  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--color-bg);
    color: var(--color-text);
    font-size: 15px;
    transition: background var(--transition), color var(--transition);
  }
  a { text-decoration: none; color: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 8px; }

  /* ---------------- App Shell ---------------- */
  .app-shell { display: flex; min-height: 100vh; }

  /* ---------------- Sidebar ---------------- */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--color-surface);
    border-right: 1px solid var(--color-border);
    position: fixed;
    top: 0; left: 0; bottom: 0;
    display: flex;
    flex-direction: column;
    z-index: 40;
    transition: transform var(--transition);
  }
  .sidebar-brand {
    display: flex; align-items: center; gap: 10px;
    padding: 20px 20px 16px 20px;
  }
  .sidebar-brand .logo-dot {
    width: 34px; height: 34px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--color-primary), var(--color-gold));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 700; font-size: 15px;
    flex-shrink: 0;
  }
  .sidebar-brand .brand-text { line-height: 1.2; }
  .sidebar-brand .brand-text strong { display: block; font-size: 14.5px; font-weight: 700; }
  .sidebar-brand .brand-text span { font-size: 12px; color: var(--color-text-muted); }

  .sidebar-nav { flex: 1; overflow-y: auto; padding: 8px 12px; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 11px 12px;
    border-radius: var(--radius-sm);
    color: var(--color-text-muted);
    font-size: 14.5px; font-weight: 500;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background var(--transition), color var(--transition);
  }
  .nav-item .material-symbols-rounded { font-size: 21px; }
  .nav-item:hover { background: var(--color-primary-soft); color: var(--color-primary); }
  .nav-item.active {
    background: var(--color-primary);
    color: #fff;
    box-shadow: var(--shadow-soft);
  }
  .sidebar-footer {
    padding: 14px 20px; border-top: 1px solid var(--color-border);
    font-size: 12px; color: var(--color-text-muted);
  }

  /* ---------------- Main ---------------- */
  .main {
    margin-left: var(--sidebar-width);
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  /* ---------------- Top Header ---------------- */
  .topbar {
    height: var(--header-height);
    background: var(--color-surface-glass);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    position: sticky; top: 0; z-index: 30;
  }
  .topbar-left { display: flex; flex-direction: column; }
  .topbar-title { font-size: 17px; font-weight: 700; }
  .topbar-date { font-size: 12.5px; color: var(--color-text-muted); }
  .topbar-right { display: flex; align-items: center; gap: 8px; }

  .icon-btn {
    width: 38px; height: 38px;
    border-radius: 12px;
    border: 1px solid var(--color-border);
    background: var(--color-surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--color-text-muted);
    transition: all var(--transition);
  }
  .icon-btn:hover { color: var(--color-primary); border-color: var(--color-primary); transform: translateY(-1px); }
  .icon-btn .material-symbols-rounded { font-size: 20px; }

  /* ---------------- Theme Picker (popover 6 tema) ---------------- */
  .theme-picker-wrap { position: relative; }
  .theme-picker-menu {
    display: none;
    position: absolute; top: calc(100% + 8px); right: 0;
    width: 248px; z-index: 200;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius-md); box-shadow: var(--shadow-hover);
    padding: 10px;
  }
  .theme-picker-menu.open { display: block; }
  .theme-picker-title {
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    color: var(--color-text-muted); padding: 4px 8px 8px;
  }
  .theme-picker-list { display: flex; flex-direction: column; gap: 2px; }
  .theme-picker-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px; border-radius: var(--radius-sm); cursor: pointer;
    transition: background var(--transition);
  }
  .theme-picker-item:hover { background: var(--color-bg); }
  .theme-picker-item.active { background: var(--color-primary-soft); }
  .theme-picker-swatches { display: flex; gap: -4px; flex-shrink: 0; }
  .theme-picker-swatches span {
    width: 16px; height: 16px; border-radius: 50%;
    border: 1.5px solid var(--color-surface);
    box-shadow: 0 0 0 1px var(--color-border);
    margin-left: -6px;
  }
  .theme-picker-swatches span:first-child { margin-left: 0; }
  .theme-picker-name { flex: 1; font-size: 13px; font-weight: 600; color: var(--color-text); }
  .theme-picker-check { font-size: 18px !important; color: var(--color-primary); width: 18px; flex-shrink: 0; }

  .user-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px 6px 6px;
    border-radius: 999px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    margin-left: 4px;
  }
  .user-chip .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--color-primary-soft); color: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700;
  }
  .user-chip .u-info { line-height: 1.15; }
  .user-chip .u-name { font-size: 13px; font-weight: 600; }
  .user-chip .u-role { font-size: 11.5px; color: var(--color-text-muted); }

  /* ---------------- Content ---------------- */
  .content { padding: 22px 26px 40px 26px; }
  .page { display: none; animation: fadeIn 220ms ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: translateY(0);} }

  .page-header { margin-bottom: 18px; }
  .page-header h1 { font-size: 21px; margin: 0 0 4px 0; }
  .page-header p { margin: 0; font-size: 13.5px; color: var(--color-text-muted); }

  /* ---------------- Card ---------------- */
  .card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-soft);
    padding: 18px;
    transition: box-shadow var(--transition), transform var(--transition);
  }
  .card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }
  @media (max-width: 1200px) { .kpi-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 800px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 520px) { .kpi-grid { grid-template-columns: 1fr; } }

  /* ---------------- Global Period Filter (Dashboard) ---------------- */
  .dashboard-header-row {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 16px; flex-wrap: wrap;
  }
  .period-filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .period-mode-tabs {
    display: flex; border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    overflow: hidden; flex-shrink: 0;
  }
  .period-mode-tab {
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    padding: 7px 12px; border: none; background: var(--color-surface);
    color: var(--color-text-muted); cursor: pointer; transition: all var(--transition);
    white-space: nowrap;
  }
  .period-mode-tab + .period-mode-tab { border-left: 1px solid var(--color-border); }
  .period-mode-tab.active { background: var(--color-primary); color: #fff; }
  .period-filter-controls { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .period-filter-controls .date-picker-input { width: 132px; }
  .period-filter-controls select.date-picker-input { width: auto; min-width: 168px; }
  .period-range-sep { font-size: 12px; color: var(--color-text-muted); }
  .btn-sm { padding: 7px 12px; font-size: 12.5px; }
  .period-active-label {
    margin-top: 8px; font-size: 12px; color: var(--color-primary); font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--color-primary-soft);
    padding: 4px 10px; border-radius: 999px;
  }
  @media (max-width: 800px) {
    .dashboard-header-row { flex-direction: column; }
    .period-filter-bar { width: 100%; }
  }

  .kpi-card { display: flex; flex-direction: column; gap: 10px; }
  .kpi-icon {
    width: 38px; height: 38px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-primary-soft); color: var(--color-primary);
  }
  .kpi-icon.gold { background: var(--color-gold-soft); color: var(--color-gold); }
  .kpi-icon.danger { background: var(--color-danger-soft); color: var(--color-danger); }
  .kpi-label { font-size: 12.5px; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .02em; }
  .kpi-value { font-size: 23px; font-weight: 700; }
  .kpi-sub { font-size: 12.5px; color: var(--color-text-muted); display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi-sub b { color: var(--color-text); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 60px 20px;
    color: var(--color-text-muted);
    text-align: center;
  }
  .empty-state .material-symbols-rounded { font-size: 40px; margin-bottom: 10px; opacity: .5; }
  .empty-state h3 { margin: 0 0 4px 0; color: var(--color-text); font-size: 15.5px; }
  .empty-state p { margin: 0; font-size: 13.5px; max-width: 320px; }

  /* ---------------- Loading Skeleton ---------------- */
  .skeleton {
    background: linear-gradient(90deg, var(--color-border) 25%, var(--color-bg) 37%, var(--color-border) 63%);
    background-size: 400% 100%;
    animation: skeleton-loading 1.4s ease infinite;
    border-radius: var(--radius-sm);
  }
  @keyframes skeleton-loading { 0% { background-position: 100% 50%; } 100% { background-position: 0 50%; } }

  /* ---------------- Toast ---------------- */
  #toast-container {
    position: fixed; bottom: 22px; right: 22px; z-index: 100;
    display: flex; flex-direction: column; gap: 8px;
  }
  .toast {
    min-width: 260px; max-width: 340px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-primary);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow-hover);
    padding: 12px 14px;
    font-size: 13.5px;
    display: flex; gap: 10px; align-items: flex-start;
    animation: toastIn 220ms ease;
  }
  .toast.success { border-left-color: var(--color-success); }
  .toast.error { border-left-color: var(--color-danger); }
  .toast.warning { border-left-color: var(--color-warning); }
  @keyframes toastIn { from { opacity: 0; transform: translateX(16px);} to { opacity: 1; transform: translateX(0);} }

  /* ---------------- Badge ---------------- */
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700;
  }
  .badge.green { background: var(--color-success-soft); color: var(--color-success); }
  .badge.red { background: var(--color-danger-soft); color: var(--color-danger); }
  .badge.gold { background: var(--color-gold-soft); color: var(--color-gold); }
  .badge.gray { background: var(--color-border); color: var(--color-text-muted); }
  .badge.blue { background: rgba(59, 130, 246, 0.12); color: #3B82F6; }

  /* ---------------- Rekonsiliasi Pembayaran ---------------- */
  .kpi-icon.red { background: var(--color-danger-soft); color: var(--color-danger); }
  .lap-section-header.red { background: var(--color-danger); }
  .rk-dropzone {
    border: 2px dashed var(--color-border); border-radius: 12px;
    padding: 28px 16px; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .rk-dropzone:hover, .rk-dropzone.rk-dropzone-active {
    border-color: var(--color-primary); background: var(--color-success-soft);
  }
  .loader-spinner {
    display: inline-block; width: 16px; height: 16px; vertical-align: -3px;
    border: 2px solid var(--color-border); border-top-color: var(--color-primary);
    border-radius: 50%; animation: rkSpin 0.7s linear infinite;
  }
  @keyframes rkSpin { to { transform: rotate(360deg); } }
  .rk-upload-result-box {
    border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6;
    background: var(--color-success-soft); border: 1px solid var(--color-success);
  }
  .rk-upload-result-box.rk-has-warning { background: var(--color-gold-soft); border-color: var(--color-gold); }
  .rk-group-row td { background: var(--color-success-soft); }
  .rk-group-subtotal td { background: var(--color-surface-alt, var(--color-border)); font-size: 12.5px; padding-top: 6px; padding-bottom: 6px; }

  /* ---------------- Monitoring PKS Supplier ---------------- */
  /* Selector table.mpks-table + !important dipakai supaya menang dari
     aturan global ".data-table th/td" (bagian PERBESARAN TAMPILAN di bawah)
     yang sebelumnya diam-diam menimpa ukuran font/padding tabel ini. */
  .mpks-table thead tr { background: var(--color-primary-soft); }
  table.mpks-table th {
    white-space: normal; word-break: break-word; line-height: 1.35;
    font-size: 21px !important; color: var(--color-primary);
    border-bottom: 2px solid var(--color-primary-light);
    padding: 16px 16px !important;
  }
  .mpks-subhead { text-transform: none; font-weight: 500; font-size: 20px; color: var(--color-text-muted); }
  table.mpks-table td { padding: 16px 16px !important; font-size: 26px; }
  table.mpks-table td.mpks-col-proses { padding: 16px 6px !important; text-align: center; }
  table.mpks-table td a { font-size: 22px !important; }
  table.mpks-table .badge { font-size: 23px !important; padding: 6px 18px !important; }
  .mpks-table tbody tr:nth-child(even) td { background: var(--color-bg); }
  .mpks-table tr:hover td { background: var(--color-primary-soft) !important; }

  .mpks-select {
    font-size: 24px; font-weight: 600; padding: 10px 12px; border-radius: 999px;
    border: 1px solid transparent; cursor: pointer; min-width: 136px; width: 100%;
    box-sizing: border-box; text-align: center;
    -webkit-appearance: none; -moz-appearance: none; appearance: none;
    transition: opacity .15s;
  }
  .mpks-select:hover { opacity: .85; }
  .mpks-select.st-belum { background: var(--color-border); color: var(--color-text-muted); }
  .mpks-select.st-proses { background: var(--color-warning-soft); color: var(--color-warning); }
  .mpks-select.st-selesai { background: var(--color-success-soft); color: var(--color-success); }
  .mpks-select.st-na { background: transparent; color: var(--color-text-muted); font-style: italic; font-weight: 400; border: 1px dashed var(--color-border); }

  .mpks-text-input {
    font-size: 24px; padding: 10px 16px; border-radius: 6px; width: 240px;
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  }
  .mpks-text-input:focus { outline: none; border-color: var(--color-primary-light); }
  .mpks-text-input[readonly] { background: transparent; border-color: transparent; cursor: pointer; }
  .mpks-text-input[readonly]:hover { background: var(--color-bg); border-color: var(--color-border); }

  .mpks-save-pending { animation: mpksPulse 1.4s infinite; }
  @keyframes mpksPulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--color-primary-soft); }
    50% { box-shadow: 0 0 0 5px var(--color-primary-soft); }
  }

  .mpks-score-grid { display:grid; grid-template-columns: repeat(5, 1fr); gap:14px; margin-top:18px; }
  .mpks-score-card { display:flex; align-items:center; gap:12px; }
  .mpks-score-icon {
    width:44px; height:44px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .mpks-score-icon .material-symbols-rounded { font-size:22px; }
  .mpks-score-icon.c-dark { background: var(--color-primary); color:#fff; }
  .mpks-score-icon.c-green { background: var(--color-success-soft); color: var(--color-success); }
  .mpks-score-icon.c-gold { background: var(--color-warning-soft); color: var(--color-warning); }
  .mpks-score-icon.c-red { background: var(--color-danger-soft); color: var(--color-danger); }
  .mpks-score-icon.c-blue { background: var(--color-primary-soft); color: var(--color-primary-light); }
  .mpks-score-label { font-size:12px; color:var(--color-text-muted); font-weight:600; }
  .mpks-score-value { font-size:22px; font-weight:800; color:var(--color-text); }
  @media (max-width: 900px) { .mpks-score-grid { grid-template-columns: repeat(2, 1fr); } }

  .mpks-progres-bar-wrap { width: 70px; height: 6px; border-radius: 999px; background: var(--color-border); overflow: hidden; margin-top: 4px; }
  .mpks-progres-bar-fill { height: 100%; border-radius: 999px; transition: width .2s; }
  .mpks-progres-bar-fill.low { background: var(--color-danger); }
  .mpks-progres-bar-fill.mid { background: var(--color-warning); }
  .mpks-progres-bar-fill.high { background: var(--color-success); }

  /* Draft Nota Dinas (Monitoring PKS Supplier) — 2 kartu independen
     (Nodin Due Diligence / Nodin Kajian Draft PKS), masing-masing punya
     checklist, preview, & tombol download sendiri. Tidak pernah
     digabung jadi satu dokumen. */
  .nodin-card { border: 1px solid var(--color-border); border-radius: var(--radius-md, 12px); padding: 16px; margin-bottom: 16px; }
  .nodin-card:last-of-type { margin-bottom: 14px; }
  .nodin-card-title { font-size: 15px; font-weight: 800; color: var(--color-primary); margin-bottom: 10px; }
  .nodin-card-checklist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .nodin-card-checklist label { display: flex; align-items: center; gap: 8px; font-weight: 400; font-size: 13.5px; cursor: pointer; }
  .nodin-card-warning { font-size: 12.5px; font-weight: 700; color: var(--color-danger); margin-bottom: 10px; }
  .nodin-card-preview {
    font-size: 13px; line-height: 1.7; white-space: pre-wrap; text-align: justify;
    background: var(--color-bg); border-radius: 8px; padding: 12px; margin-bottom: 12px;
    max-height: 280px; overflow-y: auto;
  }
  .nodin-card-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* ---------------- Form ---------------- */
  .form-section-title {
    font-size: 15px; font-weight: 700; margin: 0 0 14px 0;
    display: flex; align-items: center; gap: 8px;
  }
  .form-section-title .material-symbols-rounded { font-size: 19px; color: var(--color-primary); }
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.span-2 { grid-column: span 2; }
  .form-group label {
    font-size: 13px; font-weight: 600; color: var(--color-text-muted);
  }
  .form-group input, .form-group select, .form-group textarea {
    font-family: inherit;
    font-size: 14.5px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-border);
    background: var(--color-bg);
    color: var(--color-text);
    outline: none;
    transition: border-color var(--transition), box-shadow var(--transition);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-hint { font-size: 12px; color: var(--color-text-muted); }
  .form-computed {
    background: var(--color-primary-soft);
    color: var(--color-primary);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 14.5px; font-weight: 700;
  }

  .form-actions {
    display: flex; gap: 10px; margin-top: 16px;
    padding-top: 14px; border-top: 1px solid var(--color-border);
  }
  .btn {
    font-family: inherit;
    font-size: 13.5px; font-weight: 600;
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all var(--transition);
  }
  .btn .material-symbols-rounded { font-size: 18px; }
  .btn-primary { background: var(--color-primary); color: #fff; }
  .btn-primary:hover { background: var(--color-primary-light); }
  .btn-secondary { background: var(--color-surface); color: var(--color-text-muted); border-color: var(--color-border); }
  .btn-secondary:hover { color: var(--color-text); border-color: var(--color-text-muted); }
  .btn-danger { background: var(--color-danger); color: #fff; }
  .btn-danger:hover { filter: brightness(0.92); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }

  .grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 1000px) { .grid-2col { grid-template-columns: 1fr; } }

  .card-title-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }

  .recent-list { display: flex; flex-direction: column; gap: 8px; }
  .recent-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    background: var(--color-bg);
    font-size: 13.5px;
  }
  .recent-row .r-main { font-weight: 600; }
  .recent-row .r-sub { color: var(--color-text-muted); font-size: 12px; }
  .recent-row .r-val { font-weight: 700; }
  .recent-empty { text-align: center; padding: 20px; color: var(--color-text-muted); font-size: 13px; }

  /* ---------------- Jadwal Pickup (Menu Penjualan) ---------------- */
  .pjl-pickup-list { max-height: 320px; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
  .pjl-slot { border: 1px solid var(--color-border); border-radius: 10px; padding: 8px 10px; background: var(--color-bg); }
  .pjl-slot-header { font-size: 11px; font-weight: 700; color: var(--color-primary); text-transform: uppercase; letter-spacing: .02em; margin-bottom: 4px; }
  .pjl-slot-empty { font-size: 12px; color: var(--color-text-muted); font-style: italic; }
  .pjl-slot-item { font-size: 12.5px; padding: 5px 0; border-top: 1px dashed var(--color-border); }
  .pjl-slot-item:first-child { border-top: none; }
  .pjl-slot-item .pjl-item-main { font-weight: 600; }
  .pjl-slot-item .pjl-item-sub { color: var(--color-text-muted); font-size: 11.5px; }
  .pjl-buyer-name { font-weight: 700; font-size: 12.5px; margin-bottom: 3px; }
  .pjl-buyer-invoice { font-size: 12px; padding: 3px 0 3px 14px; }
  .pjl-buyer-invoice .pjl-item-main { font-weight: 600; }
  .pjl-buyer-invoice .pjl-item-sub { color: var(--color-text-muted); font-size: 11.5px; }
  .pjl-buyer-summary { font-size: 11.5px; color: var(--color-text-muted); font-weight: 600; margin-top: 3px; padding-left: 14px; }
  .pjl-bulk-checkbox-col { width: 30px; text-align: center; }
  .pjl-bulk-bar { display: none; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--color-gold); background: #FFFBEA; font-size: 12.5px; }
  .pjl-bulk-bar.active { display: flex; }
  .pjl-massal-summary-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12.5px; }
  .pjl-massal-summary-row b { display: block; font-size: 15px; }
  .pjl-massal-list { max-height: 180px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: 8px; padding: 8px 10px; margin-bottom: 12px; font-size: 12px; }
  .pjl-massal-list-buyer { font-weight: 700; margin-top: 6px; }
  .pjl-massal-list-buyer:first-child { margin-top: 0; }
  .pjl-pending-item {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 0; border-top: 1px dashed var(--color-border); font-size: 12.5px;
  }
  .pjl-pending-item:first-child { border-top: none; }
  .pjl-pickup-item-badge { display: inline-block; margin-top: 3px; font-size: 10.5px; padding: 2px 7px; }

  /* ---------------- Tab halaman Pembelian (Riwayat / Monitoring Delivery PO) ---------------- */
  .pmb-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
  .pmb-tab {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--color-text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .pmb-tab:hover { color: var(--color-text); }
  .pmb-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
  .pmb-tab .material-symbols-rounded { font-size: 18px; }
  .pmb-tab-content { display: none; }
  .pmb-tab-content.active { display: block; }

  /* ---------------- Monitoring Delivery PO ---------------- */
  .mpo-row-outstanding { border-left: 3px solid var(--color-gold); }
  #mpo-table-body td { white-space: nowrap; }
  @media (max-width: 700px) {
    #mpo-table-body td { white-space: normal; }
  }

  /* ---------------- Gold in Transit (halaman Piutang Supplier) ---------------- */
  .git-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-border); flex-wrap: wrap; }
  .git-tab {
    display: inline-flex; align-items: center; gap: 6px; padding: 10px 16px; font-size: 13px; font-weight: 600;
    color: var(--color-text-muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .git-tab:hover { color: var(--color-text); }
  .git-tab.active { color: var(--color-primary); border-bottom-color: var(--color-primary); }
  .git-tab .material-symbols-rounded { font-size: 18px; }
  .git-tab-content { display: none; }
  .git-tab-content.active { display: block; }
  #git-quick-hariini.active, #git-quick-akhirbulan.active, #git-quick-custom.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }

  .git-lastdata-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 20px;
    background: var(--color-success-soft); color: var(--color-success); font-size: 12.5px; font-weight: 700; white-space: nowrap;
  }
  .git-lastdata-pill .material-symbols-rounded { font-size: 16px; }

  .git-kpi-card { display: flex; align-items: center; gap: 14px; text-align: left; }
  .git-kpi-icon { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .git-kpi-icon .material-symbols-rounded { font-size: 22px; }
  .git-kpi-label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .02em; }
  .git-kpi-value { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .git-kpi-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
  @media (max-width: 420px) { .git-kpi-value { font-size: 15px; } }

  /* Tombol Edit Pickup / Selesai Diambil di Riwayat Penjualan — rapat,

  .chart-card { min-height: 300px; }

    font-size: 15px; font-weight: 700; margin-bottom: 4px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .chart-card-title .material-symbols-rounded { font-size: 18px; color: var(--color-primary); vertical-align: middle; margin-right: 6px; }
  .chart-canvas-wrap { position: relative; height: 240px; margin-top: 10px; }

  .ai-summary-card {
    background: linear-gradient(135deg, #046A38, #064F2A);

  }
  .ai-summary-insight-title { display:flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:#F5D061; }
  .ai-summary-insight-text { font-size: 13px; line-height: 1.5; color: rgba(255,255,255,0.9); }
  .ai-summary-title {

    margin-bottom: 8px;
  }
  .ai-summary-text { font-size: 14px; line-height: 1.6; color: rgba(255,255,255,0.92); }

  .alert-list { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .alert-item {

  .alert-item.warning { background: var(--color-warning-soft); color: var(--color-warning); }

  .alert-item .alert-title { font-weight: 700; display: block; }

  .rank-list { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .rank-row {

    padding: 10px 12px; border-radius: var(--radius-sm);
    background: var(--color-bg);
  }

    width: 24px; height: 24px; border-radius: 50%;

    flex-shrink: 0;

  .rank-row:nth-child(2) .rank-num { background: #1E9E5A; }
  .rank-row:nth-child(3) .rank-num { background: #6FCB9F; }
  .rank-info { flex: 1; min-width: 0; }
  .rank-name { font-size: 13.5px; font-weight: 600; }
  .rank-sub { font-size: 11.5px; color: var(--color-text-muted); }
  .rank-val { font-size: 13.5px; font-weight: 700; white-space: nowrap; }

  .trend-tabs { display: flex; gap: 6px; }
  .trend-tab {
    font-size: 12px; font-weight: 600; padding: 5px 12px;
    border-radius: 999px; border: 1px solid var(--color-border);

  }
  .trend-tab.active { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }

  /* ---------------- Fase 6: Data Table & Settings ---------------- */
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .data-table th {
    text-align: left; font-size: 11.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .03em; color: var(--color-text-muted);

  }
  .data-table td { padding: 11px 12px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
  .data-table tr:last-child td { border-bottom: none; }
  .data-table tr:hover td { background: var(--color-bg); }

  .role-badge {
    display: inline-flex; padding: 3px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 700;
  }
  .role-badge.Admin { background: var(--color-danger-soft); color: var(--color-danger); }
  .role-badge.Supervisor { background: var(--color-gold-soft); color: var(--color-gold); }
  .role-badge.Viewer { background: var(--color-primary-soft); color: var(--color-primary); }

  .role-select {
    font-size: 12.5px; padding: 5px 8px; border-radius: var(--radius-sm);
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  }

  .settings-section { margin-bottom: 22px; }
  .settings-section-title {
    font-size: 15px; font-weight: 700; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .settings-section-title .material-symbols-rounded { font-size: 19px; color: var(--color-primary); }

  .inline-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 14px; }
  .inline-form .form-group { min-width: 160px; flex: 1; }

  .insight-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
  .insight-card { display: flex; gap: 12px; align-items: flex-start; }
  .insight-icon {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    background: var(--color-primary-soft); color: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
  }
  .insight-title { font-size: 13.5px; font-weight: 700; margin-bottom: 4px; }
  .insight-text { font-size: 13px; color: var(--color-text-muted); line-height: 1.5; }

  .mini-kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 800px) { .mini-kpi-grid { grid-template-columns: repeat(2, 1fr); } }
  .mini-kpi { text-align: center; }
  .mini-kpi-label { font-size: 11.5px; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; }
  .mini-kpi-value { font-size: 19px; font-weight: 700; margin-top: 4px; }
  .mini-kpi-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }
  .mini-kpi-date { font-size: 10px; color: var(--color-text-muted); margin-top: 2px; font-style: italic; }

  .pjl-scorecard-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin-bottom: 18px; }
  @media (max-width: 900px) { .pjl-scorecard-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 420px) { .pjl-scorecard-grid { grid-template-columns: 1fr; } }

  /* ---------------- Print Mode ---------------- */
  .no-print { }
  .print-only { display: none; }
  .date-picker-input {
    font-size: 13.5px; padding: 8px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text);
  }
  @media print {
    .sidebar, .topbar, .menu-toggle, .no-print, #toast-container { display: none !important; }
    .main { margin-left: 0 !important; }
    body, .content { background: #fff !important; padding: 6px !important; }
    .print-only { display: block !important; text-align: center; margin-bottom: 14px; }
    .print-only h2 { margin: 0 0 2px 0; font-size: 16px; }
    .print-only div { font-size: 11px; color: #555; }
    .card {
      box-shadow: none !important; border: 1px solid #ddd !important;
      padding: 8px !important; margin-bottom: 8px !important; break-inside: avoid;
    }
    .form-section-title { font-size: 11px !important; margin-bottom: 6px !important; }
    .data-table { font-size: 8.5px !important; }

    .mini-kpi-grid { margin-bottom: 8px !important; }

  /* ---------------- Sidebar Extras ---------------- */
  .sidebar-section-label {

  .nav-item.deprecated { opacity: .55; font-size: 13px; }

  .nav-item.deprecated .material-symbols-rounded { font-size: 18px; }
  .sidebar-promo-card {
    margin: 14px 12px; padding: 18px 14px; border-radius: 16px;

    color: #fff; text-align: center;

  .sidebar-promo-card .promo-icon { font-size: 26px; margin-bottom: 8px; }

  /* ---------------- KPI Sparkline ---------------- */
  /* Sparkline dipindah ke baris paling atas card (sebelum icon/nilai),
     horizontal penuh mengikuti lebar card, tinggi compact — supaya card
     tidak jadi tinggi & tetap rapi di semua level zoom browser. */
  .kpi-card.with-spark { flex-direction: column; gap: 10px; }
  .kpi-card.with-spark .kpi-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .kpi-sparkline-wrap { position: relative; width: 100%; height: 40px; flex-shrink: 0; overflow: hidden; }
  .kpi-sparkline-wrap canvas { width: 100% !important; height: 100% !important; display: block; }

  .donut-wrap { position: relative; width: 210px; height: 210px; margin: 0 auto; flex-shrink: 0; }
  .donut-center-label {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    text-align: center; pointer-events: none;
  }
  .donut-center-label .dc-val { font-size: 18px; font-weight: 800; color: var(--color-text); }
  .donut-center-label .dc-lbl { font-size: 11px; color: var(--color-text-muted); margin-top: 2px; }

  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  .lap-container { background: var(--color-surface); border-radius: 24px; padding: 20px; max-width: 980px; margin: 0 auto; }
  .lap-banner {
    background: linear-gradient(120deg, var(--color-primary) 0%, var(--color-primary-light) 55%, var(--color-gold) 100%);

  .lap-kpi-text-value { font-size: 16px; font-weight: 800; margin-top: 2px; }

  }
  .spt-insight-item .material-symbols-rounded { color: var(--color-primary); font-size: 20px; margin-top: 1px; }
  .spt-insight-item .spt-insight-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .spt-insight-item .spt-insight-text { font-size: 12.5px; color: var(--color-text-muted); line-height: 1.5; }
  @media (max-width: 900px) { .spt-insight-grid { grid-template-columns: 1fr; } }

  /* ---------------- Harga Rata-Rata per Supplier ---------------- */
  .spt-sentra-buyback-kpi {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; color: var(--color-text-muted);
    background: var(--color-bg); border: 1px solid var(--color-border);
    border-radius: 999px; padding: 6px 12px; white-space: nowrap;
  }
  .spt-sentra-buyback-kpi .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .spt-sentra-buyback-kpi b { color: var(--color-text); font-weight: 700; }

  .spt-supplier-avg-list { display: flex; flex-wrap: wrap; gap: 12px; }
  .spt-avg-item {
    flex: 1 1 190px; min-width: 190px; max-width: 240px;
    background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    padding: 12px 14px; border-left: 4px solid transparent;
  }
  .spt-avg-item-head { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .spt-avg-item-head .dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .spt-avg-item-name { font-size: 12.5px; font-weight: 700; color: var(--color-text-muted); flex: 1; }
  .spt-avg-item-badge {
    font-size: 9.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em;
    padding: 2px 7px; border-radius: 999px; white-space: nowrap;
  }
  .spt-avg-item-badge.termurah { background: var(--color-success-soft); color: var(--color-success); }
  .spt-avg-item-badge.tertinggi { background: var(--color-danger-soft); color: var(--color-danger); }
  .spt-avg-item-value { font-size: 16.5px; font-weight: 800; color: var(--color-text); margin-bottom: 4px; }
  .spt-avg-item-value.muted { font-size: 13px; font-weight: 600; color: var(--color-text-muted); }
  .spt-avg-item-delta { font-size: 11.5px; font-weight: 600; }
  .spt-avg-item-delta.below { color: var(--color-success); }
  .spt-avg-item-delta.above { color: var(--color-danger); }
  .spt-avg-item-delta.equal { color: var(--color-text-muted); }
  @media (max-width: 560px) { .spt-avg-item { flex: 1 1 100%; max-width: 100%; } }

  /* ---------------- Profile Mitra ---------------- */
  .mitra-sort-th { cursor: pointer; user-select: none; }
  .mitra-sort-th:hover { color: var(--color-primary); }
  .mitra-pagination { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .mitra-pagination-info { font-size: 13px; color: var(--color-text-muted); }
  .mitra-pagination-pages { display: flex; gap: 6px; align-items: center; }
  .mitra-page-btn {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--color-border);
    background: var(--color-surface); cursor: pointer; font-size: 13px; min-width: 34px; text-align: center;
  }
  .mitra-page-btn.active { background: var(--color-primary); border-color: var(--color-primary); color: #fff; }
  .mitra-page-btn.nav { color: var(--color-text-muted); }
  .mitra-page-btn.disabled { opacity: .4; pointer-events: none; }

  /* Layout Detail: sidebar kiri (profil ringkas + tab vertikal) + konten kanan */
  .mitra-detail-layout { display: grid; grid-template-columns: 240px 1fr; gap: 18px; align-items: start; }
  @media (max-width: 900px) { .mitra-detail-layout { grid-template-columns: 1fr; } }

  .mitra-sidebar-card { text-align: center; padding: 22px 16px; }
  .mitra-sidebar-logo {
    width: 64px; height: 64px; border-radius: 16px; margin: 0 auto 12px auto;
    background: linear-gradient(135deg, var(--color-primary), var(--color-gold));
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 24px; font-weight: 800;
  }
  .mitra-sidebar-name { font-size: 15px; font-weight: 800; margin-bottom: 10px; line-height: 1.3; }
  .mitra-sidebar-badges { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-bottom: 4px; }

  .mitra-tabs { display: flex; flex-direction: column; gap: 2px; margin-top: 14px; }
  .mitra-tab {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px;
    font-size: 14px; font-weight: 600; color: var(--color-text-muted); cursor: pointer; text-align: left;
  }
  .mitra-tab:hover { background: var(--color-bg); }
  .mitra-tab.active { color: var(--color-primary); background: var(--color-primary-soft); }
  .mitra-tab .material-symbols-rounded { font-size: 18px; }
  .mitra-tab-content { display: none; }
  .mitra-tab-content.active { display: block; }

  .mitra-overview-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 1000px) { .mitra-overview-grid { grid-template-columns: 1fr; } }
  .mitra-info-grid { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .mitra-info-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; border-bottom: 1px dashed var(--color-border); padding-bottom: 8px; }
  .mitra-info-row .label { color: var(--color-text-muted); }
  .mitra-info-row .value { font-weight: 600; text-align: right; }

  .mitra-kpi-icon-card { display: flex; flex-direction: column; gap: 10px; }
  .mitra-kpi-icon-card .mitra-kpi-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .mitra-kpi-icon {
    width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    background: var(--color-primary-soft); color: var(--color-primary); flex-shrink: 0;
  }
  .mitra-kpi-icon.gold { background: var(--color-gold-soft); color: #8a6d1f; }
  .mitra-kpi-icon.purple { background: #EDE9FE; color: #6D28D9; }
  .mitra-kpi-icon-card .mitra-kpi-val { font-size: 20px; font-weight: 800; }
  .mitra-kpi-icon-card .mitra-kpi-sub { font-size: 12px; color: var(--color-text-muted); }

  .mitra-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
  .mitra-badge.supplier { background: var(--color-gold-soft); color: #8a6d1f; }
  .mitra-badge.buyer { background: var(--color-primary-soft); color: var(--color-primary); }
  .mitra-badge.both { background: #EDE9FE; color: #6D28D9; }
  .mitra-badge.none { background: var(--color-bg); color: var(--color-text-muted); }
  .mitra-badge.aktif { background: var(--color-success-soft, #DCFCE7); color: #15803D; }
  .mitra-badge.nonaktif { background: #FEE2E2; color: #B91C1C; }
  .mitra-badge.kuning { background: #FEF9C3; color: #854D0E; }
  .mitra-badge.oranye { background: #FFEDD5; color: #C2410C; }

  .mitra-reminder-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .mitra-reminder-chip {
    padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
    background: var(--color-bg); color: var(--color-text-muted); border: 1px solid var(--color-border);
  }
  .mitra-reminder-chip.hit { background: #FEE2E2; color: #B91C1C; border-color: transparent; }
  .mitra-pks-countdown {
    text-align: center; padding: 18px; border-radius: 14px; margin-top: 10px;
    background: var(--color-gold-soft);
  }
  .mitra-pks-countdown .val { font-size: 27px; font-weight: 800; color: #8a6d1f; }
  .mitra-pks-countdown .lbl { font-size: 12px; color: var(--color-text-muted); margin-bottom: 4px; }
  .mitra-pks-countdown .sub { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
  .mitra-pks-list-item {
    border: 1px solid var(--color-border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px;
  }
  .mitra-pks-list-item .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }

  /* ---------------- Mobile ---------------- */
  .menu-toggle { display: none; }
  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .menu-toggle { display: flex; }
  }

  /* ============================================================
     WIDGET DASHBOARD BARU — kartu ringkasan bar-list (Piutang per
     Supplier, Penjualan per Buyer, Top 5 Merk), menggantikan versi
     donut chart. Struktur: header (icon + judul + subjudul + info),
     opsional kotak highlight angka besar, daftar bar-list, dan
     kotak insight/statistik di bawah.
     ============================================================ */
  .widget-header { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
  .widget-icon-badge {
    width: 38px; height: 38px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-primary-soft); color: var(--color-primary);
  }
  .widget-icon-badge.gold { background: var(--color-gold-soft); color: var(--color-gold); }
  .widget-icon-badge .material-symbols-rounded { font-size: 20px; }
  .widget-header-text { flex: 1; min-width: 0; }
  .widget-title { font-size: 15px; font-weight: 700; color: var(--color-text); }
  .widget-subtitle { font-size: 12px; color: var(--color-text-muted); margin-top: 1px; }
  .widget-info-icon { font-size: 18px; color: var(--color-text-muted); cursor: help; flex-shrink: 0; }

  .stat-highlight-box {
    background: var(--color-primary-soft);
    border-radius: var(--radius-sm);
    padding: 18px 16px;
    text-align: center;
    margin-bottom: 16px;
  }
  .stat-highlight-value { font-size: 26px; font-weight: 800; color: var(--color-primary); }
  .stat-highlight-label { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
  .stat-highlight-sub { font-size: 11.5px; color: var(--color-text-muted); margin-top: 2px; font-weight: 600; }

  .bar-list { display: flex; flex-direction: column; gap: 14px; }
  .bar-list-row { display: flex; align-items: center; gap: 10px; }
  .bar-list-rank {
    width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
    background: var(--color-bg); color: var(--color-text-muted);
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .bar-list-main { flex: 1; min-width: 0; }
  .bar-list-name {
    font-size: 13px; font-weight: 600; margin-bottom: 5px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .bar-list-track { height: 7px; border-radius: 999px; background: var(--color-bg); overflow: hidden; }
  .bar-list-fill { height: 100%; border-radius: 999px; transition: width 400ms ease; }
  .bar-list-values { text-align: right; flex-shrink: 0; min-width: 78px; }
  .bar-list-value { font-size: 13px; font-weight: 700; color: var(--color-text); white-space: nowrap; }
  .bar-list-pct { font-size: 11px; color: var(--color-success); font-weight: 600; margin-top: 1px; }

  .bar-list-table-header {
    display: flex; justify-content: space-between;
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    color: var(--color-text-muted); letter-spacing: .03em;
    margin-bottom: 12px; padding: 0 2px;
  }

  .two-stat-row { display: flex; gap: 10px; margin-top: 16px; }
  .two-stat-box {
    flex: 1; display: flex; align-items: center; gap: 10px;
    background: var(--color-primary-soft); border-radius: var(--radius-sm);
    padding: 12px 14px;
  }
  .two-stat-box .material-symbols-rounded { color: var(--color-primary); font-size: 20px; }
  .two-stat-label { font-size: 10.5px; color: var(--color-text-muted); font-weight: 600; text-transform: uppercase; }
  .two-stat-value { font-size: 16px; font-weight: 800; color: var(--color-text); }

  .insight-footer-box {
    display: flex; align-items: center; gap: 12px;
    background: var(--color-bg); border-radius: var(--radius-sm);
    padding: 12px 14px; margin-top: 16px;
  }
  .insight-footer-icon {
    width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
    background: var(--color-primary-soft); color: var(--color-primary);
    display: flex; align-items: center; justify-content: center;
  }
  .insight-footer-icon .material-symbols-rounded { font-size: 18px; }
  .insight-footer-text { min-width: 0; }
  .insight-footer-label { font-size: 11.5px; color: var(--color-text-muted); }
  .insight-footer-value { font-size: 14.5px; font-weight: 700; color: var(--color-text); margin-top: 1px; }
  .insight-footer-sub { font-size: 11.5px; color: var(--color-success); font-weight: 600; margin-top: 1px; }

  /* ---------------- Piutang per Supplier (Dashboard) — Gabungan/Trading/EGR ---------------- */
  .piutang-mode-tabs { display: flex; gap: 4px; justify-content: flex-end; margin: -6px 0 12px; }
  .piutang-mode-tab {
    font-size: 10.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    background: var(--color-bg); color: var(--color-text-muted); cursor: pointer;
    transition: background .15s, color .15s; user-select: none;
  }
  .piutang-mode-tab:hover { color: var(--color-text); }
  .piutang-mode-tab.active { background: var(--color-gold); color: #fff; }
  .piutang-breakdown-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .piutang-breakdown-item { background: var(--color-bg); border-radius: var(--radius-sm); padding: 10px 12px; }
  .piutang-breakdown-label { font-size: 10px; font-weight: 700; color: var(--color-text-muted); letter-spacing: .03em; }
  .piutang-breakdown-value { font-size: 16px; font-weight: 800; color: var(--color-text); margin-top: 2px; }
  .piutang-breakdown-sub { font-size: 11px; color: var(--color-text-muted); margin-top: 1px; }

  /* ---------------- Kalender HUT & Ulang Tahun ---------------- */
  .hut-agenda-list { display: flex; flex-direction: column; gap: 10px; }
  .hut-agenda-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px; border-radius: var(--radius-sm); border-left: 4px solid transparent;
    background: var(--color-bg);
  }
  .hut-agenda-main { min-width: 0; }
  .hut-agenda-name { font-size: 13.5px; font-weight: 700; color: var(--color-text); }
  .hut-agenda-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--color-text-muted); margin-top: 2px; }
  .hut-kategori-tag {
    font-size: 10.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--color-primary-soft); color: var(--color-primary);
  }
  .hut-agenda-countdown {
    font-size: 12.5px; font-weight: 800; padding: 6px 12px; border-radius: 999px; flex-shrink: 0; white-space: nowrap;
  }
  .hut-badge-red { border-left-color: var(--color-danger); }
  .hut-badge-red .hut-agenda-countdown, .hut-agenda-countdown.hut-badge-red { background: var(--color-danger-soft); color: var(--color-danger); }
  .hut-badge-yellow { border-left-color: var(--color-warning); }
  .hut-badge-yellow .hut-agenda-countdown, .hut-agenda-countdown.hut-badge-yellow { background: var(--color-warning-soft); color: var(--color-warning); }
  .hut-badge-blue { border-left-color: #2563EB; }
  .hut-badge-blue .hut-agenda-countdown, .hut-agenda-countdown.hut-badge-blue { background: rgba(37, 99, 235, 0.14); color: #2563EB; }

  .hut-timeline { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .hut-timeline-month { border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 10px 12px; background: var(--color-bg); }
  .hut-timeline-month-label { font-size: 12.5px; font-weight: 800; color: var(--color-primary); text-transform: uppercase; margin-bottom: 8px; }
  .hut-timeline-entry { display: flex; align-items: baseline; gap: 8px; padding: 4px 6px; border-radius: 6px; font-size: 12px; margin-bottom: 4px; }
  .hut-timeline-entry.hut-badge-red { background: var(--color-danger-soft); }
  .hut-timeline-entry.hut-badge-yellow { background: var(--color-warning-soft); }
  .hut-timeline-entry.hut-badge-blue { background: rgba(37, 99, 235, 0.1); }
  .hut-timeline-date { font-weight: 800; color: var(--color-text); flex-shrink: 0; }
  .hut-timeline-name { color: var(--color-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hut-timeline-empty { font-size: 11.5px; color: var(--color-text-muted); font-style: italic; }

  /* ---------------- Laporan Harian ETF ---------------- */
  .etf-gram-main { font-size: 22px; font-weight: 800; color: var(--color-text); }
  .etf-gram-decimal { font-size: 13px; font-weight: 700; color: var(--color-text-muted); }
  .etf-gram-unit { font-size: 12px; font-weight: 600; color: var(--color-text-muted); }

  .etf-net-summary { padding: 12px 16px 16px; border-top: 1px solid var(--color-border); }
  .etf-net-summary-noborder { border-top: none; padding-top: 16px; }
  .etf-net-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; font-size: 13px; color: var(--color-text-muted); }
  .etf-net-row span:last-child { font-weight: 700; color: var(--color-text); }
  .etf-net-rupiah { font-size: 11px; font-weight: 500; color: var(--color-text-muted); }
  .etf-net-row-highlight { margin-top: 6px; padding-top: 10px; border-top: 1px dashed var(--color-border); font-size: 14.5px; font-weight: 800; }
  .etf-net-row-highlight span:last-child { font-size: 16px; }
  .etf-net-positive span:last-child { color: var(--color-success); }
  .etf-net-negative span:last-child { color: var(--color-danger); }
  .etf-net-zero span:last-child { color: var(--color-text-muted); }

  .etf-inv-block { padding: 4px 16px 16px; border-top: 1px solid var(--color-border); }
  .etf-inv-title { font-size: 12px; font-weight: 800; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .02em; margin: 8px 0 4px; }
  .etf-inv-before-row span:last-child { color: #1F2937 !important; }
  .etf-net-row-highlight span:first-child { font-weight: 800; }

  .etf-toggle-btn {
    margin-left: auto; display: inline-flex; align-items: center; gap: 4px;
    font-size: 11.5px; font-weight: 600; color: #fff; background: rgba(255, 255, 255, 0.18);
    border: none; border-radius: 999px; padding: 4px 10px; cursor: pointer; flex-shrink: 0;
  }
  .etf-toggle-btn:hover { background: rgba(255, 255, 255, 0.32); }

  /* Download Laporan / Download Summary — dropdown 2 pilihan (PDF / Gambar) */
  .dl-dropdown { position: relative; display: inline-block; }
  .dl-caret { font-size: 16px; }
  .dl-menu {
    display: none; flex-direction: column; gap: 2px;
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 50;
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: 12px; box-shadow: var(--shadow-soft); padding: 6px; min-width: 150px;
  }
  .dl-dropdown.open .dl-menu { display: flex; }
  .dl-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    padding: 8px 10px; border: none; border-radius: 8px; background: transparent;
    font-size: 13px; font-weight: 600; color: var(--color-text); cursor: pointer;
  }
  .dl-menu button:hover { background: var(--color-bg); }
  .dl-menu .material-symbols-rounded { font-size: 17px; }
  .dl-spin { display: inline-block; animation: dl-spin-anim 1s linear infinite; }
  @keyframes dl-spin-anim { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  /* Selama proses download PDF/gambar: sembunyikan tombol, filter, toggle,
     dan elemen non-laporan lain (.no-print) supaya tidak ikut ter-render. */
  .dl-capturing .no-print { display: none !important; }

  /* Perbandingan Penjualan EGR — tabel perbandingan H-1 vs Hari Ini.
     Sel Kenaikan/Penurunan & Persentase berubah warna sesuai state
     (naik=hijau, turun=merah, sama=abu). */
  .egrcmp-table th, .egrcmp-table td { white-space: nowrap; }
  .egrcmp-table td:not(:first-child), .egrcmp-table th:not(:first-child) { text-align: right; }
  .egrcmp-table-sub { font-size: 16px; font-weight: 700; color: var(--color-text-muted); margin-top: 3px; }
  .egrcmp-cell-up { color: var(--color-success); }
  .egrcmp-cell-down { color: var(--color-danger); }
  .egrcmp-cell-flat { color: var(--color-text-muted); }

  /* Ikon panah di depan label baris "Selisih" pada tabel Perbandingan */
  .egrcmp-selisih-icon { font-size: 1em; vertical-align: middle; margin-right: 4px; }

  /* Perbandingan Harga (Bagian A) — tabel kolom dinamis (H-1, Harga I,
     Harga II, ...), reuse .data-table + .egrcmp-table (rata kanan &
     font ~18.5px global sama dgn tabel Perbandingan Hari Sebelumnya/
     Hari Ini di Bagian C, jadi tidak perlu style tambahan di sini). */

  /* Rekap Transaksi Hari Ini (Bagian B) — grid 3 kolom TETAP (Keterangan /
     Gramasi / Nilai Rupiah) supaya gramasi & rupiah baris Buyback selalu
     lurus persis di bawah baris Penjualan, brp pun panjang teksnya —
     lebar kolom sama utk semua baris krn satu grid container dipakai
     bareng (bukan flex per-baris yg lebarnya bisa beda-beda). */
  .egrcmp-rekap-grid {
    display: grid;
    grid-template-columns: minmax(220px, 1fr) minmax(180px, auto) minmax(220px, auto);
    column-gap: 20px; row-gap: 10px;
    padding: 14px 16px;
    align-items: baseline;
  }
  .egrcmp-rekap-label { font-size: 18px; font-weight: 800; color: var(--color-text); text-align: left; }
  .egrcmp-rekap-gram { font-size: 18px; font-weight: 700; color: var(--color-text); text-align: right; }
  .egrcmp-rekap-rupiah { font-size: 18px; font-weight: 700; color: var(--color-text); text-align: right; }
  @media (max-width: 560px) {
    .egrcmp-rekap-grid { grid-template-columns: 1fr; row-gap: 4px; }
    .egrcmp-rekap-gram, .egrcmp-rekap-rupiah { text-align: left; }
    .egrcmp-rekap-grid > .egrcmp-rekap-label:nth-child(n+4) { margin-top: 10px; }
  }

  /* Rekap Transaksi EGR per Sesi (Laporan Harian EGR) — snapshot 100%
     otomatis dari trigger server (tidak ada tombol simpan manual).
     Baris kecil "Tersimpan otomatis pukul .." di bawah tabel sesi, &
     placeholder saat snapshot belum tersedia (tidak pernah angka 0). */
  .egrsesi-savedat-row { display: flex; flex-wrap: wrap; gap: 6px 32px; margin-top: 10px; }
  .egrsesi-empty { font-size: 13.5px; font-weight: 600; color: var(--color-text-muted); font-style: italic; }

  /* Kartu Summary — paragraf naratif otomatis */
  .egrcmp-summary-body { padding: 14px 16px; }
  .egrcmp-summary-body p { font-size: 18px; line-height: 1.65; color: var(--color-text); margin: 0 0 12px; }
  .egrcmp-summary-body p:last-child { margin-bottom: 0; }

  /* Transaksi Hari Ini (Laporan Rekap EGR) — kartu horizontal ringkas
     paling atas halaman, SELALU baca tanggal hari ini (independen dari
     filter rentang tanggal laporan). Gramasi & rupiah besar/tebal (reuse
     .etf-gram-main/-decimal/-unit), jam WIB realtime lebih kecil tapi
     tetap jelas. 3 item sejajar horizontal, turun berurutan di layar
     kecil supaya tidak terpotong. */
  .egrtoday-card {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 18px 36px;
    padding: 16px 20px;
  }
  .egrtoday-item { display: flex; align-items: center; gap: 12px; }
  .egrtoday-icon {
    width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--color-primary); color: #fff;
  }
  .egrtoday-icon.gold { background: var(--color-gold); }
  .egrtoday-icon .material-symbols-rounded { font-size: 22px; }
  .egrtoday-text { display: flex; flex-direction: column; gap: 2px; }
  .egrtoday-label { font-size: 11.5px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .3px; }
  .egrtoday-value { font-size: 23px; font-weight: 900; color: var(--color-text); line-height: 1.15; }
  .egrtoday-clock-value { font-size: 16px; font-weight: 700; color: var(--color-text); line-height: 1.15; }
  @media (max-width: 640px) {
    .egrtoday-card { flex-direction: column; align-items: flex-start; gap: 14px; }
  }

  /* ---------------- Modal — base (berlaku di semua ukuran layar,
     dulu cuma ada di dalam @media max-width:640px sehingga modal
     seperti "Kirim Confirmation Deal" tidak kelihatan di desktop;
     ditambahkan di sini tanpa mengubah rule yang sudah ada) ---------------- */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(16, 24, 32, 0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .modal-box {
    background: var(--color-surface);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-hover);
    width: 100%; max-width: 440px;
    padding: 20px;
    animation: fadeIn 180ms ease;
  }
  .modal-box.modal-box-wide { max-width: 1120px; }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .modal-title {
    font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px;
  }
  .modal-title .material-symbols-rounded { font-size: 20px; color: var(--color-primary); }
  .modal-body { display: flex; flex-direction: column; }
  .modal-footer {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--color-border);
  }

  /* ---------------- Laporan Buyer Trading — UI dashboard ---------------- */
  .kpi-icon.blue { background: rgba(59, 130, 246, 0.12); color: #3B82F6; }
  .lbt-periode-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--color-primary-soft); color: var(--color-primary);
    border-radius: 999px; padding: 7px 16px; font-size: 12.5px; font-weight: 700;
    margin-top: 10px; margin-bottom: 14px;
  }
  .lbt-vol-bar-track { background: var(--color-bg); border-radius: 999px; height: 7px; width: 100%; min-width: 70px; overflow: hidden; }
  .lbt-vol-bar-fill { background: var(--color-primary); height: 100%; border-radius: 999px; }

  .lbt-mtm-card {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 8px;
    background: var(--color-bg); border: 1px solid var(--color-border); font-size: 12px; white-space: nowrap;
  }
  .lbt-mtm-label { font-weight: 700; color: var(--color-text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: .02em; }
  .lbt-mtm-arrow { display: inline-flex; align-items: center; }
  .lbt-mtm-arrow .material-symbols-rounded { font-size: 15px; }
  .lbt-mtm-pct { font-weight: 800; }
  .lbt-mtm-sep { color: var(--color-border); }
  .lbt-mtm-selisih { font-weight: 700; color: var(--color-text-muted); }
  .lbt-mtm-card.lbt-mtm-up .lbt-mtm-arrow, .lbt-mtm-card.lbt-mtm-up .lbt-mtm-pct { color: var(--color-success); }
  .lbt-mtm-card.lbt-mtm-down .lbt-mtm-arrow, .lbt-mtm-card.lbt-mtm-down .lbt-mtm-pct { color: var(--color-danger); }
  .lbt-mtm-card.lbt-mtm-flat .lbt-mtm-arrow, .lbt-mtm-card.lbt-mtm-flat .lbt-mtm-pct { color: var(--color-text-muted); }
  @media (max-width: 640px) { .lbt-mtm-card { font-size: 11px; padding: 5px 9px; } }
  .lbt-detail-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
  @media (max-width: 640px) { .lbt-detail-summary { grid-template-columns: 1fr; } }
  .lbt-detail-summary .card { padding: 14px 16px; }
  .lbt-detail-table-wrap { max-height: 420px; overflow-y: auto; border: 1px solid var(--color-border); border-radius: var(--radius-sm); }
  .lbt-detail-table-wrap table.data-table { margin: 0; }
  .lbt-detail-table-wrap thead th { position: sticky; top: 0; z-index: 1; background: var(--color-bg); }
  .lbt-detail-table-wrap tfoot td { position: sticky; bottom: 0; background: var(--color-gold-soft); font-weight: 700; }

  /* ---------------- Modal "Lihat Detail" (Laporan Buyer Trading & EGR) —
     tema premium dark green + gold, HANYA berlaku di dalam modal ini
     (pakai token --kpi-* yang sama dengan halaman KPI Perdagangan —
     keduanya varian "premium dark card" aplikasi, ikut berubah sesuai
     tema yang dipilih via CSS variables). Tidak memengaruhi
     dashboard/sidebar/tabel utama sama sekali. ---------------- */
  .lbt-detail-overlay-dark { background: rgba(4, 8, 6, 0.72); }
  .modal-box.lbt-detail-modal-dark {
    width: 60vw !important; max-width: 920px !important; min-width: 360px;
    height: 78vh !important; max-height: 780px !important;
    display: flex; flex-direction: column;
    background: linear-gradient(165deg, var(--kpi-bg-1) 0%, var(--kpi-bg-2) 100%);
    border: 1px solid var(--kpi-border);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(212, 175, 55, 0.08);
    padding: 24px;
  }
  @media (max-width: 1000px) {
    .modal-box.lbt-detail-modal-dark { width: 92vw !important; max-width: 92vw !important; height: 85vh !important; max-height: 85vh !important; padding: 18px; }
  }
  @media (max-width: 640px) {
    .modal-box.lbt-detail-modal-dark { width: 95vw !important; max-width: 95vw !important; height: 88vh !important; max-height: 88vh !important; padding: 14px; }
  }
  .lbt-detail-modal-dark .modal-header { flex-shrink: 0; margin-bottom: 18px; }
  .lbt-detail-modal-dark .modal-title { color: var(--kpi-heading); font-size: 19px; }
  .lbt-detail-modal-dark .modal-title .material-symbols-rounded { color: var(--kpi-accent); }
  .lbt-detail-modal-dark .icon-btn {
    background: transparent; border: 1px solid var(--kpi-accent-strong); color: var(--kpi-accent); border-radius: 999px;
  }
  .lbt-detail-modal-dark .icon-btn:hover { background: var(--kpi-accent-soft); }
  .lbt-detail-modal-dark .modal-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .lbt-detail-modal-dark .lbt-detail-summary { flex-shrink: 0; }
  .lbt-detail-modal-dark .lbt-detail-summary .card {
    background: var(--kpi-header-icon-bg); border: 1px solid var(--kpi-border); box-shadow: none;
  }
  .lbt-detail-modal-dark .lbt-detail-summary .kpi-label { color: var(--kpi-label); }
  .lbt-detail-modal-dark .lbt-detail-summary .kpi-value { color: var(--kpi-accent); font-weight: 800; }
  .lbt-detail-modal-dark .lbt-detail-table-wrap {
    flex: 1; min-height: 0; max-height: none;
    background: var(--kpi-selisih-bg); border: 1px solid var(--kpi-border);
  }
  .lbt-detail-modal-dark .data-table thead th {
    background: var(--kpi-card-icon-bg) !important; color: var(--kpi-sub); border-bottom: 1px solid var(--kpi-border-soft);
  }
  .lbt-detail-modal-dark .data-table tbody td {
    color: var(--kpi-row-value); border-bottom: 1px solid var(--kpi-track);
  }
  .lbt-detail-modal-dark .data-table tr:hover td { background: rgba(212, 175, 55, 0.08); }
  .lbt-detail-modal-dark .data-table tfoot td {
    background: var(--kpi-card-icon-bg) !important; color: var(--kpi-value-gold); font-weight: 800; border-top: 1px solid var(--kpi-accent-strong);
  }
  .lbt-detail-modal-dark .recent-empty { color: var(--kpi-label); }
  .lbt-detail-modal-dark .modal-footer { flex-shrink: 0; border-top: 1px solid var(--kpi-border); }
  .lbt-detail-modal-dark .modal-footer .btn {
    background: transparent; border: 1px solid var(--kpi-accent-strong); color: var(--kpi-accent);
  }
  .lbt-detail-modal-dark .modal-footer .btn:hover { background: var(--kpi-accent-soft); }

  /* ---------------- Halaman KPI Perdagangan Emas — tema dark green +
     gold khusus halaman ini (warna hardcode, sama seperti modal
     "Lihat Detail" — TIDAK memengaruhi halaman lain / dark-light
     toggle aplikasi). Data tetap dari getKpiPerdaganganEmas() di
     Code.gs, ini murni styling. ---------------- */
  .kpi-dark-page {
    background: linear-gradient(160deg, var(--kpi-bg-1) 0%, var(--kpi-bg-2) 100%);
    border-radius: 22px; border: 1px solid var(--kpi-border); padding: 26px 28px 30px;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.35);
  }
  /* display/min-height HANYA aktif kalau halaman ini sedang aktif
     (.page.active) — kalau cuma ".kpi-dark-page { display:flex }"
     tanpa syarat ini, spesifisitasnya menyamai ".page { display:none }"
     dan menang berdasarkan urutan CSS, jadi halaman KPI kelihatan
     terus "nempel" di bawah halaman lain walau tidak sedang dibuka. */
  .page.active.kpi-dark-page {
    min-height: calc(100vh - var(--header-height) - 62px);
    display: flex; flex-direction: column;
  }
  .kpi-dark-header { position: relative; display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; overflow: hidden; }
  .kpi-dark-header-icon {
    width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0;
    background: var(--kpi-header-icon-bg); border: 1px solid var(--kpi-border-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .kpi-dark-header-icon .material-symbols-rounded { font-size: 26px; color: var(--kpi-accent); }
  .kpi-dark-header-text h1 { color: var(--kpi-heading); font-size: 24px; margin: 0 0 4px 0; font-weight: 800; }
  .kpi-dark-header-text p { color: var(--kpi-sub); font-size: 13.5px; margin: 0; }
  .kpi-dark-badge {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 10px;
    background: var(--kpi-accent-soft); color: var(--kpi-accent); border: 1px solid var(--kpi-accent-soft-border);
    border-radius: 999px; padding: 4px 12px; font-size: 11.5px; font-weight: 700;
  }
  .kpi-dark-refresh-btn {
    background: transparent; border: 1px solid var(--kpi-accent-strong); color: var(--kpi-accent);
    margin-left: auto; flex-shrink: 0; align-self: flex-start;
  }
  .kpi-dark-refresh-btn:hover { background: var(--kpi-accent-soft); }
  .kpi-dark-deco {
    position: absolute; right: -10px; top: -30px; font-size: 130px !important;
    color: var(--kpi-deco); pointer-events: none;
  }
  .kpi-dark-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 8px; }
  .kpi-dark-grid-3 { grid-template-columns: repeat(3, 1fr); }
  @media (max-width: 900px) { .kpi-dark-grid, .kpi-dark-grid-3 { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .kpi-dark-grid, .kpi-dark-grid-3 { grid-template-columns: 1fr; } }
  .kpi-dark-card {
    background: var(--kpi-card-bg); border: 1px solid var(--kpi-border); border-radius: 16px; padding: 18px;
    position: relative; overflow: hidden;
  }
  .kpi-dark-card::after {
    content: ''; position: absolute; left: 18px; right: 18px; bottom: 12px; height: 1px;
    background: var(--kpi-card-divider);
  }
  .kpi-dark-icon {
    width: 36px; height: 36px; border-radius: 10px; margin-bottom: 12px;
    background: var(--kpi-card-icon-bg); border: 1px solid var(--kpi-border-soft);
    display: flex; align-items: center; justify-content: center;
  }
  .kpi-dark-icon .material-symbols-rounded { font-size: 19px; color: var(--kpi-accent); }
  .kpi-dark-label { color: var(--kpi-label); font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
  .kpi-dark-value { color: var(--kpi-value); font-size: 19px; font-weight: 800; line-height: 1.2; }
  .kpi-dark-value.gold-big { color: var(--kpi-value-gold); font-size: 26px; }
  .kpi-dark-bar-track { margin-top: 12px; background: var(--kpi-track); }
  .kpi-dark-bar-fill { background: var(--kpi-bar-fill-gradient); }
  .kpi-dark-section-label {
    color: var(--kpi-accent); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
    margin: 20px 2px 12px; padding-left: 12px; border-left: 3px solid var(--kpi-accent-strong);
  }
  .kpi-dark-banner {
    margin-top: auto; text-align: center; padding: 30px 20px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--kpi-banner-bg);
    border: 1px solid var(--kpi-accent-strong); border-radius: 18px;
    box-shadow: var(--kpi-banner-shadow);
  }
  .kpi-dark-banner-label {
    display: inline-flex; align-items: center; gap: 8px; color: var(--kpi-accent);
    font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 10px;
  }
  .kpi-dark-banner-value { color: var(--kpi-banner-value); font-size: 46px; font-weight: 900; letter-spacing: .01em; line-height: 1.1; }
  .kpi-dark-banner-sub { color: var(--kpi-banner-sub); font-size: 16px; font-weight: 600; margin-top: 6px; }
  .kpi-dark-banner-sisa { color: var(--kpi-label); font-size: 13px; margin-top: 12px; }
  .kpi-dark-value-sub { color: var(--kpi-sub); font-size: 12.5px; font-weight: 600; margin-top: 4px; }

  /* Achieved state — HANYA dipakai saat Target 100% sudah tercapai
     (toggled via JS, class="kpi-achieved"). Background tetap dark green
     (var(--kpi-card-bg) tidak diubah), cuma border + subtle glow yang
     jadi gold, supaya tetap 1 card saja yang berubah — bukan seluruh
     grid KPI ikut kuning. */
  .kpi-dark-card.kpi-achieved {
    border-color: var(--kpi-accent-strong);
    box-shadow: 0 0 0 1px var(--kpi-accent-soft-border), 0 0 22px -6px var(--kpi-accent-soft-border);
  }
  .kpi-dark-card.kpi-achieved .kpi-dark-icon { border-color: var(--kpi-accent-strong); }
  .kpi-dark-card.kpi-achieved .kpi-dark-icon .material-symbols-rounded { color: var(--kpi-accent-strong); }
  .kpi-dark-surplus-badge {
    display: none; align-items: center; gap: 4px; margin-top: 6px;
    color: var(--kpi-accent-strong); font-size: 12px; font-weight: 800;
  }
  .kpi-dark-surplus-badge.show { display: inline-flex; }

  .kpi-dark-chart-card {
    background: var(--kpi-card-bg); border: 1px solid var(--kpi-border); border-radius: 16px; padding: 16px 18px 10px; margin-bottom: 8px;
  }
  .kpi-dark-chart-wrap { height: 300px; }

  .kpi-prognosa-card {
    background: var(--kpi-card-bg); border: 1px solid var(--kpi-border); border-radius: 16px; padding: 18px;
  }
  .kpi-prognosa-card[data-tier="110"] { border-color: var(--kpi-border-soft); }
  .kpi-prognosa-card[data-tier="120"] { border-color: var(--kpi-accent-strong); }
  /* Achieved state (class="achieved", toggled via JS ikut data.tercapai
     tiap tier — hari ini hanya tier 100 yang true). Background tetap
     dark green, cuma ditambah gradient tint gold tipis + border/glow
     gold, supaya "focal point" tapi tidak jadi kartu kuning penuh. */
  .kpi-prognosa-card.achieved {
    border-color: var(--kpi-accent-strong);
    background: linear-gradient(165deg, var(--kpi-accent-soft) 0%, var(--kpi-card-bg) 60%);
    box-shadow: 0 0 0 1px var(--kpi-accent-soft-border), 0 0 26px -8px var(--kpi-accent-soft-border);
  }
  .kpi-prognosa-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .kpi-prognosa-tier { color: var(--kpi-accent); font-size: 13.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
  .kpi-prognosa-status {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; padding: 3px 9px; border-radius: 999px;
    background: var(--kpi-status-bg); color: var(--kpi-status-color); display: none;
  }
  .kpi-prognosa-status.show { display: inline-block; }
  /* Badge "🏆 TERCAPAI" — pill gold dengan tulisan dark green, beda dari
     badge "Tercapai" generik (hijau) di atas supaya achieved state Target
     100% lebih menonjol sebagai focal point section Prognosa. */
  .kpi-prognosa-status.achieved-badge { background: var(--kpi-accent-strong); color: var(--kpi-bg-2); }
  .kpi-prognosa-card.achieved .kpi-prognosa-tier { color: var(--kpi-accent-strong); }
  .kpi-prognosa-target { color: var(--kpi-value); font-size: 20px; font-weight: 800; margin-bottom: 10px; }
  .kpi-prognosa-pct-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 8px 0 12px; }
  .kpi-prognosa-pct { color: var(--kpi-value-gold); font-size: 13px; font-weight: 700; margin: 0; }
  .kpi-prognosa-pct-surplus { display: none; color: var(--kpi-accent-strong); font-size: 12px; font-weight: 800; white-space: nowrap; }
  .kpi-prognosa-pct-surplus.show { display: inline; }
  .kpi-prognosa-rows { display: flex; flex-direction: column; gap: 8px; padding-top: 10px; border-top: 1px solid var(--kpi-track); }
  .kpi-prognosa-row { display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; }
  .kpi-prognosa-row span { color: var(--kpi-label); }
  .kpi-prognosa-row b { color: var(--kpi-row-value); font-weight: 700; text-align: right; }

  .kpi-proyeksi-selisih {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 4px 0 22px;
  }
  .kpi-proyeksi-selisih > div {
    background: var(--kpi-selisih-bg); border: 1px solid var(--kpi-border); border-radius: 12px; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .kpi-proyeksi-selisih span { color: var(--kpi-label); font-size: 12px; }
  .kpi-proyeksi-selisih b { color: var(--kpi-value-gold); font-size: 13.5px; font-weight: 800; white-space: nowrap; }
  @media (max-width: 900px) { .kpi-proyeksi-selisih { grid-template-columns: 1fr; } }

  .kpi-dark-ringkasan { margin-top: 4px; }
  .kpi-dark-ringkasan p { color: var(--kpi-banner-sub); font-size: 14px; line-height: 1.7; text-align: left; max-width: 900px; margin: 0 auto; }

  .kpi-sim-card { margin-bottom: 8px; }
  .kpi-sim-inputs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  @media (max-width: 700px) { .kpi-sim-inputs { grid-template-columns: 1fr; } }
  .kpi-sim-inputs .form-group label { color: var(--kpi-label); }
  .kpi-sim-inputs input, .kpi-sim-inputs select,
  .kpi-sim-gram-needed-row select {

     gramasi & rupiah rata kanan (rupiah boleh turun baris di layar sempit). */
  .egrsaldo-card { padding: 12px 16px 16px; }

  /* ---------------- Modal (Kirim Confirmation Deal, dll) ---------------- */

  /* ---------------- Market Indicators — Running Ticker ---------------- */
  .ticker-viewport {
    overflow: hidden; white-space: nowrap; position: relative;
    height: 56px; margin-top: 10px; border-radius: var(--radius-sm);
    background: var(--color-bg); border: 1px solid var(--color-border);
    display: flex; align-items: center;
  }
  .ticker-track {
    display: inline-flex; align-items: center; gap: 32px;
    padding: 0 24px;
    animation: ticker-scroll 32s linear infinite;
    will-change: transform;
  }
  .ticker-viewport:hover .ticker-track { animation-play-state: paused; }
  @keyframes ticker-scroll {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }
  .ticker-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 14.5px !important; }
  .ticker-item .ticker-label { font-weight: 700; color: var(--color-text-muted); }
  .ticker-item .ticker-value { font-weight: 700; color: var(--color-text); }
  .ticker-item .ticker-delta.up { color: var(--color-success); font-weight: 700; }
  .ticker-item .ticker-delta.down { color: var(--color-danger); font-weight: 700; }
  .ticker-item .ticker-delta.gray { color: var(--color-text-muted); font-weight: 700; }
  .ticker-sep { color: var(--color-border); font-weight: 400; margin: 0 4px; }

  .pjl-f1-card {

    padding: 22px 26px; position: relative; overflow: hidden;
  }
  .pjl-f1-banner::after {
    content: ''; position: absolute; right: -30px; top: -40px;
    width: 160px; height: 160px; border-radius: 50%;
    background: radial-gradient(circle, rgba(201,162,39,0.28) 0%, rgba(201,162,39,0) 70%);
  }
  /* Pita emas dekoratif di sudut kiri-atas banner. */
  .pjl-f1-banner::before {
    content: ''; position: absolute; top: 0; left: 0; width: 0; height: 0;
    border-style: solid; border-width: 54px 54px 0 0;
    border-color: rgba(233, 206, 114, 0.4) transparent transparent transparent;

  table.pjl-f1-table thead th {

  .pjl-f1-col-no { text-align: center; color: #6B7684; font-weight: 700; }

  .pjl-f1-badge {

  .pjl-f1-total-bar {

  /* ============================================================
     PDF TEMPLATE — "Download Laporan" (Print Penetapan Harga).
     Dirender OFF-SCREEN (lihat #pph-pdf-capture-wrap di Index.html),
     di-capture via html2canvas lalu dimasukkan ke jsPDF (A4).
     SEMUA warna di-hardcode (bukan var(--color-...)) supaya hasil
     PDF selalu terang/korporat terlepas dari tema aplikasi yang
     sedang aktif. Class di-prefix "pdfph-" supaya tidak menyentuh
     style halaman Dashboard Print Penetapan Harga yang lain.
     ============================================================ */
  #pph-pdf-capture-wrap { position: fixed; top: 0; left: -99999px; z-index: -1; }
  .pdfph-page {
    width: 794px;
    background: #FFFFFF;
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    color: #23291F;
    box-sizing: border-box;
    padding: 20px 38px 0 38px; /* kiri/kanan ~38px = ~10mm @96dpi -> content ~90.4% lebar A4 */
    position: relative;
  }
