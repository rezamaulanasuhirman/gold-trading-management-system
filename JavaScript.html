  // ============================================================
  // PIUTANG SUPPLIER EGR — klon PERSIS blok "GOLD IN TRANSIT" Trading di
  // atas (semua fungsi gitegr* mengikuti logic git* apa adanya), HANYA
  // beda: elemen target berprefix "gitegr-" dan endpoint server yang
  // dipanggil getGoldInTransitDataEgr() (sumber "Input_Barang EGR").
  // Filter Status/Search/Aging tab Detail tetap murni di client, sama
  // seperti versi Trading. Tabel detail EGR punya 2 kolom tambahan
  // (Harga/Gram, Nominal Piutang) sesuai kebutuhan spesifik EGR — field
  // ini sudah tersedia di objek detail (harga, nilaiGoldInTransit) krn
  // dihasilkan oleh fungsi shared goldInTransitPerPO_ yang sama.
  // ============================================================
  var gitegrData = null;
  var gitegrDetailFiltered = [];
  var gitegrSortState = { col: 'aging', dir: 'desc' };
  var gitegrCurrentPage = 1;
  var GITEGR_PAGE_SIZE = 25;

  function loadPiutangEgrPage() {
    loadGoldInTransitDataEgr();
  }

  function gitegrFormatKgTon_(gram) {
    const kg = gram / 1000;
    const ton = gram / 1000000;
    return kg.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg · ' + ton.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' ton';
  }

  function gitegrQuickPosisi(mode) {
    ['gitegr-quick-hariini', 'gitegr-quick-akhirbulan', 'gitegr-quick-custom'].forEach(function (id) {
      document.getElementById(id).classList.toggle('active', id === 'gitegr-quick-' + mode);
    });
    const posisiEl = document.getElementById('gitegr-f-posisi');
    if (mode === 'hariini') {
      posisiEl.value = todayISO();
      loadGoldInTransitDataEgr(posisiEl.value);
    } else if (mode === 'akhirbulan') {
      const d = new Date();
      d.setDate(0);
      posisiEl.value = pjlDateToIso_(d);
      loadGoldInTransitDataEgr(posisiEl.value);
    }
  }

  function gitegrApplyFilter() {
    loadGoldInTransitDataEgr(document.getElementById('gitegr-f-posisi').value);
  }

  function gitegrResetFilter() {
    document.getElementById('gitegr-f-supplier').value = '';
    document.getElementById('gitegr-f-tahun').value = '';
    gitegrQuickPosisi('hariini');
  }

  function loadGoldInTransitDataEgr(tanggalPosisi) {
    google.script.run
      .withSuccessHandler(function (res) {
        gitegrData = res;
        document.getElementById('gitegr-f-posisi').value = res.posisi;

        const supEl = document.getElementById('gitegr-f-supplier');
        const curSup = supEl.value;
        supEl.innerHTML = '<option value="">Semua Supplier</option>' + res.supplierList.map(function (s) { return '<option value="' + escapeHtmlAttr(s) + '">' + escapeHtmlAttr(s) + '</option>'; }).join('');
        supEl.value = curSup;

        const tahunEl = document.getElementById('gitegr-f-tahun');
        const curTahun = tahunEl.value;
        tahunEl.innerHTML = '<option value="">Semua Tahun</option>' + res.tahunList.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('');
        tahunEl.value = curTahun;

        gitegrRenderRingkasan_();
        gitegrDetailApply();
      })
      .withFailureHandler(function (err) {
        showToast('Gagal memuat Piutang Supplier EGR: ' + (err.message || err), 'error');
      })
      .getGoldInTransitDataEgr(tanggalPosisi || '');
  }

  function showGitegrTab(tabId) {
    document.getElementById('gitegr-tab-btn-ringkasan').classList.toggle('active', tabId === 'ringkasan');
    document.getElementById('gitegr-tab-btn-detail').classList.toggle('active', tabId === 'detail');
    document.getElementById('gitegr-tab-ringkasan').classList.toggle('active', tabId === 'ringkasan');
    document.getElementById('gitegr-tab-detail').classList.toggle('active', tabId === 'detail');
  }

  function gitegrPosisiLabel_(tanggalStr) {
    const d = new Date(tanggalStr + 'T00:00:00');
    return d.getDate() + ' ' + DL_BULAN_ID[d.getMonth()] + ' ' + d.getFullYear();
  }

  function gitegrRenderRingkasan_() {
    if (!gitegrData) return;
    const sup = document.getElementById('gitegr-f-supplier').value;
    const sc = gitegrData.scorecard;

    let detailForScorecard = gitegrData.detail;
    if (sup) detailForScorecard = detailForScorecard.filter(function (r) { return r.supplier === sup; });

    const totalOrder = detailForScorecard.reduce(function (s, r) { return s + r.qtyPO; }, 0);
    const diterima = detailForScorecard.reduce(function (s, r) { return s + r.diterima; }, 0);
    const git = detailForScorecard.reduce(function (s, r) { return s + r.goldInTransit; }, 0);
    const outstanding = detailForScorecard.filter(function (r) { return r.goldInTransit > 0; }).length;
    const rupiahGit = detailForScorecard.reduce(function (s, r) { return s + (r.nilaiGoldInTransit || 0); }, 0);

    document.getElementById('gitegr-sc-git-gr').textContent = formatGram(git);
    document.getElementById('gitegr-sc-git-conv').textContent = gitegrFormatKgTon_(git);
    document.getElementById('gitegr-sc-total-po').textContent = sup ? detailForScorecard.length : sc.totalPO;
    document.getElementById('gitegr-sc-diterima-gr').textContent = formatGram(diterima);
    document.getElementById('gitegr-sc-diterima-conv').textContent = gitegrFormatKgTon_(diterima);
    document.getElementById('gitegr-sc-outstanding').textContent = outstanding + ' PO';
    document.getElementById('gitegr-sc-rupiah').textContent = formatRupiah(rupiahGit);
    document.getElementById('gitegr-sc-rupiah-gr').textContent = '= ' + (git / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';

    const posisiLabelEl = document.getElementById('gitegr-posisi-label');
    if (posisiLabelEl) {
      posisiLabelEl.textContent = 'Posisi per ' + gitegrPosisiLabel_(gitegrData.posisi) +
        (gitegrData.posisi === gitegrData.lastDataDate ? ' (data terakhir tersedia)' : '');
    }
    const lastDataEl = document.getElementById('gitegr-lastdata-label');
    if (lastDataEl) lastDataEl.textContent = gitegrPosisiLabel_(gitegrData.lastDataDate);

    gitegrRenderTrendChart_();
    gitegrRenderDonutChart_(totalOrder, diterima, git);

    const breakdownEl = document.getElementById('gitegr-supplier-breakdown');
    let breakdown = gitegrData.supplierBreakdown;
    if (sup) breakdown = breakdown.filter(function (b) { return b.supplier === sup; });
    if (!breakdown.length) {
      breakdownEl.innerHTML = '<div class="recent-empty">Tidak ada Piutang Supplier EGR outstanding</div>';
    } else {
      const maxGit = Math.max.apply(null, breakdown.map(function (b) { return b.goldInTransit; }));
      breakdownEl.innerHTML = breakdown.map(function (b) {
        const barPct = maxGit > 0 ? (b.goldInTransit / maxGit) * 100 : 0;
        return '<div class="git-supplier-card">' +
          '<div class="git-supplier-avatar"><span class="material-symbols-rounded">domain</span></div>' +
          '<div class="git-supplier-info"><div class="git-supplier-name">' + escapeHtmlAttr(b.supplier) + '</div>' +
          '<div class="git-supplier-sub">' + b.poCount + ' PO outstanding &middot; ' + b.persen.toFixed(1) + '% dari total</div></div>' +
          '<div class="git-supplier-bar-wrap"><div class="git-supplier-bar-fill" style="width:' + barPct.toFixed(1) + '%;"></div></div>' +
          '<div class="git-supplier-value">' + formatGram(b.goldInTransit) + '</div>' +
          '<button type="button" class="btn btn-secondary" style="padding:5px 10px; font-size:11px;" onclick="gitegrLihatDetailSupplier(\'' + escapeHtmlAttr(b.supplier).replace(/'/g, "\\'") + '\')">Lihat Detail</button>' +
          '</div>';
      }).join('');
      breakdownEl.innerHTML += '<div class="git-supplier-card git-supplier-total-row"><div class="git-supplier-info">TOTAL</div><div class="git-supplier-bar-wrap" style="visibility:hidden;"></div><div class="git-supplier-value">' + formatGram(breakdown.reduce(function (s, b) { return s + b.goldInTransit; }, 0)) + '</div></div>';
    }
  }

  function gitegrLihatDetailSupplier(supplier) {
    document.getElementById('gitegr-f-supplier').value = supplier;
    showGitegrTab('detail');
    gitegrDetailApply();
  }

  function gitegrRenderDonutChart_(totalOrder, diterima, git) {
    const persenDiterima = totalOrder > 0 ? (diterima / totalOrder) * 100 : 0;
    const persenGit = totalOrder > 0 ? (git / totalOrder) * 100 : 0;

    document.getElementById('gitegr-donut-pct').textContent = persenDiterima.toFixed(1) + '%';
    document.getElementById('gitegr-legend-diterima-val').textContent = formatGram(diterima);
    document.getElementById('gitegr-legend-diterima-pct').textContent = persenDiterima.toFixed(1) + '%';
    document.getElementById('gitegr-legend-git-val').textContent = formatGram(git);
    document.getElementById('gitegr-legend-git-pct').textContent = persenGit.toFixed(1) + '%';
    document.getElementById('gitegr-formula-total').textContent = formatGram(totalOrder);
    document.getElementById('gitegr-formula-diterima').textContent = formatGram(diterima);
    document.getElementById('gitegr-formula-git').textContent = formatGram(git);

    destroyChart('gitegrDonut');
    const ctx = document.getElementById('gitegr-chart-donut');
    if (!ctx) return;
    charts.gitegrDonut = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['EGR Sudah Diterima', 'Piutang Supplier EGR'],
        datasets: [{
          data: [diterima, git],
          backgroundColor: [cssColor('--color-success'), cssColor('--color-gold')],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '72%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (ctx) { return ctx.label + ': ' + formatGram(ctx.parsed); } } }
        }
      }
    });
  }

  function gitegrRenderTrendChart_() {
    if (!gitegrData) return;
    let trend = gitegrData.trend || [];
    const tahun = document.getElementById('gitegr-f-tahun').value;
    if (tahun) trend = trend.filter(function (t) { return t.bulan.slice(0, 4) === tahun; });

    destroyChart('gitegrTrend');
    const ctx = document.getElementById('gitegr-chart-trend');
    if (!ctx) return;
    charts.gitegrTrend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.map(function (t) {
          const parts = t.bulan.split('-');
          const label = DL_BULAN_ID[parseInt(parts[1], 10) - 1].slice(0, 3) + ' ' + parts[0];
          return t.isSementara ? label + '*' : label;
        }),
        datasets: [{
          label: 'Piutang Supplier EGR (gr)', data: trend.map(function (t) { return t.goldInTransit; }),
          borderColor: cssColor('--color-primary'), backgroundColor: cssColor('--color-primary-soft'),
          fill: true, tension: 0.3, pointRadius: 3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (ctx) { return formatGram(ctx.parsed.y); } } }
        },
        scales: { y: { ticks: { callback: function (v) { return (v / 1000).toLocaleString('id-ID') + ' kg'; } } } }
      }
    });
  }

  function gitegrDetailReset() {
    document.getElementById('gitegr-d-status').value = 'Semua Outstanding';
    document.getElementById('gitegr-d-search').value = '';
    document.getElementById('gitegr-d-aging').value = '';
    gitegrDetailApply();
  }

  function gitegrAgingBucket_(hari) {
    if (hari <= 7) return '0-7';
    if (hari <= 14) return '8-14';
    if (hari <= 30) return '15-30';
    return '>30';
  }

  function gitegrDetailApply() {
    if (!gitegrData) return;
    const sup = document.getElementById('gitegr-f-supplier').value;
    const status = document.getElementById('gitegr-d-status').value;
    const search = document.getElementById('gitegr-d-search').value.trim().toLowerCase();
    const aging = document.getElementById('gitegr-d-aging').value;

    gitegrDetailFiltered = gitegrData.detail.filter(function (r) {
      if (sup && r.supplier !== sup) return false;
      if (status === 'Semua Outstanding') { if (r.goldInTransit <= 0) return false; }
      else if (status && r.status !== status) return false;
      if (search && r.nomorPO.toLowerCase().indexOf(search) === -1) return false;
      if (aging && gitegrAgingBucket_(r.aging) !== aging) return false;
      return true;
    });

    gitegrSortApply_();
    gitegrCurrentPage = 1;
    gitegrRenderDetailScorecard_();
    gitegrRenderDetailTable_();
  }

  function gitegrSortBy(col) {
    if (gitegrSortState.col === col) {
      gitegrSortState.dir = gitegrSortState.dir === 'asc' ? 'desc' : 'asc';
    } else {
      gitegrSortState.col = col;
      gitegrSortState.dir = 'desc';
    }
    gitegrSortApply_();
    gitegrCurrentPage = 1;
    gitegrRenderDetailTable_();
  }

  function gitegrSortApply_() {
    const col = gitegrSortState.col, dir = gitegrSortState.dir;
    gitegrDetailFiltered.sort(function (a, b) {
      let va = a[col], vb = b[col];
      if (typeof va === 'string') { va = va || ''; vb = vb || ''; }
      else { va = va || 0; vb = vb || 0; }
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function gitegrRenderDetailScorecard_() {
    const outstanding = gitegrDetailFiltered.filter(function (r) { return r.goldInTransit > 0; });
    const git = gitegrDetailFiltered.reduce(function (s, r) { return s + r.goldInTransit; }, 0);
    const belum = gitegrDetailFiltered.filter(function (r) { return r.status === 'Belum Datang' && r.goldInTransit > 0; }).length;
    const sebagian = gitegrDetailFiltered.filter(function (r) { return r.status === 'Sebagian'; }).length;
    document.getElementById('gitegr-dsc-outstanding').textContent = outstanding.length;
    document.getElementById('gitegr-dsc-git').textContent = formatGram(git);
    document.getElementById('gitegr-dsc-belum').textContent = belum;
    document.getElementById('gitegr-dsc-sebagian').textContent = sebagian;
  }

  function gitegrStatusBadge_(status) {

  function gitegrRenderDetailTable_() {
    const body = document.getElementById('gitegr-table-body');
    const countEl = document.getElementById('gitegr-table-count');
    document.querySelectorAll('#gitegr-tab-detail .git-sortable').forEach(function (th) { th.classList.remove('sorted', 'sorted-asc'); });
    const activeTh = document.querySelector('#gitegr-tab-detail .git-sortable[onclick="gitegrSortBy(\'' + gitegrSortState.col + '\')"]');
    if (activeTh) activeTh.classList.add(gitegrSortState.dir === 'asc' ? 'sorted-asc' : 'sorted');

    if (!gitegrDetailFiltered.length) {
      body.innerHTML = '<tr><td colspan="14" class="recent-empty">Tidak ada data sesuai filter</td></tr>';
      if (countEl) countEl.textContent = '0 data';
      document.getElementById('gitegr-pagination').innerHTML = '';
      return;
    }
    const totalPages = Math.max(1, Math.ceil(gitegrDetailFiltered.length / GITEGR_PAGE_SIZE));
    if (gitegrCurrentPage > totalPages) gitegrCurrentPage = totalPages;
    const start = (gitegrCurrentPage - 1) * GITEGR_PAGE_SIZE;
    const pageItems = gitegrDetailFiltered.slice(start, start + GITEGR_PAGE_SIZE);

    body.innerHTML = pageItems.map(function (r) {
      return '<tr class="' + (r.goldInTransit > 0 ? 'git-row-outstanding' : '') + '">' +
        '<td>' + (r.tanggalPO ? r.tanggalPO.split('-').reverse().join('/') : '-') + '</td>' +
        '<td>' + escapeHtmlAttr(r.nomorPO) + '</td>' +
        '<td>' + (r.nomorInvoice ? escapeHtmlAttr(r.nomorInvoice) : '-') + '</td>' +
        '<td>' + escapeHtmlAttr(r.supplier) + '</td>' +
        '<td>' + formatGram(r.qtyPO) + '</td>' +
        '<td>' + formatGram(r.diterima) + '</td>' +
        '<td><b>' + formatGram(r.goldInTransit) + '</b></td>' +
        '<td>' + formatRupiah(r.harga || 0) + '</td>' +
        '<td>' + formatRupiah(r.nilaiGoldInTransit || 0) + '</td>' +
        '<td>' + r.persenPemenuhan.toFixed(1) + '%</td>' +
        '<td>' + (r.tanggalTerakhirTerima ? r.tanggalTerakhirTerima.split('-').reverse().join('/') : '-') + '</td>' +
        '<td>' + r.aging + ' hari</td>' +
        '<td>' + gitegrStatusBadge_(r.status) + '</td>' +
        '<td><button type="button" class="btn btn-secondary" style="padding:4px 8px; font-size:10.5px;" onclick="gitegrOpenDetailModal(\'' + escapeHtmlAttr(r.nomorPO).replace(/'/g, "\\'") + '\')">Lihat Detail</button></td>' +
        '</tr>';
    }).join('');

    if (countEl) countEl.textContent = gitegrDetailFiltered.length + ' data (menampilkan ' + (start + 1) + '-' + Math.min(start + GITEGR_PAGE_SIZE, gitegrDetailFiltered.length) + ')';

    const pag = document.getElementById('gitegr-pagination');
    const showStart = start + 1, showEnd = Math.min(start + GITEGR_PAGE_SIZE, gitegrDetailFiltered.length);
    let pagHtml = '<div class="mitra-pagination-info">' + showStart + '-' + showEnd + ' dari ' + gitegrDetailFiltered.length + ' data</div><div class="mitra-pagination-pages">';
    pagHtml += '<div class="mitra-page-btn nav' + (gitegrCurrentPage === 1 ? ' disabled' : '') + '" onclick="gitegrGoToPage(' + (gitegrCurrentPage - 1) + ')">&laquo;</div>';
    const maxBtns = 5;
    let pStart = Math.max(1, gitegrCurrentPage - 2), pEnd = Math.min(totalPages, pStart + maxBtns - 1);
    pStart = Math.max(1, pEnd - maxBtns + 1);
    if (pStart > 1) pagHtml += '<div class="mitra-page-btn" onclick="gitegrGoToPage(1)">1</div><span>...</span>';
    for (let i = pStart; i <= pEnd; i++) {
      pagHtml += '<div class="mitra-page-btn' + (i === gitegrCurrentPage ? ' active' : '') + '" onclick="gitegrGoToPage(' + i + ')">' + i + '</div>';
    }
    if (pEnd < totalPages) pagHtml += '<span>...</span><div class="mitra-page-btn" onclick="gitegrGoToPage(' + totalPages + ')">' + totalPages + '</div>';
    pagHtml += '<div class="mitra-page-btn nav' + (gitegrCurrentPage === totalPages ? ' disabled' : '') + '" onclick="gitegrGoToPage(' + (gitegrCurrentPage + 1) + ')">&raquo;</div>';
    pagHtml += '</div>';
    pag.innerHTML = pagHtml;
  }

  // Download Tabel Monitoring PKS Supplier — PNG, screenshot langsung dari
  // elemen tabel yang sedang tampil di layar (html2canvas) supaya warna,
  // judul, header, ikon, font, dan seluruh data persis sama dengan yang
  // dilihat user — bukan desain/template baru. Font tabel sudah 2x lebih
  // besar di CSS (lihat .mpks-table di Styles.html) sehingga hasil PNG
  // otomatis ikut besar tanpa perlu diskalakan ulang di sini.
  function downloadMonitoringPksTableImage() {
    const el = document.getElementById('mpks-capture-area');
    if (!el || typeof html2canvas === 'undefined') { showToast('Gagal memuat modul export gambar', 'error'); return; }
    const list = mpksListCache || [];
    if (!list.length) { showToast('Belum ada data untuk diunduh', 'warning'); return; }

    showToast('Menyiapkan gambar tabel...', 'success');

    // Ukuran penuh konten (bukan viewport) — tabel dibungkus div overflow-x:auto
    // sehingga scrollWidth elemen tabel itu sendiri yang jadi acuan lebar asli.
    const tableEl = el.querySelector('table.mpks-table');
    const fullWidth = Math.max(el.scrollWidth, tableEl ? tableEl.scrollWidth : 0);
    const fullHeight = Math.max(el.scrollHeight, tableEl ? tableEl.scrollHeight : 0);

    // Batasi ukuran kanvas supaya tidak melebihi batas maksimum browser
    // ("Canvas exceeds max size") — scale diturunkan otomatis hanya jika
    // kontennya besar; tabel yang wajar tetap dapat scale 3 penuh.
    const MAX_DIMENSION = 6000;
    const MAX_AREA = 40000000;
    let scale = 3;
    scale = Math.min(scale, MAX_DIMENSION / fullWidth, MAX_DIMENSION / fullHeight);
    scale = Math.min(scale, Math.sqrt(MAX_AREA / (fullWidth * fullHeight)));
    scale = Math.max(scale, 1);

    html2canvas(el, {
      scale: scale, backgroundColor: '#ffffff', useCORS: true,
      width: fullWidth, height: fullHeight,
      windowWidth: fullWidth, windowHeight: fullHeight,
      onclone: function (clonedDoc, clonedEl) {
        // Buka semua pembungkus overflow-x:auto pada elemen kloning (khusus
        // proses download) agar seluruh kolom kanan ikut ter-render, tanpa
        // mengubah tampilan tabel asli di layar.
        clonedEl.style.width = fullWidth + 'px';
        clonedEl.style.maxWidth = 'none';
        clonedEl.style.overflow = 'visible';
        clonedEl.querySelectorAll('div').forEach(function (w) {
          if (w.style && (w.style.overflowX === 'auto' || w.style.overflowX === 'scroll')) {
            w.style.overflow = 'visible';
            w.style.width = 'max-content';
            w.style.maxWidth = 'none';
          }
        });
        const clonedTable = clonedEl.querySelector('table.mpks-table');
        if (clonedTable) {
          clonedTable.style.width = 'max-content';
        }
      }
    }).then(function (canvas) {
      canvas.toBlob(function (blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'Monitoring_PKS_Supplier_' + todayISO() + '.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Tabel Monitoring PKS Supplier berhasil diunduh', 'success');
      }, 'image/png', 1.0);
    }).catch(function (err) {
      console.error('Gagal membuat gambar tabel Monitoring PKS:', err);
      showToast('Gagal membuat gambar tabel', 'error');
    });
  }

  var mpksNodinCurrentSupplierId = null;

  var NODIN_PKS_KEYS = ['KajianRisiko', 'KajianLegal', 'KajianKepatuhan'];

  function mpksNodinOverrides(jenis) {
    const keys = jenis === 'dd' ? NODIN_DD_KEYS : NODIN_PKS_KEYS;

  // Muat pilihan default (dari checklist Monitoring PKS tersimpan) +
  // preview awal saat modal pertama dibuka, utk satu jenis Nodin.
  function mpksLoadNodinDefaults_(jenis) {
    const preview = document.getElementById('mpks-nodin-' + jenis + '-preview');
    preview.textContent = 'Memuat...';
    const runner = google.script.run
      .withSuccessHandler(function (res) {
        const keys = jenis === 'dd' ? NODIN_DD_KEYS : NODIN_PKS_KEYS;
        keys.forEach(function (k) {
          document.getElementById('mpks-nodin-' + jenis + '-' + k).checked = (res.kajianKeys || []).indexOf(k) !== -1;
        });
        mpksRenderNodinPreview_(jenis, res);
      })

        handleLoadError(err);
      });

    else runner.getNodinKajianPksPreview(mpksNodinCurrentSupplierId);
  }

  function mpksRenderNodinPreview_(jenis, res) {
    const preview = document.getElementById('mpks-nodin-' + jenis + '-preview');
    const warning = document.getElementById('mpks-nodin-' + jenis + '-warning');
    const missingBox = document.getElementById('mpks-nodin-' + jenis + '-missing');
    const missingText = document.getElementById('mpks-nodin-' + jenis + '-missing-text');
    const downloadBtn = document.getElementById('mpks-nodin-' + jenis + '-download-btn');
    const kosong = !res.kajianKeys || res.kajianKeys.length === 0;
    const missing = res.missingFields || [];
    warning.style.display = kosong ? '' : 'none';
    // Data narahubung/target belum lengkap -> jangan cuma pesan error,
    // tampilkan juga tombol "Edit Data Supplier" yang langsung membuka
    // form edit utk supplier yang sedang dibuka di modal ini.
    if (missingBox) {
      missingBox.style.display = missing.length ? '' : 'none';
      if (missingText) missingText.textContent = 'Lengkapi data berikut sebelum download: ' + missing.join(', ') + '.';
    }
    downloadBtn.disabled = kosong || missing.length > 0;
    preview.textContent = 'Perihal: ' + res.judul + '\n\n' + res.paragraphs.join('\n\n');
    mpksNodinMissing[jenis] = missing;
    if (res.namaPerusahaan) document.getElementById('mpks-nodin-supplier-nama').textContent = res.namaPerusahaan;
  }

  // Dipanggil saat tombol "Preview" diklik ATAU checklist salah satu
  // kartu berubah — preview teks kartu itu saja yang diperbarui
  // (kartu jenis Nodin lain tidak ikut ter-refresh).
  function mpksRefreshNodinPreview(jenis) {
    if (!mpksNodinCurrentSupplierId) return;
    const preview = document.getElementById('mpks-nodin-' + jenis + '-preview');
    preview.textContent = 'Memuat...';
    const runner = google.script.run
      .withSuccessHandler(function (res) { mpksRenderNodinPreview_(jenis, res); })
      .withFailureHandler(function (err) {
        preview.textContent = 'Gagal memuat preview.';
        handleLoadError(err);
      });
    const overrides = mpksNodinOverrides(jenis);
    if (jenis === 'dd') runner.getNodinDueDiligencePreview(mpksNodinCurrentSupplierId, overrides);
    else runner.getNodinKajianPksPreview(mpksNodinCurrentSupplierId, overrides);

  function mpksDownloadNodin(jenis) {
    if (!mpksNodinCurrentSupplierId) return;
    const overrides = mpksNodinOverrides(jenis);
    if (!overrides.kajianKeys.length) { showToast('Pilih minimal satu jenis kajian.', 'warning'); return; }
    const missing = mpksNodinMissing[jenis] || [];
    if (missing.length) { showToast('Lengkapi data berikut sebelum download: ' + missing.join(', ') + '.', 'warning'); return; }

    const btn = document.getElementById('mpks-nodin-' + jenis + '-download-btn');
    btn.disabled = true;
    const runner = google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        const byteChars = atob(res.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = res.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Draft Nodin berhasil diunduh', 'success');
      })
      .withFailureHandler(function (err) { btn.disabled = false; handleLoadError(err); });
    if (jenis === 'dd') runner.generateNodinDueDiligenceDocx(mpksNodinCurrentSupplierId, overrides);
    else runner.generateNodinKajianPksDocx(mpksNodinCurrentSupplierId, overrides);
  }

  function mpoResetFilter() {
    ['mpo-f-tgl-mulai', 'mpo-f-tgl-akhir', 'mpo-f-supplier', 'mpo-f-status', 'mpo-f-aging', 'mpo-f-search'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    mpoApplyFilter();
  }

  function mpoApplyFilter() {
    if (!mpoData) return;
    const tglMulai = document.getElementById('mpo-f-tgl-mulai').value;
    const tglAkhir = document.getElementById('mpo-f-tgl-akhir').value;
    const supplier = document.getElementById('mpo-f-supplier').value;
    const status = document.getElementById('mpo-f-status').value;
    const aging = document.getElementById('mpo-f-aging').value;
    const search = document.getElementById('mpo-f-search').value.trim().toLowerCase();

    mpoFiltered = mpoData.items.filter(function (r) {
      if (tglMulai && r.tanggalPO < tglMulai) return false;
      if (tglAkhir && r.tanggalPO > tglAkhir) return false;
      if (supplier && r.supplier !== supplier) return false;
      if (status && r.status !== status) return false;
      if (aging && r.agingBucket !== aging) return false;
      if (search && r.nomorPO.toLowerCase().indexOf(search) === -1) return false;
      return true;
    });

    // Default: outstanding (Remaining > 0) paling lama (aging terbesar) di atas,
    // baru yang sudah Selesai di bawahnya (diurutkan tanggal PO terbaru dulu).
    mpoFiltered.sort(function (a, b) {
      const aOut = a.remaining > 0 ? 1 : 0, bOut = b.remaining > 0 ? 1 : 0;
      if (aOut !== bOut) return bOut - aOut;
      if (aOut) return b.agingHari - a.agingHari;
      return a.tanggalPO < b.tanggalPO ? 1 : (a.tanggalPO > b.tanggalPO ? -1 : 0);
    });

    mpoCurrentPage = 1;
    mpoRenderScorecard_();
    mpoRenderCharts_();
    mpoRenderTable_();
  }

  function mpoRenderScorecard_() {
    const totalPO = mpoFiltered.length;
    const totalOrder = mpoFiltered.reduce(function (s, r) { return s + r.totalOrder; }, 0);
    const sudah = mpoFiltered.reduce(function (s, r) { return s + r.delivery; }, 0);
    const belum = mpoFiltered.reduce(function (s, r) { return s + r.remaining; }, 0);
    const outstanding = mpoFiltered.filter(function (r) { return r.remaining > 0; }).length;

    document.getElementById('mpo-sc-total-po').textContent = totalPO;
    document.getElementById('mpo-sc-total-order').textContent = mpoFormatKg_(totalOrder);
    document.getElementById('mpo-sc-total-order-gr').textContent = formatGram(totalOrder);
    document.getElementById('mpo-sc-sudah').textContent = mpoFormatKg_(sudah);
    document.getElementById('mpo-sc-sudah-gr').textContent = formatGram(sudah);
    document.getElementById('mpo-sc-belum').textContent = mpoFormatKg_(belum);
    document.getElementById('mpo-sc-belum-gr').textContent = formatGram(belum);
    document.getElementById('mpo-sc-outstanding').textContent = outstanding + ' PO';
  }

  function mpoFormatKg_(gram) {
    return (Number(gram) / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' Kg';
  }

  function mpoAgingBucketLabel_(bucket) {
    return { '0-7': '0–7 hari', '8-14': '8–14 hari', '15-30': '15–30 hari', '>30': '> 30 hari' }[bucket] || bucket;
  }

  function mpoRenderCharts_() {
    // 1. Order vs Delivery per bulan
    const monthlyMap = {};
    mpoFiltered.forEach(function (r) {
      if (!r.tanggalPO) return;
      const key = r.tanggalPO.slice(0, 7);
      if (!monthlyMap[key]) monthlyMap[key] = { order: 0, delivery: 0, remaining: 0 };
      monthlyMap[key].order += r.totalOrder;
      monthlyMap[key].delivery += r.delivery;
      monthlyMap[key].remaining += r.remaining;
    });
    const monthKeys = Object.keys(monthlyMap).sort();
    const monthLabels = monthKeys.map(function (k) {
      const parts = k.split('-');
      return DL_BULAN_ID[parseInt(parts[1], 10) - 1].slice(0, 3) + ' ' + parts[0];
    });
    destroyChart('mpoBulan');
    const ctxBulan = document.getElementById('mpo-chart-bulan');
    if (ctxBulan) {
      charts.mpoBulan = new Chart(ctxBulan, {
        type: 'bar',
        data: {
          labels: monthLabels,
          datasets: [
            { label: 'Order', data: monthKeys.map(function (k) { return monthlyMap[k].order / 1000; }), backgroundColor: cssColor('--color-primary'), borderRadius: 5 },
            { label: 'Delivery', data: monthKeys.map(function (k) { return monthlyMap[k].delivery / 1000; }), backgroundColor: cssColor('--color-gold'), borderRadius: 5 }
          ]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { ticks: { callback: function (v) { return v + ' Kg'; } } } } }
      });
    }

    // 2. Outstanding (Remaining) per supplier
    const supplierMap = {};
    mpoFiltered.forEach(function (r) {
      if (r.remaining <= 0) return;
      supplierMap[r.supplier] = (supplierMap[r.supplier] || 0) + r.remaining;
    });
    const supplierKeys = Object.keys(supplierMap).sort(function (a, b) { return supplierMap[b] - supplierMap[a]; }).slice(0, 10);
    destroyChart('mpoSupplier');
    const ctxSupplier = document.getElementById('mpo-chart-supplier');
    if (ctxSupplier) {
      charts.mpoSupplier = new Chart(ctxSupplier, {
        type: 'bar',
        data: {
          labels: supplierKeys,
          datasets: [{ label: 'Remaining', data: supplierKeys.map(function (k) { return supplierMap[k] / 1000; }), backgroundColor: cssColor('--color-danger'), borderRadius: 5 }]
        },
        options: {
          indexAxis: 'y', responsive: true, maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: { x: { ticks: { callback: function (v) { return v + ' Kg'; } } } }
        }
      });
    }

    // 3. Aging outstanding PO
    const agingOrder = ['0-7', '8-14', '15-30', '>30'];
    const agingCount = { '0-7': 0, '8-14': 0, '15-30': 0, '>30': 0 };
    mpoFiltered.forEach(function (r) { if (r.remaining > 0) agingCount[r.agingBucket]++; });
    destroyChart('mpoAging');
    const ctxAging = document.getElementById('mpo-chart-aging');
    if (ctxAging) {
      charts.mpoAging = new Chart(ctxAging, {
        type: 'bar',
        data: {
          labels: agingOrder.map(mpoAgingBucketLabel_),
          datasets: [{ label: 'Jumlah PO', data: agingOrder.map(function (k) { return agingCount[k]; }), backgroundColor: [cssColor('--color-success'), cssColor('--color-gold'), '#F59E0B', cssColor('--color-danger')], borderRadius: 5 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });
    }
  }

  function mpoStatusBadge_(status) {
    if (status === 'Selesai') return '<span class="badge green">Selesai</span>';
    if (status === 'Sebagian') return '<span class="badge gold">Sebagian</span>';
    return '<span class="badge red">Belum Delivery</span>';
  }

  function mpoRenderTable_() {
    const body = document.getElementById('mpo-table-body');
    const countEl = document.getElementById('mpo-table-count');
    if (!body) return;
    if (!mpoFiltered.length) {
      body.innerHTML = '<tr><td colspan="9" class="recent-empty">Tidak ada data sesuai filter</td></tr>';
      if (countEl) countEl.textContent = '0 data';
      document.getElementById('mpo-pagination').innerHTML = '';
      return;
    }
    const totalPages = Math.max(1, Math.ceil(mpoFiltered.length / MPO_PAGE_SIZE));
    if (mpoCurrentPage > totalPages) mpoCurrentPage = totalPages;
    const start = (mpoCurrentPage - 1) * MPO_PAGE_SIZE;
    const pageItems = mpoFiltered.slice(start, start + MPO_PAGE_SIZE);

    body.innerHTML = pageItems.map(function (r, idx) {
      return '<tr class="' + (r.remaining > 0 ? 'mpo-row-outstanding' : '') + '">' +
        '<td>' + (start + idx + 1) + '</td>' +
        '<td>' + (r.tanggalPO ? r.tanggalPO.split('-').reverse().join('/') : '-') + '</td>' +
        '<td>' + escapeHtmlAttr(r.nomorPO) + '</td>' +
        '<td>' + escapeHtmlAttr(r.supplier) + '</td>' +
        '<td>' + formatGram(r.totalOrder) + '</td>' +
        '<td>' + formatGram(r.delivery) + '</td>' +
        '<td>' + formatGram(r.remaining) + '</td>' +
        '<td>' + r.agingHari + ' hari</td>' +
        '<td>' + mpoStatusBadge_(r.status) + '</td>' +
        '</tr>';
    }).join('');

    if (countEl) countEl.textContent = mpoFiltered.length + ' data (menampilkan ' + (start + 1) + '-' + Math.min(start + MPO_PAGE_SIZE, mpoFiltered.length) + ')';

    const pag = document.getElementById('mpo-pagination');
    const showStart = start + 1, showEnd = Math.min(start + MPO_PAGE_SIZE, mpoFiltered.length);
    let pagHtml = '<div class="mitra-pagination-info">' + showStart + '-' + showEnd + ' dari ' + mpoFiltered.length + ' data</div><div class="mitra-pagination-pages">';
    pagHtml += '<div class="mitra-page-btn nav' + (mpoCurrentPage === 1 ? ' disabled' : '') + '" onclick="mpoGoToPage(' + (mpoCurrentPage - 1) + ')">&laquo;</div>';
    const maxBtns = 5;
    let pStart = Math.max(1, mpoCurrentPage - 2), pEnd = Math.min(totalPages, pStart + maxBtns - 1);
    pStart = Math.max(1, pEnd - maxBtns + 1);
    if (pStart > 1) pagHtml += '<div class="mitra-page-btn" onclick="mpoGoToPage(1)">1</div><span>...</span>';
    for (let i = pStart; i <= pEnd; i++) {
      pagHtml += '<div class="mitra-page-btn' + (i === mpoCurrentPage ? ' active' : '') + '" onclick="mpoGoToPage(' + i + ')">' + i + '</div>';
    }
    if (pEnd < totalPages) pagHtml += '<span>...</span><div class="mitra-page-btn" onclick="mpoGoToPage(' + totalPages + ')">' + totalPages + '</div>';
    pagHtml += '<div class="mitra-page-btn nav' + (mpoCurrentPage === totalPages ? ' disabled' : '') + '" onclick="mpoGoToPage(' + (mpoCurrentPage + 1) + ')">&raquo;</div>';
    pagHtml += '</div>';
    pag.innerHTML = pagHtml;
  }

  function mpoGoToPage(page) { mpoCurrentPage = page; mpoRenderTable_(); }

  function mpoDownloadExcel() {
    if (typeof XLSX === 'undefined') { showToast('Modul export Excel tidak tersedia', 'error'); return; }
    if (!mpoFiltered.length) { showToast('Tidak ada data untuk diexport', 'warning'); return; }
    const header = ['No', 'Tanggal PO', 'Nomor PO', 'Supplier', 'Total Order (gr)', 'Delivery (gr)', 'Remaining (gr)', 'Aging PO (hari)', 'Status'];
    const data = mpoFiltered.map(function (r, idx) {
      return [idx + 1, r.tanggalPO, r.nomorPO, r.supplier, r.totalOrder, r.delivery, r.remaining, r.agingHari, r.status];
    });
    const ws = XLSX.utils.aoa_to_sheet([header].concat(data));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Monitoring Delivery PO');
    XLSX.writeFile(wb, 'Monitoring Delivery PO - ' + todayISO() + '.xlsx');
  }

  // ---- Upload Data PO (CSV) ----
  // Parser CSV sederhana (koma sbg delimiter, dukung quoted field) —
  // TIDAK ada base64/upload file mentah ke server, hanya baris yang
  // sudah diparse jadi array yang dikirim via google.script.run.
  function mpoParseCsvText_(text) {
    const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(function (l) { return l.trim() !== ''; });
    return lines.map(function (line) {
      const cells = [];
      let cur = '', inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (inQuotes) {
          if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (c === '"') { inQuotes = false; }
          else cur += c;
        } else {
          if (c === '"') inQuotes = true;
          else if (c === ',') { cells.push(cur); cur = ''; }
          else cur += c;
        }
      }
      cells.push(cur);
      return cells.map(function (c) { return c.trim(); });
    });
  }

  // Format angka file sumber pakai titik sbg pemisah ribuan — hapus
  // semua titik, ganti koma (kalau ada, desimal) jadi titik, baru parse.
  function pjlParseAngkaTitik_(str) {
    if (typeof str === 'number') return str;
    str = String(str == null ? '' : str).trim();
    if (!str) return 0;
    str = str.replace(/\./g, '').replace(/,/g, '.');
    const n = parseFloat(str);
    return isNaN(n) ? 0 : n;
  }

  // "18/08/2026" atau "2026-08-18" -> "2026-08-18"
  function mpoParseTanggal_(str) {
    str = String(str || '').trim();
    let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return m[1] + '-' + m[2] + '-' + m[3];
    m = str.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);
    if (m) return m[3] + '-' + m[1].padStart(2, '0') + '-' + m[2].padStart(2, '0');
    return '';
  }

  function mpoHandleFileSelected(evt) {
    const file = evt.target.files && evt.target.files[0];
    const errEl = document.getElementById('mpo-upload-error');
    errEl.style.display = 'none';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (e) {
      const csvRows = mpoParseCsvText_(String(e.target.result || ''));
      if (csvRows.length < 2) {
        errEl.textContent = 'File CSV kosong atau tidak ada baris data.';
        errEl.style.display = 'block';
        return;
      }
      const headerRow = csvRows[0];
      const dataRows = csvRows.slice(1).map(function (cells, idx) {
        return {
          tanggalPO: mpoParseTanggal_(cells[1]),
          nomorPO: (cells[2] || '').trim(),
          supplier: (cells[3] || '').trim(),
          totalOrder: pjlParseAngkaTitik_(cells[4]),
          delivery: pjlParseAngkaTitik_(cells[5])
        };
      });
      mpoParsedRows = { headerRow: headerRow, rows: dataRows };

      const btn = document.getElementById('mpo-upload-file-input');
      google.script.run
        .withSuccessHandler(function (result) { mpoShowPreview_(result); })
        .withFailureHandler(function (err) {
          errEl.textContent = err.message || String(err);
          errEl.style.display = 'block';
        })
        .previewMonitoringPoImport(headerRow, dataRows);
    };
    reader.readAsText(file, 'UTF-8');
  }

    document.getElementById('mpo-preview-total').textContent = total;
    document.getElementById('mpo-preview-baru').textContent = result.baru.length;
    document.getElementById('mpo-preview-diperbarui').textContent = result.diperbarui.length;
    document.getElementById('mpo-preview-dilewati').textContent = result.dilewati.length;
    document.getElementById('mpo-preview-gagal').textContent = result.gagal.length;

      gagalListEl.innerHTML = result.gagal.map(function (g) {

      }).join('');

      }).join('')

  function loadKpiPage() {

  function kpiShortRupiah_(num) {
    num = Number(num) || 0;
    const abs = Math.abs(num);
    if (abs >= 1e12) return 'Rp' + (num / 1e12).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' T';
    if (abs >= 1e9) return 'Rp' + (num / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' M';
    return formatRupiah(num);
  }

  function kpiSelisihText_(v) {
    v = Number(v) || 0;
    return (v >= 0 ? '+' : '-') + formatRupiah(Math.abs(v));
  }

  function renderKpiPrognosaTier_(tier, data) {
    const card = document.querySelector('.kpi-prognosa-card[data-tier="' + tier + '"]');
    if (!card || !data) return;
    card.querySelector('[data-role="target"]').textContent = formatRupiah(data.targetNominal);
    const statusEl = card.querySelector('[data-role="status"]');
    const achieved = !!data.tercapai;
    // achieved state (gold) murni ikut flag data.tercapai — hari ini cuma
    // tier 100% yang true, tapi kalau nanti 110%/120% ikut tercapai,
    // treatment yang sama otomatis berlaku (bukan di-hardcode ke tier 100).
    card.classList.toggle('achieved', achieved);
    if (achieved) { statusEl.textContent = '🏆 TERCAPAI'; statusEl.classList.add('show', 'achieved-badge'); }
    else { statusEl.textContent = ''; statusEl.classList.remove('show', 'achieved-badge'); }
    const pct = Number(data.pencapaianPersen) || 0;
    // Persentase yang DITAMPILKAN selalu actual (realisasi/target*100, bisa
    // >100%) — tidak pernah "reset" ke bawah 100 setelah target tercapai.
    // Hanya LEBAR progress bar yang dibatasi 100% (bar penuh, tidak boleh
    // lebih dari track-nya).
    card.querySelector('[data-role="bar"]').style.width = Math.min(100, Math.max(0, pct)) + '%';
    card.querySelector('[data-role="pct"]').textContent = pct.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '% tercapai';
    const surplusEl = card.querySelector('[data-role="pct-surplus"]');
    if (achieved && Number(data.surplus) > 0) {
      surplusEl.textContent = '+' + formatRupiah(data.surplus) + ' di atas target';
      surplusEl.classList.add('show');
    } else {
      surplusEl.textContent = '';
      surplusEl.classList.remove('show');
    }
    card.querySelector('[data-role="realisasi"]').textContent = formatRupiah(data.realisasi);
    card.querySelector('[data-role="sisa"]').textContent = formatRupiah(data.sisa);
    card.querySelector('[data-role="kebutuhan-hari"]').textContent = formatRupiah(data.kebutuhanPerHari);
    card.querySelector('[data-role="kebutuhan-gram"]').textContent = (Number(data.kebutuhanGramPerHari) || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gram';
  }

  function renderKpiBulananChart_(g, avgPrice) {
    destroyChart('kpiBulanan');
    const ctx = document.getElementById('chart-kpi-bulanan');
    if (!ctx || !g) return;
    // Warna diambil dari token --kpi-* (bukan hex statis) supaya grafik
    // ini ikut tema aktif (halaman KPI punya palet "premium dark card"
    // sendiri, lihat --kpi-* di Styles.html).
    const kpiAccent = themeVar_('--kpi-accent', '#E8C766');
    const kpiAccentSoft = themeVar_('--kpi-accent-soft', 'rgba(201, 162, 39, 0.28)');
    const kpiStatusColor = themeVar_('--kpi-status-color', '#6FE3A0');
    const kpiLabel = themeVar_('--kpi-label', '#9FB3A8');
    const kpiSub = themeVar_('--kpi-sub', '#B9CBC0');
    const kpiCardBg = themeVar_('--kpi-card-bg', '#10281D');
    const kpiValue = themeVar_('--kpi-value', '#F3EFE4');
    const kpiBorder = themeVar_('--kpi-border', '#1F4D36');
    charts.kpiBulanan = new Chart(ctx, {
      data: {
        labels: g.labels,
        datasets: [
          { type: 'bar', label: 'Realisasi Bulanan', data: g.realisasi, backgroundColor: kpiAccent, borderRadius: 4, order: 2, yAxisID: 'y' },
          { type: 'bar', label: 'Target Bulanan', data: g.target, backgroundColor: kpiAccentSoft, borderRadius: 4, order: 3, yAxisID: 'y' },
          { type: 'line', label: 'Realisasi Kumulatif', data: g.realisasiKumulatif, borderColor: kpiStatusColor, backgroundColor: 'transparent', tension: .3, pointRadius: 2, order: 0, yAxisID: 'y1' },
          { type: 'line', label: 'Target Kumulatif', data: g.targetKumulatif, borderColor: kpiLabel, backgroundColor: 'transparent', borderDash: [5, 4], pointRadius: 0, order: 1, yAxisID: 'y1' }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: {
          legend: { labels: { color: kpiSub, font: { size: 11 } } },
          tooltip: {
            backgroundColor: kpiCardBg, titleColor: kpiValue, bodyColor: kpiValue, borderColor: kpiBorder, borderWidth: 1,
            callbacks: {
              label: function (c) {
                if (c.dataset.label === 'Realisasi Bulanan') {
                  const nominal = Number(c.raw) || 0;
                  const gram = avgPrice > 0 ? nominal / avgPrice : 0;
                  const target = g.target[c.dataIndex] || 0;
                  const pct = target > 0 ? (nominal / target * 100) : 0;
                  return ['Realisasi: ' + formatRupiah(nominal), 'Gramasi: ' + formatKgPlain_(gram / 1000), 'Pencapaian: ' + pct.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '%'];
                }
                return c.dataset.label + ': ' + formatRupiah(c.raw);
              }
            }
          }
        },
        scales: {
          x: { ticks: { color: kpiLabel }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y: { ticks: { color: kpiLabel, callback: function (v) { return kpiShortRupiah_(v); } }, grid: { color: 'rgba(255,255,255,0.05)' } },
          y1: { position: 'right', ticks: { color: kpiLabel, callback: function (v) { return kpiShortRupiah_(v); } }, grid: { display: false } }
        }
      }
    });
  }

  // Data KPI terakhir dari getKpiPerdaganganEmas(), disimpan supaya
  // Simulasi Pencapaian KPI (renderKpiSimulasi) bisa pakai realisasi &
  // target 100/110/120 yang sama tanpa panggil ulang backend.

  function renderKpiPage(d) {
    d = d || {};
    kpiLastData_ = d;
    const t100 = d.tingkat100 || {};
    const t110 = d.tingkat110 || {};
    const t120 = d.tingkat120 || {};
    const proy = d.proyeksi || {};

    document.getElementById('kpi-target-100').textContent = formatRupiah(t100.targetNominal);
    document.getElementById('kpi-realisasi').textContent = formatRupiah(d.realisasi);
    const realisasiBreakdownEl = document.getElementById('kpi-realisasi-breakdown');

    }

    const sisaLabelEl = document.getElementById('kpi-sisa-target-label');

      else { sisaLabelEl.textContent = 'Target Tercapai'; sisaValEl.textContent = formatRupiah(0); }

      sisaLabelEl.textContent = 'Sisa Target Transaksi';
      sisaValEl.textContent = formatRupiah(t100.sisa);
    }

    const pct100 = Number(t100.pencapaianPersen) || 0;
    document.getElementById('kpi-pencapaian').textContent = pct100.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '%';
    document.getElementById('kpi-pencapaian-bar').style.width = Math.min(100, Math.max(0, pct100)) + '%';

    // Card "Pencapaian" (KPI utama) — achieved state (border/glow gold)
    // + badge kecil "▲ +X% di atas target" saat Target 100% sudah
    // tercapai. Angka pct100 di atas TETAP actual (bisa >100%), tidak
    // di-cap — hanya lebar bar & state visual ini yang bereaksi.
    const pencapaianCardEl = document.getElementById('kpi-pencapaian-card');
    const pencapaianSurplusEl = document.getElementById('kpi-pencapaian-surplus');
    if (pencapaianCardEl) pencapaianCardEl.classList.toggle('kpi-achieved', !!t100.tercapai);
    if (pencapaianSurplusEl) {
      if (t100.tercapai && pct100 > 100) {
        pencapaianSurplusEl.textContent = '▲ +' + (pct100 - 100).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '% di atas target';
        pencapaianSurplusEl.classList.add('show');

    document.getElementById('kpi-sisa-hari').textContent = (Number(d.sisaHariKerja) || 0).toLocaleString('id-ID') + ' hari';
    document.getElementById('kpi-avg-price').textContent = formatRupiah(d.avgPriceTransaksi) + ' / gram';
    document.getElementById('kpi-kebutuhan-harian').textContent = formatRupiah(t100.kebutuhanPerHari);
    const gramHarian = Number(t100.kebutuhanGramPerHari) || 0;
    document.getElementById('kpi-gramasi-harian').textContent = gramHarian.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gram';
    document.getElementById('kpi-gramasi-harian-kg').textContent = (gramHarian / 1000).toLocaleString('id-ID', { maximumFractionDigits: 3 }) + ' kg per hari';

    renderKpiBulananChart_(d.grafikBulanan, Number(d.avgPriceTransaksi) || 0);

    renderKpiPrognosaTier_('100', t100);
    renderKpiPrognosaTier_('110', t110);
    renderKpiPrognosaTier_('120', t120);

    document.getElementById('kpi-proy-rata-harian').textContent = formatRupiah(proy.rataRataHarian);
    document.getElementById('kpi-proy-rata-bulanan').textContent = formatRupiah(proy.rataRataBulanan);
    document.getElementById('kpi-proy-nominal').textContent = formatRupiah(proy.nominalAkhirTahun);
    let statusText = 'Di Bawah Target';
    if (proy.tingkatTertinggiBerpotensi === '120%') statusText = 'Prognosa 120% Berpotensi Tercapai';
    else if (proy.tingkatTertinggiBerpotensi === '110%') statusText = 'Prognosa 110% Berpotensi Tercapai';
    else if (proy.tingkatTertinggiBerpotensi === '100%') statusText = 'Target 100% Berpotensi Tercapai';
    document.getElementById('kpi-proy-status').textContent = statusText;
    document.getElementById('kpi-proy-selisih-100').textContent = kpiSelisihText_(proy.selisihTarget100);
    document.getElementById('kpi-proy-selisih-110').textContent = kpiSelisihText_(proy.selisihTarget110);
    document.getElementById('kpi-proy-selisih-120').textContent = kpiSelisihText_(proy.selisihTarget120);

    const todayStr = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
    const kebutuhanKalimat = t100.tercapai
      ? 'Target 100% sudah tercapai.'
      : ('Dengan sisa ' + (Number(d.sisaHariKerja) || 0) + ' hari kerja, diperlukan rata-rata transaksi sebesar ' + formatRupiah(t100.kebutuhanPerHari) +
        ' atau ' + (gramHarian / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg per hari untuk mencapai target 100%.');
    const ringkasan = 'Hingga ' + todayStr + ', realisasi transaksi mencapai ' + formatRupiah(d.realisasi) +
      ' atau ' + pct100.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '% dari target 100% sebesar ' + formatRupiah(t100.targetNominal) + '. ' + kebutuhanKalimat +
      ' Berdasarkan rata-rata realisasi berjalan, transaksi sampai akhir tahun diproyeksikan mencapai ' + formatRupiah(proy.nominalAkhirTahun) +
      ' atau ' + (Number(proy.persenTerhadapTarget100) || 0).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '% dan berpotensi mencapai tingkat ' + (proy.tingkatTertinggiBerpotensi || '-') + '.';
    document.getElementById('kpi-ringkasan-text').textContent = ringkasan;

  // ============================================================
  // SIMULASI PENCAPAIAN KPI — murni kalkulasi di browser (tidak
  // memanggil backend, tidak menyimpan apapun). Pakai realisasi &
  // target 100/110/120 dari kpiLastData_ (hasil getKpiPerdaganganEmas
  // yang sudah dimuat oleh loadKpiPage/renderKpiPage), lalu tambahkan
  // proyeksi transaksi di atasnya.
  //
  // KPI Nominal Transaksi = Penjualan + Pembelian. Setiap gramasi
  // penjualan diasumsikan diimbangi pembelian gramasi yang sama,
  // jadi proyeksi nominal tambahan = (harga x gramasi) x 2 —
  // 1x estimasi Penjualan + 1x estimasi Pembelian.
  // ============================================================
  function renderKpiSimulasi() {
    if (!kpiLastData_) return;

    const hargaEmas = getCurrencyValue(document.getElementById('kpi-sim-harga'));
    const gramInputRaw = getCurrencyValue(document.getElementById('kpi-sim-gramasi'));
    const unit = document.getElementById('kpi-sim-gramasi-unit').value;
    const gramasiTambahan = unit === 'kg' ? gramInputRaw * 1000 : gramInputRaw;

    const estimasiPenjualan = hargaEmas * gramasiTambahan;
    const estimasiPembelian = hargaEmas * gramasiTambahan;
    const nominalTambahan = estimasiPenjualan + estimasiPembelian;
    const realisasi = Number(kpiLastData_.realisasi) || 0;
    const totalAkhirTahun = realisasi + nominalTambahan;

    const target100 = Number((kpiLastData_.tingkat100 || {}).targetNominal) || 0;
    const target110 = Number((kpiLastData_.tingkat110 || {}).targetNominal) || 0;
    const target120 = Number((kpiLastData_.tingkat120 || {}).targetNominal) || 0;

    const pencapaianPersen = target100 > 0 ? (totalAkhirTahun / target100) * 100 : 0;

    document.getElementById('kpi-sim-realisasi').textContent = formatRupiah(realisasi);
    document.getElementById('kpi-sim-gramasi-out').textContent = gramasiTambahan.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gram';
    document.getElementById('kpi-sim-nominal-tambahan').textContent = formatRupiah(nominalTambahan);
    document.getElementById('kpi-sim-nominal-breakdown').textContent =
      'Penjualan: ' + formatRupiah(estimasiPenjualan) + ' | Pembelian: ' + formatRupiah(estimasiPembelian);
    document.getElementById('kpi-sim-total').textContent = formatRupiah(totalAkhirTahun);
    document.getElementById('kpi-sim-pencapaian').textContent = pencapaianPersen.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '%';
    document.getElementById('kpi-sim-pencapaian-bar').style.width = Math.min(100, Math.max(0, pencapaianPersen)) + '%';

    document.getElementById('kpi-sim-selisih-100').textContent = formatRupiahSigned(totalAkhirTahun - target100);
    document.getElementById('kpi-sim-selisih-110').textContent = formatRupiahSigned(totalAkhirTahun - target110);
    document.getElementById('kpi-sim-selisih-120').textContent = formatRupiahSigned(totalAkhirTahun - target120);

    // --- Estimasi Gramasi yang Dibutuhkan (per target tier pilihan) ---
    // Target KPI = Penjualan + Pembelian, dan setiap penjualan emas
    // pada prinsipnya diikuti pembelian dengan gramasi yang sama
    // (1:1) — jadi kontribusi ke KPI = 2x gramasi penjualan fisik.
    // Karena itu kebutuhan gramasi FISIK yang harus dijual dihitung
    // dari separuh sisa transaksi, bukan dari seluruh sisa:
    //   Sisa Transaksi          = Target (tier dropdown) - Realisasi
    //   Kebutuhan Nominal Jual  = Sisa Transaksi / 2
    //   Estimasi Gramasi        = Kebutuhan Nominal Jual / Harga Emas
    //   Gram/Hari                = Estimasi Gramasi / Sisa Hari Kerja
    // Semua nilai di atas HARUS ikut berubah setiap dropdown tier
    // diganti — tidak ada lagi nilai independen dari input manual.
    const tier = document.getElementById('kpi-sim-target-tier').value;
    const targetPilihan = tier === '110' ? target110 : (tier === '120' ? target120 : target100);
    document.getElementById('kpi-sim-gram-needed-label').textContent = 'Estimasi Gramasi Dibutuhkan untuk Target ' + tier + '%';

    const sisaTransaksi = Math.max(0, targetPilihan - realisasi);
    const kebutuhanNominalPenjualan = sisaTransaksi / 2;
    const gramNeededEl = document.getElementById('kpi-sim-gram-needed');
    const gramNeededKgEl = document.getElementById('kpi-sim-gram-needed-kg');
    const sisaHariKerja = Number(kpiLastData_.sisaHariKerja) || 0;
    const gramNeededHarianEl = document.getElementById('kpi-sim-gram-needed-harian');
    const gramNeededHarianSubEl = document.getElementById('kpi-sim-gram-needed-harian-sub');

    if (sisaTransaksi <= 0) {
      gramNeededEl.textContent = 'Target sudah tercapai';
      gramNeededKgEl.textContent = '';
      gramNeededHarianEl.textContent = 'Target sudah tercapai';
      gramNeededHarianSubEl.textContent = '';
    } else if (hargaEmas <= 0) {
      gramNeededEl.textContent = 'Isi asumsi harga emas dahulu';
      gramNeededKgEl.textContent = '';
      gramNeededHarianEl.textContent = 'Isi asumsi harga emas dahulu';
      gramNeededHarianSubEl.textContent = '';
    } else {
      const gramNeeded = kebutuhanNominalPenjualan / hargaEmas;
      gramNeededEl.textContent = gramNeeded.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gram';
      gramNeededKgEl.textContent = (gramNeeded / 1000).toLocaleString('id-ID', { maximumFractionDigits: 3 }) + ' kg — Sisa Transaksi ' + formatRupiah(sisaTransaksi) +
        ' ÷ 2 = Kebutuhan Penjualan ' + formatRupiah(kebutuhanNominalPenjualan);

      if (sisaHariKerja <= 0) {
        gramNeededHarianEl.textContent = '-';
        gramNeededHarianSubEl.textContent = 'Tidak ada sisa hari kerja tahun ini';
      } else {
        const gramHarian = gramNeeded / sisaHariKerja;
        gramNeededHarianEl.textContent = gramHarian.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gram/hari';
        gramNeededHarianSubEl.textContent = (gramHarian / 1000).toLocaleString('id-ID', { maximumFractionDigits: 3 }) + ' kg/hari — dari estimasi ' +
          gramNeeded.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gram ÷ sisa ' + sisaHariKerja.toLocaleString('id-ID') + ' hari kerja';
      }
    }
  }

  // Migrasi dijalankan dari CLIENT, memanggil fungsi server LAMA yang
  // sudah pasti dikenali (selesaikanPickup) satu per satu — bukan
  // fungsi server baru — supaya tidak kena masalah cache/propagasi
  // fungsi baru di sisi Apps Script.
  function pjlJalankanMigrasiPickup() {
    const confirmEl = document.getElementById('pjl-migrasi-confirm');
    const resultEl = document.getElementById('pjl-migrasi-result');
    if (!confirmEl || (confirmEl.value || '').trim().toUpperCase() !== 'YA') {
      showToast('Ketik YA di kotak konfirmasi dulu', 'warning');
      return;
    }
    if (!pjlJadwalCache || !pjlJadwalCache.pending) {
      showToast('Data belum termuat, buka dulu panel Jadwal Pickup', 'warning');
      return;
    }
    const BATAS = '2026-08-18';
    const KECUALI = ['00643/INV-00017/2026', '00651/INV-00017/2026'];
    const targets = pjlJadwalCache.pending.filter(function (p) {
      if (KECUALI.indexOf(String(p.nomorInvoice || '').trim()) !== -1) return false;
      return p.tanggal && p.tanggal < BATAS;
    });
    if (!targets.length) {
      if (resultEl) resultEl.textContent = 'Tidak ada transaksi yang perlu ditandai.';
      showToast('Tidak ada transaksi yang perlu ditandai', 'info');
      return;
    }
    let done = 0, failed = 0;
    if (resultEl) resultEl.textContent = 'Memproses 0/' + targets.length + '...';
    targets.forEach(function (p) {
      google.script.run
        .withSuccessHandler(function () {
          done++;
          if (resultEl) resultEl.textContent = 'Memproses ' + (done + failed) + '/' + targets.length + '...';
          if (done + failed === targets.length) pjlMigrasiSelesai_(done, failed, confirmEl, resultEl);
        })
        .withFailureHandler(function () {
          failed++;
          if (done + failed === targets.length) pjlMigrasiSelesai_(done, failed, confirmEl, resultEl);
        })
        .selesaikanPickup(p.id);
    });
  }

  function pjlMigrasiSelesai_(done, failed, confirmEl, resultEl) {
    const msg = done + ' transaksi ditandai Selesai' + (failed ? ', ' + failed + ' gagal' : '') + '.';
    if (resultEl) resultEl.textContent = msg;
    showToast(msg, failed ? 'warning' : 'success');
    if (confirmEl) confirmEl.value = '';
    loadJadwalPickup();
    loadPenjualanHistoryTable();
  }

  function pjlRenderF1_(res) {
    const rows = (res && res.rows) || [];
    const dateLabel = (res && res.tanggalLabel) || (res && res.tanggalStr) || '-';
    ['pjl-f1-tanggal', 'pjl-f1-print-tanggal'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.textContent = dateLabel;
    });

    const textEl = document.getElementById('pjl-f1-text-output');
    const totalKg = rows.reduce(function (sum, r) { return sum + (Number(r.gramasiKg) || 0); }, 0);
    const totalText = formatKgPlain_(totalKg);
    ['pjl-f1-total-value', 'pjl-f1-print-total-value'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.textContent = totalText;
    });

    const emptyRowHtml = '<tr><td colspan="4" class="recent-empty">Belum ada transaksi penjualan hari ini</td></tr>';
    const rowsHtml = rows.length ? pjlBuildRowsHtml_(rows) : emptyRowHtml;
    ['pjl-f1-table-body', 'pjl-f1-print-table-body'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.innerHTML = rowsHtml;
    });

    if (!textEl) return;
    const lines = rows.length
      ? ['REKAP PENJUALAN HARI INI — ' + dateLabel, '', ['No', 'Buyer', 'Gramasi (Kg)', 'Merk'].join('\t')]
      : ['REKAP PENJUALAN HARI INI — ' + dateLabel, '', 'Belum ada transaksi penjualan hari ini.'];
    if (rows.length) {
      rows.forEach(function (r, idx) {
        lines.push([idx + 1, r.buyer, formatKgPlain_(r.gramasiKg), r.merk].join('\t'));
      });
      lines.push('', 'TOTAL\t\t' + totalText);
    }
    textEl.value = lines.join('\n');
  }
