  // ============================================================
  // DOWNLOAD LAPORAN — UTILITAS BERSAMA
  // Dipakai oleh Laporan Harian EGR & Laporan Rekap EGR: PDF multi-halaman
  // aman (header tabel diulang tiap halaman, baris tabel tidak pernah
  // terpotong di antara 2 halaman) + PNG resolusi tinggi (satu gambar
  // panjang, area scroll tabel diperluas sementara lalu dikembalikan).
  // ============================================================
  var DL_BULAN_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  function dlTanggalFilePart_(isoDateStr, includeYear) {
    const parts = String(isoDateStr || '').split('-');
    if (parts.length !== 3) return String(isoDateStr || '');
    const y = parts[0], m = parseInt(parts[1], 10) - 1, d = parts[2];
    return d + '-' + (DL_BULAN_ID[m] || '') + (includeYear ? '-' + y : '');
  }
  function dlTanggalFileName(isoDateStr) { return dlTanggalFilePart_(isoDateStr, true); }
  function dlRentangFileName(startIso, endIso) {
    const sameYear = String(startIso).split('-')[0] === String(endIso).split('-')[0];
    return dlTanggalFilePart_(startIso, !sameYear) + '-sd-' + dlTanggalFilePart_(endIso, true);
  }

  function dlToggleMenu(btn) {
    const dropdown = btn.closest('.dl-dropdown');
    const willOpen = !dropdown.classList.contains('open');
    document.querySelectorAll('.dl-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
    if (willOpen) dropdown.classList.add('open');
  }
  document.addEventListener('click', function (e) {
    if (!e.target.closest('.dl-dropdown')) {
      document.querySelectorAll('.dl-dropdown.open').forEach(function (d) { d.classList.remove('open'); });
    }
  });

  function dlSetLoading(dropdown, isLoading, label) {
    dropdown.classList.remove('open');
    const btn = dropdown.querySelector('.dl-trigger-btn');
    if (!btn) return;
    btn.disabled = isLoading;
    if (isLoading) {
      btn.dataset.origHtml = btn.dataset.origHtml || btn.innerHTML;
      btn.innerHTML = '<span class="material-symbols-rounded dl-spin">progress_activity</span> ' + (label || 'Memproses...');
    } else if (btn.dataset.origHtml) {
      btn.innerHTML = btn.dataset.origHtml;
    }
  }

  // Sebelum capture: sembunyikan semua elemen .no-print, perluas area
  // scroll tabel (.etf-scroll-table-wrap), & paksa tampil bagian detail yg
  // sedang disembunyikan (*-wrap) supaya seluruh data ikut ter-render.
  // Mengembalikan fungsi restore utk dipanggil setelah proses selesai.
  function dlPrepareCapture_(el) {
    document.body.classList.add('dl-capturing');
    const restoreFns = [];
    el.querySelectorAll('.etf-scroll-table-wrap').forEach(function (wrap) {
      const prevMaxHeight = wrap.style.maxHeight, prevOverflow = wrap.style.overflow;
      wrap.style.maxHeight = 'none';
      wrap.style.overflow = 'visible';
      restoreFns.push(function () { wrap.style.maxHeight = prevMaxHeight; wrap.style.overflow = prevOverflow; });
    });
    el.querySelectorAll('[id$="-wrap"]').forEach(function (wrap) {
      if (wrap.style.display === 'none') {
        wrap.style.display = '';
        restoreFns.push(function () { wrap.style.display = 'none'; });
      }
    });
    return function dlRestoreCapture_() {
      document.body.classList.remove('dl-capturing');
      restoreFns.forEach(function (fn) { fn(); });
    };
  }

  // Satu gambar PNG panjang, resolusi tinggi (>=2x), memuat seluruh isi
  // elemen. opts.minWindowWidth opsional — kalau diisi, html2canvas
  // di-render seolah lebar browser minimal segitu (mis. 1400) supaya
  // breakpoint responsive desktop TIDAK berubah jadi mobile hanya karena
  // capture kebetulan berjalan dari viewport yang lebih sempit (dipakai
  // Download Laporan EGR — lihat downloadRekapEgrLaporanImage).
  function dlDownloadImage(el, filename, opts) {
    if (!el || typeof html2canvas === 'undefined') { showToast('Gagal memuat modul export gambar', 'error'); return Promise.reject(new Error('no html2canvas')); }
    const restore = dlPrepareCapture_(el);
    const windowWidth = (opts && opts.minWindowWidth) ? Math.max(el.scrollWidth, opts.minWindowWidth) : el.scrollWidth;
    return html2canvas(el, {
      scale: 2.5, backgroundColor: '#ffffff', useCORS: true,
      windowWidth: windowWidth, windowHeight: el.scrollHeight
    }).then(function (canvas) {
      return new Promise(function (resolve) {
        canvas.toBlob(function (blob) {
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = filename;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          resolve();
        }, 'image/png', 1.0);
      });
    }).finally(function () { restore(); });
  }

  // PDF satu halaman, ukuran pas dengan konten (portrait/landscape otomatis)
  // — dipakai utk Summary (selalu ringkas, cukup 1 halaman).
  function dlDownloadSinglePagePdf(el, filename) {
    if (!el || typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { showToast('Gagal memuat modul export PDF', 'error'); return Promise.reject(new Error('no jspdf')); }
    const restore = dlPrepareCapture_(el);
    return html2canvas(el, {
      scale: 2.5, backgroundColor: '#ffffff', useCORS: true,
      windowWidth: el.scrollWidth, windowHeight: el.scrollHeight
    }).then(function (canvas) {
      const imgData = canvas.toDataURL('image/png', 1.0);
      const { jsPDF } = window.jspdf;
      const pdfWidth = 595.28;
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      const pdf = new jsPDF({ orientation: pdfHeight > pdfWidth ? 'portrait' : 'landscape', unit: 'pt', format: [pdfWidth, pdfHeight], compress: false });
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');
      pdf.save(filename);
    }).finally(function () { restore(); });
  }

  // PDF A4 multi-halaman AMAN: baris tabel (<tr>) & kartu scorecard tidak
  // pernah terpotong di antara 2 halaman, header tabel (<thead>) diulang
  // di setiap halaman lanjutan. Koordinat elemen diukur dari DOM SEBELUM
  // capture (getBoundingClientRect), lalu dipetakan ke piksel canvas.
  // opts.minWindowWidth — lihat penjelasan di dlDownloadImage di atas.
  function dlDownloadPaginatedPdf(el, filename, opts) {
    if (!el || typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { showToast('Gagal memuat modul export PDF', 'error'); return Promise.reject(new Error('no jspdf')); }
    const restore = dlPrepareCapture_(el);
    const windowWidth = (opts && opts.minWindowWidth) ? Math.max(el.scrollWidth, opts.minWindowWidth) : el.scrollWidth;

    const rootRect = el.getBoundingClientRect();
    const atomicZones = [];
    el.querySelectorAll('tr, .lap-kpi-pill, .etf-net-row').forEach(function (node) {
      const r = node.getBoundingClientRect();
      atomicZones.push({ top: r.top - rootRect.top, bottom: r.bottom - rootRect.top });
    });
    const tableZones = [];
    el.querySelectorAll('table').forEach(function (table) {
      const thead = table.querySelector('thead');
      if (!thead) return;
      const theadRect = thead.getBoundingClientRect();
      const tableRect = table.getBoundingClientRect();
      tableZones.push({
        theadTop: theadRect.top - rootRect.top,
        theadBottom: theadRect.bottom - rootRect.top,
        bodyBottom: tableRect.bottom - rootRect.top
      });
    });

    return html2canvas(el, {
      scale: 2.5, backgroundColor: '#ffffff', useCORS: true,
      windowWidth: windowWidth, windowHeight: el.scrollHeight
    }).then(function (canvas) {
      const pxScale = canvas.width / rootRect.width;
      const { jsPDF } = window.jspdf;
      const pageWidthPt = 595.28, pageHeightPt = 841.89, marginPt = 28;
      const contentWidthPt = pageWidthPt - marginPt * 2;
      const pxToPt = contentWidthPt / rootRect.width;
      const maxContentHeightPx = (pageHeightPt - marginPt * 2) / pxToPt;
      const totalHeightPx = rootRect.height;

      function findSafeBreak(idealY) {
        let safeY = idealY;
        atomicZones.forEach(function (z) {
          if (z.top < idealY && idealY < z.bottom && z.top < safeY) safeY = z.top;
        });
        return safeY;
      }
      function findRepeatHeader(cursorY) {
        for (let i = 0; i < tableZones.length; i++) {
          const t = tableZones[i];
          if (cursorY >= t.theadBottom - 0.5 && cursorY < t.bodyBottom - 0.5) return t;
        }
        return null;
      }

      // Pass 1: tentukan potongan tiap halaman tanpa menggambar dulu.
      const pages = [];
      let cursor = 0, guard = 0;
      while (cursor < totalHeightPx - 0.5 && guard < 1000) {
        guard++;
        const repeatHeader = pages.length > 0 ? findRepeatHeader(cursor) : null;
        const headerHeightPx = repeatHeader ? (repeatHeader.theadBottom - repeatHeader.theadTop) : 0;
        const budgetPx = maxContentHeightPx - headerHeightPx;
        let bottom = cursor + budgetPx;
        if (bottom >= totalHeightPx) {
          bottom = totalHeightPx;
        } else {
          const safe = findSafeBreak(bottom);
          bottom = safe > cursor + 1 ? safe : bottom;
        }
        pages.push({ top: cursor, bottom: bottom, headerZone: repeatHeader });
        cursor = bottom;
      }

      function cropCanvas(sy, sh) {
        const c = document.createElement('canvas');
        c.width = canvas.width;
        c.height = Math.max(1, Math.round(sh));
        c.getContext('2d').drawImage(canvas, 0, Math.round(sy), canvas.width, c.height, 0, 0, canvas.width, c.height);
        return c;
      }

      const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: [pageWidthPt, pageHeightPt], compress: false });
      pages.forEach(function (page, idx) {
        if (idx > 0) pdf.addPage([pageWidthPt, pageHeightPt], 'portrait');
        let yPt = marginPt;
        if (page.headerZone) {
          const hSh = (page.headerZone.theadBottom - page.headerZone.theadTop) * pxScale;
          const hCanvas = cropCanvas(page.headerZone.theadTop * pxScale, hSh);
          const hHeightPt = (hSh / pxScale) * pxToPt;
          pdf.addImage(hCanvas.toDataURL('image/png', 1.0), 'PNG', marginPt, yPt, contentWidthPt, hHeightPt, undefined, 'FAST');
          yPt += hHeightPt;
        }
        const bSh = (page.bottom - page.top) * pxScale;
        const bCanvas = cropCanvas(page.top * pxScale, bSh);
        const bHeightPt = (bSh / pxScale) * pxToPt;
        pdf.addImage(bCanvas.toDataURL('image/png', 1.0), 'PNG', marginPt, yPt, contentWidthPt, bHeightPt, undefined, 'FAST');

        pdf.setFontSize(8);
        pdf.setTextColor(150);
        pdf.text('Halaman ' + (idx + 1) + ' dari ' + pages.length, pageWidthPt - marginPt, pageHeightPt - 12, { align: 'right' });
      });

      pdf.save(filename);
    }).finally(function () { restore(); });
  }

  // ============================================================
  // LAPORAN HARIAN ETF
  // ============================================================
  // Format Indonesia, TANPA trailing ",0000" (mis. 11.559 Gram, bukan
  // 11.559,0000 Gram) — desimal hanya muncul kalau nilainya memang punya
  // pecahan asli (maksimal 4 digit), presisi asli tidak dibulatkan/
  // dipotong, ini murni format tampilan. Angka utama besar/tebal,
  // desimal (kalau ada) + "Gram" lebih kecil — sesuai desain referensi.
  function formatGramSplitHtml(num) {
    num = Number(num) || 0;
    const parts = num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 4 }).split(',');
    const main = parts[0];
    const decimal = parts[1] || '';
    return '<span class="etf-gram-main">' + main + '</span>' +
      (decimal ? '<span class="etf-gram-decimal">,' + decimal + '</span>' : '') +
      '<span class="etf-gram-unit"> Gram</span>';
  }

  // Sama seperti formatGramSplitHtml, tapi selalu tampilkan tanda +/-
  // eksplisit di depan angka (dipakai utk ringkasan Inventory Utama —
  // "forceSign" dipakai kalau nilai HARUS ditampilkan negatif/positif
  // meski angka sumbernya sendiri selalu positif, mis. Penjualan Hari Ini).
  function formatGramSplitSignedHtml(num, forceSign) {
    num = Number(num) || 0;
    if (forceSign === 'negative') num = -Math.abs(num);
    if (forceSign === 'positive') num = Math.abs(num);
    const sign = num > 0 ? '+' : (num < 0 ? '-' : '');
    const parts = Math.abs(num).toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 4 }).split(',');
    const main = parts[0];
    const decimal = parts[1] || '';
    return '<span class="etf-gram-main">' + sign + main + '</span>' +
      (decimal ? '<span class="etf-gram-decimal">,' + decimal + '</span>' : '') +
      '<span class="etf-gram-unit"> gram</span>';
  }

  function etfSetNetRowColor(rowId, num) {
    const row = document.getElementById(rowId);
    row.classList.remove('etf-net-positive', 'etf-net-negative', 'etf-net-zero');
    row.classList.add(num > 0 ? 'etf-net-positive' : num < 0 ? 'etf-net-negative' : 'etf-net-zero');
  }

  function loadLaporanEtf() {
    // PENTING: default tanggal laporan ini HARUS pakai tanggal "hari ini"
    // versi Asia/Jakarta (jakartaNowParts_), BUKAN todayISO() yang
    // menghitung dari timezone LOKAL BROWSER. Kalau browser pengguna
    // bukan WIB, todayISO() bisa mengembalikan tanggal yang beda dgn
    // "hari ini" versi server — akibatnya Rekap Sesi mengira laporan
    // BUKAN utk hari ini, pemulihan otomatis tidak pernah jalan (lihat
    // guard "tgl !== todayStr" di ensureEgrSesiPemulihanJikaPerlu_ /
    // Code.gs), dan tabel nyangkut selamanya di "Snapshot tidak tersedia".
    const dateInput = document.getElementById('etf-date-picker');
    if (dateInput && !dateInput.value) dateInput.value = jakartaNowParts_().dateStr;
    const date = dateInput ? dateInput.value : null;

    etfLastData = null;
    etfCmpLastData = null;
    etfSesiLastData = null;

    document.getElementById('etf-print-date').textContent = 'Memuat...';
    document.getElementById('etf-kpi-saldo-egr').innerHTML = '-';
    document.getElementById('etf-kpi-penjualan').innerHTML = '-';
    document.getElementById('etf-kpi-penjualan-rupiah').textContent = '';
    document.getElementById('etf-kpi-sisa').innerHTML = '-';
    document.getElementById('etf-penjualan-body').innerHTML = '<tr><td colspan="5" class="recent-empty">Memuat...</td></tr>';
    document.getElementById('etf-pembelian-body').innerHTML = '<tr><td colspan="5" class="recent-empty">Memuat...</td></tr>';
    const hargaTable = document.getElementById('etf-tbl-harga-table');
    if (hargaTable) hargaTable.innerHTML = '<tbody><tr><td class="recent-empty">Memuat...</td></tr></tbody>';
    ['sesi-1200-jual', 'sesi-1200-buyback', 'sesi-1600-jual', 'sesi-1600-buyback'].forEach(function (k) {
      egrcmpSetText_('etf-tbl-' + k, 'Memuat...');
    });

    google.script.run
      .withSuccessHandler(function (data) { etfLastData = data; renderLaporanEtf(data); etfRenderSummaryIfReady_(); })
      .withFailureHandler(handleLoadError)
      .getLaporanHarianEtfData(date);

    google.script.run
      .withSuccessHandler(function (data) { etfCmpLastData = data; renderEtfCmpSections_(data); etfRenderSummaryIfReady_(); })
      .withFailureHandler(function (err) { console.error('getEgrPerbandinganPenjualanData gagal:', err); })
      .getEgrPerbandinganPenjualanData(date);

    google.script.run
      .withSuccessHandler(function (data) {
        console.log('[EgrSesiSnapshot] getEgrSesiSnapshot() hasil:', data, '| tanggal diminta:', date, '| tanggal Jakarta sekarang (client):', jakartaNowParts_());
        if (data && data.recoveryError) {
          console.error('[EgrSesiSnapshot] Pemulihan otomatis gagal di server:', data.recoveryError);
          showToast('Pemulihan snapshot sesi gagal: ' + data.recoveryError, 'warning');
        }
        etfSesiLastData = data;
        etfFillSesiTable_(data, 'etf-tbl');
        etfRenderSummaryIfReady_();
      })
      .withFailureHandler(function (err) { console.error('[EgrSesiSnapshot] getEgrSesiSnapshot gagal total:', err); handleLoadError(err); })
      .getEgrSesiSnapshot(date);
  }

  var etfLastData = null;
  var etfCmpLastData = null;
  var etfSesiLastData = null;

  // Baris Redemption EGR & Net Subscription di Ringkasan Saldo EGR —
  // dipakai kartu live (prefix 'etf-net') & kartu Summary ('etf-sum-net').
  function etfFillRedemRows_(data, prefix) {
    const redem = data.redemption || { totalGram: 0, totalNominal: 0 };
    document.getElementById(prefix + '-total-redem').innerHTML =
      formatGramSplitSignedHtml(redem.totalGram, 'positive') + ' <span class="etf-net-rupiah">(' + formatRupiah(redem.totalNominal) + ')</span>';
    etfSetNetRowColor(prefix + '-row-redem', redem.totalGram);
    const netSubs = data.netSubscriptionGram !== undefined ? data.netSubscriptionGram : data.penjualanEtfGram;
    document.getElementById(prefix + '-netsubs').innerHTML = formatGramSplitHtml(netSubs);
  }

  function renderLaporanEtf(data) {
    document.getElementById('etf-print-date').textContent = data.tanggalLabel;
    document.getElementById('etf-kpi-saldo-egr').innerHTML = formatGramSplitHtml(data.saldoTersedia);
    document.getElementById('etf-kpi-penjualan').innerHTML = formatGramSplitHtml(data.penjualanEtfGram);
    document.getElementById('etf-kpi-penjualan-rupiah').textContent = formatRupiah(data.penjualanEtfNilai);
    document.getElementById('etf-kpi-sisa').innerHTML = formatGramSplitHtml(data.saldoAkhir);

    // --- Ringkasan Saldo EGR: Total Pembelian / Net Hari Ini / Inventory
    // Utama KUMULATIF (kartu ringkas, tanpa tabel/rincian transaksi) ---
    document.getElementById('etf-net-total-pembelian').innerHTML =
      formatGramSplitSignedHtml(data.restock.totalGram, 'positive') + ' <span class="etf-net-rupiah">(' + formatRupiah(data.restock.totalNominal) + ')</span>';
    etfSetNetRowColor('etf-net-row-pembelian', data.restock.totalGram);
    etfFillRedemRows_(data, 'etf-net');

    document.getElementById('etf-net-hariini').innerHTML = formatGramSplitSignedHtml(data.netEgrHariIni);
    etfSetNetRowColor('etf-net-row-net', data.netEgrHariIni);

    document.getElementById('etf-inv-before-tgl').textContent = data.tanggalSebelumLabel;
    document.getElementById('etf-inv-before-val').innerHTML = formatGramSplitSignedHtml(data.inventorySebelumnya);
    document.getElementById('etf-inv-net-val').innerHTML = formatGramSplitSignedHtml(data.netEgrHariIni);
    etfSetNetRowColor('etf-inv-row-net', data.netEgrHariIni);
    document.getElementById('etf-inv-after-tgl').textContent = data.tanggalLabel;
    document.getElementById('etf-inv-after-val').innerHTML = formatGramSplitSignedHtml(data.inventoryUtamaKumulatif);
    etfSetNetRowColor('etf-inv-row-after', data.inventoryUtamaKumulatif);

    // --- Restock Pembelian EGR: total gramasi saja (Input_Beli_EGR) ---
    document.getElementById('etf-restock-gram').innerHTML = formatGramSplitHtml(data.restock.totalGram);

    // --- Detail Penjualan EGR (scroll + sticky header + Total di tfoot) ---
    const pjBody = document.getElementById('etf-penjualan-body');
    const pjRows = (data.penjualan && data.penjualan.rows) || [];
    pjBody.innerHTML = pjRows.length
      ? pjRows.map(function (r) {
          return '<tr><td>' + r.NomorInvoice + '</td><td>' + formatRupiah(r.HargaPerGram) + '</td><td>' + formatGram(r.Qty) + '</td>' +
            '<td>' + formatRupiah(r.TotalHarga) + '</td><td>' + r.Pembeli + '</td></tr>';
        }).join('')
      : '<tr><td colspan="5" class="recent-empty">Tidak ada penjualan EGR pada tanggal ini</td></tr>';
    const pjTotalGram = pjRows.reduce(function (s, r) { return s + (Number(r.Qty) || 0); }, 0);
    const pjTotalNominal = pjRows.reduce(function (s, r) { return s + (Number(r.TotalHarga) || 0); }, 0);
    document.getElementById('etf-penjualan-total-gram').innerHTML = formatGramSplitHtml(pjTotalGram);
    document.getElementById('etf-penjualan-total-nominal').textContent = formatRupiah(pjTotalNominal);

    // --- Detail Pembelian EGR (scroll + sticky header + Total di tfoot) ---
    const pbBody = document.getElementById('etf-pembelian-body');
    const pbRows = (data.pembelian && data.pembelian.rows) || [];
    pbBody.innerHTML = pbRows.length
      ? pbRows.map(function (r) {
          return '<tr><td>' + r.NomorPO + '</td><td>' + formatRupiah(r.AfterDiskon) + '</td><td>' + formatGram(r.Qty) + '</td>' +
            '<td>' + formatRupiah(r.TotalHarga) + '</td><td>' + r.Seller + '</td></tr>';
        }).join('')
      : '<tr><td colspan="5" class="recent-empty">Tidak ada pembelian EGR pada tanggal ini</td></tr>';
    const pbTotalGram = pbRows.reduce(function (s, r) { return s + (Number(r.Qty) || 0); }, 0);
    const pbTotalNominal = pbRows.reduce(function (s, r) { return s + (Number(r.TotalHarga) || 0); }, 0);
    document.getElementById('etf-pembelian-total-gram').innerHTML = formatGramSplitHtml(pbTotalGram);
    document.getElementById('etf-pembelian-total-nominal').textContent = formatRupiah(pbTotalNominal);
  }

  // Bagian Perbandingan Harga Harian & Perbandingan Hari Ini/Sebelumnya —
  // REUSE fungsi isi tabel yg sudah ada (egrcmpFillHargaTable_/
  // egrcmpFillTable_, awalnya dibuat utk halaman Perbandingan Penjualan
  // EGR yg sudah digabung ke sini), cukup ganti prefix id elemennya.
  function renderEtfCmpSections_(data) {
    try {
      egrcmpFillHargaTable_(data, 'etf-tbl');
      egrcmpFillTable_(data, 'etf-tbl');
    } catch (e) {
      console.error('renderEtfCmpSections_ gagal:', e);
    }
  }

  // Waktu saat ini di Asia/Jakarta (jam:menit + tanggal yyyy-MM-dd) — TIDAK
  // bergantung timezone browser. Dipakai HANYA utk menentukan teks
  // placeholder "Menunggu snapshot .../Snapshot tidak tersedia" di tabel
  // Rekap Sesi, BUKAN sbg pemicu snapshot (snapshot 100% dari trigger
  // otomatis di server, lihat Code.gs egrSesiSnapshot1200/1600).
  function jakartaNowParts_() {
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Asia/Jakarta', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(new Date());
    const get = function (type) { const p = parts.find(function (x) { return x.type === type; }); return p ? p.value : ''; };
    return { dateStr: get('year') + '-' + get('month') + '-' + get('day'), hour: Number(get('hour')), minute: Number(get('minute')) };
  }

  // Rekap Transaksi EGR per Sesi (12.00/16.00 WIB) — snapshot OTOMATIS dari
  // trigger server, halaman ini murni menampilkan hasilnya. Kalau snapshot
  // belum ada: sebelum jam sesi pada tanggal HARI INI -> "Menunggu
  // snapshot ..."; selain itu (jadwal sudah lewat tapi trigger belum/gagal
  // jalan, atau tanggal lampau tanpa data) -> "Snapshot tidak tersedia".
  // TIDAK PERNAH menampilkan angka 0 utk snapshot yang belum dijalankan.
  function etfSesiPlaceholder_(sesi, reportDateStr) {
    const label = sesi === '12:00' ? '12.00 WIB' : '16.00 WIB';
    const now = jakartaNowParts_();
    const cutoffHour = sesi === '12:00' ? 12 : 16;
    if (reportDateStr && reportDateStr === now.dateStr && now.hour < cutoffHour) {
      return '<span class="egrsesi-empty">Menunggu snapshot ' + label + '</span>';
    }
    return '<span class="egrsesi-empty">Snapshot tidak tersedia</span>';
  }

  // "Otomatis" (dari trigger terjadwal) -> "Tersimpan otomatis pukul
  // HH:mm WIB"; "Pemulihan" (dibuat saat halaman dibuka krn jadwalnya
  // sudah lewat tapi trigger belum/gagal jalan) -> "Snapshot pemulihan
  // dibuat pukul HH:mm WIB", sesuai wording yg diminta.
  function etfSesiSavedLabel_(entry) {
    if (!entry) return '';
    return (entry.status === 'Pemulihan' ? 'Snapshot pemulihan dibuat pukul ' : 'Tersimpan otomatis pukul ') + entry.savedAtLabel + ' WIB';
  }

  function etfFillSesiTable_(data, prefix) {
    function cell(id, entry, sesi, field) {
      if (!entry) { egrcmpSetHtml_(id, etfSesiPlaceholder_(sesi, data.tanggalStr)); return; }
      egrcmpSetHtml_(id, formatGramSplitHtml(entry[field] || 0));
    }
    cell(prefix + '-sesi-1200-jual', data.s1200, '12:00', 'jualGram');
    cell(prefix + '-sesi-1200-buyback', data.s1200, '12:00', 'buybackGram');
    cell(prefix + '-sesi-1600-jual', data.s1600, '16:00', 'jualGram');
    cell(prefix + '-sesi-1600-buyback', data.s1600, '16:00', 'buybackGram');
    egrcmpSetText_(prefix + '-sesi-1200-savedat', etfSesiSavedLabel_(data.s1200));
    egrcmpSetText_(prefix + '-sesi-1600-savedat', etfSesiSavedLabel_(data.s1600));
  }

  // Bagian Summary — paragraf naratif otomatis, HANYA menyimpulkan angka
  // yang sudah tampil di atas (harga/spread, posisi sesi, penjualan vs
  // H-1, saldo tersisa, pembelian & inventory utama), tanpa asumsi
  // penyebab. Dipakai baik utk kartu Laporan (live) maupun Summary
  // (off-screen) — tinggal beda prefix id elemennya.
  function etfFillSummary_(etfData, cmpData, sesiData, prefix) {
    // P1: Perubahan harga & spread hari ini.
    let p1;
    const adaHargaJual = cmpData.hariIni.hargaJual !== null;
    const adaHargaBuyback = !!cmpData.hargaBuyback;
    if (adaHargaJual && adaHargaBuyback) {
      p1 = 'Harga jual EGR pada ' + cmpData.tanggalLabel + ' tercatat sebesar ' + formatRupiah(cmpData.hariIni.hargaJual) +
        ' per gram, dengan harga buyback sebesar ' + formatRupiah(cmpData.hargaBuyback) + ' per gram, menghasilkan spread ' +
        formatRupiah(cmpData.spread) + ' atau ' + (cmpData.spreadPersen !== null ? formatPersenPlain_(cmpData.spreadPersen) : 'N/A') + '.';
    } else if (adaHargaJual) {
      p1 = 'Harga jual EGR pada ' + cmpData.tanggalLabel + ' tercatat sebesar ' + formatRupiah(cmpData.hariIni.hargaJual) + ' per gram. Harga buyback belum tersedia pada tanggal ini.';
    } else {
      p1 = 'Harga jual dan harga buyback EGR belum tersedia pada tanggal ini.';
    }
    const posisiList = (cmpData.hargaPosisi && cmpData.hargaPosisi.list) || [];
    if (posisiList.length > 1) {
      p1 += ' Tercatat ' + posisiList.length + ' posisi harga berbeda pada hari ini (' + posisiList[0].label + ' s.d. ' + posisiList[posisiList.length - 1].label + ').';
    }

    // P2: Posisi transaksi sesi 12.00 & 16.00 WIB (snapshot otomatis/pemulihan).
    let p2;
    if (sesiData.s1200 || sesiData.s1600) {
      const parts = [];
      parts.push(sesiData.s1200
        ? 'posisi 12.00 WIB tercatat ' + formatGramPlain_(sesiData.s1200.jualGram) + ' (' + etfSesiSavedLabel_(sesiData.s1200).toLowerCase() + ')'
        : 'posisi 12.00 WIB belum tersedia');
      parts.push(sesiData.s1600
        ? 'posisi 16.00 WIB tercatat ' + formatGramPlain_(sesiData.s1600.jualGram) + ' (' + etfSesiSavedLabel_(sesiData.s1600).toLowerCase() + ')'
        : 'posisi 16.00 WIB belum tersedia');
      p2 = 'Rekap transaksi per sesi: ' + parts.join(', ') + '. Transaksi buyback pada kedua sesi masih tercatat 0,0000 gram.';
    } else {
      p2 = 'Snapshot posisi transaksi sesi 12.00 WIB dan 16.00 WIB belum tersedia pada tanggal ini.';
    }

    // P3: Penjualan hari ini dibanding H-1.
    let p3 = 'Penjualan EGR pada ' + cmpData.tanggalLabel + ' tercatat sebesar ' + formatGramPlain_(cmpData.hariIni.qty) + ' dengan nilai ' + formatRupiah(cmpData.hariIni.nilai) + '.';
    if (!cmpData.adaDataSebelumnya) {
      p3 += ' Data transaksi sebelumnya belum tersedia sehingga perbandingan belum dapat dihitung.';
    } else {
      const selisihGram = cmpData.hariIni.qty - cmpData.sebelumnya.qty;
      const state = selisihGram > 0 ? 'up' : (selisihGram < 0 ? 'down' : 'flat');
      if (state === 'flat') {
        p3 += ' Dibandingkan ' + cmpData.tanggalSebelumnyaLabel + ' sebesar ' + formatGramPlain_(cmpData.sebelumnya.qty) + ', penjualan tidak mengalami perubahan.';
      } else {
        const kataKerja = state === 'up' ? 'kenaikan' : 'penurunan';
        const persenText = cmpData.sebelumnya.qty === 0 ? 'N/A' : formatPersenPlain_((selisihGram / cmpData.sebelumnya.qty) * 100);
        p3 += ' Dibandingkan ' + cmpData.tanggalSebelumnyaLabel + ' sebesar ' + formatGramPlain_(cmpData.sebelumnya.qty) + ', terjadi ' + kataKerja +
          ' sebesar ' + formatGramPlain_(Math.abs(selisihGram)) + ' atau ' + persenText + '.';
      }
    }

    // P4: Saldo tersisa.
    const p4 = 'Saldo EGR tersisa pada ' + etfData.tanggalLabel + ' tercatat sebesar ' + formatGramPlain_(etfData.saldoAkhir) + '.';

    // P5: Pembelian (Restock) & Inventory Utama Kumulatif (Before/Perubahan/After).
    const redemData = etfData.redemption || { totalGram: 0, totalNominal: 0 };
    const p5 = 'Pembelian (restock) EGR hari ini tercatat sebesar ' + formatGramPlain_(etfData.restock.totalGram) +
      ' senilai ' + formatRupiah(etfData.restock.totalNominal) + '. Redemption EGR hari ini tercatat sebesar ' + formatGramPlain_(redemData.totalGram) +
      ' senilai ' + formatRupiah(redemData.totalNominal) + '. Inventory Utama Kumulatif: posisi s.d. ' + etfData.tanggalSebelumLabel +
      ' sebesar ' + formatGramPlain_(etfData.inventorySebelumnya) + ', perubahan hari ini ' + formatGramPlain_(etfData.netEgrHariIni) +
      ', sehingga posisi s.d. ' + etfData.tanggalLabel + ' menjadi ' + formatGramPlain_(etfData.inventoryUtamaKumulatif) + '.';

    egrcmpSetText_(prefix + '-summary-p1', p1);
    egrcmpSetText_(prefix + '-summary-p2', p2);
    egrcmpSetText_(prefix + '-summary-p3', p3);
    egrcmpSetText_(prefix + '-summary-p4', p4);
    egrcmpSetText_(prefix + '-summary-p5', p5);
  }

  // ---------- Realisasi Nominal Transaksi 2026 (gauge saja) ----------

  function formatRupiahTriliun_(nominal) {
    return 'Rp' + (Number(nominal || 0) / 1e12).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' T';
  }

  // Konversi polar->kartesian konvensi standar gauge SVG: angle=0 di arah
  // jam 12 (atas), bertambah searah jarum jam. describeArc pakai formula
  // "teruji" ini supaya large-arc-flag tidak pernah salah pilih busur.
  function rkegrPolarToCartesian_(cx, cy, r, angleDeg) {
    const rad = (angleDeg - 90) * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
  }
  function rkegrDescribeArc_(cx, cy, r, startAngle, endAngle) {
    const start = rkegrPolarToCartesian_(cx, cy, r, endAngle);
    const end = rkegrPolarToCartesian_(cx, cy, r, startAngle);
    const largeArcFlag = (endAngle - startAngle) <= 180 ? '0' : '1';
    return ['M', start.x.toFixed(2), start.y.toFixed(2), 'A', r, r, 0, largeArcFlag, 0, end.x.toFixed(2), end.y.toFixed(2)].join(' ');
  }

  // Posisi gauge (skala 0-120) — piecewise: 0-100% dari realisasi/target100,
  // 100-120% dari kelebihan realisasi terhadap (target120-target100).
  // Target120 (Rp35T) BUKAN target100 x 1,2 — dua target bisnis independen.
  function rkegrGaugePositionPercent_(realisasi, target100, target120) {
    if (target100 <= 0) return 0;
    if (realisasi <= target100) return (realisasi / target100) * 100;
    const denom = target120 - target100;
    const extra = denom > 0 ? ((realisasi - target100) / denom) * 20 : 0;
    return 100 + extra;
  }

  /**
   * Gauge semi-circle SVG murni (tanpa library) — 1 track background, 1
   * track progress (gold->hijau), marker HANYA 0%/100%/120%, label di
   * luar arc. viewBox responsive (width:100% di CSS).
   */
  function buildRkEgrGaugeSvg_(realisasi, target100, target120) {
    const cx = 290, cy = 195, r = 160, sw = 24, labelR = r + 36;
    const posPercent = Math.max(0, Math.min(120, rkegrGaugePositionPercent_(realisasi, target100, target120)));
    const posFraction = posPercent / 120;
    const angleFor = function (fraction) { return -90 + fraction * 180; };
    const persen = target100 > 0 ? (realisasi / target100) * 100 : 0;

    const bgPath = rkegrDescribeArc_(cx, cy, r, -90, 90);
    const fgPath = rkegrDescribeArc_(cx, cy, r, -90, angleFor(Math.max(0.004, posFraction)));

    const p0 = rkegrPolarToCartesian_(cx, cy, labelR, angleFor(0));
    const p100 = rkegrPolarToCartesian_(cx, cy, labelR, angleFor(100 / 120));
    const p120 = rkegrPolarToCartesian_(cx, cy, labelR, angleFor(1));

    return '<svg viewBox="0 0 580 320" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="rkegrGaugeGrad" x1="0%" y1="0%" x2="100%" y2="0%">' +
      '<stop offset="0%" stop-color="#B8860B"/><stop offset="100%" stop-color="#046A38"/>' +
      '</linearGradient></defs>' +
      '<path d="' + bgPath + '" fill="none" stroke="#E5E7EB" stroke-width="' + sw + '" stroke-linecap="round"/>' +
      '<path d="' + fgPath + '" fill="none" stroke="url(#rkegrGaugeGrad)" stroke-width="' + sw + '" stroke-linecap="round"/>' +
      '<text x="' + p0.x.toFixed(1) + '" y="' + (p0.y + 5).toFixed(1) + '" text-anchor="middle" font-size="14" font-weight="700" fill="#8A8F98">0%</text>' +
      '<text x="' + p100.x.toFixed(1) + '" y="' + (p100.y - 6).toFixed(1) + '" text-anchor="middle" font-size="15" font-weight="800" fill="#6B7280">100%</text>' +
      '<text x="' + (p120.x + 8).toFixed(1) + '" y="' + (p120.y + 5).toFixed(1) + '" text-anchor="start" font-size="15" font-weight="800" fill="#6B7280">120%</text>' +
      '<text x="' + cx + '" y="' + (cy + 58) + '" text-anchor="middle" font-size="46" font-weight="800" fill="#1F2937">' + persen.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%</text>' +
      '<text x="' + cx + '" y="' + (cy + 92) + '" text-anchor="middle" font-size="18" font-weight="700" fill="#6B7280">' + formatRupiahTriliun_(realisasi) + ' / ' + formatRupiahTriliun_(target100) + '</text>' +
      '</svg>';
  }

  // Realisasi YTD (1 Jan - Tanggal Akhir filter), GABUNGAN Trading + EGR,
  // TIDAK dipengaruhi filter Buyer EGR di halaman ini (per instruksi user).
  function loadRkEgrGauge_() {
    const endInput = document.getElementById('rekap-egr-tanggal-akhir');
    const end = (endInput && endInput.value) ? endInput.value : todayISO();
    google.script.run
      .withSuccessHandler(function (data) {
        if (!data) return;
        const box = document.getElementById('rkegr-gauge-box');
        if (box) box.innerHTML = buildRkEgrGaugeSvg_(data.realisasiNominal, data.target100, data.target120);

        const persen = data.target100 > 0 ? (data.realisasiNominal / data.target100) * 100 : 0;
        const targetEl = document.getElementById('rkegr-kpi-target');
        if (targetEl) targetEl.textContent = formatRupiahTriliun_(data.target100);
        const realisasiEl = document.getElementById('rkegr-kpi-realisasi');
        if (realisasiEl) realisasiEl.textContent = formatRupiahTriliun_(data.realisasiNominal);
        const realisasiPctEl = document.getElementById('rkegr-kpi-realisasi-pct');
        if (realisasiPctEl) realisasiPctEl.textContent = persen.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '% dari target';
      })
      .withFailureHandler(function (err) { console.error(err); })
      .getRealisasiNominal2026(end);
  }

  // Jam realtime WIB (Asia/Jakarta) yang TIDAK bergantung pada zona waktu
  // browser — dibangun dari Intl.DateTimeFormat('en-GB', ...) format 24
  // jam supaya hasilnya selalu "HH:mm:ss" apa pun locale perangkat user.
  function rekapEgrNowJakartaClockText_() {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).formatToParts(new Date());
    const get = function (type) { const p = parts.find(function (x) { return x.type === type; }); return p ? p.value : '00'; };
    return 'Pukul ' + get('hour') + ':' + get('minute') + ':' + get('second') + ' WIB';
  }

  function rekapEgrTickClock_() {
    rekapEgrSetText_('rekap-egr-today-clock', rekapEgrNowJakartaClockText_());
  }

  function rekapEgrStartClock_() {
    rekapEgrTickClock_();
    if (rekapEgrTodayClockTimer) clearInterval(rekapEgrTodayClockTimer);

  function renderLaporanRekapEgr(data, refreshBuyerOptions) {
    rekapEgrLastData = data;
    document.getElementById('rekap-egr-print-date').textContent = data.startDateStr + ' s.d. ' + data.endDateStr;

    rekapEgrFillSaldoCard_(data, 'rekap-egr');

    const body = document.getElementById('rekap-egr-buyer-body');
    const rows = data.buyerRows || [];
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="4" class="recent-empty">Tidak ada penjualan EGR pada rentang tanggal ini</td></tr>';
    } else {
      let html = rows.map(function (r) {
        return '<tr><td><b>' + r.nama + '</b></td><td>' + r.count + ' trx</td>' +
          '<td>' + formatGramSplitHtml(r.gram) + '</td><td>' + formatRupiah(r.nilai) + '</td></tr>';
      }).join('');
      const totalCount = rows.reduce(function (s, r) { return s + r.count; }, 0);
      const totalGram = rows.reduce(function (s, r) { return s + r.gram; }, 0);
      const totalNilai = rows.reduce(function (s, r) { return s + r.nilai; }, 0);
      html += '<tr style="background:var(--color-gold-soft); font-weight:700;"><td>TOTAL SELURUH BUYER</td><td>' + totalCount + ' trx</td>' +
        '<td>' + formatGramSplitHtml(totalGram) + '</td><td>' + formatRupiah(totalNilai) + '</td></tr>';

    }

    // Dropdown filter Buyer hanya di-refresh saat load TANPA filter buyer

    if (refreshBuyerOptions) {
      rekapEgrBuyerListCache = rows.map(function (r) { return r.nama; });
      const select = document.getElementById('rekap-egr-buyer-filter');
      const current = select.value;
      select.innerHTML = '<option value="">Semua Buyer</option>' +
        rekapEgrBuyerListCache.map(function (nama) { return '<option value="' + escapeHtmlAttr(nama) + '">' + escapeHtmlAttr(nama) + '</option>'; }).join('');
      select.value = current && rekapEgrBuyerListCache.indexOf(current) !== -1 ? current : '';
    }

  // ============================================================
  // LAPORAN BUYER (Trading & EGR) — rekap per Buyer, filter Bulan +
  // Minggu ke- (tahun berjalan). Sumber data & aggregasi dilakukan di
  // server (getLaporanBuyerTrading/getLaporanBuyerEgr); di sini hanya
  // merender hasilnya. Data transaksi asli tidak diubah.
  // ============================================================
  function laporanBuyerPeriodeLabel_(bulanSelect, mingguSelect) {
    const bulanNum = Number(bulanSelect.value);
    const bulanNama = bulanNum ? DL_BULAN_ID[bulanNum - 1] : '-';
    const mingguNum = Number(mingguSelect.value);
    const mingguLabel = mingguNum ? ('Minggu ' + mingguNum) : 'Semua Minggu';
    return bulanNama + ' ' + new Date().getFullYear() + ' — ' + mingguLabel;
  }

  function renderLaporanBuyer_(bodyId, rows) {
    const body = document.getElementById(bodyId);
    if (!body) return;
    rows = rows || [];
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="4" class="recent-empty">Tidak ada transaksi pada periode ini</td></tr>';
      return;
    }
    let html = rows.map(function (r, idx) {
      return '<tr><td>' + (idx + 1) + '</td><td><b>' + escapeHtmlAttr(r.nama) + '</b></td>' +
        '<td>' + formatKgPlain_(r.gram / 1000) + '</td><td>' + formatRupiah(r.nilai) + '</td></tr>';
    }).join('');
    const totalGram = rows.reduce(function (s, r) { return s + r.gram; }, 0);
    const totalNilai = rows.reduce(function (s, r) { return s + r.nilai; }, 0);
    html += '<tr style="background:var(--color-gold-soft); font-weight:700;"><td></td><td>TOTAL</td>' +
      '<td>' + formatKgPlain_(totalGram / 1000) + '</td><td>' + formatRupiah(totalNilai) + '</td></tr>';
    body.innerHTML = html;

  // ------------------------------------------------------------
  // LAPORAN BUYER TRADING — dashboard (KPI, tren, Top 5, rekap +
  // modal detail per-transaksi). Sumber & aggregasi backend TETAP
  // sama (getLaporanBuyerTrading/getLaporanBuyerTradingDetail/
  // getLaporanBuyerTradingTrend) — di sini murni render UI. Tidak
  // menyentuh loadLaporanBuyerEgr / renderLaporanBuyer_ (dipakai
  // halaman EGR, tidak diubah).
  // ------------------------------------------------------------
  var lbtBuyerListCache = [];
  var lbtCurrentRows = [];

  function lbtFormatTanggal_(iso) {
    if (!iso) return '-';
    const p = String(iso).split('-');
    if (p.length !== 3) return iso;
    const bulanSingkat = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
    return p[2] + ' ' + (bulanSingkat[Number(p[1]) - 1] || p[1]) + ' ' + p[0];
  }

  function lbtKpiSubHtml_(curr, prev, prevLabel) {
    if (!prev) return '<span style="color:var(--color-text-muted);">Tidak ada data ' + (prevLabel || 'pembanding') + '</span>';
    const pct = ((curr - prev) / prev) * 100;
    const up = pct >= 0;
    return '<span style="color:' + (up ? 'var(--color-success)' : 'var(--color-danger)') + '; font-weight:700; display:inline-flex; align-items:center; gap:1px;">' +
      '<span class="material-symbols-rounded" style="font-size:14px;">' + (up ? 'arrow_upward' : 'arrow_downward') + '</span>' +
      Math.abs(pct).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%</span> dari ' + prevLabel;
  }

  function laporanBuyerTradingPeriodeLabel_() {
    const bulanSelect = document.getElementById('lapbuyer-trd-bulan');
    const mingguSelect = document.getElementById('lapbuyer-trd-minggu');
    const buyerSelect = document.getElementById('lapbuyer-trd-buyer');
    const tahun = new Date().getFullYear();
    const buyerLabel = (buyerSelect && buyerSelect.value) ? buyerSelect.value : 'Semua Buyer';

    if (bulanSelect.value === 'all') {
      const bulanIni = DL_BULAN_ID[new Date().getMonth()];
      return 'Periode Aktif: Januari–' + bulanIni + ' ' + tahun + ' • ' + buyerLabel;
    }

    const bulanNum = Number(bulanSelect.value);
    const bulanNama = bulanNum ? DL_BULAN_ID[bulanNum - 1] : '-';
    const mingguNum = Number(mingguSelect.value);
    const mingguLabel = mingguNum ? ('Minggu ' + mingguNum) : 'Semua Minggu';
    return 'Periode Aktif: ' + bulanNama + ' ' + tahun + ' • ' + mingguLabel + ' • ' + buyerLabel;
  }

  /**
   * "Semua Bulan (Januari–Saat Ini)" adalah rentang kumulatif, bukan 1
   * bulan/minggu spesifik — filter Minggu & mode Tren "Mingguan" tidak
   * relevan dalam kondisi ini, jadi dikunci ke "Semua Minggu"/"Bulanan"
   * selama opsi ini aktif. Dipanggil saat filter Bulan berubah maupun
   * saat halaman pertama kali dimuat (default = Semua Bulan).
   */
  function lbtOnBulanChange_() {
    const bulanSelect = document.getElementById('lapbuyer-trd-bulan');
    const isAll = bulanSelect.value === 'all';
    const mingguSelect = document.getElementById('lapbuyer-trd-minggu');
    const trendModeSelect = document.getElementById('lapbuyer-trd-trend-mode');
    if (mingguSelect) {
      mingguSelect.disabled = isAll;
      if (isAll) mingguSelect.value = '0';
    }
    if (trendModeSelect) {
      const mingguanOpt = trendModeSelect.querySelector('option[value="mingguan"]');
      if (mingguanOpt) mingguanOpt.disabled = isAll;
      if (isAll) trendModeSelect.value = 'bulanan';
    }
  }

  function renderLapbuyerTrdTable_(rows) {
    lbtCurrentRows = rows || [];
    const body = document.getElementById('lapbuyer-trd-body');
    if (!lbtCurrentRows.length) { body.innerHTML = '<tr><td colspan="7" class="recent-empty">Tidak ada transaksi pada periode ini</td></tr>'; return; }
    body.innerHTML = lbtCurrentRows.map(function (r, idx) {
      const pct = r.persenVolume || 0;
      return '<tr>' +
        '<td>' + (idx + 1) + '</td>' +
        '<td><b>' + escapeHtmlAttr(r.nama) + '</b></td>' +
        '<td>' + r.jumlahTransaksi + '</td>' +
        '<td style="text-align:right;">' + formatKgPlain_(r.gram / 1000) + '</td>' +
        '<td style="text-align:right;">' + formatRupiah(r.nilai) + '</td>' +
        '<td><div style="display:flex; align-items:center; gap:8px;"><div class="lbt-vol-bar-track"><div class="lbt-vol-bar-fill" style="width:' + Math.min(100, pct) + '%;"></div></div>' +
        '<span style="font-size:12px; font-weight:700; white-space:nowrap;">' + pct.toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%</span></div></td>' +
        '<td><button type="button" class="btn btn-secondary" style="padding:6px 12px; font-size:12px;" onclick="openLaporanBuyerTradingDetailByIndex(' + idx + ')">' +
        '<span class="material-symbols-rounded" style="font-size:15px;">visibility</span> Lihat Detail</button></td>' +
        '</tr>';
    }).join('');
  }

  // Format gramasi ASLI (gram, bukan Kg) dgn pemisah ribuan id-ID + "gr" —
  // dipakai khusus label ujung bar chart Top 5 Buyer (nilai bar sendiri
  // tetap dalam Kg spt semula, label cuma menampilkan gramasi aslinya).
  function lbtFormatGramasiLabel_(value) {
    return Number(value).toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 4 }) + ' gr';
  }

  // Plugin canvas custom (chartjs-plugin-datalabels belum ter-install di
  // project ini) — gambar label gramasi ASLI langsung di ujung kanan tiap
  // bar horizontal SETELAH chart selesai render, supaya ikut kegambar di
  // canvas bitmap-nya sendiri (otomatis ikut ke-capture saat Download
  // Gambar/PDF/print/screenshot — bukan tooltip yg cuma muncul saat hover).
  function lbtGramasiLabelPlugin_(gramasiAsliList) {
    return {
      id: 'lbtGramasiLabels',
      afterDatasetsDraw: function (chart) {
        const ctx2 = chart.ctx;
        const meta = chart.getDatasetMeta(0);
        ctx2.save();
        ctx2.font = '700 11px Arial, Helvetica, sans-serif';
        ctx2.fillStyle = '#142033';
        ctx2.textBaseline = 'middle';
        ctx2.textAlign = 'left';
        meta.data.forEach(function (bar, i) {
          if (gramasiAsliList[i] == null) return;
          const label = lbtFormatGramasiLabel_(gramasiAsliList[i]);
          ctx2.fillText(label, bar.x + 6, bar.y);
        });
        ctx2.restore();
      }
    };
  }

  function renderLapbuyerTrdTop5Chart_(rows) {
    destroyChart('lapbuyerTrdTop5');
    const ctx = document.getElementById('chart-lapbuyer-trd-top5');
    if (!ctx) return;
    const top5 = (rows || []).slice(0, 5);
    if (!top5.length) return;
    const dataKg = top5.map(function (r) { return r.gram / 1000; });
    const gramasiAsli = top5.map(function (r) { return r.gram; });
    const nilaiTerbesar = Math.max.apply(null, dataKg);
    charts.lapbuyerTrdTop5 = new Chart(ctx, {
      type: 'bar',
      data: { labels: top5.map(function (r) { return r.nama; }), datasets: [{ data: dataKg, backgroundColor: cssColor('--color-primary'), borderRadius: 6 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        layout: { padding: { right: 80 } },
        plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (c) { return formatKgPlain_(c.parsed.x); } } } },
        scales: { x: { suggestedMax: nilaiTerbesar * 1.18, ticks: { callback: function (v) { return v.toLocaleString('id-ID'); } } } }
      },
      plugins: [lbtGramasiLabelPlugin_(gramasiAsli)]
    });
  }

  // Format persen id-ID, 1-2 desimal — dipakai khusus indikator MtM/WtW
  // (Tren Gramasi Trading), TIDAK dipakai bagian lain.
  function lbtFormatPersen_(value) {
    return Number(value).toLocaleString('id-ID', { minimumFractionDigits: 1, maximumFractionDigits: 2 }) + '%';
  }
  // kg = nilai sudah dalam Kg (boleh negatif) -> "+8 kg" / "−8 kg" / "0 kg".
  function lbtFormatKgSigned_(kg) {
    const text = Math.abs(kg).toLocaleString('id-ID', { maximumFractionDigits: 4 }) + ' kg';
    if (kg > 0) return '+' + text;
    if (kg < 0) return '−' + text;
    return text;
  }

  function lbtRenderMtmCard_(trend) {
    const c = trend.compare;
    const card = document.getElementById('lbt-mtm-card');
    const detailEl = document.getElementById('lbt-mtm-detail');
    if (!card || !c) return;
    document.getElementById('lbt-mtm-label').textContent = c.periodType;
    card.title = c.aktifLabel + ' vs ' + c.prevLabel;
    card.classList.remove('lbt-mtm-up', 'lbt-mtm-down', 'lbt-mtm-flat');

    const arrowEl = document.getElementById('lbt-mtm-arrow');
    const pctEl = document.getElementById('lbt-mtm-pct');
    const selisihEl = document.getElementById('lbt-mtm-selisih');
    const selisihKg = c.selisihGram / 1000;

    if (c.isBaru) {
      arrowEl.innerHTML = '<span class="material-symbols-rounded">fiber_new</span>';
      pctEl.textContent = 'Baru';
      selisihEl.textContent = lbtFormatKgSigned_(selisihKg);
      card.classList.add('lbt-mtm-up');
      detailEl.textContent = c.aktifLabel + ' vs ' + c.prevLabel + ' — Periode sebelumnya 0 kg';
      return;
    }
    if (c.isZero) {
      arrowEl.innerHTML = '<span class="material-symbols-rounded">remove</span>';
      pctEl.textContent = lbtFormatPersen_(0);
      selisihEl.textContent = '0 kg';
      card.classList.add('lbt-mtm-flat');
      detailEl.textContent = c.aktifLabel + ' vs ' + c.prevLabel + ' — Tidak ada perubahan';
      return;
    }
    const up = c.persen > 0, flat = c.persen === 0;
    arrowEl.innerHTML = '<span class="material-symbols-rounded">' + (flat ? 'remove' : (up ? 'arrow_upward' : 'arrow_downward')) + '</span>';
    pctEl.textContent = lbtFormatPersen_(Math.abs(c.persen));
    selisihEl.textContent = lbtFormatKgSigned_(selisihKg);
    card.classList.add(flat ? 'lbt-mtm-flat' : (up ? 'lbt-mtm-up' : 'lbt-mtm-down'));
    detailEl.textContent = c.aktifLabel + ' vs ' + c.prevLabel;
  }

  // Gambar indikator MtM/WtW langsung di kanvas chart (pojok kanan atas),
  // supaya tetap kelihatan walau yg di-capture cuma elemen <canvas>-nya saja
  // (bukan cuma kartu HTML lbt-mtm-card di atasnya).
  function lbtMtmIndicatorPlugin_(trend) {
    return {
      id: 'lbtMtmIndicator',
      afterDatasetsDraw: function (chart) {
        const c = trend && trend.compare;
        if (!c) return;
        const ctx2 = chart.ctx;
        const area = chart.chartArea;

        let arrow, colorHex, text;
        const selisihKg = c.selisihGram / 1000;
        if (c.isBaru) {
          arrow = '✳'; colorHex = '#1E9E5A';
          text = c.periodType + ' Baru · ' + lbtFormatKgSigned_(selisihKg);
        } else if (c.isZero) {
          arrow = '→'; colorHex = '#6B7684';
          text = c.periodType + ' ' + lbtFormatPersen_(0) + ' · 0 kg';
        } else {
          const up = c.persen > 0, flat = c.persen === 0;
          arrow = flat ? '→' : (up ? '↑' : '↓');
          colorHex = flat ? '#6B7684' : (up ? '#1E9E5A' : '#D6483A');
          text = c.periodType + ' ' + arrow + ' ' + lbtFormatPersen_(Math.abs(c.persen)) + ' · ' + lbtFormatKgSigned_(selisihKg);
        }

        ctx2.save();
        ctx2.font = '700 12px Arial, Helvetica, sans-serif';
        const paddingX = 10, paddingY = 6, textW = ctx2.measureText(text).width;
        const boxW = textW + paddingX * 2, boxH = 24;
        const x = area.right - boxW - 6, y = Math.max(2, area.top - boxH - 4);

        ctx2.fillStyle = 'rgba(255,255,255,0.92)';
        ctx2.strokeStyle = colorHex;
        ctx2.lineWidth = 1.3;
        if (ctx2.roundRect) {
          ctx2.beginPath(); ctx2.roundRect(x, y, boxW, boxH, 6); ctx2.fill(); ctx2.stroke();
        } else {
          ctx2.fillRect(x, y, boxW, boxH); ctx2.strokeRect(x, y, boxW, boxH);
        }
        ctx2.fillStyle = colorHex;
        ctx2.textBaseline = 'middle';
        ctx2.textAlign = 'left';
        ctx2.fillText(text, x + paddingX, y + boxH / 2);
        ctx2.restore();
      }
    };
  }

  function renderLapbuyerTrdTrendChart_(trend) {
    destroyChart('lapbuyerTrdTrend');
    const ctx = document.getElementById('chart-lapbuyer-trd-trend');
    if (!ctx || !trend) return;
    lbtLastTrend = trend;
    lbtRenderMtmCard_(trend);

    const isBulanan = trend.mode === 'bulanan';
    charts.lapbuyerTrdTrend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.labels,
        datasets: [{
          data: trend.gramKg, borderColor: cssColor('--color-primary'), backgroundColor: cssColor('--color-primary-soft'),
          fill: true, tension: 0.35, pointRadius: 4, pointBackgroundColor: cssColor('--color-primary')
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        layout: { padding: { top: 30 } },
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              title: function (items) {
                const i = items[0].dataIndex;
                return isBulanan ? (trend.labels[i] + ' ' + trend.tahunAktif) : (trend.labels[i] + ' — ' + DL_BULAN_ID[trend.bulanAktifNum - 1] + ' ' + trend.tahunAktif);
              },
              label: function (ctx2) {
                const i = ctx2.dataIndex;
                const aktif = trend.gramKg[i];
                const prev = i > 0 ? trend.gramKg[i - 1] : trend.prevBoundaryGram;
                const prevLabel = i > 0 ? (trend.labels[i - 1] + (isBulanan ? ' ' + trend.tahunAktif : '')) : trend.prevBoundaryLabel;
                const lines = ['Gramasi: ' + formatKgPlain_(aktif)];
                lines.push((isBulanan ? 'Bulan sebelumnya: ' : 'Minggu sebelumnya: ') + formatKgPlain_(prev) + ' (' + prevLabel + ')');
                if (prev > 0) {
                  const pct = ((aktif - prev) / prev) * 100;
                  lines.push((isBulanan ? 'MtM: ' : 'WtW: ') + (pct >= 0 ? '+' : '') + lbtFormatPersen_(pct));
                  lines.push('Selisih: ' + lbtFormatKgSigned_(aktif - prev));
                } else if (aktif > 0) {
                  lines.push((isBulanan ? 'MtM: Baru' : 'WtW: Baru'));
                } else {
                  lines.push('Tidak ada perubahan');
                }
                return lines;
              }
            }
          }
        },
        scales: { y: { ticks: { callback: function (v) { return v.toLocaleString('id-ID') + ' Kg'; } } } }
      },
      plugins: [lbtMtmIndicatorPlugin_(trend)]
    });
  }

  var lbtLastTrend = null;

  function loadLaporanBuyerTradingTrend() {
    const bulanSelect = document.getElementById('lapbuyer-trd-bulan');
    if (!bulanSelect.value) return;
    const mode = document.getElementById('lapbuyer-trd-trend-mode').value;
    const mingguSelect = document.getElementById('lapbuyer-trd-minggu');
    const buyerSelect = document.getElementById('lapbuyer-trd-buyer');
    google.script.run
      .withSuccessHandler(renderLapbuyerTrdTrendChart_)
      .withFailureHandler(function (err) { showToast('Gagal memuat tren gramasi: ' + (err.message || err), 'error'); })
      .getLaporanBuyerTradingTrend(bulanSelect.value, mode, buyerSelect ? buyerSelect.value : '', mingguSelect ? mingguSelect.value : '');
  }

  function loadLaporanBuyerTradingFilteredTable_(bulan, minggu, buyer) {
    document.getElementById('lapbuyer-trd-body').innerHTML = '<tr><td colspan="7" class="recent-empty">Memuat...</td></tr>';
    google.script.run
      .withSuccessHandler(function (res) { renderLapbuyerTrdTable_((res || {}).buyerRows); })
      .withFailureHandler(function (err) {
        document.getElementById('lapbuyer-trd-body').innerHTML = '<tr><td colspan="7" class="recent-empty">Gagal memuat data</td></tr>';
        showToast('Gagal memuat data buyer: ' + (err.message || err), 'error');
      })
      .getLaporanBuyerTrading(bulan, minggu, buyer);
  }

  function loadLaporanBuyerTrading() {
    const bulanSelect = document.getElementById('lapbuyer-trd-bulan');
    const mingguSelect = document.getElementById('lapbuyer-trd-minggu');
    const buyerSelect = document.getElementById('lapbuyer-trd-buyer');
    if (!bulanSelect.value) { showToast('Pilih Bulan terlebih dahulu', 'warning'); return; }
    lbtOnBulanChange_();

    document.getElementById('lapbuyer-trd-body').innerHTML = '<tr><td colspan="7" class="recent-empty">Memuat...</td></tr>';
    document.getElementById('lapbuyer-trd-print-periode').textContent = laporanBuyerTradingPeriodeLabel_();
    ['transaksi', 'buyer', 'gram', 'nilai'].forEach(function (k) {
      document.getElementById('lapbuyer-trd-kpi-' + k).textContent = '-';
      document.getElementById('lapbuyer-trd-kpi-' + k + '-sub').innerHTML = '';
    });

    google.script.run
      .withSuccessHandler(function (res) {
        res = res || {};
        const totals = res.totals || { transaksi: 0, buyer: 0, gram: 0, nilai: 0 };
        const prev = res.prevTotals || { transaksi: 0, buyer: 0, gram: 0, nilai: 0 };
        const prevLabel = res.prevPeriodeLabel || '';

        document.getElementById('lapbuyer-trd-kpi-transaksi').textContent = totals.transaksi.toLocaleString('id-ID');
        document.getElementById('lapbuyer-trd-kpi-transaksi-sub').innerHTML = lbtKpiSubHtml_(totals.transaksi, prev.transaksi, prevLabel);
        document.getElementById('lapbuyer-trd-kpi-buyer').textContent = totals.buyer.toLocaleString('id-ID');
        document.getElementById('lapbuyer-trd-kpi-buyer-sub').innerHTML = lbtKpiSubHtml_(totals.buyer, prev.buyer, prevLabel);
        document.getElementById('lapbuyer-trd-kpi-gram').innerHTML = formatKgPlain_(totals.gram / 1000);
        document.getElementById('lapbuyer-trd-kpi-gram-sub').innerHTML = lbtKpiSubHtml_(totals.gram, prev.gram, prevLabel);
        document.getElementById('lapbuyer-trd-kpi-nilai').textContent = formatRupiah(totals.nilai);
        document.getElementById('lapbuyer-trd-kpi-nilai-sub').innerHTML = lbtKpiSubHtml_(totals.nilai, prev.nilai, prevLabel);

        renderLapbuyerTrdTop5Chart_(res.buyerRows);

        const currentBuyer = buyerSelect.value;
        lbtBuyerListCache = (res.buyerRows || []).map(function (r) { return r.nama; });
        buyerSelect.innerHTML = '<option value="">Semua Buyer</option>' +
          lbtBuyerListCache.map(function (nama) { return '<option value="' + escapeHtmlAttr(nama) + '">' + escapeHtmlAttr(nama) + '</option>'; }).join('');
        buyerSelect.value = currentBuyer && lbtBuyerListCache.indexOf(currentBuyer) !== -1 ? currentBuyer : '';

        if (!buyerSelect.value) {
          renderLapbuyerTrdTable_(res.buyerRows);
        } else {
          loadLaporanBuyerTradingFilteredTable_(bulanSelect.value, mingguSelect.value, buyerSelect.value);
        }
      })
      .withFailureHandler(function (err) {
        document.getElementById('lapbuyer-trd-body').innerHTML = '<tr><td colspan="7" class="recent-empty">Gagal memuat data</td></tr>';

  /**
   * Download Excel — SEBELUMNYA hanya export rekap/summary per buyer
   * (client-side, XLSX.js). Diganti: ambil detail SELURUH transaksi
   * (sumber & filter SAMA seperti modal "Detail Buyer") dari server,
   * sudah diformat/di-style rapi (hijau, zebra, TOTAL, freeze,
   * autofilter) — client cuma men-decode base64 & memicu download,
   * tidak ada perhitungan ulang di sini.
   *
   * Dropdown "Buyer" IKUT diterapkan ke export (WYSIWYG — hasil Excel
   * mengikuti tabel yang sedang tampil di layar): kalau dropdown
   * kosong ("Semua Buyer"), Excel berisi SEMUA buyer periode ini;
   * kalau dropdown diisi 1 buyer, Excel hanya berisi buyer itu —
   * sama seperti tabel rekap yang sedang Anda lihat.
   */
  function exportLaporanBuyerTradingExcel() {
    if (!lbtCurrentRows.length) { showToast('Belum ada data untuk diexport — klik Tampilkan dulu', 'warning'); return; }
    showToast('Menyiapkan Excel detail transaksi...', 'success');
    const bulan = document.getElementById('lapbuyer-trd-bulan').value;
    const minggu = document.getElementById('lapbuyer-trd-minggu').value;
    const buyerSelect = document.getElementById('lapbuyer-trd-buyer');
    const periodeLabel = laporanBuyerTradingPeriodeLabel_();
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.base64) { showToast('Gagal membuat file Excel', 'error'); return; }
        const byteChars = atob(result.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = result.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Excel berhasil diunduh', 'success');
      })
      .withFailureHandler(function (err) { showToast('Gagal export Excel: ' + (err.message || err), 'error'); })
      .exportLaporanBuyerTradingDetailExcel(bulan, minggu, buyerSelect ? buyerSelect.value : '', periodeLabel);
  }

    const tahun = document.getElementById('lsb-tahun').value;

    ['supplier', 'transaksi', 'gram', 'nilai', 'avgprice'].forEach(function (k) {
      const el = document.getElementById('lsb-kpi-' + k);
      if (el) el.textContent = '-';
    });

    google.script.run
      .withSuccessHandler(function (res) {
        res = res || {};

        document.getElementById('lsb-kpi-supplier').textContent = totals.supplierAktif.toLocaleString('id-ID');

        if (totalBulanChip) {

            totals.supplierAktif.toLocaleString('id-ID') + ' supplier';

  function renderLsbTrendChart_(trend) {
    destroyChart('lsbTrend');
    const ctx = document.getElementById('chart-lsb-trend');
    if (!ctx || !trend) return;
    const activeMonthIdx = Number(document.getElementById('lsb-bulan').value) - 1;
    const pointColors = trend.labels.map(function (_, idx) { return idx === activeMonthIdx ? '#C9A227' : cssColor('--color-primary'); });
    const pointRadii = trend.labels.map(function (_, idx) { return idx === activeMonthIdx ? 6 : 3; });
    charts.lsbTrend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.labels,
        datasets: [{
          data: trend.gramKg, borderColor: cssColor('--color-primary'), backgroundColor: cssColor('--color-primary-soft'),
          fill: true, tension: .35, pointRadius: pointRadii, pointBackgroundColor: pointColors
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (c) {
                const idx = c.dataIndex;
                return [
                  'Gramasi: ' + formatKgPlain_(trend.gramKg[idx]),
                  'Nominal: ' + formatRupiah(trend.nilai[idx]),
                  'Transaksi: ' + trend.jumlahTransaksi[idx]
                ];
              }
            }
          }
        },
        scales: { y: { ticks: { callback: function (v) { return v.toLocaleString('id-ID') + ' Kg'; } } } }
      }
    });
  }

  function renderLsbTop5Chart_(rows) {
    destroyChart('lsbTop5');
    const ctx = document.getElementById('chart-lsb-top5');
    const emptyEl = document.getElementById('lsb-top5-empty');
    rows = rows || [];
    if (!ctx) return;
    if (!rows.length) { ctx.style.display = 'none'; if (emptyEl) emptyEl.style.display = 'block'; return; }
    ctx.style.display = 'block';
    if (emptyEl) emptyEl.style.display = 'none';
    charts.lsbTop5 = new Chart(ctx, {
      type: 'bar',
      data: { labels: rows.map(function (r) { return r.nama; }), datasets: [{ data: rows.map(function (r) { return r.gram / 1000; }), backgroundColor: cssColor('--color-primary'), borderRadius: 6 }] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function (c) {
                const r = rows[c.dataIndex];
                return [
                  'Jumlah Transaksi: ' + r.jumlahTransaksi,
                  'Total Gramasi: ' + formatKgPlain_(r.gram / 1000),
                  'Total Nominal: ' + formatRupiah(r.nilai),
                  'Average Price: ' + formatRupiah(r.avgPrice),
                  'Kontribusi: ' + (r.persenKontribusi || 0).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + '%'
                ];
              }
            }
          }
        },
        scales: { x: { ticks: { callback: function (v) { return v.toLocaleString('id-ID'); } } }, y: { ticks: { autoSkip: false } } }
      }
    });
  }

      const nomor = (r.nomorPO || '-') + (r.invoiceRef ? ' / ' + r.invoiceRef : '');
      return '<tr>' +
        '<td>' + (idx + 1) + '</td>' +
        '<td>' + lbtFormatTanggal_(r.tanggal) + '</td>' +
        '<td>' + escapeHtmlAttr(nomor) + '</td>' +

        '<td style="text-align:right;">' + formatRupiah(r.hargaPerGram) + '</td>' +
        '<td style="text-align:right;">' + formatRupiah(r.totalHarga) + '</td>' +

      '<td style="text-align:right;">' + formatKgPlain_(totalGram / 1000) + '</td><td></td>' +

  /**
   * Download Excel Laporan Supplier Bulanan — menu ini sebelumnya
   * tidak punya opsi Excel sama sekali. Ambil detail SELURUH transaksi
   * (sumber & filter SAMA seperti modal "Detail Supplier", termasuk
   * filter Supplier & Cari yang aktif) dari server, sudah
   * diformat/di-style rapi (hijau, zebra, TOTAL, freeze, autofilter)
   * — client cuma men-decode base64 & memicu download.
   *
   * Dropdown "Supplier" & "Cari" IKUT diterapkan ke export (WYSIWYG
   * — hasil Excel mengikuti tabel yang sedang tampil di layar): kalau
   * keduanya kosong, Excel berisi SEMUA supplier periode ini; kalau
   * salah satu diisi, Excel hanya berisi supplier yang cocok — sama
   * seperti tabel rekap yang sedang Anda lihat.
   */
  function exportLaporanSupplierBulananExcel() {
    if (!lsbCurrentRows.length) { showToast('Belum ada data untuk diexport', 'warning'); return; }
    showToast('Menyiapkan Excel detail transaksi...', 'success');
    const tahun = document.getElementById('lsb-tahun').value;
    const bulan = document.getElementById('lsb-bulan').value;
    const supplierSelect = document.getElementById('lsb-supplier');
    const search = document.getElementById('lsb-search').value.trim();
    const periodeLabel = lsbPeriodeLabel_();
    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.base64) { showToast('Gagal membuat file Excel', 'error'); return; }
        const byteChars = atob(result.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = result.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Excel berhasil diunduh', 'success');
      })
      .withFailureHandler(function (err) { showToast('Gagal export Excel: ' + (err.message || err), 'error'); })
      .exportLaporanSupplierBulananDetailExcel(tahun, bulan, supplierSelect ? supplierSelect.value : '', search, periodeLabel);
  }

  // Hasil Download Laporan (PDF/Gambar) HARUS PERSIS sama dengan layout
  // desktop (gauge kiri, 3 KPI vertikal kanan) — TIDAK ada layout export
  // alternatif. .export-mode (lihat Styles.html) hanya mengunci grid 2
  // kolom & ukuran gauge desktop supaya breakpoint responsive tidak ikut
  // aktif; dikombinasikan dengan windowWidth desktop tetap (1400) di
  // html2canvas (lihat REKAP_EGR_EXPORT_MIN_WIDTH_) supaya capture selalu
  // di-render selebar layar desktop, apa pun lebar viewport sebenarnya.
  var REKAP_EGR_EXPORT_MIN_WIDTH_ = 1400;

  function rekapEgrEnableExportMode_(el) {
    el.classList.add('export-mode');
    return function rekapEgrDisableExportMode_() { el.classList.remove('export-mode'); };
  }

  // Tunggu font & layout selesai settle (2x requestAnimationFrame) setelah
  // .export-mode diaktifkan, supaya html2canvas tidak men-capture gauge
  // SVG di tengah proses reflow.
  function rekapEgrWaitRenderReady_() {
    const fontsReady = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    return fontsReady.then(function () {
      return new Promise(function (resolve) {
        requestAnimationFrame(function () { requestAnimationFrame(resolve); });
      });
    });
  }
