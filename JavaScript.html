  // ------------------------------------------------------------
  // Summary Teks (Laporan Rekap EGR) — SELALU baca langsung dari sheet
  // berdasarkan Tanggal Akhir yang dipilih, TIDAK PERNAH memakai
  // snapshot sesi 12.00/16.00 (fitur itu KHUSUS Laporan Harian EGR).
  // Jam pada teks HANYA dihitung ulang saat summary dibuat/ditampilkan/
  // diperbarui/tombol Copy Teks diklik — bukan jam transaksi terakhir,
  // dan tidak ikut serta di Download Laporan/Summary (lihat class
  // no-print pada section-nya di Index.html).
  // ------------------------------------------------------------
  var rekapEgrSummaryData = null;

  function rekapEgrJamSaatIniLabel_() {
    const parts = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Jakarta', hour: '2-digit', minute: '2-digit', hour12: false
    }).formatToParts(new Date());
    const get = function (type) { const p = parts.find(function (x) { return x.type === type; }); return p ? p.value : '00'; };
    return get('hour') + '.' + get('minute');
  }

  function rekapEgrBuildSummaryText_(data) {
    const jam = rekapEgrJamSaatIniLabel_();
    const lines = [];
    lines.push('Update Transaksi EGR ' + data.tanggalLabel + ' per ' + jam + ' WIB');
    lines.push('');
    lines.push('Harga EGR: ' + (data.hargaJualTerakhir !== null ? formatRupiah(data.hargaJualTerakhir) : 'Belum ada transaksi'));
    lines.push('Buyback EGR: ' + (data.hargaBuybackTerakhir !== null ? formatRupiah(data.hargaBuybackTerakhir) : 'Belum ada transaksi'));
    lines.push('');
    if (data.totalGramHariIni > 0 && data.buyerRows && data.buyerRows.length) {
      lines.push('Transaksi EGR hari ini sebesar ' + formatGramPlain_(data.totalGramHariIni) + ' dengan detail transaksi sebagai berikut:');
      lines.push('');
      data.buyerRows.forEach(function (r, idx) {
        lines.push((idx + 1) + '. ' + r.nama + ': ' + formatGramPlain_(r.gram));
      });
    } else {
      lines.push('Belum ada transaksi EGR pada tanggal ini.');
    }
    lines.push('');
    lines.push('Total emas yang telah ditransaksikan sebagai EGR sampai dengan ' + data.tanggalLabel + ' sebesar ' + formatGramPlain_(data.totalGramKumulatif) + '.');
    return lines.join('\n');
  }

  function renderRekapEgrSummaryText_() {
    const el = document.getElementById('rekap-egr-summary-text');
    if (!el || !rekapEgrSummaryData) return;
    el.value = rekapEgrBuildSummaryText_(rekapEgrSummaryData);
  }

  function loadRekapEgrSummaryText_() {
    const endInput = document.getElementById('rekap-egr-tanggal-akhir');
    const end = endInput ? endInput.value : todayISO();
    if (!end) return;
    const el = document.getElementById('rekap-egr-summary-text');
    if (el) el.value = 'Memuat...';
    google.script.run
      .withSuccessHandler(function (data) {
        rekapEgrSummaryData = data;
        renderRekapEgrSummaryText_();
      })
      .withFailureHandler(function (err) {
        if (el) el.value = 'Gagal memuat summary.';
        console.error('getEgrRekapSummaryData gagal:', err);
      })
      .getEgrRekapSummaryData(end);
  }

  // Sebelum menyalin, jam diperbarui dulu (waktu Copy Teks diklik),
  // BARU teks disalin — sesuai urutan yang diminta.
  function rekapEgrCopySummaryText() {
    if (!rekapEgrSummaryData) { showToast('Tampilkan laporan terlebih dahulu', 'warning'); return; }
    renderRekapEgrSummaryText_();
    const el = document.getElementById('rekap-egr-summary-text');
    el.select();
    el.setSelectionRange(0, 999999);
    try {
      document.execCommand('copy');
      showToast('Summary berhasil disalin', 'success');
    } catch (e) {
      showToast('Gagal menyalin — silakan copy manual dari kotak teks', 'error');
    }
  }

  // ============================================================
  // PERBANDINGAN PENJUALAN EGR — tabel horizontal H-1 vs Hari Ini
  // (vs tanggal transaksi terakhir sebelumnya)
  // ============================================================
  var egrcmpLastData = null;

  // Helper NULL-SAFE — dipakai di semua fungsi halaman ini supaya elemen
  // yg (utk alasan apa pun) tidak ketemu di DOM tidak bikin seluruh fungsi
  // crash (yg sebelumnya bikin "Memuat..." macet selamanya karena
  // google.script.run tidak sempat dipanggil sama sekali).
  function egrcmpSetText_(id, text) {
    const el = document.getElementById(id);
    if (el) el.textContent = text;
  }
  function egrcmpSetHtml_(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = html;
  }

  function loadEgrPerbandingan() {
    const dateInput = document.getElementById('egrcmp-date-picker');
    if (dateInput && !dateInput.value) dateInput.value = todayISO();
    const date = dateInput ? dateInput.value : null;

    egrcmpSetText_('egrcmp-print-date', 'Memuat...');
    const hargaTable = document.getElementById('egrcmp-tbl-harga-table');
    if (hargaTable) hargaTable.innerHTML = '<tbody><tr><td class="recent-empty">Memuat...</td></tr></tbody>';
    ['rekap-penjualan-gram', 'rekap-penjualan-nilai', 'rekap-buyback-gram', 'rekap-buyback-nilai',
      'h1-tanggal', 'h1-gram', 'h1-nilai', 'hi-gram', 'hi-nilai', 'selisih-gram', 'selisih-nilai', 'persentase',
      'summary-p1', 'summary-p2'].forEach(function (k) {
      egrcmpSetText_('egrcmp-tbl-' + k, '-');
    });
    egrcmpSetText_('egrcmp-tbl-selisih-text', 'Selisih (Tidak Berubah)');
    egrcmpSetText_('egrcmp-tbl-selisih-icon', 'trending_flat');

    google.script.run
      .withSuccessHandler(renderEgrPerbandingan)
      .withFailureHandler(function (err) {
        egrcmpSetText_('egrcmp-print-date', 'Gagal memuat');
        handleLoadError(err);
      })
      .getEgrPerbandinganPenjualanData(date);
  }

  function egrcmpSetCellClass_(cellId, state) {
    const el = document.getElementById(cellId);
    if (!el) return;
    el.classList.remove('egrcmp-cell-up', 'egrcmp-cell-down', 'egrcmp-cell-flat');
    el.classList.add('egrcmp-cell-' + state);
  }

  function formatGramPlain_(num) {
    num = Number(num) || 0;
    return num.toLocaleString('id-ID', { minimumFractionDigits: 0, maximumFractionDigits: 4 }) + ' gram';
  }
  function formatPersenPlain_(num) {
    return Math.abs(Number(num) || 0).toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
  }

  // Bagian A (Perbandingan Harga) + Bagian B (Rekap Transaksi Hari Ini) —
  // dipakai baik utk kartu Laporan (live) maupun Summary (off-screen).
  // Bagian A (Perbandingan Harga) — tabel kolom DINAMIS: H-1 selalu ada,
  // lalu Harga I, Harga II, ... hanya sebanyak posisi harga yg benar-benar
  // berbeda pada tanggal laporan (data.hargaPosisi.list dari backend,
  // sudah dideduplikasi & berurutan). Tidak pernah bikin kolom kosong/"-".
  function egrcmpFmtHarga_(v) { return (v === null || v === undefined) ? '-' : formatRupiah(v); }
  function egrcmpFmtPersenSpread_(v) {
    return (v === null || v === undefined) ? '-' : (v > 0 ? '+' : '') + v.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
  }

  function egrcmpFillHargaTable_(data, prefix) {
    const table = document.getElementById(prefix + '-harga-table');
    if (!table) return;
    const hp = data.hargaPosisi || { h1: null, list: [] };
    const kolom = [{ label: 'H-1', hargaJual: hp.h1 ? hp.h1.hargaJual : null, hargaBuyback: hp.h1 ? hp.h1.hargaBuyback : null, spread: hp.h1 ? hp.h1.spread : null, spreadPersen: hp.h1 ? hp.h1.spreadPersen : null }]
      .concat(hp.list || []);

    const theadHtml = '<tr><th>Keterangan</th>' + kolom.map(function (k) { return '<th>' + k.label + '</th>'; }).join('') + '</tr>';
    function row(label, field) {
      return '<tr><td><b>' + label + '</b></td>' + kolom.map(function (k) {
        return '<td>' + (field === 'spreadPersen' ? egrcmpFmtPersenSpread_(k[field]) : egrcmpFmtHarga_(k[field])) + '</td>';
      }).join('') + '</tr>';
    }
    table.innerHTML = '<thead>' + theadHtml + '</thead><tbody>' +
      row('Harga Jual', 'hargaJual') + row('Harga Buyback', 'hargaBuyback') +
      row('Spread Rupiah', 'spread') + row('Persentase Spread', 'spreadPersen') +
      '</tbody>';
  }

  // Bagian B (Rekap Transaksi Hari Ini).
  function egrcmpFillRekap_(data, prefix) {
    // Transaksi Penjualan = penjualan hari ini (sama dgn scorecard Hari
    // Ini di Bagian C). Transaksi Buyback SELALU 0 (belum ada transaksi
    // buyback sungguhan) — beda dgn Harga Buyback di Bagian A (Harga
    // Buyback = harga per gram; Transaksi Buyback = realisasi gramasi).
    egrcmpSetHtml_(prefix + '-rekap-penjualan-gram', formatGramSplitHtml(data.hariIni.qty));
    egrcmpSetText_(prefix + '-rekap-penjualan-nilai', formatRupiah(data.rekapEgrNilai));
    egrcmpSetHtml_(prefix + '-rekap-buyback-gram', formatGramSplitHtml(data.rekapBuybackGram || 0));
    egrcmpSetText_(prefix + '-rekap-buyback-nilai', formatRupiah(data.rekapBuybackNilai || 0));
  }

  // Bagian C (tabel H-1 / Selisih / Hari Ini) — dipakai baik utk tabel
  // Laporan (live) maupun tabel Summary (off-screen).
  function egrcmpFillTable_(data, prefix) {
    egrcmpSetText_(prefix + '-h1-tanggal', data.tanggalSebelumnyaLabel);
    egrcmpSetHtml_(prefix + '-h1-gram', formatGramSplitHtml(data.sebelumnya.qty));
    egrcmpSetText_(prefix + '-h1-nilai', formatRupiah(data.sebelumnya.nilai));

    egrcmpSetHtml_(prefix + '-hi-gram', formatGramSplitHtml(data.hariIni.qty));
    egrcmpSetText_(prefix + '-hi-nilai', formatRupiah(data.hariIni.nilai));

    // Baris Selisih — nilai gramasi & rupiah SELALU ditampilkan angka
    // aslinya (termasuk 0 kalau tidak berubah). Label dinamis: "Selisih
    // (Kenaikan/Penurunan/Tidak Berubah)", warna & ikon mengikuti status.
    const selisihGram = data.hariIni.qty - data.sebelumnya.qty;
    const selisihNilai = data.hariIni.nilai - data.sebelumnya.nilai;
    const gramState = selisihGram > 0 ? 'up' : (selisihGram < 0 ? 'down' : 'flat');
    const nilaiState = selisihNilai > 0 ? 'up' : (selisihNilai < 0 ? 'down' : 'flat');
    const iconSym = gramState === 'up' ? 'trending_up' : (gramState === 'down' ? 'trending_down' : 'trending_flat');
    const keteranganState = gramState === 'up' ? 'Kenaikan' : (gramState === 'down' ? 'Penurunan' : 'Tidak Berubah');

    egrcmpSetText_(prefix + '-selisih-icon', iconSym);
    egrcmpSetText_(prefix + '-selisih-text', 'Selisih (' + keteranganState + ')');
    egrcmpSetCellClass_(prefix + '-selisih-label', gramState);

    egrcmpSetHtml_(prefix + '-selisih-gram',
      formatGramSplitSignedHtml(selisihGram) + '<div class="egrcmp-table-sub" id="' + prefix + '-persentase"></div>');
    egrcmpSetCellClass_(prefix + '-selisih-gram', gramState);

    egrcmpSetText_(prefix + '-selisih-nilai', formatRupiahSigned(selisihNilai));
    egrcmpSetCellClass_(prefix + '-selisih-nilai', nilaiState);

    if (data.sebelumnya.qty === 0 && data.hariIni.qty === 0) {
      egrcmpSetText_(prefix + '-persentase', 'Tidak ada perubahan');
    } else if (data.sebelumnya.qty === 0) {
      egrcmpSetText_(prefix + '-persentase', 'Baru — H-1 tidak ada transaksi');
    } else {
      const persen = (selisihGram / data.sebelumnya.qty) * 100;
      egrcmpSetText_(prefix + '-persentase', gramState === 'flat'
        ? '0,00%'
        : (persen > 0 ? '+' : '') + persen.toLocaleString('id-ID', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%');
    }
  }

  // Bagian Summary — paragraf naratif otomatis dari data yg sama persis
  // dgn Bagian A/B/C di atasnya (bukan angka statis). Dipakai baik utk
  // kartu Laporan (live) maupun Summary (off-screen).
  function egrcmpFillSummary_(data, prefix) {
    // Paragraf 1: penjualan hari ini vs H-1.
    let p1 = 'Pada ' + data.tanggalLabel + ', transaksi penjualan EGR tercatat sebesar ' +
      formatGramPlain_(data.hariIni.qty) + ' dengan nilai ' + formatRupiah(data.hariIni.nilai) + '.';

    if (!data.sebelumnyaAdaTransaksi && data.hariIni.qty === 0) {
      p1 += ' Pada ' + data.tanggalSebelumnyaLabel + ' (H-1) maupun hari ini tidak terdapat transaksi penjualan.';
    } else if (!data.sebelumnyaAdaTransaksi) {
      p1 += ' Pada ' + data.tanggalSebelumnyaLabel + ' (H-1) tidak terdapat transaksi penjualan, sehingga seluruh gramasi hari ini (' +
        formatGramPlain_(data.hariIni.qty) + ') merupakan kenaikan baru — Baru, H-1 tidak ada transaksi.';
    } else {
      const selisihGram = data.hariIni.qty - data.sebelumnya.qty;
      const selisihNilai = data.hariIni.nilai - data.sebelumnya.nilai;
      const state = selisihGram > 0 ? 'up' : (selisihGram < 0 ? 'down' : 'flat');

      if (state === 'flat') {
        p1 += ' Dibandingkan dengan ' + data.tanggalSebelumnyaLabel + ' sebesar ' + formatGramPlain_(data.sebelumnya.qty) +
          ' senilai ' + formatRupiah(data.sebelumnya.nilai) + ', transaksi penjualan tidak mengalami perubahan.';
      } else {
        const kataKerja = state === 'up' ? 'kenaikan' : 'penurunan';
        const persenText = formatPersenPlain_((selisihGram / data.sebelumnya.qty) * 100);
        p1 += ' Dibandingkan dengan ' + data.tanggalSebelumnyaLabel + ' sebesar ' + formatGramPlain_(data.sebelumnya.qty) +
          ' senilai ' + formatRupiah(data.sebelumnya.nilai) + ', terjadi ' + kataKerja + ' penjualan sebesar ' +
          formatGramPlain_(Math.abs(selisihGram)) + ' atau ' + persenText + ', dengan ' + kataKerja + ' nilai transaksi sebesar ' +
          formatRupiah(Math.abs(selisihNilai)) + '.';
      }
    }

    // Paragraf 2: harga jual/buyback/spread + transaksi buyback (selalu 0 utk saat ini).
    const p2parts = [];
    const adaHargaJual = data.hariIni.hargaJual !== null;
    const adaHargaBuyback = !!data.hargaBuyback;
    if (adaHargaJual && adaHargaBuyback) {
      p2parts.push('Harga jual EGR pada hari ini tercatat sebesar ' + formatRupiah(data.hariIni.hargaJual) +
        ' per gram, sedangkan harga buyback sebesar ' + formatRupiah(data.hargaBuyback) + ' per gram.');
      p2parts.push('Dengan demikian, terdapat spread sebesar ' + formatRupiah(data.spread) + ' per gram atau ' +
        (data.spreadPersen !== null ? formatPersenPlain_(data.spreadPersen) : 'N/A') + '.');
    } else if (adaHargaJual && !adaHargaBuyback) {
      p2parts.push('Harga jual EGR pada hari ini tercatat sebesar ' + formatRupiah(data.hariIni.hargaJual) + ' per gram.');
      p2parts.push('Harga buyback belum tersedia pada tanggal laporan.');
    } else if (!adaHargaJual && adaHargaBuyback) {
      p2parts.push('Harga jual EGR pada hari ini belum tersedia.');
      p2parts.push('Harga buyback pada hari ini tercatat sebesar ' + formatRupiah(data.hargaBuyback) + ' per gram.');
    } else {
      p2parts.push('Harga jual EGR pada hari ini belum tersedia.');
      p2parts.push('Harga buyback belum tersedia pada tanggal laporan.');
    }
    p2parts.push('Saat ini belum terdapat transaksi buyback, sehingga transaksi buyback masih tercatat sebesar 0,0000 gram dengan nilai Rp0.');

    egrcmpSetText_(prefix + '-summary-p1', p1);
    egrcmpSetText_(prefix + '-summary-p2', p2parts.join(' '));
  }

  function renderEgrPerbandingan(data) {
    egrcmpLastData = data;
    egrcmpSetText_('egrcmp-print-date', data.tanggalLabel);
    try {
      egrcmpFillHargaTable_(data, 'egrcmp-tbl');
      egrcmpFillRekap_(data, 'egrcmp-tbl');
      egrcmpFillTable_(data, 'egrcmp-tbl');
      egrcmpFillSummary_(data, 'egrcmp-tbl');
    } catch (e) {
      console.error('renderEgrPerbandingan gagal:', e);
    }
  }

  // ============================================================
  // REKONSILIASI PEMBAYARAN
  // Modul terisolasi: upload mutasi bank (CSV/XLSX) -> parse di
  // client (SheetJS) -> kirim ke server untuk dedup + reconciliation.
  // Data sumber invoice TETAP dari PenjualanTransaksi existing —
  // modul ini tidak pernah menulis ke sheet Trading manapun.
  // ============================================================

  var rkCurrentTab_ = 'upload';
  var rkHasilRows_ = [];
  var rkHasilIsTestMode_ = false;
  var rkVerifikasiRows_ = [];
  var rkInvoiceRows_ = [];
  var rkVerifyTargetFingerprint_ = null;

  function rkEsc_(s) {
    return String(s === undefined || s === null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function rkTglIndo_(iso) {
    if (!iso) return '-';
    const p = String(iso).split('-');
    if (p.length !== 3) return iso;
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function rkErr_(err) {
    showToast('Rekonsiliasi: ' + (err && err.message ? err.message : err), 'error');
  }

  function rkBadge_(status) {
    const map = {
      MATCHED: ['LUNAS', 'green'],
      MANUAL_VERIFIED: ['LUNAS (MANUAL)', 'green'],
      PARTIAL: ['PARTIAL', 'gold'],
      'BELUM BAYAR': ['BELUM BAYAR', 'gray'],
      'LEBIH BAYAR': ['LEBIH BAYAR', 'gold'],
      LUNAS: ['LUNAS', 'green'],
      POTENTIAL_MATCH: ['POTENTIAL MATCH', 'blue'],
      PERLU_VERIFIKASI: ['PERLU VERIFIKASI', 'red'],
      UNIDENTIFIED: ['TIDAK DIKENALI', 'red'],
      DEBIT: ['DEBIT', 'gray'],
      BELUM_DIPROSES: ['BELUM DIPROSES', 'gray'],
      BELUM_DITEMUKAN: ['BELUM DITEMUKAN', 'gray'],
      MENUNGGU_REKONSILIASI: ['MENUNGGU REKONSILIASI', 'gray'],
      'LEBIH BAYAR': ['LEBIH BAYAR', 'gold']
    };
    const m = map[status] || [status || '-', 'gray'];
    return '<span class="badge ' + m[1] + '">' + m[0] + '</span>';
  }

  function rkWritebackBadge_(status) {
    const map = {
      UPDATED: ['UPDATED', 'green'],
      ALREADY_MATCHED: ['ALREADY MATCHED', 'green'],
      'NOT_UPDATED - PARTIAL': ['NOT UPDATED - PARTIAL', 'gold'],
      'NOT_UPDATED - NEED_VERIFICATION': ['NOT UPDATED - NEED VERIFICATION', 'red'],
      'NOT_UPDATED - PENDING': ['NOT UPDATED - PENDING', 'blue'],
      CONFLICT: ['CONFLICT', 'red'],
      CONFLICT_KEPT: ['CONFLICT (DIPERTAHANKAN)', 'gray'],
      FAILED: ['FAILED', 'red']
    };
    const m = map[status] || [status || '-', 'gray'];
    return '<span class="badge ' + m[1] + '">' + m[0] + '</span>';
  }

  var rkHasilFilterDatesInitialized_ = false;

  function rkTodayIso_() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  // Default tab "Hasil Rekonsiliasi" = hari ini s.d. hari ini (bukan
  // 01/09-09/09), sejalan dengan cut-off go-live RK_CUTOFF_DATE di backend.
  // Hanya set sekali per sesi supaya tidak menimpa filter yang sudah
  // diubah manual oleh user saat berpindah-pindah tab.
  function rkSetDefaultHasilFilterDates_() {
    const today = rkTodayIso_();
    document.getElementById('rk-filter-start').value = today;
    document.getElementById('rk-filter-end').value = today;
  }

  // Export mutasi BRI QLola (CMS Online "DD_ONLINE_CMS_NLedger") punya format
  // unik: TIDAK ada satu baris header di atas tabel. Setiap baris DATA justru
  // diawali literal "TIME,REMARK,DEBET,CREDIT,TELLER ID" (label ikut tercetak
  // ulang di tiap baris), lalu baru diikuti nilai sebenarnya:
  //   [TIME,REMARK,DEBET,CREDIT,TELLER ID, <tanggal>, <jam>, <remark>, <debit>, <credit>, <tellerId>]
  // Baris lain (judul, info akun, ringkasan) diabaikan otomatis karena tidak
  // cocok pola ini.
  function rkTryParseQlolaLedgerRows_(aoa) {
    const rows = [];
    aoa.forEach(function (r) {
      if (!r || r.length < 11) return;
      const a = String(r[0] || '').trim().toUpperCase();
      const b = String(r[1] || '').trim().toUpperCase();
      const c = String(r[2] || '').trim().toUpperCase();
      const d = String(r[3] || '').trim().toUpperCase();
      const e = String(r[4] || '').trim().toUpperCase();
      if (a === 'TIME' && b === 'REMARK' && c === 'DEBET' && d === 'CREDIT' && e.indexOf('TELLER') > -1) {
        rows.push({ tanggal: r[5], jam: r[6], remark: r[7], debit: r[8], credit: r[9], tellerId: r[10] });
      }
    });
    return rows;
  }

  function rkParseWorkbookRows_(arrayBuffer) {
    if (typeof XLSX === 'undefined') throw new Error('Modul parser file (SheetJS) gagal dimuat.');
    const wb = XLSX.read(arrayBuffer, { type: 'array', codepage: 65001 });
    const sheetName = wb.SheetNames[0];
    const sheet = wb.Sheets[sheetName];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });

    const qlolaRows = rkTryParseQlolaLedgerRows_(aoa);
    if (qlolaRows.length) return qlolaRows;

    // Fallback: format file dengan satu baris header normal (Tanggal/Remark/dst).
    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(aoa.length, 25); i++) {
      const rowText = (aoa[i] || []).map(function (c) { return String(c || '').toLowerCase(); }).join('|');
      if (rowText.indexOf('tanggal') > -1 || rowText.indexOf('date') > -1) { headerRowIdx = i; break; }
    }
    if (headerRowIdx === -1) throw new Error('Format file tidak dikenali — header kolom (Tanggal, Remark, Debit, Credit) tidak ditemukan.');

    const headers = (aoa[headerRowIdx] || []).map(function (c) { return String(c || '').trim().toLowerCase(); });
    function findCol(names) {
      for (let n = 0; n < names.length; n++) {
        const idx = headers.findIndex(function (h) { return h.indexOf(names[n]) > -1; });
        if (idx > -1) return idx;
      }
      return -1;
    }
    const colTgl = findCol(['tanggal', 'date']);
    const colJam = findCol(['jam', 'time', 'waktu']);
    const colRemark = findCol(['remark', 'keterangan', 'deskripsi', 'uraian']);
    const colDebit = findCol(['debit', 'db']);
    const colCredit = findCol(['credit', 'kredit', 'cr']);
    const colTeller = findCol(['teller']);
    if (colTgl === -1 || colRemark === -1) throw new Error('Kolom Tanggal dan Remark wajib ada pada file.');

    const rows = [];
    aoa.slice(headerRowIdx + 1).forEach(function (r) {
      if (!r || r.every(function (c) { return c === '' || c === null || c === undefined; })) return;
      rows.push({
        tanggal: colTgl > -1 ? r[colTgl] : '',
        jam: colJam > -1 ? r[colJam] : '',
        remark: colRemark > -1 ? r[colRemark] : '',
        debit: colDebit > -1 ? r[colDebit] : 0,
        credit: colCredit > -1 ? r[colCredit] : 0,
        tellerId: colTeller > -1 ? r[colTeller] : ''
      });
    });
    return rows;
  }

  function rkProcessFile_(file) {
    const progress = document.getElementById('rk-upload-progress');
    const resultBox = document.getElementById('rk-upload-result');
    progress.style.display = '';
    resultBox.style.display = 'none';
    document.getElementById('rk-upload-progress-text').textContent = 'Membaca file ' + file.name + '...';

    const reader = new FileReader();
    reader.onload = function (e) {
      let rows;
      try {
        rows = rkParseWorkbookRows_(e.target.result);
      } catch (err) {
        progress.style.display = 'none';
        showToast('Gagal membaca file: ' + err.message, 'error');
        return;
      }
      if (!rows.length) {
        progress.style.display = 'none';
        showToast('Tidak ada baris data yang bisa dibaca dari file ini.', 'warning');
        return;
      }
      document.getElementById('rk-upload-progress-text').textContent = 'Memproses ' + rows.length + ' baris & menjalankan rekonsiliasi...';
      google.script.run.withSuccessHandler(function (res) {
        progress.style.display = 'none';
        resultBox.style.display = '';
        resultBox.className = 'rk-upload-result-box' + (res.gagal > 0 ? ' rk-has-warning' : '');
        resultBox.innerHTML =
          '<strong>File berhasil diproses.</strong><br>' +
          res.totalBaris.toLocaleString('id-ID') + ' transaksi dibaca.<br>' +
          res.sudahAda.toLocaleString('id-ID') + ' transaksi sudah tersedia.<br>' +
          res.baru.toLocaleString('id-ID') + ' transaksi baru ditambahkan.<br>' +
          res.autoMatched.toLocaleString('id-ID') + ' berhasil direkonsiliasi otomatis.<br>' +
          res.perluVerifikasi.toLocaleString('id-ID') + ' memerlukan verifikasi.' +
          (res.gagal > 0 ? ('<br>' + res.gagal.toLocaleString('id-ID') + ' baris gagal dibaca.') : '');
        showToast('Upload selesai: ' + res.baru + ' transaksi baru', 'success');
        loadRkSummaryCards_();
        if (rkCurrentTab_ === 'hasil') loadRkHasil();
        if (rkCurrentTab_ === 'verifikasi') loadRkVerifikasi();
        if (rkCurrentTab_ === 'invoice') loadRkInvoice();
      }).withFailureHandler(function (err) {
        progress.style.display = 'none';
        rkErr_(err);
      }).rkUploadMutasi(file.name, rows);
    };
    reader.onerror = function () {
      progress.style.display = 'none';
      showToast('Gagal membaca file.', 'error');
    };
    reader.readAsArrayBuffer(file);
  }

  function renderRkHasilTable_() {
    const tbody = document.getElementById('rk-hasil-body');
    if (!rkHasilRows_.length) {
      tbody.innerHTML = '<tr><td colspan="11" class="recent-empty">' +
        (rkHasilIsTestMode_ ? 'Tidak ada invoice Trading tanggal 13/08/2026.' : 'Tidak ada invoice outstanding (Payment kosong) pada filter ini.') +
        '</td></tr>';
      return;
    }
    if (rkHasilIsTestMode_) {
      tbody.innerHTML = rkHasilRows_.map(rkRenderTestModeRow_).join('');
      return;
    }

    // 1 transaksi bank yang membayar beberapa invoice sekaligus harus
    // tampil sebagai SATU kelompok (bukan seolah tiap invoice punya
    // transaksi bank berbeda) — kelompokkan berdasarkan fingerprint
    // transfer tunggal yang sama.
    const groupCount = {};
    rkHasilRows_.forEach(function (r) {
      if (r.singleTransferFingerprint) groupCount[r.singleTransferFingerprint] = (groupCount[r.singleTransferFingerprint] || 0) + 1;
    });

    const rendered = {};
    let html = '';
    rkHasilRows_.forEach(function (r) {
      if (rendered[r.nomorInvoice]) return;
      const fp = r.singleTransferFingerprint;
      const isGroup = fp && groupCount[fp] > 1;
      if (!isGroup) {
        html += rkRenderHasilRow_(r, false, 1);
        rendered[r.nomorInvoice] = true;
        return;
      }
      const members = rkHasilRows_.filter(function (x) { return x.singleTransferFingerprint === fp; });
      const total = members.reduce(function (s, m) { return s + m.nilaiInvoice; }, 0);
      members.forEach(function (m) {
        html += rkRenderHasilRow_(m, true, members.length);
        rendered[m.nomorInvoice] = true;
      });
      html += '<tr class="rk-group-subtotal">' +
        '<td colspan="3" style="text-align:right; font-weight:700;">TOTAL ' + members.length + ' INVOICE</td>' +
        '<td style="text-align:right; font-weight:700; border-right:2px solid var(--color-border);">' + formatRupiah(total) + '</td>' +
        '<td colspan="7"></td></tr>';
    });
    tbody.innerHTML = html;
  }

  function exportRkHasilPdf() {
    if (!rkHasilRows_.length) { showToast('Belum ada data untuk diexport', 'warning'); return; }
    const el = document.querySelector('#rk-panel-hasil .lap-section');
    if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { showToast('Gagal memuat modul export PDF', 'error'); return; }
    showToast('Menyiapkan PDF...', 'success');
    html2canvas(el, { scale: 2.5, backgroundColor: '#ffffff', useCORS: true, windowWidth: el.scrollWidth, windowHeight: el.scrollHeight }).then(function (canvas) {
      const imgData = canvas.toDataURL('image/png', 1.0);
      const { jsPDF } = window.jspdf;
      const pdfWidth = 841.89, pdfHeight = (canvas.height * pdfWidth) / canvas.width;

  // ---------- Upload Alias Buyer via Excel (bulk) ----------

  var rkAliasUploadPreview_ = []; // hasil previewUploadAliasBuyer terakhir, dipakai saat "Simpan Alias Valid"

  // File Excel hanya 2 kolom (Nama Buyer, Alias) — cari baris header berisi
  // kedua label itu, baris kosong diabaikan. Parsing murni client-side
  // (SheetJS, sudah dimuat global), sama pola dengan rkParseWorkbookRows_.
  function rkAliasUploadParseFile_(arrayBuffer) {
    if (typeof XLSX === 'undefined') throw new Error('Modul parser file (SheetJS) gagal dimuat.');
    const wb = XLSX.read(arrayBuffer, { type: 'array', codepage: 65001 });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });

    let headerRowIdx = -1, colBuyer = -1, colAlias = -1;
    for (let i = 0; i < Math.min(aoa.length, 10); i++) {
      const cells = (aoa[i] || []).map(function (c) { return String(c || '').trim().toLowerCase(); });
      const bIdx = cells.findIndex(function (c) { return c.indexOf('nama buyer') > -1; });
      const aIdx = cells.findIndex(function (c) { return c === 'alias' || c.indexOf('alias') > -1; });
      if (bIdx > -1 && aIdx > -1) { headerRowIdx = i; colBuyer = bIdx; colAlias = aIdx; break; }
    }
    if (headerRowIdx === -1) throw new Error('Header "Nama Buyer" dan "Alias" tidak ditemukan pada file.');

    const rows = [];
    aoa.slice(headerRowIdx + 1).forEach(function (r) {
      if (!r) return;
      const buyerNama = String(r[colBuyer] || '').trim();
      const alias = String(r[colAlias] || '').trim();
      if (!buyerNama && !alias) return; // baris kosong diabaikan
      rows.push({ buyerNama: buyerNama, alias: alias });
    });
    return rows;
  }

  function rkAliasUploadHandleFile_(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      let rows;
      try {
        rows = rkAliasUploadParseFile_(ev.target.result);
      } catch (err) {
        showToast(err.message || 'Gagal membaca file Excel.', 'error');
        return;
      }
      if (!rows.length) { showToast('File tidak berisi data.', 'warning'); return; }
      const body = document.getElementById('rk-alias-upload-modal-body');
      body.innerHTML = '<div class="recent-empty">Mencocokkan dengan Master Buyer...</div>';
      document.getElementById('rk-alias-upload-modal-overlay').style.display = 'flex';
      google.script.run
        .withSuccessHandler(function (result) {
          rkAliasUploadPreview_ = result || [];
          rkRenderAliasUploadPreview_();
        })
        .withFailureHandler(function (err) {
          rkErr_(err);
          closeRkAliasUploadModal();
        })
        .previewUploadAliasBuyer(rows);
    };
    reader.onerror = function () { showToast('Gagal membaca file.', 'error'); };
    reader.readAsArrayBuffer(file);
  }

  function rkAliasUploadStatusBadge_(status) {
    const cls = status === 'VALID' ? 'green' : (status === 'DUPLIKAT' ? 'gold' : 'red');
    return '<span class="badge ' + cls + '">' + status + '</span>';

  function rkRenderAliasUploadPreview_() {
    const rows = rkAliasUploadPreview_;
    const total = rows.length;
    const validCount = rows.filter(function (r) { return r.status === 'VALID'; }).length;
    const dupCount = rows.filter(function (r) { return r.status === 'DUPLIKAT'; }).length;

    let html = '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;">' +
      '<span class="badge gray">Total Data: ' + total + '</span>' +
      '<span class="badge green">Valid: ' + validCount + '</span>' +

    html += '<div style="max-height:340px; overflow:auto;"><table class="data-table">' +
      '<thead><tr><th>Nama Buyer Excel</th><th>Alias</th><th>Buyer Master Ditemukan</th><th>Status</th></tr></thead><tbody>';
    if (!total) {
      html += '<tr><td colspan="4" class="recent-empty">Tidak ada data.</td></tr>';
    } else {
      rows.forEach(function (r) {
        html += '<tr><td>' + rkEsc_(r.buyerNamaExcel) + '</td><td>' + rkEsc_(r.alias) + '</td>' +

    html += '</tbody></table></div>';

    html += '<div style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">' +
      '<button class="btn btn-secondary" onclick="closeRkAliasUploadModal()">Batal</button>' +
      '<button class="btn btn-primary" ' + (validCount ? '' : 'disabled') + ' onclick="rkAliasUploadSaveValid_()">' +
      '<span class="material-symbols-rounded">save</span> Simpan Alias Valid (' + validCount + ')</button>' +

    document.getElementById('rk-alias-upload-modal-body').innerHTML = html;
  }

    }).withFailureHandler(function (err) {
      closeRkAdminResetModal();
      rkErr_(err);
    }).resetDataRekonsiliasiPembayaran();
  }
</script>
