  // ------------------------------------------------------------
  // FILTER RIWAYAT PENJUALAN — murni client-side di atas data yang
  // sudah dimuat ke pjlHistoryCache (hasil getPenjualanTransaksiRecent,
  // "DATA BREAKDOWN" tabel Riwayat Penjualan). Tidak ada query baru ke
  // backend/sheet, tidak mengubah data — hanya menyaring & merender
  // ulang baris tabel + ringkasan yang sudah ada di memory browser.
  // ------------------------------------------------------------
  function pjlBuildFilterOptions_(list) {
    const buyerSel = document.getElementById('pjl-filter-buyer');
    const merkSel = document.getElementById('pjl-filter-merk');
    const statusSel = document.getElementById('pjl-filter-status');
    if (!buyerSel || !merkSel || !statusSel) return;
    const prevBuyer = buyerSel.value, prevMerk = merkSel.value, prevStatus = statusSel.value;

    const buyers = [...new Set(list.map(p => p.Pembeli).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    const merks = [...new Set(list.map(p => p.Merk).filter(Boolean))].sort((a, b) => a.localeCompare(b));
    const statuses = [...new Set(list.map(p => p.Status).filter(Boolean))].sort((a, b) => a.localeCompare(b));

    buyerSel.innerHTML = '<option value="">Semua Buyer</option>' + buyers.map(b => '<option value="' + escapeHtmlAttr(b) + '">' + b + '</option>').join('');
    merkSel.innerHTML = '<option value="">Semua Merk</option>' + merks.map(m => '<option value="' + escapeHtmlAttr(m) + '">' + m + '</option>').join('');
    statusSel.innerHTML = '<option value="">Semua Status</option>' + statuses.map(s => '<option value="' + escapeHtmlAttr(s) + '">' + s + '</option>').join('');

    if (buyers.indexOf(prevBuyer) !== -1) buyerSel.value = prevBuyer;
    if (merks.indexOf(prevMerk) !== -1) merkSel.value = prevMerk;
    if (statuses.indexOf(prevStatus) !== -1) statusSel.value = prevStatus;
  }

  function pjlApplyFilter() {
    const buyer = (document.getElementById('pjl-filter-buyer') || {}).value || '';
    const merk = (document.getElementById('pjl-filter-merk') || {}).value || '';
    const status = (document.getElementById('pjl-filter-status') || {}).value || '';
    const tglAwal = (document.getElementById('pjl-filter-tgl-awal') || {}).value || '';
    const tglAkhir = (document.getElementById('pjl-filter-tgl-akhir') || {}).value || '';
    const search = ((document.getElementById('pjl-filter-search') || {}).value || '').trim().toLowerCase();
    const filterAktif = !!(buyer || merk || status || tglAwal || tglAkhir || search);

    const filtered = pjlHistoryCache.filter(function (p) {
      if (buyer && p.Pembeli !== buyer) return false;
      if (merk && (p.Merk || '') !== merk) return false;
      if (status && (p.Status || '') !== status) return false;
      const tglRow = String(p.Tanggal).split('T')[0];
      if (tglAwal && tglRow < tglAwal) return false;
      if (tglAkhir && tglRow > tglAkhir) return false;
      if (search) {
        const haystack = [p.NomorInvoice, p.Pembeli, p.Merk, p.Bank].filter(Boolean).join(' ').toLowerCase();
        if (haystack.indexOf(search) === -1) return false;
      }
      return true;
    });

    pjlRenderHistoryRows_(filtered, filterAktif ? 'Tidak ada transaksi yang cocok dengan filter' : 'Belum ada data dalam 30 hari terakhir');

    const totalGram = filtered.reduce(function (sum, p) { return sum + (Number(p.Qty) || 0); }, 0);
    const totalNominal = filtered.reduce(function (sum, p) { return sum + (Number(p.TotalHarga) || 0); }, 0);
    const countEl = document.getElementById('pjl-filter-count');
    const gramEl = document.getElementById('pjl-filter-gram');
    const nominalEl = document.getElementById('pjl-filter-nominal');
    if (countEl) countEl.textContent = filtered.length.toLocaleString('id-ID');
    if (gramEl) gramEl.textContent = formatGram(totalGram);
    if (nominalEl) nominalEl.textContent = formatRupiah(totalNominal);

    if (pjlBulkMode) pjlUpdateBulkSummary_();
  }

  function pjlResetFilter() {
    ['pjl-filter-buyer', 'pjl-filter-merk', 'pjl-filter-status', 'pjl-filter-tgl-awal', 'pjl-filter-tgl-akhir', 'pjl-filter-search'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.value = '';
    });
    pjlApplyFilter();
  }

  function pjlRenderHistoryRows_(list, emptyMessage) {
    const body = document.getElementById('penjualan-history-body');
    if (!body) return;
    if (!list.length) { body.innerHTML = '<tr><td colspan="11" class="recent-empty">' + emptyMessage + '</td></tr>'; return; }
    body.innerHTML = list.map(function (p) {
      const statusBadge = p.DealEmailSent
        ? '<span class="badge green">Sudah dikirim</span>'
        : '<span class="badge gray">Belum dikirim</span>';
      const statusPickup = p.StatusPickup || '';
      const adaJadwalAktif = statusPickup === 'Terjadwal' || statusPickup === 'Dalam Proses';
      let pickupActionsHtml = '';
      if (statusPickup === 'Selesai') {
        // Edit Pickup tetap tersedia (mis. utk koreksi data lama), diganti
        // badge hijau sbg pengganti tombol Selesai Diambil (tidak boleh
        // diselesaikan dua kali).
        pickupActionsHtml =
          '<button type="button" class="btn btn-secondary pjl-pickup-compact-btn" onclick="openPickupModal(\'' + p.ID + '\')" title="Edit Pickup"><span class="material-symbols-rounded" style="font-size:14px;">local_shipping</span><span class="pjl-pickup-btn-label-full"> Edit Pickup</span><span class="pjl-pickup-btn-label-short"> Edit</span></button>' +
          '<span class="badge green pjl-pickup-compact-btn" style="margin-left:6px;" title="Selesai Diambil">✓ <span class="pjl-pickup-btn-label-full">Selesai</span><span class="pjl-pickup-btn-label-short">Selesai</span></span>';
      } else {
        const label = adaJadwalAktif ? 'Edit Pickup' : 'Atur Pickup';
        const labelShort = adaJadwalAktif ? 'Edit' : 'Atur';
        pickupActionsHtml =
          '<button type="button" class="btn btn-secondary pjl-pickup-compact-btn" onclick="openPickupModal(\'' + p.ID + '\')" title="' + label + '"><span class="material-symbols-rounded" style="font-size:14px;">local_shipping</span><span class="pjl-pickup-btn-label-full"> ' + label + '</span><span class="pjl-pickup-btn-label-short"> ' + labelShort + '</span></button>';
        if (adaJadwalAktif) {
          pickupActionsHtml +=
            '<button type="button" class="btn btn-primary pjl-pickup-compact-btn" style="margin-left:6px;" onclick="pjlSelesaiDiambil(this, \'' + p.ID + '\', \'' + escapeHtmlAttr(p.NomorInvoice) + '\')" title="Selesai Diambil"><span class="material-symbols-rounded" style="font-size:14px;">check_circle</span><span class="pjl-pickup-btn-label-full"> Selesai Diambil</span><span class="pjl-pickup-btn-label-short"> Selesai</span></button>';
        }
      }
      const checkboxCell = statusPickup === 'Selesai'
        ? '<td class="pjl-bulk-checkbox-col pjl-bulk-col" style="display:none;"><span title="Pickup transaksi ini sudah selesai.">-</span></td>'
        : '<td class="pjl-bulk-checkbox-col pjl-bulk-col" style="display:none;"><input type="checkbox" class="pjl-bulk-row-checkbox" data-id="' + p.ID + '" onchange="pjlBulkToggleRow(\'' + p.ID + '\', this.checked)"></td>';
      return '<tr>' + checkboxCell + '<td>' + String(p.Tanggal).split('T')[0] + '</td><td>' + p.NomorInvoice + '</td>' +
        '<td>' + formatRupiah(p.HargaPerGram) + '</td><td>' + formatGram(p.Qty) + '</td>' +
        '<td><b>' + formatRupiah(p.TotalHarga) + '</b></td><td>' + p.Pembeli + '</td>' +
        '<td>' + (p.Merk || '-') + '</td>' +
        '<td><span class="badge ' + (p.Status === 'V' ? 'green' : 'gold') + '">' + p.Status + '</span></td>' +
        '<td><button type="button" class="icon-btn" style="width:28px; height:28px; margin-right:4px;" title="Edit" onclick="editPenjualan(\'' + p.ID + '\')"><span class="material-symbols-rounded" style="font-size:14px;">edit</span></button>' +
        '<button type="button" class="btn btn-secondary" style="padding:5px 10px; font-size:11px;" onclick="sendDealEmailConfirm(\'penjualan\', \'' + p.ID + '\', \'Invoice\', \'' + p.NomorInvoice + '\')"><span class="material-symbols-rounded" style="font-size:14px;">mail</span> Kirim Deal</button></td>' +
        '<td>' + statusBadge + '<div class="pjl-pickup-actions-row">' + pickupActionsHtml + '</div></td>' +
        '</tr>';
    }).join('');
  }

  // ------------------------------------------------------------
  // ATUR JADWAL MASSAL — pilih beberapa invoice sekaligus dari
  // Riwayat Penjualan, lalu terapkan 1 pengaturan jadwal ke semua.
  // Setiap invoice tetap disimpan/diproses individual di server
  // (simpanJadwalPickupMassal memanggil simpanJadwalPickup per ID) —
  // TIDAK ada transaksi gabungan baru dan nominal asli tidak disentuh.
  // ------------------------------------------------------------
  function pjlToggleBulkMode() {
    pjlBulkMode = !pjlBulkMode;
    pjlBulkSelected = {};
    document.querySelectorAll('.pjl-bulk-col').forEach(function (el) { el.style.display = pjlBulkMode ? '' : 'none'; });
    document.getElementById('pjl-bulk-bar').classList.toggle('active', pjlBulkMode);
    const selectAllEl = document.getElementById('pjl-bulk-select-all');
    if (selectAllEl) selectAllEl.checked = false;
    document.querySelectorAll('.pjl-bulk-row-checkbox').forEach(function (cb) { cb.checked = false; });
    const btn = document.getElementById('pjl-bulk-toggle-btn');
    btn.innerHTML = pjlBulkMode
      ? '<span class="material-symbols-rounded">close</span> Batal Pilih'
      : '<span class="material-symbols-rounded">checklist</span> Atur Jadwal Massal';
    pjlUpdateBulkSummary_();
  }

  function pjlBulkToggleRow(id, checked) {
    if (checked) pjlBulkSelected[id] = true; else delete pjlBulkSelected[id];
    pjlUpdateBulkSummary_();
  }

  function pjlBulkToggleAll(checked) {
    document.querySelectorAll('.pjl-bulk-row-checkbox').forEach(function (cb) {
      cb.checked = checked;
      if (checked) pjlBulkSelected[cb.getAttribute('data-id')] = true; else delete pjlBulkSelected[cb.getAttribute('data-id')];
    });
    pjlUpdateBulkSummary_();
  }

  function pjlBulkSelectedRows_() {
    return pjlHistoryCache.filter(function (p) { return pjlBulkSelected[p.ID]; });
  }

  function pjlUpdateBulkSummary_() {
    const rows = pjlBulkSelectedRows_();
    const totalGram = rows.reduce(function (sum, p) { return sum + (Number(p.Qty) || 0); }, 0);
    const summaryEl = document.getElementById('pjl-bulk-summary');
    if (summaryEl) summaryEl.textContent = rows.length + ' transaksi dipilih • ' + formatGram(totalGram);
    const openBtn = document.getElementById('pjl-bulk-open-modal-btn');
    if (openBtn) openBtn.disabled = rows.length === 0;
  }

  function pjlOpenMassalModal() {
    const rows = pjlBulkSelectedRows_();
    if (!rows.length) { showToast('Pilih minimal 1 transaksi terlebih dahulu', 'warning'); return; }

    const totalGram = rows.reduce(function (sum, p) { return sum + (Number(p.Qty) || 0); }, 0);
    const buyerSet = {};
    rows.forEach(function (p) { buyerSet[p.Pembeli] = true; });
    const buyerCount = Object.keys(buyerSet).length;

    document.getElementById('massal-summary-invoice').textContent = rows.length;
    document.getElementById('massal-summary-buyer').textContent = buyerCount;
    document.getElementById('massal-summary-gram').textContent = formatGram(totalGram);

    const groups = pjlGroupByBuyer_(rows.map(function (p) {
      return { pembeli: p.Pembeli, nomorInvoice: p.NomorInvoice, qty: p.Qty, merk: p.Merk };
    }));
    document.getElementById('massal-list').innerHTML = groups.map(function (g) {
      return '<div class="pjl-massal-list-buyer">' + escapeHtmlAttr(g.pembeli) + '</div>' +
        g.items.map(function (it) {
          return '<div>' + escapeHtmlAttr(it.nomorInvoice) + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + '</div>';
        }).join('');
    }).join('');

    const sudahTerjadwal = rows.some(function (p) { return p.StatusPickup === 'Terjadwal' || p.StatusPickup === 'Dalam Proses'; });
    document.getElementById('massal-warning-existing').style.display = sudahTerjadwal ? 'block' : 'none';

    document.getElementById('massal-metode').value = 'Ambil Sendiri';
    document.getElementById('massal-tanggal').value = '';
    document.getElementById('massal-jam').value = '';
    document.getElementById('massal-pic').value = '';
    document.getElementById('massal-catatan').value = '';
    pjlMassalMetodeChanged();

    document.getElementById('massal-modal-overlay').style.display = 'flex';
  }

  function pjlCloseMassalModal() {
    document.getElementById('massal-modal-overlay').style.display = 'none';
  }

  function pjlMassalMetodeChanged() {
    const metode = document.getElementById('massal-metode').value;
    document.getElementById('massal-fields-jadwal').style.display = metode === 'Hold' ? 'none' : 'block';
    document.getElementById('massal-pic-group').style.display = metode === 'Brinks' ? 'none' : 'block';
  }

  function pjlSubmitMassalModal() {
    const rows = pjlBulkSelectedRows_();
    if (!rows.length) { showToast('Tidak ada transaksi yang dipilih', 'warning'); return; }

    const metode = document.getElementById('massal-metode').value;
    const tanggal = document.getElementById('massal-tanggal').value;
    const jam = document.getElementById('massal-jam').value;
    const pic = document.getElementById('massal-pic').value.trim();
    const catatan = document.getElementById('massal-catatan').value.trim();

    if (metode !== 'Hold') {
      if (!tanggal) { showToast('Tanggal pengambilan wajib diisi', 'warning'); return; }
      if (!jam) { showToast('Jam pengambilan wajib dipilih', 'warning'); return; }
    }

    const sudahTerjadwal = rows.some(function (p) { return p.StatusPickup === 'Terjadwal' || p.StatusPickup === 'Dalam Proses'; });
    if (sudahTerjadwal && !confirm('Sebagian transaksi sudah memiliki jadwal pickup. Lanjutkan dan ubah jadwal transaksi yang dipilih?')) {
      return;
    }

    const btn = document.getElementById('massal-submit-btn');
    if (btn.disabled) return;
    setButtonLoading(btn, true);

    google.script.run
      .withSuccessHandler(function (res) {
        setButtonLoading(btn, false);
        if (res.failed && res.failed.length) {
          showToast(res.ok.length + ' berhasil, ' + res.failed.length + ' gagal (' + res.failed.map(function (f) { return f.nomorInvoice; }).join(', ') + ')', 'warning');
        } else {
          showToast('Jadwal massal berhasil disimpan untuk ' + res.ok.length + ' invoice', 'success');
        }
        pjlCloseMassalModal();
        pjlBulkSelected = {};
        pjlToggleBulkMode();
        loadPenjualanHistoryTable();
        loadJadwalPickup();
      })
      .withFailureHandler(function (err) {
        setButtonLoading(btn, false);
        showToast('Gagal menyimpan jadwal massal: ' + (err.message || err), 'error');
      })
      .simpanJadwalPickupMassal(rows.map(function (p) { return p.ID; }), { metode: metode, tanggal: tanggal, jam: jam, pic: pic, catatan: catatan });
  }

  // ------------------------------------------------------------
  // JADWAL PICKUP (Menu Penjualan) — panel pengganti "Penjualan Hari
  // Ini". Sumber & aggregasi di server (getJadwalPickup/
  // getPickupTransaksiInfo/simpanJadwalPickup/selesaikanPickup/
  // batalkanPickup di Code.gs). Di sini murni render + modal.
  // ------------------------------------------------------------
  var pjlJadwalCache = null;

  function pjlDateToIso_(d) {
    const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function pjlSlotLabel_(jam) {
    if (!jam) return '';
    const start = parseInt(jam.split(':')[0], 10);
    const end = start + 1;
    const pad = function (n) { return String(n).padStart(2, '0'); };
    return pad(start) + '.00–' + pad(end) + '.00';
  }

  function pjlHitungLamaHari_(tanggalStr) {
    if (!tanggalStr) return '-';
    const d = new Date(tanggalStr + 'T00:00:00');
    const diff = Math.floor((new Date() - d) / 86400000);
    return Math.max(0, diff);
  }

  function loadJadwalPickup() {
    const dateEl = document.getElementById('pjl-pickup-tanggal');
    if (!dateEl) return;
    if (!dateEl.value) dateEl.value = todayISO();
    const slotsEl = document.getElementById('pjl-pickup-slots');
    const pendingEl = document.getElementById('pjl-pickup-pending');
    if (slotsEl) slotsEl.innerHTML = '<div class="recent-empty">Memuat...</div>';
    if (pendingEl) pendingEl.innerHTML = '<div class="recent-empty">Memuat...</div>';

    google.script.run
      .withSuccessHandler(renderJadwalPickup_)
      .withFailureHandler(function (err) {
        if (slotsEl) slotsEl.innerHTML = '<div class="recent-empty">Gagal memuat jadwal</div>';
        showToast('Gagal memuat Jadwal Pickup: ' + (err.message || err), 'error');
      })
      .getJadwalPickup(dateEl.value);

    loadPickupScorecards();
  }

  // Scorecard "Pickup Hari Ini" & "Barang Belum Dipickup" — SELALU hari
  // ini di server (getPickupScorecards), TIDAK terpengaruh filter tanggal
  // Jadwal Pickup di atas.
  function loadPickupScorecards() {
    const empty = { gram: 0, buyerCount: 0, invoiceCount: 0 };
    google.script.run
      .withSuccessHandler(function (sc) {
        sc = sc || { hariIni: { total: empty, selesai: empty, menunggu: empty }, belumDipickup: empty, tanggal: todayISO() };
        const total = sc.hariIni.total || empty;
        const gramEl = document.getElementById('pjl-sc-hariini-gram');
        const detailEl = document.getElementById('pjl-sc-hariini-detail');
        const tanggalEl = document.getElementById('pjl-sc-hariini-tanggal');
        const selesaiEl = document.getElementById('pjl-sc-hariini-selesai');
        const menungguEl = document.getElementById('pjl-sc-hariini-menunggu');
        if (gramEl) gramEl.textContent = formatGram(total.gram);
        if (detailEl) detailEl.textContent = total.buyerCount + ' buyer • ' + total.invoiceCount + ' invoice';
        if (tanggalEl) tanggalEl.textContent = pjlHariTanggalLabel_(sc.tanggal);
        if (selesaiEl) selesaiEl.textContent = formatGram((sc.hariIni.selesai || empty).gram);
        if (menungguEl) menungguEl.textContent = formatGram((sc.hariIni.menunggu || empty).gram);

        const gramEl2 = document.getElementById('pjl-sc-belum-gram');
        const detailEl2 = document.getElementById('pjl-sc-belum-detail');
        if (gramEl2) gramEl2.textContent = formatGram(sc.belumDipickup.gram);
        if (detailEl2) detailEl2.textContent = sc.belumDipickup.buyerCount + ' buyer • ' + sc.belumDipickup.invoiceCount + ' invoice';
      })
      .withFailureHandler(handleLoadError)
      .getPickupScorecards();
  }

  function pjlPickupShiftDate(delta) {
    const dateEl = document.getElementById('pjl-pickup-tanggal');
    const d = new Date((dateEl.value || todayISO()) + 'T00:00:00');
    d.setDate(d.getDate() + delta);
    dateEl.value = pjlDateToIso_(d);
    loadJadwalPickup();
  }

  function pjlPickupToday() {
    document.getElementById('pjl-pickup-tanggal').value = todayISO();
    loadJadwalPickup();
  }

  // Pengelompokan TAMPILAN saja (data transaksi asli tidak diubah/digabung).
  // Grup dasar: buyer yang sama di dalam 1 slot (tanggal+jam sudah pasti
  // sama krn per-slot; metode dipisah lewat brinksItems/lainItems sebelum
  // fungsi ini dipanggil).
  function pjlGroupByBuyer_(items) {
    const order = [];
    const map = {};
    items.forEach(function (it) {
      const key = String(it.pembeli || '');
      if (!map[key]) { map[key] = []; order.push(key); }
      map[key].push(it);
    });
    return order.map(function (key) { return { pembeli: key, items: map[key] }; });
  }

  // Badge status pickup per-invoice — hijau "✓ Selesai Diambil" kalau
  // sudah Selesai, gold/oranye "Menunggu Pickup" kalau belum (transaksi
  // Selesai TETAP tampil di slot, tidak pernah disingkirkan).
  function pjlPickupBadgeHtml_(statusPickup) {
    return statusPickup === 'Selesai'
      ? '<span class="badge green pjl-pickup-item-badge">✓ Selesai Diambil</span>'
      : '<span class="badge gold pjl-pickup-item-badge">Menunggu Pickup</span>';
  }

  function pjlRenderBuyerGroupsHtml_(items) {
    return pjlGroupByBuyer_(items).map(function (g) {
      if (g.items.length <= 1) {
        const it = g.items[0];
        return '<div class="pjl-slot-item"><div class="pjl-item-main">' + escapeHtmlAttr(it.pembeli) + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + '</div>' +
          '<div class="pjl-item-sub">' + escapeHtmlAttr(it.nomorInvoice) + (it.metode ? ' · ' + escapeHtmlAttr(it.metode) : '') + '</div>' +
          pjlPickupBadgeHtml_(it.statusPickup) + '</div>';
      }
      const totalGram = g.items.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
      const selesaiItems = g.items.filter(function (it) { return it.statusPickup === 'Selesai'; });
      const belumItems = g.items.filter(function (it) { return it.statusPickup !== 'Selesai'; });
      const selesaiGram = selesaiItems.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
      const belumGram = belumItems.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
      const invoicesHtml = g.items.map(function (it, idx) {
        return '<div class="pjl-buyer-invoice"><div class="pjl-item-main">' + (idx + 1) + '. ' + escapeHtmlAttr(it.nomorInvoice) + '</div>' +
          '<div class="pjl-item-sub">' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + '</div>' +
          pjlPickupBadgeHtml_(it.statusPickup) + '</div>';
      }).join('');
      return '<div class="pjl-slot-item"><div class="pjl-buyer-name">' + escapeHtmlAttr(g.pembeli) + '</div>' +
        invoicesHtml +
        '<div class="pjl-buyer-summary">Total: ' + g.items.length + ' invoice • ' + formatGram(totalGram) +
        '<br>Selesai: ' + selesaiItems.length + ' invoice • ' + formatGram(selesaiGram) +
        '<br>Belum selesai: ' + belumItems.length + ' invoice • ' + formatGram(belumGram) + '</div></div>';
    }).join('');
  }

  function renderJadwalPickup_(data) {
    data = data || { slots: [], pending: [] };
    pjlJadwalCache = data;

    const wrap = document.getElementById('pjl-pickup-slots');
    if (wrap) {
      wrap.innerHTML = (data.slots || []).map(function (s) {
        if (!s.items.length) {
          return '<div class="pjl-slot"><div class="pjl-slot-header">' + s.label + '</div><div class="pjl-slot-empty">Tersedia</div></div>';
        }
        const brinksItems = s.items.filter(function (it) { return it.metode === 'Brinks'; });
        const lainItems = s.items.filter(function (it) { return it.metode !== 'Brinks'; });
        let html = '<div class="pjl-slot"><div class="pjl-slot-header">' + s.label + (brinksItems.length ? ' — Pick Up Brinks' : '') + '</div>';
        html += pjlRenderBuyerGroupsHtml_(lainItems);
        html += pjlRenderBuyerGroupsHtml_(brinksItems);
        html += '</div>';
        return html;
      }).join('');
    }

    const pendingWrap = document.getElementById('pjl-pickup-pending');
    if (pendingWrap) {
      const pending = data.pending || [];
      if (!pending.length) {
        pendingWrap.innerHTML = '<div class="recent-empty">Tidak ada barang yang menunggu pickup</div>';
      } else {
        pendingWrap.innerHTML = pending.map(function (p, idx) {
          return '<div class="pjl-pending-item"><div>' + (idx + 1) + '. <b>' + escapeHtmlAttr(p.pembeli) + '</b> — ' + formatGram(p.qty) + (p.merk ? ' — ' + escapeHtmlAttr(p.merk) : '') +
            '<div class="pjl-item-sub">' + escapeHtmlAttr(p.nomorInvoice) + ' · menunggu ' + pjlHitungLamaHari_(p.tanggal) + ' hari</div></div>' +
            '<button type="button" class="btn btn-secondary" style="padding:4px 8px; font-size:10.5px; flex-shrink:0;" onclick="openPickupModal(\'' + p.id + '\')">Atur Jadwal</button></div>';
        }).join('');
      }
    }
  }

  function pjlHariTanggalLabel_(tanggalStr) {
    const d = new Date((tanggalStr || todayISO()) + 'T00:00:00');
    const hariNama = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', "Jum'at", 'Sabtu'][d.getDay()];
    return hariNama + ', ' + d.getDate() + ' ' + DL_BULAN_ID[d.getMonth()] + ' ' + d.getFullYear();
  }

  function pjlPickupStatusLabel_(st) {
    if (!st || st === 'Hold - Belum Ada Jadwal') return 'Hold/Belum Ada Jadwal';
    return st;
  }

  // Keterangan status pickup per-invoice utk Copy/Download Jadwal —
  // transaksi Selesai tetap tampil di slot aslinya, ditandai teks ini.
  function pjlPickupStatusMark_(statusPickup) {
    return statusPickup === 'Selesai' ? '✓ Selesai Diambil' : 'Menunggu Pickup';
  }

  // Format PLAIN TEKS, kompatibel WhatsApp (tanda bintang = bold, tidak ada
  // warna) — dipakai sebagai fallback text/plain saat copy, sesuai contoh
  // format Vault Room yang wajib diikuti.
  function pjlBuildJadwalPlainWA_(jp, tanggalLabel) {
    const lines = [];
    lines.push('*VAULT ROOM ACTIVITY APPOINTMENT*');
    lines.push('*' + tanggalLabel + '*');
    lines.push('');
    lines.push('Berikut kami sampaikan jadwal penggunaan Vault Room:');
    lines.push('');
    (jp.slots || []).forEach(function (s) {
      const brinksItems = s.items.filter(function (it) { return it.metode === 'Brinks'; });
      const lainItems = s.items.filter(function (it) { return it.metode !== 'Brinks'; });
      if (!s.items.length) {
        lines.push('*' + s.label + ':*' + ' Tersedia');
        lines.push('');
        return;
      }
      const title = s.label + (brinksItems.length ? ' — PICK UP BRINKS' : '');
      lines.push('*' + title + '*');
      lines.push('');
      pjlGroupByBuyer_(lainItems.concat(brinksItems)).forEach(function (g) {
        if (g.items.length <= 1) {
          const it = g.items[0];
          lines.push(it.pembeli + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + it.merk : ''));
          lines.push('(' + it.nomorInvoice + ')');
          lines.push('*' + pjlPickupStatusMark_(it.statusPickup) + '*');
          lines.push('');
          return;
        }
        lines.push('*' + g.pembeli + '*');
        lines.push('');
        const totalGram = g.items.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
        g.items.forEach(function (it, idx) {
          lines.push('  ' + (idx + 1) + '. ' + it.nomorInvoice + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + it.merk : ''));
          lines.push('     *' + pjlPickupStatusMark_(it.statusPickup) + '*');
        });
        lines.push('');
        lines.push('  *Total: ' + g.items.length + ' invoice • ' + formatGram(totalGram) + '*');
        lines.push('');
      });
    });

    lines.push('');
    lines.push('*Note:*');
    lines.push('Barang yang masih belum dilakukan pickup:');
    lines.push('');
    const pending = jp.pending || [];
    if (!pending.length) {
      lines.push('(Tidak ada)');
    } else {
      pjlGroupByBuyer_(pending).forEach(function (g, gi) {
        lines.push((gi + 1) + '. ' + g.pembeli);
        lines.push('');
        g.items.forEach(function (it) {
          lines.push('   ' + it.nomorInvoice + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + it.merk : ''));
          lines.push('   Status: ' + pjlPickupStatusLabel_(it.statusPickup));
        });
        if (g.items.length > 1) {
          const totalGram = g.items.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
          lines.push('   Total: ' + g.items.length + ' invoice • ' + formatGram(totalGram));
        }
        lines.push('');
      });
    }
    lines.push('');
    lines.push('Demikian kami sampaikan, terima kasih atas perhatian dan kerja samanya.');
    return lines.join('\n');
  }

  // Format HTML rich-text (bold + hijau) — dipakai sebagai text/html saat
  // copy, supaya kalau ditempel ke Word/aplikasi rich-text formatnya tetap
  // terjaga.
  function pjlBuildJadwalHtmlRich_(jp, tanggalLabel) {
    const GREEN = '#1E9E5A';
    let html = '<div style="font-family:Arial,sans-serif; font-size:13px; color:#1a1a1a; line-height:1.5;">';
    html += '<div><b>VAULT ROOM ACTIVITY APPOINTMENT</b></div>';
    html += '<div><b>' + escapeHtmlAttr(tanggalLabel) + '</b></div>';
    html += '<div>&nbsp;</div>';
    html += '<div>Berikut kami sampaikan jadwal penggunaan Vault Room:</div>';
    html += '<div>&nbsp;</div>';
    (jp.slots || []).forEach(function (s) {
      const brinksItems = s.items.filter(function (it) { return it.metode === 'Brinks'; });
      const lainItems = s.items.filter(function (it) { return it.metode !== 'Brinks'; });
      if (!s.items.length) {
        html += '<div><b style="color:' + GREEN + ';">' + escapeHtmlAttr(s.label) + ':</b> Tersedia</div><div>&nbsp;</div>';
        return;
      }
      const title = s.label + (brinksItems.length ? ' — PICK UP BRINKS' : '');
      html += '<div><b style="color:' + GREEN + ';">' + escapeHtmlAttr(title) + '</b></div><div>&nbsp;</div>';
      pjlGroupByBuyer_(lainItems.concat(brinksItems)).forEach(function (g) {
        if (g.items.length <= 1) {
          const it = g.items[0];
          const mark = it.statusPickup === 'Selesai' ? ('<b style="color:' + GREEN + ';">✓ Selesai Diambil</b>') : '<b style="color:#B8860B;">Menunggu Pickup</b>';
          html += '<div>' + escapeHtmlAttr(it.pembeli) + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + '</div>';
          html += '<div>(' + escapeHtmlAttr(it.nomorInvoice) + ')</div><div>' + mark + '</div><div>&nbsp;</div>';
          return;
        }
        const totalGram = g.items.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
        html += '<div><b>' + escapeHtmlAttr(g.pembeli) + '</b></div><div>&nbsp;</div>';
        g.items.forEach(function (it, idx) {
          const mark = it.statusPickup === 'Selesai' ? ('<span style="color:' + GREEN + ';">✓ Selesai Diambil</span>') : '<span style="color:#B8860B;">Menunggu Pickup</span>';
          html += '<div style="margin-left:20px;">' + (idx + 1) + '. ' + escapeHtmlAttr(it.nomorInvoice) + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + ' — ' + mark + '</div>';
        });
        html += '<div>&nbsp;</div><div style="margin-left:20px;"><b>Total: ' + g.items.length + ' invoice • ' + formatGram(totalGram) + '</b></div><div>&nbsp;</div>';
      });
    });
    html += '<div>&nbsp;</div><div><b>Note:</b></div><div>Barang yang masih belum dilakukan pickup:</div><div>&nbsp;</div>';
    const pending = jp.pending || [];
    if (!pending.length) {
      html += '<div>(Tidak ada)</div>';
    } else {
      pjlGroupByBuyer_(pending).forEach(function (g, gi) {
        html += '<div>' + (gi + 1) + '. <b>' + escapeHtmlAttr(g.pembeli) + '</b></div><div>&nbsp;</div>';
        g.items.forEach(function (it) {
          html += '<div style="margin-left:20px;">' + escapeHtmlAttr(it.nomorInvoice) + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + '</div>';
          html += '<div style="margin-left:20px;">Status: ' + escapeHtmlAttr(pjlPickupStatusLabel_(it.statusPickup)) + '</div>';
        });
        if (g.items.length > 1) {
          const totalGram = g.items.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
          html += '<div style="margin-left:20px;">Total: ' + g.items.length + ' invoice • ' + formatGram(totalGram) + '</div>';
        }
        html += '<div>&nbsp;</div>';
      });

    html += '<div>&nbsp;</div><div>Demikian kami sampaikan, terima kasih atas perhatian dan kerja samanya.</div>';

  function copyJadwalPickup() {
    const data = pjlJadwalCache;
    if (!data) { showToast('Data jadwal belum dimuat', 'warning'); return; }
    const dateEl = document.getElementById('pjl-pickup-tanggal');
    const tanggalLabel = pjlHariTanggalLabel_(dateEl.value);
    const plainText = pjlBuildJadwalPlainWA_(data, tanggalLabel);
    const richHtml = pjlBuildJadwalHtmlRich_(data, tanggalLabel);

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = plainText;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, 999999);
      try {
        document.execCommand('copy');
        showToast('Jadwal pickup berhasil disalin.', 'success');
      } catch (e) {
        showToast('Gagal menyalin — coba lagi', 'error');
      }
      document.body.removeChild(ta);
    }

    if (navigator.clipboard && window.ClipboardItem) {
      try {
        const item = new ClipboardItem({
          'text/html': new Blob([richHtml], { type: 'text/html' }),
          'text/plain': new Blob([plainText], { type: 'text/plain' })
        });
        navigator.clipboard.write([item]).then(function () {
          showToast('Jadwal pickup berhasil disalin.', 'success');
        }).catch(fallbackCopy);
      } catch (e) {
        fallbackCopy();
      }
    } else {
      fallbackCopy();
    }
  }

  // Download PNG "Jadwal Pickup" (terpisah dari Download Penjualan) —
  // memakai tanggal aktif filter Jadwal Pickup & grouping per buyer yang
  // sama dengan Copy Jadwal.
  // Setiap elemen teks WAJIB punya class typography eksplisit sendiri
  // (pickup-buyer/pickup-invoice/pickup-total/dst) — TIDAK boleh
  // mengandalkan pewarisan ukuran font dari elemen induk, supaya ukuran
  // selalu identik di manapun elemen itu dipakai (Jadwal Pickup maupun
  // Barang Belum Dilakukan Pickup).
  function pjlRenderBuyerGroupsPrintHtml_(items) {
    return pjlGroupByBuyer_(items).map(function (g) {
      if (g.items.length <= 1) {
        const it = g.items[0];
        return '<div class="pickup-invoice">' + escapeHtmlAttr(it.pembeli) + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + ' (' + escapeHtmlAttr(it.nomorInvoice) + ') — ' + escapeHtmlAttr(pjlPickupStatusMark_(it.statusPickup)) + '</div>';
      }
      const totalGram = g.items.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
      const selesaiCount = g.items.filter(function (it) { return it.statusPickup === 'Selesai'; }).length;
      let html = '<div class="pickup-buyer">' + escapeHtmlAttr(g.pembeli) + '</div>';
      g.items.forEach(function (it, idx) {
        html += '<div class="pickup-invoice">' + (idx + 1) + '. ' + escapeHtmlAttr(it.nomorInvoice) + ' — ' + formatGram(it.qty) + (it.merk ? ' — ' + escapeHtmlAttr(it.merk) : '') + ' — ' + escapeHtmlAttr(pjlPickupStatusMark_(it.statusPickup)) + '</div>';
      });
      html += '<div class="pickup-total">Total: ' + g.items.length + ' invoice • ' + formatGram(totalGram) + ' · Selesai: ' + selesaiCount + ' · Belum selesai: ' + (g.items.length - selesaiCount) + '</div>';
      return html;
    }).join('');
  }

  function pjlBuildJadwalPrintHtml_(jp, tanggalLabel) {
    let html = '<div class="pickup-export"><div class="pjl-f1-banner">' +
      '<div class="pjl-f1-banner-left"><div class="pjl-f1-banner-icon"><span class="material-symbols-rounded">vault</span></div>' +

        html += '<div><span class="pickup-time">' + escapeHtmlAttr(s.label) + ':</span> <span class="pickup-available">Tersedia</span></div>';
      } else {

      html += '</div>';
    });
    html += '</div>';

    html += '<div class="pjl-f1-pickup-section"><div class="pickup-section-title">Barang Belum Dilakukan Pickup</div>';
    const pending = jp.pending || [];
    if (!pending.length) {
      html += '<div class="pickup-available">Tidak ada</div>';
    } else {
      pjlGroupByBuyer_(pending).forEach(function (g) {
        const totalGram = g.items.reduce(function (sum, it) { return sum + (Number(it.qty) || 0); }, 0);
        html += '<div class="pickup-buyer">' + escapeHtmlAttr(g.pembeli) + '</div>';

        });

    html += '</div>';

  // File Excel minimal 3 kolom (No. Invoice, Tanggal Pickup, Jam Pickup) —
  // cari baris header yang memuat ketiganya, baris kosong diabaikan.
  function pjlParseImportJadwalFile_(arrayBuffer) {
    if (typeof XLSX === 'undefined') throw new Error('Modul parser file (SheetJS) gagal dimuat.');
    const wb = XLSX.read(arrayBuffer, { type: 'array', codepage: 65001 });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, raw: false, defval: '' });

    let headerRowIdx = -1, colInv = -1, colTgl = -1, colJam = -1;
    for (let i = 0; i < Math.min(aoa.length, 10); i++) {
      const cells = (aoa[i] || []).map(function (c) { return String(c || '').trim().toLowerCase(); });
      const iIdx = cells.findIndex(function (c) { return c.indexOf('invoice') > -1; });
      const tIdx = cells.findIndex(function (c) { return c.indexOf('tanggal') > -1; });
      const jIdx = cells.findIndex(function (c) { return c.indexOf('jam') > -1; });
      if (iIdx > -1 && tIdx > -1 && jIdx > -1) { headerRowIdx = i; colInv = iIdx; colTgl = tIdx; colJam = jIdx; break; }
    }
    if (headerRowIdx === -1) throw new Error('Header "No. Invoice", "Tanggal Pickup", dan "Jam Pickup" tidak ditemukan pada file.');

    const rows = [];
    aoa.slice(headerRowIdx + 1).forEach(function (r) {
      if (!r) return;
      const nomorInvoice = String(r[colInv] || '').trim();
      const tanggal = String(r[colTgl] || '').trim();
      const jam = String(r[colJam] || '').trim();
      if (!nomorInvoice && !tanggal && !jam) return; // baris kosong diabaikan
      rows.push({ nomorInvoice: nomorInvoice, tanggal: tanggal, jam: jam });
    });
    return rows;
  }

  function pjlImportJadwalHandleFile_(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function (ev) {
      let rows;
      try {
        rows = pjlParseImportJadwalFile_(ev.target.result);
      } catch (err) {
        showToast(err.message || 'Gagal membaca file Excel.', 'error');
        return;
      }
      if (!rows.length) { showToast('File tidak berisi data.', 'warning'); return; }
      document.getElementById('pjl-import-jadwal-body').innerHTML = '<div class="recent-empty">Mencocokkan dengan data penjualan...</div>';
      google.script.run
        .withSuccessHandler(function (result) {
          pjlImportJadwalPreview_ = (result || []).map(function (r) { return Object.assign({ action: 'update' }, r); });
          pjlRenderImportJadwalPreview_();
        })
        .withFailureHandler(function (err) {
          showToast('Gagal memproses preview: ' + (err.message || err), 'error');
          document.getElementById('pjl-import-jadwal-body').innerHTML = '<div class="recent-empty">Gagal memuat preview.</div>';
        })
        .previewImportJadwalPickup(rows);
    };
    reader.onerror = function () { showToast('Gagal membaca file.', 'error'); };
    reader.readAsArrayBuffer(file);
  }

  function pjlImportJadwalStatusBadge_(status) {
    const map = {
      DITEMUKAN: ['green', 'DITEMUKAN'],
      SUDAH_ADA_JADWAL: ['gold', 'SUDAH ADA JADWAL'],
      TIDAK_DITEMUKAN: ['red', 'TIDAK DITEMUKAN'],
      DATA_TIDAK_VALID: ['red', 'TANGGAL/JAM TIDAK VALID']
    };
    const m = map[status] || ['gray', status];
    return '<span class="badge ' + m[0] + '">' + m[1] + '</span>';
  }

  function pjlImportJadwalSetAllAction_(action) {
    pjlImportJadwalPreview_.forEach(function (r) { if (r.status === 'SUDAH_ADA_JADWAL') r.action = action; });
    pjlRenderImportJadwalPreview_();
  }

  function pjlImportJadwalRowActionChange_(idx, action) {
    pjlImportJadwalPreview_[idx].action = action;
    pjlImportJadwalUpdateSubmitCount_();
  }

  function pjlImportJadwalCountToImport_() {
    return pjlImportJadwalPreview_.filter(function (r) {
      return r.status === 'DITEMUKAN' || (r.status === 'SUDAH_ADA_JADWAL' && r.action === 'update');
    }).length;
  }

  function pjlImportJadwalUpdateSubmitCount_() {
    const n = pjlImportJadwalCountToImport_();
    const btn = document.getElementById('pjl-import-jadwal-submit-btn');
    btn.disabled = n === 0;
    btn.innerHTML = '<span class="material-symbols-rounded">save</span> Import Jadwal (' + n + ')';
  }

  function pjlRenderImportJadwalPreview_() {
    const rows = pjlImportJadwalPreview_;
    const total = rows.length;
    const ditemukan = rows.filter(function (r) { return r.status === 'DITEMUKAN'; }).length;
    const sudahAda = rows.filter(function (r) { return r.status === 'SUDAH_ADA_JADWAL'; }).length;
    const tidakDitemukan = rows.filter(function (r) { return r.status === 'TIDAK_DITEMUKAN'; }).length;
    const tidakValid = rows.filter(function (r) { return r.status === 'DATA_TIDAK_VALID'; }).length;

    let html = '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px;">' +
      '<span class="badge gray">Total Data: ' + total + '</span>' +
      '<span class="badge green">Ditemukan: ' + ditemukan + '</span>' +
      '<span class="badge gold">Sudah Ada Jadwal: ' + sudahAda + '</span>' +
      '<span class="badge red">Tidak Ditemukan: ' + tidakDitemukan + '</span>' +
      (tidakValid ? '<span class="badge red">Tanggal/Jam Tidak Valid: ' + tidakValid + '</span>' : '') +
      '</div>';

    if (sudahAda) {
      html += '<div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; font-size:12px;">' +
        '<span style="color:var(--color-text-muted);">Invoice yang sudah punya jadwal:</span>' +
        '<button type="button" class="btn btn-secondary btn-sm" onclick="pjlImportJadwalSetAllAction_(\'update\')">Update Semua</button>' +
        '<button type="button" class="btn btn-secondary btn-sm" onclick="pjlImportJadwalSetAllAction_(\'skip\')">Lewati Semua</button>' +
        '</div>';
    }

    html += '<div style="max-height:340px; overflow:auto;"><table class="data-table">' +
      '<thead><tr><th>No. Invoice</th><th>Tanggal</th><th>Jam</th><th>Buyer</th><th>Merk</th><th>Status</th><th>Aksi</th></tr></thead><tbody>';
    if (!total) {
      html += '<tr><td colspan="7" class="recent-empty">Tidak ada data.</td></tr>';
    } else {
      rows.forEach(function (r, idx) {
        let aksiCell = '-';
        if (r.status === 'SUDAH_ADA_JADWAL') {
          aksiCell = '<select class="date-picker-input" style="font-size:11.5px; padding:4px 6px;" onchange="pjlImportJadwalRowActionChange_(' + idx + ', this.value)">' +
            '<option value="update"' + (r.action === 'update' ? ' selected' : '') + '>Update Jadwal</option>' +
            '<option value="skip"' + (r.action === 'skip' ? ' selected' : '') + '>Lewati</option>' +
            '</select>' +
            '<div style="font-size:10.5px; color:var(--color-text-muted); margin-top:2px;">Jadwal lama: ' + rkEsc_(r.jadwalLama || '-') + '</div>';
        }
        html += '<tr><td>' + rkEsc_(r.nomorInvoiceExcel) + '</td><td>' + rkEsc_(r.tanggal || '-') + '</td><td>' + rkEsc_(r.jam || '-') + '</td>' +
          '<td>' + rkEsc_(r.pembeli || '-') + '</td><td>' + rkEsc_(r.merk || '-') + '</td>' +
          '<td>' + pjlImportJadwalStatusBadge_(r.status) + '</td><td>' + aksiCell + '</td></tr>';
      });
    }
    html += '</tbody></table></div>';

    document.getElementById('pjl-import-jadwal-body').innerHTML = html;
    pjlImportJadwalUpdateSubmitCount_();
  }

  var pjlImportJadwalSubmitting_ = false;

  function pjlImportJadwalSubmit_() {
    if (pjlImportJadwalSubmitting_) return; // cegah double submit
    const toImport = pjlImportJadwalPreview_
      .filter(function (r) { return r.status === 'DITEMUKAN' || (r.status === 'SUDAH_ADA_JADWAL' && r.action === 'update'); })
      .map(function (r) { return { id: r.id, tanggal: r.tanggal, jam: r.jam }; });
    if (!toImport.length) { showToast('Tidak ada data yang akan diimpor.', 'warning'); return; }

    pjlImportJadwalSubmitting_ = true;
    const btn = document.getElementById('pjl-import-jadwal-submit-btn');
    setButtonLoading(btn, true);
    google.script.run
      .withSuccessHandler(function (result) {
        pjlImportJadwalSubmitting_ = false;
        setButtonLoading(btn, false);
        showToast((result.doneCount || 0) + ' jadwal pickup berhasil diimpor.' + (result.failedCount ? ' (' + result.failedCount + ' gagal)' : ''), result.failedCount ? 'warning' : 'success');
        pjlCloseImportJadwalModal();
        loadPenjualanHistoryTable();
        loadJadwalPickup();
      })
      .withFailureHandler(function (err) {
        pjlImportJadwalSubmitting_ = false;
        setButtonLoading(btn, false);
        showToast('Gagal mengimpor jadwal: ' + (err.message || err), 'error');
      })
      .importJadwalPickupMassal(toImport);
  }

  // ---------- B. Pickup Massal ----------

  var pjlPmData_ = [];        // seluruh invoice belum selesai pickup dari server
  var pjlPmSelected_ = {};    // {id: true}

  function pjlOpenPickupMassalModal() {
    pjlPmSelected_ = {};
    document.getElementById('pjl-pm-search').value = '';
    document.getElementById('pjl-pm-body').innerHTML = '<tr><td colspan="7" class="recent-empty">Memuat...</td></tr>';
    document.getElementById('pjl-pm-select-all').checked = false;
    document.getElementById('pjl-pickup-massal-modal-overlay').style.display = 'flex';
    google.script.run
      .withSuccessHandler(function (list) {
        pjlPmData_ = list || [];
        pjlPickupMassalBuildFilterOptions_();
        pjlPickupMassalRender_();
      })
      .withFailureHandler(function (err) {
        showToast('Gagal memuat data pickup: ' + (err.message || err), 'error');
        document.getElementById('pjl-pm-body').innerHTML = '<tr><td colspan="7" class="recent-empty">Gagal memuat data.</td></tr>';
      })
      .getPenjualanBelumSelesaiPickup();
  }

  function pjlClosePickupMassalModal() {
    document.getElementById('pjl-pickup-massal-modal-overlay').style.display = 'none';
  }

  function pjlPickupMassalBuildFilterOptions_() {
    const buyerSel = document.getElementById('pjl-pm-filter-buyer');
    const merkSel = document.getElementById('pjl-pm-filter-merk');
    const buyers = Array.from(new Set(pjlPmData_.map(function (r) { return r.pembeli; }).filter(Boolean))).sort();
    const merks = Array.from(new Set(pjlPmData_.map(function (r) { return r.merk; }).filter(Boolean))).sort();
    buyerSel.innerHTML = '<option value="">Semua Buyer</option>' + buyers.map(function (b) { return '<option value="' + rkEsc_(b) + '">' + rkEsc_(b) + '</option>'; }).join('');
    merkSel.innerHTML = '<option value="">Semua Merk</option>' + merks.map(function (m) { return '<option value="' + rkEsc_(m) + '">' + rkEsc_(m) + '</option>'; }).join('');
  }

  function pjlPickupMassalJadwalLabel_(r) {
    if (!r.tanggalPengambilan) return 'Belum Dijadwalkan';
    return r.tanggalPengambilan + (r.jamPengambilan ? ' ' + r.jamPengambilan : '');
  }

  function pjlPickupMassalLamaMenunggu_(tanggalStr) {
    if (!tanggalStr) return '-';
    const d = new Date(tanggalStr + 'T00:00:00');
    const diff = Math.max(0, Math.floor((new Date() - d) / 86400000));
    return diff + ' hari';
  }

  function pjlPickupMassalFilteredRows_() {
    const q = (document.getElementById('pjl-pm-search').value || '').trim().toLowerCase();
    const buyer = document.getElementById('pjl-pm-filter-buyer').value;
    const merk = document.getElementById('pjl-pm-filter-merk').value;
    return pjlPmData_.filter(function (r) {
      if (buyer && r.pembeli !== buyer) return false;
      if (merk && r.merk !== merk) return false;
      if (q) {
        const hay = (String(r.nomorInvoice || '') + ' ' + String(r.pembeli || '')).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function pjlPickupMassalToggleRow_(id, checked) {
    if (checked) pjlPmSelected_[id] = true; else delete pjlPmSelected_[id];
    pjlPickupMassalUpdateSummary_();
  }

  function pjlPickupMassalToggleAll_(checked) {
    pjlPickupMassalFilteredRows_().forEach(function (r) {
      if (checked) pjlPmSelected_[r.id] = true; else delete pjlPmSelected_[r.id];
    });
    pjlPickupMassalRender_();
  }

  function pjlPickupMassalUpdateSummary_() {
    const selectedRows = pjlPmData_.filter(function (r) { return pjlPmSelected_[r.id]; });
    const totalGram = selectedRows.reduce(function (s, r) { return s + (Number(r.qty) || 0); }, 0);
    document.getElementById('pjl-pm-summary').textContent = selectedRows.length + ' invoice dipilih • ' + formatGram(totalGram);
    const btn = document.getElementById('pjl-pm-submit-btn');
    btn.disabled = selectedRows.length === 0;
    btn.innerHTML = '<span class="material-symbols-rounded">task_alt</span> Selesaikan Pickup (' + selectedRows.length + ')';
  }

  function pjlPickupMassalRender_() {
    const rows = pjlPickupMassalFilteredRows_();
    const tbody = document.getElementById('pjl-pm-body');
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="recent-empty">Tidak ada invoice yang cocok.</td></tr>';
    } else {
      tbody.innerHTML = rows.map(function (r) {
        const checked = pjlPmSelected_[r.id] ? ' checked' : '';
        return '<tr>' +
          '<td><input type="checkbox" onchange="pjlPickupMassalToggleRow_(\'' + r.id + '\', this.checked)"' + checked + '></td>' +
          '<td>' + rkEsc_(r.nomorInvoice) + '</td>' +
          '<td>' + rkEsc_(r.pembeli) + '</td>' +
          '<td>' + rkEsc_(r.merk) + '</td>' +
          '<td>' + formatGram(r.qty) + '</td>' +
          '<td>' + rkEsc_(pjlPickupMassalJadwalLabel_(r)) + '</td>' +
          '<td>' + pjlPickupMassalLamaMenunggu_(r.tanggal) + '</td>' +
          '</tr>';
      }).join('');
    }
    const allChecked = rows.length > 0 && rows.every(function (r) { return pjlPmSelected_[r.id]; });
    document.getElementById('pjl-pm-select-all').checked = allChecked;
    pjlPickupMassalUpdateSummary_();
  }

  var pjlPickupMassalSubmitting_ = false;

  function pjlPickupMassalSubmit_() {
    if (pjlPickupMassalSubmitting_) return; // cegah double submit
    const selectedRows = pjlPmData_.filter(function (r) { return pjlPmSelected_[r.id]; });
    if (!selectedRows.length) return;
    const ids = selectedRows.map(function (r) { return r.id; });
    const totalGram = selectedRows.reduce(function (s, r) { return s + (Number(r.qty) || 0); }, 0);

    pjlShowConfirm(
      'Selesaikan pickup untuk ' + selectedRows.length + ' invoice dengan total ' + formatGram(totalGram) + '? Tanggal & waktu pickup akan memakai waktu saat ini.',
      function () {
        if (pjlPickupMassalSubmitting_) return;
        pjlPickupMassalSubmitting_ = true;
        const btn = document.getElementById('pjl-pm-submit-btn');
        setButtonLoading(btn, true);
        google.script.run
          .withSuccessHandler(function (result) {
            pjlPickupMassalSubmitting_ = false;
            setButtonLoading(btn, false);
            showToast('Pickup berhasil diselesaikan untuk ' + (result.doneCount || 0) + ' invoice dengan total ' + formatGram(result.totalGram || 0) + '.', 'success');
            pjlClosePickupMassalModal();
            loadPenjualanHistoryTable();
            loadJadwalPickup();
          })
          .withFailureHandler(function (err) {
            pjlPickupMassalSubmitting_ = false;
            setButtonLoading(btn, false);
            showToast('Gagal menyelesaikan pickup: ' + (err.message || err), 'error');
          })
          .selesaikanPickupMassal(ids);
      },
      'Ya, Selesaikan Pickup'
    );
  }

  function pickupBatalkanJadwal() {
    const id = document.getElementById('pickup-modal-id').value;
    if (!id) return;
    google.script.run
      .withSuccessHandler(function () {
        showToast('Jadwal pickup dibatalkan', 'success');
        closePickupModal();
        loadPenjualanHistoryTable();
        loadJadwalPickup();
      })
      .withFailureHandler(function (err) { showToast('Gagal: ' + (err.message || err), 'error'); })
      .batalkanPickup(id);
  }

  // ============================================================
  // HALAMAN ANALYTICS — AI INSIGHT
  // ============================================================
  function loadAnalyticsPage() {
    const box = document.getElementById('insight-grid');
    box.innerHTML = '<div class="recent-empty">Memuat...</div>';
    google.script.run
      .withSuccessHandler(function (list) {
        list = list || [];
        if (!list.length) { box.innerHTML = '<div class="recent-empty">Belum ada data untuk dianalisis</div>'; return; }
        box.innerHTML = list.map(function (ins) {
          return '<div class="card insight-card">' +
            '<div class="insight-icon"><span class="material-symbols-rounded">' + ins.icon + '</span></div>' +
            '<div><div class="insight-title">' + ins.title + '</div><div class="insight-text">' + ins.text + '</div></div>' +
            '</div>';
        }).join('');
      })
      .withFailureHandler(handleLoadError)
      .getAiInsights();
  }

  // ============================================================
  // HALAMAN LAPORAN HARIAN
  // ============================================================
  function loadLaporanHarian() {
    const dateEl = document.getElementById('lap-date-picker');
    if (dateEl && !dateEl.value) dateEl.value = todayISO();
    const selDate = dateEl ? dateEl.value : null;

    ['lap-sumberdata-body', 'lap-piutang-body', 'lap-penetapan-body'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<tr><td colspan="5" class="recent-empty">Memuat...</td></tr>';
    });
    ['lap-penjualan-body', 'lap-pembelian-body'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.innerHTML = '<tr><td colspan="6" class="recent-empty">Memuat...</td></tr>';
    });
    document.getElementById('lap-text-output').value = 'Memuat...';

    google.script.run
      .withSuccessHandler(renderLaporanHarian)
      .withFailureHandler(handleLoadError)
      .getLaporanHarianData(selDate);

    google.script.run
      .withSuccessHandler(function (text) { document.getElementById('lap-text-output').value = text; })
      .withFailureHandler(function (err) {
        document.getElementById('lap-text-output').value = 'Gagal memuat teks laporan: ' + (err.message || err);
        handleLoadError(err);
      })
      .generateLaporanHarianText(selDate);
  }

  // Isi 1 kartu KPI transaksi (Rp besar + subtext gram & jumlah trx).
  // prefix menentukan set ID: 'lap-kpi-' (tampilan utama) atau 'lap-sum-' (Summary).
  function fillLapTxCard(prefix, key, cat) {
    const valueEl = document.getElementById(prefix + key);
    if (valueEl) valueEl.textContent = formatRupiah(cat.nominal);
    const subEl = document.getElementById(prefix + key + '-sub');
    if (subEl) subEl.innerHTML = '<span>' + formatGram(cat.gram) + '</span><span><b>' + cat.count + '</b> trx</span>';
  }

  function fillLapKpiCards(prefix, data) {
    fillLapTxCard(prefix, 'penjualan-trading', data.penjualan.trading);
    fillLapTxCard(prefix, 'pembelian-trading', data.pembelian.trading);
    fillLapTxCard(prefix, 'penjualan-etf', data.penjualan.etf);
    fillLapTxCard(prefix, 'pembelian-etf', data.pembelian.etf);
    fillLapTxCard(prefix, 'penjualan-total', data.penjualan.total);
    fillLapTxCard(prefix, 'pembelian-total', data.pembelian.total);
  }

  function lapKategoriBadge(kategori) {
    return '<span class="badge ' + (kategori === 'ETF' ? 'gold' : 'green') + '" style="font-size:10px;">' + kategori + '</span>';
  }

  function renderLapPenjualanRows(rows) {
    if (!rows.length) return '<tr><td colspan="6" class="recent-empty">Belum ada penjualan hari ini</td></tr>';
    const totalGram = rows.reduce((s, r) => s + Number(r.Qty || 0), 0);
    const totalNominal = rows.reduce((s, r) => s + Number(r.TotalHarga || 0), 0);
    let html = rows.map(function (r) {
      return '<tr><td>' + r.NomorInvoice + '</td><td>' + formatRupiah(r.HargaPerGram) + '</td><td>' + formatGram(r.Qty) +
        '</td><td>' + formatRupiah(r.TotalHarga) + '</td><td>' + r.Pembeli + '</td><td>' + lapKategoriBadge(r.Kategori) + '</td></tr>';
    }).join('');
    html += '<tr style="background:var(--color-gold-soft); font-weight:700;"><td>Total</td><td>-</td><td>' + formatGram(totalGram) +
      '</td><td>' + formatRupiah(totalNominal) + '</td><td></td><td></td></tr>';
    return html;
  }

  function renderLapPembelianRows(rows) {
    if (!rows.length) return '<tr><td colspan="6" class="recent-empty">Belum ada pembelian hari ini</td></tr>';
    const totalGram = rows.reduce((s, r) => s + Number(r.Qty || 0), 0);
    const totalNominal = rows.reduce((s, r) => s + Number(r.TotalHarga || 0), 0);
    let html = rows.map(function (r) {
      return '<tr><td>' + r.NomorPO + '</td><td>' + formatRupiah(r.AfterDiskon) + '</td><td>' + formatGram(r.Qty) +
        '</td><td>' + formatRupiah(r.TotalHarga) + '</td><td>' + r.Seller + '</td><td>' + lapKategoriBadge(r.Kategori) + '</td></tr>';
    }).join('');
    html += '<tr style="background:var(--color-gold-soft); font-weight:700;"><td>Total</td><td>-</td><td>' + formatGram(totalGram) +
      '</td><td>' + formatRupiah(totalNominal) + '</td><td></td><td></td></tr>';
    return html;
  }

  var lapTanggalLabel = '';
  function renderLaporanHarian(data) {
    if (!data) return;
    lapTanggalLabel = data.tanggalLabel;
    const printDateEl = document.getElementById('lap-print-date');
    if (printDateEl) printDateEl.textContent = data.tanggalLabel;

    fillLapKpiCards('lap-kpi-', data);

    // --- Sumber Data ---
    const sdBody = document.getElementById('lap-sumberdata-body');
    if (!data.sumberData.length) {
      sdBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Belum ada input harga hari ini</td></tr>';
    } else {
      sdBody.innerHTML = data.sumberData.map(function (r) {
        const isUsd = r.nama === 'LBMA H-1' || r.nama === 'Kitco H-1';
        const fmt = isUsd ? formatUsd : formatRupiah;
        return '<tr><td><b>' + r.nama + '</b></td><td>' + fmt(r.harga1) + '</td><td>' + fmt(r.harga2) +
          '</td><td>' + fmt(r.harga3) + '</td><td>' + fmt(r.harga4) + '</td></tr>';
      }).join('');
    }

    // --- Piutang ---
    const ptBody = document.getElementById('lap-piutang-body');
    if (!data.piutang.rows.length) {
      ptBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Tidak ada piutang aktif</td></tr>';
    } else {
      let html = data.piutang.rows.map(function (r) {
        return '<tr><td><b>' + r.supplierNama + '</b></td><td>' + formatGram(r.gramasi) + '</td><td>' + r.gramasiPercent.toFixed(2) + '%</td>' +
          '<td>' + formatRupiah(r.valuasi) + '</td><td>' + r.valuasiPercent.toFixed(2) + '%</td></tr>';
      }).join('');
      html += '<tr style="background:var(--color-gold-soft); font-weight:700;"><td>Total Piutang</td><td>' + formatGram(data.piutang.totalGramasi) +
        '</td><td>100%</td><td>' + formatRupiah(data.piutang.totalValuasi) + '</td><td>100%</td></tr>';
      ptBody.innerHTML = html;
    }

    // --- Penetapan Harga (tanpa Margin Rata-rata / Profit Margin) ---
    const psBody = document.getElementById('lap-penetapan-body');
    function fourCols(vals) {
      const arr = [0, 1, 2, 3].map(i => vals[i] || 0);
      return arr.map(v => '<td>' + (v ? formatRupiah(v) : '-') + '</td>').join('');
    }
    if (!data.penetapanHarga.saleVals.length && !data.penetapanHarga.buybackVals.length) {
      psBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Belum ada penetapan harga hari ini</td></tr>';
    } else {
      psBody.innerHTML =
        '<tr><td><b>Sale</b></td>' + fourCols(data.penetapanHarga.saleVals) + '</tr>' +
        '<tr><td><b>Buyback</b></td>' + fourCols(data.penetapanHarga.buybackVals) + '</tr>';
    }

  function findSumberDataHarga(sumberData, nama) {
    const row = (sumberData || []).find(function (r) { return r.nama === nama; });
    if (!row) return null;
    const vals = [row.harga1, row.harga2, row.harga3, row.harga4].filter(function (v) { return v; });
    return vals.length ? vals[vals.length - 1] : null;

  let kbLastData_ = null;

  function getKbMonthPickerValue_() {
    const el = document.getElementById('kb-month-picker');

  function loadKinerjaBulananPage() {
    const monthVal = getKbMonthPickerValue_();
    if (!monthVal) return;
    const parts = monthVal.split('-');
    const year = Number(parts[0]), month = Number(parts[1]);

    document.getElementById('kb-input-body').innerHTML = '<tr><td colspan="5" class="recent-empty">Memuat...</td></tr>';
    document.getElementById('kb-analisis-body').innerHTML = '<tr><td colspan="4" class="recent-empty">Memuat...</td></tr>';

    google.script.run
      .withSuccessHandler(renderKinerjaBulananPage)
      .withFailureHandler(handleLoadError)
      .getKinerjaBulananData(year, month);
  }

  function kbFormatValue_(val, satuan) {
    if (val === null || val === undefined || val === '') return null;
    if (satuan === 'Rp') return formatRupiah(val);
    if (satuan === 'g') return formatGram(val);
    if (satuan === '%') return (Number(val) * 100).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + '%';
    if (satuan === 'kali') return Number(val).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + 'x';
    return Number(val).toLocaleString('id-ID', { maximumFractionDigits: 2 });
  }

  function renderKinerjaBulananPage(data) {
    kbLastData_ = data;
    if (!data) return;

    const ytdHeader = 'YTD (' + (data.ytdLabel || 'Jan–' + data.periodeLabel) + ')';
    const ytdThInput = document.getElementById('kb-input-ytd-th');
    const ytdThAnalisis = document.getElementById('kb-analisis-ytd-th');
    if (ytdThInput) ytdThInput.textContent = ytdHeader;
    if (ytdThAnalisis) ytdThAnalisis.textContent = ytdHeader;

    const inputBody = document.getElementById('kb-input-body');
    inputBody.innerHTML = data.indikator.map(function (ind) {
      const isManual = ind.source === 'manual';
      const displayVal = kbFormatValue_(ind.value, ind.satuan);
      const displayValYtd = kbFormatValue_(ind.valueYtd, ind.satuan);
      const valueCell = isManual
        ? '<input type="text" class="kb-manual-input" data-key="' + ind.key + '" value="' + (ind.value || 0) + '" style="width:120px; text-align:right;">'
        : '<b>' + (displayVal === null ? '-' : displayVal) + '</b>';
      const ytdCell = ind.key === 'stokAkhir'
        ? '<span title="Stok akhir = saldo/posisi, YTD-nya sama dengan kolom Bulan">' + (displayValYtd === null ? '-' : displayValYtd) + '</span>'
        : (displayValYtd === null ? '-' : displayValYtd);
      const labelCell = ind.label + (ind.sourceLabel ? '<div style="font-size:10.5px; color:var(--color-text-muted); font-weight:400; margin-top:2px;">' + (isManual ? '' : 'AUTO · ') + ind.sourceLabel + '</div>' : '');
      return '<tr' + (isManual ? ' style="background:var(--color-gold-soft);"' : '') + '>' +
        '<td>' + ind.no + '</td><td>' + labelCell + '</td><td>' + valueCell + '</td><td>' + ytdCell + '</td><td>' + ind.satuan + '</td></tr>';
    }).join('');

    const analisisBody = document.getElementById('kb-analisis-body');
    analisisBody.innerHTML = data.analisis.map(function (a) {
      if (a.pending) {
        const pendingCell = '<span style="color:var(--color-text-muted); font-style:italic;" title="' + (a.pendingNote || '').replace(/"/g, '&quot;') + '">Data belum tersedia</span>';
        return '<tr><td>' + a.label + '</td><td>' + pendingCell + '</td><td>' + pendingCell + '</td><td>' + a.satuan + '</td></tr>';
      }
      const displayVal = kbFormatValue_(a.value, a.satuan);
      const displayValYtd = kbFormatValue_(a.valueYtd, a.satuan);
      return '<tr><td>' + a.label + '</td><td><b>' + (displayVal === null ? '-' : displayVal) + '</b></td><td><b>' + (displayValYtd === null ? '-' : displayValYtd) + '</b></td><td>' + a.satuan + '</td></tr>';
    }).join('');

    document.getElementById('kb-manual-saved-hint').textContent = data.manualUpdatedAt
      ? 'Data manual terakhir disimpan: ' + new Date(data.manualUpdatedAt).toLocaleString('id-ID') + (data.manualUpdatedBy ? ' oleh ' + data.manualUpdatedBy : '')
      : 'Data manual bulan ini belum pernah diisi.';
  }

  function saveKinerjaBulananManual() {
    if (!kbLastData_) return;
    const inputs = document.querySelectorAll('.kb-manual-input');
    const payload = {};
    inputs.forEach(function (el) {
      payload[el.dataset.key] = parseFloat(String(el.value || '0').replace(/[^0-9.-]/g, '')) || 0;
    });
    google.script.run
      .withSuccessHandler(function () {
        showToast('Data manual Kinerja Bulanan berhasil disimpan', 'success');
        loadKinerjaBulananPage();
      })
      .withFailureHandler(handleLoadError)
      .saveKinerjaBulananManual(kbLastData_.periode, payload);
  }

  function downloadKinerjaBulananExcel() {
    if (!kbLastData_) return;
    const btn = document.getElementById('kb-download-btn');
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function (result) {
        btn.disabled = false;
        if (!result || !result.base64) { showToast('Gagal membuat file Excel', 'error'); return; }
        const byteChars = atob(result.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const blob = new Blob([new Uint8Array(byteNumbers)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = result.filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Kinerja Bulanan (Excel) berhasil diunduh', 'success');
      })
      .withFailureHandler(function (err) { btn.disabled = false; handleLoadError(err); })
      .exportKinerjaBulananExcel(kbLastData_.tahun, kbLastData_.bulan);
  }

  function formatNarrativeHtml(text) {

        html += '<div class="mo-insight-title">' + line + '</div>';
      } else {
        html += '<p>' + line + '</p>';
      }
    });
    return html;
  }
