<script>
  // ============================================================
  // SPA NAVIGATION
  // ============================================================
  // Nama fungsi loader per halaman — dipakai LAZY (lewat window[...]())
  // baik oleh showPage() maupun oleh pemilihan tema (untuk memuat ulang
  // halaman yang sedang aktif supaya grafiknya ikut warna tema baru).
  // Pakai nama-string (bukan referensi fungsi langsung) karena banyak
  // fungsi loadXxxPage() baru didefinisikan di <script> lain di bawah —
  // referensi langsung di sini akan gagal (belum ter-hoist lintas tag).
  const PAGE_LOADER_NAMES_ = {
    'dashboard': 'loadDashboard',
    'laporan-harian': 'loadLaporanHarian',
    'kinerja-bulanan': 'loadKinerjaBulananPage',
    'laporan-etf': 'loadLaporanEtf',
    'laporan-rekap-egr': 'initLaporanRekapEgrPage',
    'egr-perbandingan': 'loadEgrPerbandingan',
    'laporan-bulanan': 'loadLaporanBulanan',
    'daily-trading': 'loadDailyTradingPage',
    'piutang': 'loadPiutangPage',
    'piutang-egr': 'loadPiutangEgrPage',
    'monitoring-pks': 'loadMonitoringPksPage',
    'penetapan-harga': 'loadPenetapanHargaPage',
    'print-penetapan-harga': 'loadPrintPenetapanHarga',
    'pembelian': 'loadPembelianPage',
    'invoice': 'loadInvoicePage',
    'history': 'loadAuditTrail',
    'kpi': 'loadKpiPage',
    'settings': 'loadSettingsPage',
    'supplier-price': 'loadSupplierPriceTrend',
    'profile-mitra': 'loadMitraList',
    'penjualan': 'loadPenjualanPage',
    'analytics': 'loadAnalyticsPage',
    'rundown-hut': 'loadRundownHutPage',
    'laporan-buyer-trading': 'loadLaporanBuyerTrading',
    'laporan-buyer-egr': 'loadLaporanBuyerEgr',
    'laporan-supplier-bulanan': 'initLaporanSupplierBulananPage',
    'rekonsiliasi-pembayaran': 'loadRekonsiliasiPembayaran'
  };

  function callPageLoader_(pageId) {
    const name = PAGE_LOADER_NAMES_[pageId];
    if (name && typeof window[name] === 'function') window[name]();
  }

  function showPage(pageId, navEl) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');

    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if (navEl) navEl.classList.add('active');

    document.querySelector('.sidebar').classList.remove('open');

    callPageLoader_(pageId);
  }

  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
  }

  // ============================================================
  // TEMA APLIKASI — 6 pilihan (Terang, Gelap, + 4 tema baru).
  // CSS variable-driven (lihat :root & [data-theme="..."] di Styles.html).
  // Disimpan di localStorage supaya tetap dipakai setelah refresh/tutup
  // aplikasi/pindah menu. Default: Terang, kalau belum ada preferensi.
  // ============================================================
  const THEME_STORAGE_KEY_ = 'gtms-theme';
  const THEME_LIST_ = [
    { id: 'light', name: 'Terang', icon: 'light_mode', swatches: ['#F5F7F8', '#046A38', '#C9A227'] },
    { id: 'dark', name: 'Gelap', icon: 'dark_mode', swatches: ['#0F1720', '#1E9E5A', '#E8C766'] },
    { id: 'dark-navy-gold', name: 'Dark Navy + Gold', icon: 'dark_mode', swatches: ['#F4F6F9', '#142B4A', '#C9A227'] },
    { id: 'emerald-soft-gold', name: 'Emerald + Soft Gold', icon: 'dark_mode', swatches: ['#F2F7F4', '#006B3C', '#D4AF37'] },
    { id: 'charcoal-gold', name: 'Charcoal + Gold', icon: 'dark_mode', swatches: ['#171A1F', '#22262D', '#D6B35A'] },
    { id: 'cream-forest-green', name: 'Cream + Forest Green', icon: 'dark_mode', swatches: ['#F7F3E8', '#075E3B', '#B9913B'] }
  ];

  function getActiveThemeId_() {
    return document.documentElement.getAttribute('data-theme') || 'light';
  }

  /** Baca 1 CSS variable tema aktif (pakai cssColor() yang sudah ada,
   *  ditambah fallback) — dipakai Chart.js supaya warna grafik ikut tema. */
  function themeVar_(name, fallback) {
    const v = cssColor(name);
    return v || fallback;
  }

  /**
   * Set default global Chart.js (warna teks/legend/grid/tooltip) dari
   * token tema aktif. Berlaku untuk SEMUA chart yang tidak override
   * warna itu sendiri secara eksplisit — jadi grafik baru maupun lama
   * otomatis kontras di 6 tema, tanpa perlu edit tiap definisi chart.
   */
  function applyChartJsThemeDefaults_() {
    if (typeof Chart === 'undefined') return;
    const textMuted = themeVar_('--color-text-muted', '#6B7684');
    const border = themeVar_('--color-border', '#E7EAEE');
    const surface = themeVar_('--color-surface', '#FFFFFF');
    const text = themeVar_('--color-text', '#1B2430');

    Chart.defaults.color = textMuted;
    Chart.defaults.borderColor = border;
    if (Chart.defaults.plugins && Chart.defaults.plugins.legend && Chart.defaults.plugins.legend.labels) {
      Chart.defaults.plugins.legend.labels.color = textMuted;
    }
    if (Chart.defaults.plugins && Chart.defaults.plugins.tooltip) {
      Chart.defaults.plugins.tooltip.backgroundColor = surface;
      Chart.defaults.plugins.tooltip.titleColor = text;
      Chart.defaults.plugins.tooltip.bodyColor = text;
      Chart.defaults.plugins.tooltip.borderColor = border;
      Chart.defaults.plugins.tooltip.borderWidth = 1;
    }
  }

  function renderThemePickerList_() {
    const wrap = document.getElementById('theme-picker-list');
    if (!wrap) return;
    const activeId = getActiveThemeId_();
    wrap.innerHTML = THEME_LIST_.map(function (t) {
      const active = t.id === activeId;
      return '<div class="theme-picker-item' + (active ? ' active' : '') + '" onclick="selectTheme(\'' + t.id + '\')">' +
        '<div class="theme-picker-swatches">' + t.swatches.map(function (c) { return '<span style="background:' + c + '"></span>'; }).join('') + '</div>' +
        '<div class="theme-picker-name">' + t.name + '</div>' +
        '<span class="material-symbols-rounded theme-picker-check">' + (active ? 'check' : '') + '</span>' +
        '</div>';
    }).join('');
  }

  /**
   * Terapkan 1 tema: set atribut data-theme (CSS ikut berubah realtime
   * lewat cascade variable, tanpa refresh), simpan ke localStorage,
   * update ikon & daftar popover, set ulang default warna Chart.js, dan
   * (kalau bukan saat init pertama kali) muat ulang halaman yang sedang
   * aktif supaya grafik yang SUDAH terlanjur digambar ikut warna baru
   * (Chart.js tidak reaktif otomatis terhadap perubahan CSS variable
   * setelah chart dibuat).
   */
  function applyTheme_(themeId, opts) {
    opts = opts || {};
    document.documentElement.setAttribute('data-theme', themeId);
    try { localStorage.setItem(THEME_STORAGE_KEY_, themeId); } catch (e) {}

    const iconEl = document.getElementById('theme-icon');
    if (iconEl) {
      const t = THEME_LIST_.find(function (x) { return x.id === themeId; });
      iconEl.textContent = (t && t.icon) || (themeId === 'light' ? 'light_mode' : 'dark_mode');
    }
    renderThemePickerList_();
    applyChartJsThemeDefaults_();

    if (!opts.skipReload) {
      const activeSection = document.querySelector('.page.active');
      if (activeSection) callPageLoader_(activeSection.id.replace(/^page-/, ''));
    }
  }

  function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_STORAGE_KEY_); } catch (e) {}
    const valid = THEME_LIST_.some(function (t) { return t.id === saved; });
    applyTheme_(valid ? saved : 'light', { skipReload: true });
  }

  function toggleThemePicker(evt) {
    if (evt) evt.stopPropagation();
    const menu = document.getElementById('theme-picker-menu');
    if (menu) menu.classList.toggle('open');
  }

  function selectTheme(themeId) {
    applyTheme_(themeId);
    const menu = document.getElementById('theme-picker-menu');
    if (menu) menu.classList.remove('open');
  }

  document.addEventListener('click', function (e) {
    const menu = document.getElementById('theme-picker-menu');
    const wrap = document.getElementById('theme-picker-wrap');
    if (menu && menu.classList.contains('open') && wrap && !wrap.contains(e.target)) {
      menu.classList.remove('open');
    }
  });

  // ============================================================
  // KONFIRMASI GENERIK — pengganti browser confirm()/alert(), yang
  // terbukti tidak reliable (silently blocked) di sandboxed iframe Apps
  // Script. Pakai modal sendiri: pjlShowConfirm(message, onConfirm).
  // ============================================================
  var pjlConfirmCallback_ = null;
  function pjlShowConfirm(message, onConfirm, okLabel) {
    document.getElementById('generic-confirm-message').textContent = message;
    document.getElementById('generic-confirm-ok-btn').textContent = okLabel || 'Ya';
    pjlConfirmCallback_ = onConfirm;
    document.getElementById('generic-confirm-overlay').style.display = 'flex';
  }
  function pjlGenericConfirmOk_() {
    document.getElementById('generic-confirm-overlay').style.display = 'none';
    const cb = pjlConfirmCallback_;
    pjlConfirmCallback_ = null;
    if (cb) cb();
  }
  function pjlGenericConfirmCancel_() {
    document.getElementById('generic-confirm-overlay').style.display = 'none';
    pjlConfirmCallback_ = null;
  }

  // ============================================================
  // TOAST NOTIFICATION
  // ============================================================
  function showToast(message, type) {
    type = type || 'success';
    const container = document.getElementById('toast-container');
    const icons = { success: 'check_circle', error: 'error', warning: 'warning' };
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML =
      '<span class="material-symbols-rounded" style="font-size:18px;">' + (icons[type] || 'info') + '</span>' +
      '<span>' + message + '</span>';
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  // ============================================================
  // FORMATTER
  // ============================================================
  function formatRupiah(num) {
    num = Number(num) || 0;
    return 'Rp' + num.toLocaleString('id-ID', { maximumFractionDigits: 0 });
  }
  function formatRupiahSigned(num) {
    num = Number(num) || 0;
    const sign = num > 0 ? '+' : (num < 0 ? '-' : '');
    return sign + formatRupiah(Math.abs(num));
  }
  function formatRupiahShort(num) {
    num = Number(num) || 0;
    const abs = Math.abs(num);
    if (abs >= 1e9) return 'Rp' + (num / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M';
    if (abs >= 1e6) return 'Rp' + (num / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
    return formatRupiah(num);
  }
  function formatGram(num) {
    num = Number(num) || 0;
    return num.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gr';
  }
  function formatUsd(num) {
    num = Number(num) || 0;
    return '$' + Math.round(num).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  /**
   * Dipasang di oninput field harga (currency formatter).
   * Membersihkan non-digit lalu format dengan pemisah ribuan ID.
   */
  function formatCurrencyInput(el) {
    const raw = el.value.replace(/\D/g, '');
    el.value = raw ? Number(raw).toLocaleString('id-ID') : '';
  }
  function getCurrencyValue(el) {
    if (!el || !el.value) return 0;
    return Number(el.value.replace(/\D/g, '')) || 0;
  }

  /**
   * Formatter pemisah ribuan (format Indonesia, titik) yang menjaga
   * posisi kursor — dipakai di field input realtime seperti Asumsi
   * Harga Emas & Target/Proyeksi Gramasi pada Simulasi Pencapaian KPI.
   * Beda dari formatCurrencyInput() yang selalu memindah kursor ke
   * akhir; di sini kursor tetap mengikuti digit yang sedang diketik
   * walau user edit/hapus di tengah angka.
   */
  function formatThousandsInput(el) {
    const digitsBeforeCursor = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
    const raw = el.value.replace(/\D/g, '');
    el.value = raw ? Number(raw).toLocaleString('id-ID') : '';

    let pos = 0, digitsSeen = 0;
    while (pos < el.value.length && digitsSeen < digitsBeforeCursor) {
      if (/\d/.test(el.value[pos])) digitsSeen++;
      pos++;
    }
    el.setSelectionRange(pos, pos);
  }

  function todayISO() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().split('T')[0];
  }

  function cssColor(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function setDefaultDates() {
    ['sp-tanggal', 'bm-tanggal', 'ps-tanggal', 'ps-berlaku', 'ot-tanggal', 'inv-tanggal', 'pmb-tanggal', 'pjl-tanggal'].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.value) el.value = todayISO();
    });
  }

  function resetForm(formId) {
    document.getElementById(formId).reset();
    setDefaultDates();
    updateMarginPreview();
    updateValuasiPreview();
    updateNominalPreview();
    if (document.getElementById('pmb-total-preview')) updatePembelianPreview();

    if (formId === 'form-supplier-price') {
      document.getElementById('sp-edit-id').value = '';
      const btn = document.getElementById('sp-submit-btn');
      btn.innerHTML = '<span class="material-symbols-rounded">save</span> Simpan';
      btn.dataset.origLabel = btn.innerHTML;
      document.getElementById('sp-cancel-edit-btn').style.display = 'none';
    }
    if (formId === 'form-pembelian') {
      document.getElementById('pmb-edit-id').value = '';
      const btn = document.getElementById('pmb-submit-btn');
      btn.innerHTML = '<span class="material-symbols-rounded">save</span> Simpan';
      btn.dataset.origLabel = btn.innerHTML;
      document.getElementById('pmb-cancel-edit-btn').style.display = 'none';
    }
    if (formId === 'form-penjualan') {
      document.getElementById('pjl-edit-id').value = '';
      const btn = document.getElementById('pjl-submit-btn');
      btn.innerHTML = '<span class="material-symbols-rounded">save</span> Simpan';
      btn.dataset.origLabel = btn.innerHTML;
      document.getElementById('pjl-cancel-edit-btn').style.display = 'none';
      updatePenjualanPreview();
    }
  }

  function setButtonLoading(btn, isLoading, label) {
    if (!btn) return;
    btn.disabled = isLoading;
    btn.dataset.origLabel = btn.dataset.origLabel || btn.innerHTML;
    btn.innerHTML = isLoading
      ? '<span class="material-symbols-rounded">progress_activity</span> Menyimpan...'
      : btn.dataset.origLabel;
  }

  // ============================================================
  // TANGGAL HARI INI DI HEADER
  // ============================================================
  function renderTodayDate() {
    const el = document.getElementById('topbar-date');
    const now = new Date();
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    el.textContent = now.toLocaleDateString('id-ID', opts);
  }

  // ============================================================
  // LOAD USER (email + role) DI HEADER
  // ============================================================
  function loadCurrentUser() {
    google.script.run
      .withSuccessHandler(function (user) {
        document.getElementById('u-name').textContent = user.Nama || user.Email;
        document.getElementById('u-role').textContent = user.Role;
        document.getElementById('u-avatar').textContent = (user.Nama || user.Email || '?').charAt(0).toUpperCase();
      })
      .withFailureHandler(function (err) {
        console.error(err);
        document.getElementById('u-name').textContent = 'Guest';
        document.getElementById('u-role').textContent = '-';
      })
      .getCurrentUser();
  }

  // ============================================================
  // GLOBAL PERIOD FILTER (Dashboard) — single source of truth.
  // Semua komponen Dashboard membaca periode dari state ini saja;
  // tidak ada filter terpisah per card.
  // ============================================================
  var dashboardPeriod = { mode: 'all', startDate: null, endDate: null };
  var dashboardPeriodInitialized = false;
  var dashboardPeriodLoadToken = 0;
  var dashboardPeriodLastKey = null;

  var MONTH_NAMES_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  function pad2(n) { return String(n).padStart(2, '0'); }
  function monthKeyOf(date) { return date.getFullYear() + '-' + pad2(date.getMonth() + 1); }

  /**
   * Rentang tanggal (ISO 'yyyy-MM-dd') awal & akhir bulan dari key 'YYYY-MM'.
   */
  function getMonthRange(monthKey) {
    const parts = monthKey.split('-');
    const year = Number(parts[0]), month = Number(parts[1]); // month: 1-12
    const start = year + '-' + pad2(month) + '-01';
    const lastDay = new Date(year, month, 0).getDate();
    const end = year + '-' + pad2(month) + '-' + pad2(lastDay);
    return { start: start, end: end };
  }

  function formatDateIndo(iso) {
    if (!iso) return '-';
    const parts = iso.split('-');
    return Number(parts[2]) + ' ' + MONTH_NAMES_ID[Number(parts[1]) - 1] + ' ' + parts[0];
  }

  /**
   * Isi dropdown Bulan dengan 24 bulan terakhir (termasuk bulan berjalan),
   * terbaru di atas.
   */
  function populatePeriodMonthSelect() {
    const sel = document.getElementById('period-month-select');
    if (!sel) return;
    const now = new Date();
    const options = [];
    for (let i = 0; i < 24; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = monthKeyOf(d);
      options.push('<option value="' + key + '">' + MONTH_NAMES_ID[d.getMonth()] + ' ' + d.getFullYear() + '</option>');
    }
    sel.innerHTML = options.join('');
    sel.value = monthKeyOf(now);
  }

  function initDashboardPeriodFilter() {
    populatePeriodMonthSelect();
    setPeriodMode('all'); // default saat Dashboard pertama kali dibuka = Semua (all-time)
  }

  function setPeriodMode(mode) {
    dashboardPeriod.mode = mode;
    const monthTab = document.getElementById('period-mode-month');
    const rangeTab = document.getElementById('period-mode-range');
    const allTab = document.getElementById('period-mode-all');
    const monthCtl = document.getElementById('period-controls-month');
    const rangeCtl = document.getElementById('period-controls-range');
    if (monthTab) monthTab.classList.toggle('active', mode === 'month');
    if (rangeTab) rangeTab.classList.toggle('active', mode === 'range');
    if (allTab) allTab.classList.toggle('active', mode === 'all');
    if (monthCtl) monthCtl.style.display = mode === 'month' ? 'flex' : 'none';
    if (rangeCtl) rangeCtl.style.display = mode === 'range' ? 'flex' : 'none';

    if (mode === 'month') {
      onPeriodMonthChange();
    } else if (mode === 'all') {
      // "Semua" = tanpa filter periode sama sekali (all-time), seperti
      // perilaku Dashboard sebelum Global Period Filter ada.
      dashboardPeriod.startDate = null;
      dashboardPeriod.endDate = null;
      const labelEl = document.getElementById('period-active-label-text');
      if (labelEl) labelEl.textContent = 'Periode Aktif: Semua Data';
      loadDashboardData();
    } else {
      const startEl = document.getElementById('period-start-date');
      const endEl = document.getElementById('period-end-date');
      if (startEl && !startEl.value && dashboardPeriod.startDate) startEl.value = dashboardPeriod.startDate;
      if (endEl && !endEl.value && dashboardPeriod.endDate) endEl.value = dashboardPeriod.endDate;
      if (startEl && endEl && startEl.value && endEl.value) onPeriodRangeChange();
    }
  }

  function onPeriodMonthChange() {
    const sel = document.getElementById('period-month-select');
    if (!sel || !sel.value) return;
    const range = getMonthRange(sel.value);
    dashboardPeriod.mode = 'month';
    dashboardPeriod.startDate = range.start;
    dashboardPeriod.endDate = range.end;
    const labelEl = document.getElementById('period-active-label-text');
    if (labelEl) labelEl.textContent = 'Periode Aktif: ' + MONTH_NAMES_ID[Number(sel.value.split('-')[1]) - 1] + ' ' + sel.value.split('-')[0];
    loadDashboardData();
  }

  function onPeriodRangeChange() {
    const startEl = document.getElementById('period-start-date');
    const endEl = document.getElementById('period-end-date');
    let start = startEl.value, end = endEl.value;
    if (!start || !end) return;
    if (start > end) {
      showToast('Tanggal Mulai tidak boleh lebih besar dari Tanggal Akhir', 'warning');
      endEl.value = start;
      end = start;
    }
    dashboardPeriod.mode = 'range';
    dashboardPeriod.startDate = start;
    dashboardPeriod.endDate = end;
    const labelEl = document.getElementById('period-active-label-text');
    if (labelEl) labelEl.textContent = 'Periode Aktif: ' + formatDateIndo(start) + ' – ' + formatDateIndo(end);
    loadDashboardData();
  }

  function resetPeriodFilter() {
    const startEl = document.getElementById('period-start-date');
    const endEl = document.getElementById('period-end-date');
    if (startEl) startEl.value = '';
    if (endEl) endEl.value = '';
    populatePeriodMonthSelect();
    setPeriodMode('all'); // Reset kembali ke default (Semua/all-time)
  }

  // ============================================================
  // LOAD DASHBOARD KPI (data real dari backend)
  // ============================================================
  function loadDashboard() {
    if (!dashboardPeriodInitialized) {
      dashboardPeriodInitialized = true;
      initDashboardPeriodFilter(); // akan memicu loadDashboardData()
    } else {
      loadDashboardData(true); // refresh data untuk periode yang sedang aktif
    }
  }

  /**
   * Memuat SELURUH data Dashboard berdasarkan dashboardPeriod
   * (Global Period Filter) — single source of truth. Semua card
   * mengirim startDate/endDate yang SAMA ke backend, jadi tidak
   * ada card yang "ketinggalan" periode filter.
   */
  function loadDashboardData(force) {
    const start = dashboardPeriod.startDate;
    const end = dashboardPeriod.endDate;
    const key = dashboardPeriod.mode + '|' + start + '|' + end;
    if (!force && key === dashboardPeriodLastKey) return; // hindari request berulang untuk periode yang sama
    dashboardPeriodLastKey = key;

    const reqToken = ++dashboardPeriodLoadToken;
    function guard(handler) {
      return function (res) {
        if (reqToken !== dashboardPeriodLoadToken) return; // respons basi (periode sudah berganti), abaikan
        handler(res);
      };
    }

    setKpiLoading(true);
    loadDashboardMarketStrip(); // live/realtime — tidak terikat periode filter

    google.script.run.withSuccessHandler(guard(renderSalesKpi)).withFailureHandler(handleLoadError).getSalesSummaryAll(start, end);
    google.script.run.withSuccessHandler(guard(renderPembelianKpi)).withFailureHandler(handleLoadError).getPembelianSummaryAll(start, end);
    google.script.run.withSuccessHandler(guard(renderMarginKpi)).withFailureHandler(handleLoadError).calculateProfitMarginOverall(start, end);
    google.script.run.withSuccessHandler(guard(renderDashboardKategoriBreakdown)).withFailureHandler(handleLoadError).getDashboardKategoriBreakdown(start, end);

    google.script.run.withSuccessHandler(guard(function (v) { renderSparkline('spark-penjualan', 'sparkPenjualan', v, cssColor('--color-primary')); })).withFailureHandler(handleLoadError).getPenjualanSparklineValues(start, end);
    google.script.run.withSuccessHandler(guard(function (v) { renderSparkline('spark-pembelian', 'sparkPembelian', v, cssColor('--color-gold')); })).withFailureHandler(handleLoadError).getPembelianSparklineValues(start, end);
    google.script.run.withSuccessHandler(guard(function (v) { renderSparkline('spark-margin', 'sparkMargin', v, '#8B5CF6'); })).withFailureHandler(handleLoadError).getMarginSparklineValues(start, end);

    google.script.run.withSuccessHandler(guard(renderAiSummary)).withFailureHandler(handleLoadError).generateOverallSummary(start, end);
    google.script.run.withSuccessHandler(guard(renderAlerts)).withFailureHandler(handleLoadError).getAlertsOverall(start, end);
    // Piutang per Supplier = posisi outstanding (Gold in Transit) PER
    // TANGGAL AKHIR filter — bukan lagi live snapshot sheet Rekap. Sesuai
    // sifat datanya (saldo/posisi, bukan delta), yang diikutkan ke filter
    // periode adalah endDate saja (posisi per akhir periode terpilih).
    // Tab Gabungan/Trading/EGR — ketiganya di-fetch paralel setiap ganti
    // periode, disimpan di piutangDashData_, lalu switch tab TIDAK perlu
    // refetch (langsung render dari cache). Tab Trading tetap memakai
    // getPiutangSupplierDashboard()/renderPiutangSupplierChart() apa
    // adanya (tidak diubah) — hasil perhitungan Trading existing utuh.
    google.script.run.withSuccessHandler(guard(function (res) { piutangDashData_.trading = res; if (piutangCardMode_ === 'trading') renderPiutangCardForMode_(); })).withFailureHandler(handleLoadError).getPiutangSupplierDashboard(end);
    google.script.run.withSuccessHandler(guard(function (res) { piutangDashData_.egr = res; if (piutangCardMode_ === 'egr') renderPiutangCardForMode_(); })).withFailureHandler(handleLoadError).getPiutangSupplierDashboardEgr(end);
    google.script.run.withSuccessHandler(guard(function (res) { piutangDashData_.gabungan = res; if (piutangCardMode_ === 'gabungan') renderPiutangCardForMode_(); })).withFailureHandler(handleLoadError).getPiutangSupplierDashboardCombined(end);
    google.script.run.withSuccessHandler(guard(renderTopMerkChart)).withFailureHandler(handleLoadError).getTopMerkPenjualan(5, start, end);
    google.script.run.withSuccessHandler(guard(renderSalesBuyerChart)).withFailureHandler(handleLoadError).getSalesByBuyerAll(start, end);
    google.script.run.withSuccessHandler(guard(renderTopBuyerRank)).withFailureHandler(handleLoadError).getTopBuyers(5, start, end);
    google.script.run.withSuccessHandler(guard(renderTopSupplierRank)).withFailureHandler(handleLoadError).getTopSuppliers(5, start, end);
    // Trend 30-hari terakhir & Agenda HUT — di luar Global Period Filter
    // (chart historis tetap / bukan data transaksi bertanggal), tidak diubah.
    google.script.run.withSuccessHandler(renderMarginTrendChart).withFailureHandler(handleLoadError).getMarginTrendHarian(30);
    google.script.run.withSuccessHandler(renderBarangTibaChart).withFailureHandler(handleLoadError).getBarangTibaTrend(30);
    google.script.run.withSuccessHandler(renderHutAgendaWidget).withFailureHandler(handleLoadError).getHutAgenda();
  }

  function handleLoadError(err) {
    console.error(err);
    showToast('Gagal memuat data: ' + (err.message || err), 'error');
  }

  function loadDashboardMarketStrip() {
    const box = document.getElementById('dashboard-market-strip');
    if (box) box.textContent = 'Memuat...';
    google.script.run
      .withSuccessHandler(function (ref) {
        if (!box) return;
        if (!ref) { box.textContent = 'Belum ada data market untuk hari ini.'; return; }
        const items = [
          ['Spot Gold', ref.spotGold, 'rp'],
          ['XAUIDRK', ref.xauIdr, 'rp'],
          ['LBMA', ref.lbma, 'usd'],
          ['Kitco', ref.kitco, 'usd'],
          ['Kurs Jual', ref.kursJual, 'rp'],
          ['Kurs Beli', ref.kursBeli, 'rp'],
          ['Rp LBMA', ref.rpLbma, 'rp'],
          ['Rp Kitco', ref.rpKitco, 'rp']
        ];
        box.innerHTML = items.map(function (it) {
          const val = it[1] == null ? '-' : (it[2] === 'usd' ? formatUsd(it[1]) : formatRupiah(it[1]));
          return '<span style="white-space:nowrap;"><span style="color:var(--color-text-muted); font-weight:600;">' + it[0] + ':</span> <b>' + val + '</b></span>';
        }).join('<span style="color:var(--color-border);">|</span>');
      })
      .withFailureHandler(function (err) {
        console.error(err);
        if (box) box.textContent = 'Gagal memuat data market.';
      })
      .getMarketBenchmarkLive(null);
  }

  function setKpiLoading(isLoading) {

    });

  function clearKpiLoading(cardId) {
    const card = document.getElementById(cardId);
    if (!card) return;
    card.querySelectorAll('.skeleton').forEach(el => el.classList.remove('skeleton'));

  function kategoriBreakdownLine(label, cat, unitLabel) {
    return '<div style="font-size:12.5px; color:var(--color-text-muted); line-height:1.5;">' + label + ': ' +
      '<b style="color:var(--color-text);">' + formatRupiah(cat.nominal) + '</b> &middot; ' +
      formatGram(cat.gram) + ' &middot; ' +
      '<b style="color:var(--color-text);">' + cat.count + '</b> ' + unitLabel + '</div>';

  function renderDashboardKategoriBreakdown(res) {
    if (!res) return;
    const p = res.penjualan, b = res.pembelian;

    document.getElementById('kpi-sales-nominal').textContent = formatRupiah(p.total.nominal);
    document.getElementById('kpi-sales-sub').innerHTML =
      '<span><b>' + formatGram(p.total.gram) + '</b> gramasi</span><span><b>' + p.total.count + '</b> invoice</span>';
    const salesEl = document.getElementById('kpi-sales-kategori');
    if (salesEl) {
      salesEl.innerHTML = kategoriBreakdownLine('Trading', p.trading, 'invoice') + kategoriBreakdownLine('ETF', p.etf, 'invoice') +
        (res.redemption && res.redemption.etf ? kategoriBreakdownLine('Redemption ETF (uang masuk, terpisah dari total & margin)', res.redemption.etf, 'transaksi') : '');
    }

    document.getElementById('kpi-pembelian-nominal').textContent = formatRupiah(b.total.nominal);
    document.getElementById('kpi-pembelian-sub').innerHTML =
      '<span><b>' + formatGram(b.total.gram) + '</b> gramasi</span><span><b>' + b.total.count + '</b> transaksi</span>';
    const pembelianEl = document.getElementById('kpi-pembelian-kategori');
    if (pembelianEl) {
      pembelianEl.innerHTML = kategoriBreakdownLine('Trading', b.trading, 'transaksi') + kategoriBreakdownLine('ETF', b.etf, 'transaksi');
    }

    const marginGabungan = p.total.nominal - b.total.nominal;
    const marginTrading = p.trading.nominal - b.trading.nominal;
    const marginEtf = p.etf.nominal - b.etf.nominal;
    document.getElementById('kpi-margin-avg').textContent = formatRupiah(marginGabungan);
    document.getElementById('kpi-margin-sub').innerHTML =
      '<span>Penjualan: <b>' + formatRupiah(p.total.nominal) + '</b></span><span>Pembelian: <b>' + formatRupiah(b.total.nominal) + '</b></span>';
    const marginEl = document.getElementById('kpi-margin-kategori');
    if (marginEl) {
      marginEl.innerHTML = '<span>Trading: <b>' + formatRupiah(marginTrading) + '</b></span><span>ETF: <b>' + formatRupiah(marginEtf) + '</b></span>';
    }

    jumlahPenjualanTx = p.total.count;
    nominalPenjualanTx = p.total.nominal;
    jumlahPembelianTx = b.total.count;
    nominalPembelianTx = b.total.nominal;
    updateJumlahTransaksiKpi();
  }
  function updateJumlahTransaksiKpi() {
    const valEl = document.getElementById('kpi-total-transaksi-value');

    valEl.textContent = formatRupiah(nominalPenjualanTx + nominalPembelianTx);

  /**
   * Sparkline mini-chart tanpa sumbu/legend — dipakai di kartu KPI Dashboard.
   */
  function renderSparkline(canvasId, chartKey, values, color) {
    values = values || [];
    destroyChart(chartKey);
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    charts[chartKey] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: values.map((_, i) => i),
        datasets: [{
          data: values, borderColor: color, backgroundColor: color + '33',
          fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { display: false }, y: { display: false } },
        elements: { line: { borderJoinStyle: 'round' } }
      }
    });
  }

  // ============================================================
  // FASE 5 — CHART.JS INSTANCES
  // ============================================================
  var charts = {};

  function destroyChart(key) {
    if (charts[key]) { charts[key].destroy(); charts[key] = null; }
  }

  function renderSupplierComparisonChart(list) {
    list = list || [];
    destroyChart('supplierComparison');
    const ctx = document.getElementById('chart-supplier-comparison');
    if (!ctx) return;
    if (!list.length) { return; }

    const colors = list.map(s => s.isCheapest ? cssColor('--color-success') : (s.isMostExpensive ? cssColor('--color-danger') : cssColor('--color-primary-light')));
    charts.supplierComparison = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: list.map(s => s.supplierNama),
        datasets: [{ label: 'Harga (Rp/gr)', data: list.map(s => s.harga), backgroundColor: colors, borderRadius: 6 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { callback: v => formatRupiah(v) } } }
      }
    });
  }

  function renderBenchmarkComparisonChart(res) {
    destroyChart('benchmarkComparison');
    const ctx = document.getElementById('chart-benchmark-comparison');
    if (!ctx || !res || !res.labels.length) return;

    charts.benchmarkComparison = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: res.labels,
        datasets: [{ label: 'Harga (Rp/gr)', data: res.values, backgroundColor: cssColor('--color-gold'), borderRadius: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { ticks: { callback: v => formatRupiah(v) } } }
      }
    });
  }

  // ============================================================
  // WIDGET DASHBOARD BARU — bar-list (menggantikan donut/bar chart
  // untuk Piutang per Supplier, Penjualan per Buyer, Top 5 Merk)
  // ============================================================
  const BAR_LIST_PALETTE = ['#046A38', '#1E9E5A', '#6FCB9F', '#C9A227', '#D6483A', '#8B5CF6'];

  function buildBarListRow(rank, name, colorHex, barPct, valueText, pctText) {
    return '<div class="bar-list-row">' +
      (rank != null ? '<div class="bar-list-rank">' + rank + '</div>' : '') +
      '<div class="bar-list-main">' +
        '<div class="bar-list-name">' + name + '</div>' +
        '<div class="bar-list-track"><div class="bar-list-fill" style="width:' + Math.max(barPct, 3) + '%; background:' + colorHex + ';"></div></div>' +
      '</div>' +
      '<div class="bar-list-values">' +
        '<div class="bar-list-value">' + valueText + '</div>' +
        (pctText ? '<div class="bar-list-pct">' + pctText + '</div>' : '') +
      '</div>' +
    '</div>';
  }

  // ---------------- Piutang per Supplier (Dashboard) — Gabungan/Trading/EGR ----------------
  var piutangCardMode_ = 'gabungan';
  var piutangDashData_ = { trading: null, egr: null, gabungan: null };

  function piutangSetMode_(mode) {
    piutangCardMode_ = mode;
    ['gabungan', 'trading', 'egr'].forEach(function (m) {
      const el = document.getElementById('piutang-mode-' + m);
      if (el) el.classList.toggle('active', m === mode);
    });
    renderPiutangCardForMode_();
  }

  function renderPiutangCardForMode_() {
    const mode = piutangCardMode_;
    const labelEl = document.getElementById('piutang-total-label');
    const breakdownBox = document.getElementById('piutang-breakdown-box');
    const insightBox = document.getElementById('piutang-insight-box');
    const data = piutangDashData_[mode];

    if (!data) {
      // Belum selesai di-fetch untuk mode ini — biarkan "Memuat..." apa adanya.
      const listBox = document.getElementById('piutang-bar-list');
      if (listBox) listBox.innerHTML = '<div class="recent-empty">Memuat...</div>';
      if (breakdownBox) breakdownBox.style.display = 'none';
      if (insightBox) insightBox.style.display = 'none';
      return;
    }

    if (mode === 'trading') {
      if (labelEl) labelEl.textContent = 'Total Piutang';
      if (breakdownBox) breakdownBox.style.display = 'none';
      renderPiutangSupplierChart(data); // fungsi existing, TIDAK diubah — insightBox diatur di dalamnya
      return;
    }
    if (mode === 'egr') {
      if (labelEl) labelEl.textContent = 'Total Piutang Supplier EGR';
      if (breakdownBox) breakdownBox.style.display = 'none';
      if (insightBox) insightBox.style.display = 'none';
      renderPiutangEgrOnly_(data);
      return;
    }
    // gabungan
    if (labelEl) labelEl.textContent = 'Total Piutang Supplier';
    if (insightBox) insightBox.style.display = 'none';
    renderPiutangCombined_(data);
  }

  function renderPiutangEgrOnly_(data) {
    const totalEl = document.getElementById('piutang-total-value');
    const totalGramasiEl = document.getElementById('piutang-total-gramasi');
    const posisiEl = document.getElementById('piutang-widget-subtitle');
    const listBox = document.getElementById('piutang-bar-list');
    if (!listBox) return;

    const rows = (data && data.rows) || [];
    const totalValuasi = (data && data.totalValuasi) || 0;
    const totalGramasi = (data && data.totalGramasi) || 0;

    if (totalEl) totalEl.textContent = formatRupiahShort(totalValuasi);
    if (totalGramasiEl) totalGramasiEl.textContent = '= ' + (totalGramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
    if (posisiEl) {
      posisiEl.textContent = data && data.posisi ? ('Posisi per ' + formatDateIndo(data.posisi) + (data.posisi === data.lastDataDate ? ' (data terakhir tersedia)' : '')) : 'Total Piutang EGR';
    }

    if (!rows.length) {
      listBox.innerHTML = '<div class="recent-empty">Belum terdapat data piutang supplier EGR pada tanggal posisi yang dipilih.</div>';
      return;
    }

    const top = rows.slice(0, 3);
    const max = top[0].valuasi || 1;
    listBox.innerHTML = top.map(function (r, i) {
      const barPct = max ? (r.valuasi / max) * 100 : 0;
      const color = BAR_LIST_PALETTE[i % BAR_LIST_PALETTE.length];
      const gramasiKg = (r.gramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
      return buildBarListRow(i + 1, r.supplierNama, color, barPct, formatRupiahShort(r.valuasi), gramasiKg);
    }).join('');
  }

  function renderPiutangCombined_(data) {
    const totalEl = document.getElementById('piutang-total-value');
    const totalGramasiEl = document.getElementById('piutang-total-gramasi');
    const posisiEl = document.getElementById('piutang-widget-subtitle');
    const listBox = document.getElementById('piutang-bar-list');
    const breakdownBox = document.getElementById('piutang-breakdown-box');
    if (!listBox) return;

    const rows = (data && data.rows) || [];
    const totalValuasi = (data && data.totalValuasi) || 0;
    const totalGramasi = (data && data.totalGramasi) || 0;
    const tradingValuasi = (data && data.tradingValuasi) || 0;
    const tradingGramasi = (data && data.tradingGramasi) || 0;
    const egrValuasi = (data && data.egrValuasi) || 0;
    const egrGramasi = (data && data.egrGramasi) || 0;

    if (totalEl) totalEl.textContent = formatRupiahShort(totalValuasi);
    if (totalGramasiEl) totalGramasiEl.textContent = '= ' + (totalGramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
    if (posisiEl) {
      posisiEl.textContent = data && data.posisi ? ('Posisi per ' + formatDateIndo(data.posisi) + (data.posisi === data.lastDataDate ? ' (data terakhir tersedia)' : '')) : 'Total Piutang';
    }

    if (breakdownBox) {
      breakdownBox.style.display = 'grid';
      document.getElementById('piutang-breakdown-trading-value').textContent = formatRupiahShort(tradingValuasi);
      document.getElementById('piutang-breakdown-trading-sub').textContent = (tradingGramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
      document.getElementById('piutang-breakdown-egr-value').textContent = formatRupiahShort(egrValuasi);
      document.getElementById('piutang-breakdown-egr-sub').textContent = (egrGramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
    }

    if (!rows.length) {
      listBox.innerHTML = '<div class="recent-empty">Belum ada piutang</div>';
      return;
    }
    const top = rows.slice(0, 3);
    const max = top[0].valuasi || 1;
    listBox.innerHTML = top.map(function (r, i) {
      const barPct = max ? (r.valuasi / max) * 100 : 0;
      const color = BAR_LIST_PALETTE[i % BAR_LIST_PALETTE.length];
      const gramasiKg = (r.gramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
      return buildBarListRow(i + 1, r.supplierNama, color, barPct, formatRupiahShort(r.valuasi), gramasiKg);
    }).join('');
  }

  function renderPiutangSupplierChart(data) {
    const rows = (data && data.rows) || [];
    const totalValuasi = (data && data.totalValuasi) || 0;
    const totalGramasi = (data && data.totalGramasi) || 0;
    const totalEl = document.getElementById('piutang-total-value');
    if (totalEl) totalEl.textContent = formatRupiahShort(totalValuasi);
    const totalGramasiEl = document.getElementById('piutang-total-gramasi');
    if (totalGramasiEl) totalGramasiEl.textContent = '= ' + (totalGramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';

    const posisiEl = document.getElementById('piutang-widget-subtitle');
    if (posisiEl && data && data.posisi) {
      posisiEl.textContent = 'Posisi per ' + formatDateIndo(data.posisi) +
        (data.posisi === data.lastDataDate ? ' (data terakhir tersedia)' : '');
    }

    const listBox = document.getElementById('piutang-bar-list');
    const insightBox = document.getElementById('piutang-insight-box');
    if (!listBox) return;
    if (!rows.length) {
      listBox.innerHTML = '<div class="recent-empty">Belum ada piutang</div>';
      if (insightBox) insightBox.style.display = 'none';
      return;
    }
    if (insightBox) insightBox.style.display = 'flex';

    const max = rows[0].valuasi || 1;
    listBox.innerHTML = rows.map(function (r, i) {
      const barPct = max ? (r.valuasi / max) * 100 : 0;
      const color = BAR_LIST_PALETTE[i % BAR_LIST_PALETTE.length];
      const gramasiKg = (r.gramasi / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';
      return buildBarListRow(null, r.supplierNama, color, barPct, formatRupiahShort(r.valuasi), gramasiKg + ' &middot; ' + r.valuasiPercent.toFixed(0) + '%');
    }).join('');

    const top = rows[0];
    const topNameEl = document.getElementById('piutang-top-name');
    const topPctEl = document.getElementById('piutang-top-pct');
    if (topNameEl) topNameEl.textContent = top.supplierNama;
    if (topPctEl) topPctEl.textContent = top.valuasiPercent.toFixed(0) + '% dari total piutang';
  }

  function renderTopMerkChart(data) {
    const rows = (data && data.rows) || [];
    const total = (data && data.total) || 0;
    const listBox = document.getElementById('top-merk-bar-list');
    if (!listBox) return;
    if (!rows.length) { listBox.innerHTML = '<div class="recent-empty">Belum ada data Merk</div>'; return; }

    const max = rows[0].nominal || 1;
    listBox.innerHTML = rows.map(function (m, i) {
      const barPct = max ? (m.nominal / max) * 100 : 0;
      const color = BAR_LIST_PALETTE[i % BAR_LIST_PALETTE.length];

  // ============================================================
  // GOLD IN TRANSIT — MONITORING PEMENUHAN PO (halaman Piutang Supplier)
  // Sumber: sheet eksternal F.3.Input_Barang Masuk (getGoldInTransitData
  // di Code.gs). Posisi tanggal MENENTUKAN seluruh angka (historis) —
  // tiap ganti tanggal posisi/klik Terapkan, data diambil ulang dari
  // server (perhitungan tergantung tanggal). Filter Status/Search/Aging
  // pada tab Detail murni di client (tidak perlu refetch server).
  // ============================================================
  var gitData = null;
  var gitDetailFiltered = [];
  var gitSortState = { col: 'aging', dir: 'desc' };
  var gitCurrentPage = 1;
  var GIT_PAGE_SIZE = 25;

  function gitFormatKgTon_(gram) {
    const kg = gram / 1000;
    const ton = gram / 1000000;
    return kg.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg · ' + ton.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' ton';
  }

  function gitQuickPosisi(mode) {
    ['git-quick-hariini', 'git-quick-akhirbulan', 'git-quick-custom'].forEach(function (id) {
      document.getElementById(id).classList.toggle('active', id === 'git-quick-' + mode);
    });
    const posisiEl = document.getElementById('git-f-posisi');
    if (mode === 'hariini') {
      posisiEl.value = todayISO();
      loadGoldInTransitData(posisiEl.value);
    } else if (mode === 'akhirbulan') {
      const d = new Date();
      d.setDate(0); // mundur ke tanggal 0 bulan ini = akhir bulan sebelumnya
      posisiEl.value = pjlDateToIso_(d);
      loadGoldInTransitData(posisiEl.value);
    }
    // mode 'custom' -> user pilih tanggal sendiri, tunggu tombol Terapkan.
  }

  function gitApplyFilter() {
    loadGoldInTransitData(document.getElementById('git-f-posisi').value);
  }

  function gitResetFilter() {
    document.getElementById('git-f-supplier').value = '';
    document.getElementById('git-f-tahun').value = '';
    gitQuickPosisi('hariini');
  }

  function loadGoldInTransitData(tanggalPosisi) {
    const trendCanvas = document.getElementById('git-chart-trend');
    google.script.run
      .withSuccessHandler(function (res) {
        gitData = res;
        document.getElementById('git-f-posisi').value = res.posisi;

        const supEl = document.getElementById('git-f-supplier');
        const curSup = supEl.value;
        supEl.innerHTML = '<option value="">Semua Supplier</option>' + res.supplierList.map(function (s) { return '<option value="' + escapeHtmlAttr(s) + '">' + escapeHtmlAttr(s) + '</option>'; }).join('');
        supEl.value = curSup;

        const tahunEl = document.getElementById('git-f-tahun');
        const curTahun = tahunEl.value;
        tahunEl.innerHTML = '<option value="">Semua Tahun</option>' + res.tahunList.map(function (t) { return '<option value="' + t + '">' + t + '</option>'; }).join('');
        tahunEl.value = curTahun;

        gitRenderRingkasan_();
        gitDetailApply();
      })
      .withFailureHandler(function (err) {
        showToast('Gagal memuat Gold in Transit: ' + (err.message || err), 'error');
      })
      .getGoldInTransitData(tanggalPosisi || '');
  }

    document.getElementById('git-tab-' + tabId).classList.add('active');

  function gitPosisiLabel_(tanggalStr) {
    const d = new Date(tanggalStr + 'T00:00:00');
    return d.getDate() + ' ' + DL_BULAN_ID[d.getMonth()] + ' ' + d.getFullYear();
  }

  function gitRenderRingkasan_() {
    if (!gitData) return;
    const sup = document.getElementById('git-f-supplier').value;
    const sc = gitData.scorecard;

    // Kalau filter supplier aktif, scorecard Gold in Transit/PO Outstanding
    // dihitung ulang dari detail (bukan angka global) supaya konsisten
    // dgn breakdown per-supplier yang ditampilkan.
    let detailForScorecard = gitData.detail;
    if (sup) detailForScorecard = detailForScorecard.filter(function (r) { return r.supplier === sup; });

    const totalOrder = detailForScorecard.reduce(function (s, r) { return s + r.qtyPO; }, 0);
    const diterima = detailForScorecard.reduce(function (s, r) { return s + r.diterima; }, 0);
    const git = detailForScorecard.reduce(function (s, r) { return s + r.goldInTransit; }, 0);
    const outstanding = detailForScorecard.filter(function (r) { return r.goldInTransit > 0; }).length;
    const rupiahGit = detailForScorecard.reduce(function (s, r) { return s + (r.nilaiGoldInTransit || 0); }, 0);

    document.getElementById('git-sc-git-gr').textContent = formatGram(git);
    document.getElementById('git-sc-git-conv').textContent = gitFormatKgTon_(git);
    document.getElementById('git-sc-total-po').textContent = sup ? detailForScorecard.length : sc.totalPO;
    document.getElementById('git-sc-diterima-gr').textContent = formatGram(diterima);
    document.getElementById('git-sc-diterima-conv').textContent = gitFormatKgTon_(diterima);
    document.getElementById('git-sc-outstanding').textContent = outstanding + ' PO';
    document.getElementById('git-sc-rupiah').textContent = formatRupiah(rupiahGit);
    document.getElementById('git-sc-rupiah-gr').textContent = '= ' + (git / 1000).toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' kg';

    const posisiLabelEl = document.getElementById('git-posisi-label');
    if (posisiLabelEl) {
      posisiLabelEl.textContent = 'Posisi per ' + gitPosisiLabel_(gitData.posisi) +
        (gitData.posisi === gitData.lastDataDate ? ' (data terakhir tersedia)' : '');
    }
    const lastDataEl = document.getElementById('git-lastdata-label');
    if (lastDataEl) lastDataEl.textContent = gitPosisiLabel_(gitData.lastDataDate);

    gitRenderTrendChart_();
    gitRenderDonutChart_(totalOrder, diterima, git);

    const breakdownEl = document.getElementById('git-supplier-breakdown');
    let breakdown = gitData.supplierBreakdown;
    if (sup) breakdown = breakdown.filter(function (b) { return b.supplier === sup; });
    if (!breakdown.length) {
      breakdownEl.innerHTML = '<div class="recent-empty">Tidak ada Gold in Transit outstanding</div>';
    } else {
      const maxGit = Math.max.apply(null, breakdown.map(function (b) { return b.goldInTransit; }));
      breakdownEl.innerHTML = breakdown.map(function (b) {
        const barPct = maxGit > 0 ? (b.goldInTransit / maxGit) * 100 : 0;
        return '<div class="git-supplier-card">' +
          '<div class="git-supplier-avatar"><span class="material-symbols-rounded">domain</span></div>' +
          '<div class="git-supplier-info"><div class="git-supplier-name">' + escapeHtmlAttr(b.supplier) + '</div>' +
          '<div class="git-supplier-sub">' + b.poCount + ' PO outstanding &middot; ' + b.persen.toFixed(1) + '% dari total</div></div>' +
          '<div class="git-supplier-bar-wrap"><div class="git-supplier-bar-fill" style="width:' + barPct.toFixed(1) + '%;"></div></div>' +
          '<div class="git-supplier-value">' + formatGram(b.goldInTransit) + '</div>' +
          '<button type="button" class="btn btn-secondary" style="padding:5px 10px; font-size:11px;" onclick="gitLihatDetailSupplier(\'' + escapeHtmlAttr(b.supplier).replace(/'/g, "\\'") + '\')">Lihat Detail</button>' +
          '</div>';
      }).join('');
      breakdownEl.innerHTML += '<div class="git-supplier-card git-supplier-total-row"><div class="git-supplier-info">TOTAL</div><div class="git-supplier-bar-wrap" style="visibility:hidden;"></div><div class="git-supplier-value">' + formatGram(breakdown.reduce(function (s, b) { return s + b.goldInTransit; }, 0)) + '</div></div>';
    }
  }

  function gitRenderDonutChart_(totalOrder, diterima, git) {
    const persenDiterima = totalOrder > 0 ? (diterima / totalOrder) * 100 : 0;
    const persenGit = totalOrder > 0 ? (git / totalOrder) * 100 : 0;

    document.getElementById('git-donut-pct').textContent = persenDiterima.toFixed(1) + '%';
    document.getElementById('git-legend-diterima-val').textContent = formatGram(diterima);
    document.getElementById('git-legend-diterima-pct').textContent = persenDiterima.toFixed(1) + '%';
    document.getElementById('git-legend-git-val').textContent = formatGram(git);
    document.getElementById('git-legend-git-pct').textContent = persenGit.toFixed(1) + '%';
    document.getElementById('git-formula-total').textContent = formatGram(totalOrder);
    document.getElementById('git-formula-diterima').textContent = formatGram(diterima);
    document.getElementById('git-formula-git').textContent = formatGram(git);

    destroyChart('gitDonut');
    const ctx = document.getElementById('git-chart-donut');
    if (!ctx) return;
    charts.gitDonut = new Chart(ctx, {
      type: 'doughnut',
      data: {
        labels: ['Sudah Diterima', 'Gold in Transit'],
        datasets: [{
          data: [diterima, git],
          backgroundColor: [cssColor('--color-success'), cssColor('--color-gold')],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false, cutout: '72%',
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (ctx) { return ctx.label + ': ' + formatGram(ctx.parsed); } } }
        }
      }
    });
  }

  function gitRenderTrendChart_() {
    if (!gitData) return;
    let trend = gitData.trend || [];
    const tahun = document.getElementById('git-f-tahun').value;
    if (tahun) trend = trend.filter(function (t) { return t.bulan.slice(0, 4) === tahun; });

    destroyChart('gitTrend');
    const ctx = document.getElementById('git-chart-trend');
    if (!ctx) return;
    charts.gitTrend = new Chart(ctx, {
      type: 'line',
      data: {
        labels: trend.map(function (t) {
          const parts = t.bulan.split('-');
          const label = DL_BULAN_ID[parseInt(parts[1], 10) - 1].slice(0, 3) + ' ' + parts[0];
          return t.isSementara ? label + '*' : label;
        }),
        datasets: [{
          label: 'Gold in Transit (gr)', data: trend.map(function (t) { return t.goldInTransit; }),
          borderColor: cssColor('--color-primary'), backgroundColor: cssColor('--color-primary-soft'),
          fill: true, tension: 0.3, pointRadius: 3
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: { label: function (ctx) { return formatGram(ctx.parsed.y); } } }
        },
        scales: { y: { ticks: { callback: function (v) { return (v / 1000).toLocaleString('id-ID') + ' kg'; } } } }
      }
    });
  }

  // ---- Tab Detail Outstanding PO ----
  function gitDetailReset() {
    document.getElementById('git-d-status').value = 'Semua Outstanding';
    document.getElementById('git-d-search').value = '';
    document.getElementById('git-d-aging').value = '';
    gitDetailApply();
  }

  function gitAgingBucket_(hari) {
    if (hari <= 7) return '0-7';
    if (hari <= 14) return '8-14';
    if (hari <= 30) return '15-30';
    return '>30';
  }

  function gitDetailApply() {
    if (!gitData) return;
    const sup = document.getElementById('git-f-supplier').value;
    const status = document.getElementById('git-d-status').value;
    const search = document.getElementById('git-d-search').value.trim().toLowerCase();
    const aging = document.getElementById('git-d-aging').value;

    gitDetailFiltered = gitData.detail.filter(function (r) {
      if (sup && r.supplier !== sup) return false;
      if (status === 'Semua Outstanding') { if (r.goldInTransit <= 0) return false; }
      else if (status && r.status !== status) return false;
      if (search && r.nomorPO.toLowerCase().indexOf(search) === -1) return false;
      if (aging && gitAgingBucket_(r.aging) !== aging) return false;
      return true;
    });

    gitSortApply_();
    gitCurrentPage = 1;
    gitRenderDetailScorecard_();
    gitRenderDetailTable_();
  }

  function gitSortBy(col) {
    if (gitSortState.col === col) {
      gitSortState.dir = gitSortState.dir === 'asc' ? 'desc' : 'asc';
    } else {
      gitSortState.col = col;
      gitSortState.dir = 'desc';
    }
    gitSortApply_();
    gitCurrentPage = 1;
    gitRenderDetailTable_();
  }

  function gitSortApply_() {
    const col = gitSortState.col, dir = gitSortState.dir;
    gitDetailFiltered.sort(function (a, b) {
      let va = a[col], vb = b[col];
      if (typeof va === 'string') { va = va || ''; vb = vb || ''; }
      else { va = va || 0; vb = vb || 0; }
      if (va < vb) return dir === 'asc' ? -1 : 1;
      if (va > vb) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function gitRenderDetailScorecard_() {
    const outstanding = gitDetailFiltered.filter(function (r) { return r.goldInTransit > 0; });
    const git = gitDetailFiltered.reduce(function (s, r) { return s + r.goldInTransit; }, 0);
    const belum = gitDetailFiltered.filter(function (r) { return r.status === 'Belum Datang' && r.goldInTransit > 0; }).length;
    const sebagian = gitDetailFiltered.filter(function (r) { return r.status === 'Sebagian'; }).length;
    document.getElementById('git-dsc-outstanding').textContent = outstanding.length;
    document.getElementById('git-dsc-git').textContent = formatGram(git);
    document.getElementById('git-dsc-belum').textContent = belum;
    document.getElementById('git-dsc-sebagian').textContent = sebagian;
  }

  function gitStatusBadge_(status) {
    if (status === 'Selesai') return '<span class="badge green">Selesai</span>';
    if (status === 'Sebagian') return '<span class="badge gold">Sebagian</span>';
    return '<span class="badge red">Belum Datang</span>';
  }

  function gitRenderDetailTable_() {
    const body = document.getElementById('git-table-body');
    const countEl = document.getElementById('git-table-count');
    document.querySelectorAll('.git-sortable').forEach(function (th) { th.classList.remove('sorted', 'sorted-asc'); });
    const activeTh = document.querySelector('.git-sortable[onclick="gitSortBy(\'' + gitSortState.col + '\')"]');
    if (activeTh) activeTh.classList.add(gitSortState.dir === 'asc' ? 'sorted-asc' : 'sorted');

    if (!gitDetailFiltered.length) {
      body.innerHTML = '<tr><td colspan="12" class="recent-empty">Tidak ada data sesuai filter</td></tr>';
      if (countEl) countEl.textContent = '0 data';
      document.getElementById('git-pagination').innerHTML = '';
      return;
    }
    const totalPages = Math.max(1, Math.ceil(gitDetailFiltered.length / GIT_PAGE_SIZE));
    if (gitCurrentPage > totalPages) gitCurrentPage = totalPages;
    const start = (gitCurrentPage - 1) * GIT_PAGE_SIZE;
    const pageItems = gitDetailFiltered.slice(start, start + GIT_PAGE_SIZE);

    body.innerHTML = pageItems.map(function (r) {
      return '<tr class="' + (r.goldInTransit > 0 ? 'git-row-outstanding' : '') + '">' +
        '<td>' + (r.tanggalPO ? r.tanggalPO.split('-').reverse().join('/') : '-') + '</td>' +
        '<td>' + escapeHtmlAttr(r.nomorPO) + '</td>' +
        '<td>' + (r.nomorInvoice ? escapeHtmlAttr(r.nomorInvoice) : '-') + '</td>' +
        '<td>' + escapeHtmlAttr(r.supplier) + '</td>' +
        '<td>' + formatGram(r.qtyPO) + '</td>' +
        '<td>' + formatGram(r.diterima) + '</td>' +
        '<td><b>' + formatGram(r.goldInTransit) + '</b></td>' +
        '<td>' + r.persenPemenuhan.toFixed(1) + '%</td>' +
        '<td>' + (r.tanggalTerakhirTerima ? r.tanggalTerakhirTerima.split('-').reverse().join('/') : '-') + '</td>' +
        '<td>' + r.aging + ' hari</td>' +
        '<td>' + gitStatusBadge_(r.status) + '</td>' +
        '<td><button type="button" class="btn btn-secondary" style="padding:4px 8px; font-size:10.5px;" onclick="gitOpenDetailModal(\'' + escapeHtmlAttr(r.nomorPO).replace(/'/g, "\\'") + '\')">Lihat Detail</button></td>' +
        '</tr>';
    }).join('');

    if (countEl) countEl.textContent = gitDetailFiltered.length + ' data (menampilkan ' + (start + 1) + '-' + Math.min(start + GIT_PAGE_SIZE, gitDetailFiltered.length) + ')';

    const pag = document.getElementById('git-pagination');
    const showStart = start + 1, showEnd = Math.min(start + GIT_PAGE_SIZE, gitDetailFiltered.length);
    let pagHtml = '<div class="mitra-pagination-info">' + showStart + '-' + showEnd + ' dari ' + gitDetailFiltered.length + ' data</div><div class="mitra-pagination-pages">';
    pagHtml += '<div class="mitra-page-btn nav' + (gitCurrentPage === 1 ? ' disabled' : '') + '" onclick="gitGoToPage(' + (gitCurrentPage - 1) + ')">&laquo;</div>';
    const maxBtns = 5;
    let pStart = Math.max(1, gitCurrentPage - 2), pEnd = Math.min(totalPages, pStart + maxBtns - 1);
    pStart = Math.max(1, pEnd - maxBtns + 1);
    if (pStart > 1) pagHtml += '<div class="mitra-page-btn" onclick="gitGoToPage(1)">1</div><span>...</span>';
    for (let i = pStart; i <= pEnd; i++) {
      pagHtml += '<div class="mitra-page-btn' + (i === gitCurrentPage ? ' active' : '') + '" onclick="gitGoToPage(' + i + ')">' + i + '</div>';
    }
    if (pEnd < totalPages) pagHtml += '<span>...</span><div class="mitra-page-btn" onclick="gitGoToPage(' + totalPages + ')">' + totalPages + '</div>';
    pagHtml += '<div class="mitra-page-btn nav' + (gitCurrentPage === totalPages ? ' disabled' : '') + '" onclick="gitGoToPage(' + (gitCurrentPage + 1) + ')">&raquo;</div>';
    pagHtml += '</div>';
    pag.innerHTML = pagHtml;
  }

  function gitGoToPage(page) { gitCurrentPage = page; gitRenderDetailTable_(); }

  function gitOpenDetailModal(nomorPO) {
    const r = gitData.detail.find(function (x) { return x.nomorPO === nomorPO; });
    if (!r) return;
    document.getElementById('git-detail-nomorpo').textContent = r.nomorPO;
    document.getElementById('git-detail-tanggalpo').textContent = r.tanggalPO ? r.tanggalPO.split('-').reverse().join('/') : '-';
    document.getElementById('git-detail-supplier').textContent = r.supplier;
    document.getElementById('git-detail-invoice').textContent = r.nomorInvoice || '-';
    document.getElementById('git-detail-status').innerHTML = gitStatusBadge_(r.status);
    document.getElementById('git-detail-qtypo').textContent = formatGram(r.qtyPO);
    document.getElementById('git-detail-diterima').textContent = formatGram(r.diterima);
    document.getElementById('git-detail-git').textContent = formatGram(r.goldInTransit);
    document.getElementById('git-detail-aging').textContent = r.aging + ' hari';

    const histBody = document.getElementById('git-detail-histori-body');
    histBody.innerHTML = r.historiPenerimaan.length
      ? r.historiPenerimaan.map(function (h) {
        return '<tr><td>' + h.tanggalTerima.split('-').reverse().join('/') + '</td><td>' + escapeHtmlAttr(h.nomorBAST) + '</td>' +
          '<td>' + (h.nomorInvoice ? escapeHtmlAttr(h.nomorInvoice) : '-') + '</td><td>' + formatGram(h.gramasi) + '</td>' +
          '<td>' + formatGram(h.kumulatif) + '</td><td>' + formatGram(h.sisaSetelah) + '</td></tr>';
      }).join('')
      : '<tr><td colspan="6" class="recent-empty">Belum ada penerimaan</td></tr>';

  function gitCloseDetailModal() {
    document.getElementById('git-detail-modal-overlay').style.display = 'none';
  }

  function gitDownloadExcel() {
    if (typeof XLSX === 'undefined') { showToast('Modul export Excel tidak tersedia', 'error'); return; }
    if (!gitDetailFiltered.length) { showToast('Tidak ada data untuk diexport', 'warning'); return; }
    const header = ['No', 'Tanggal PO', 'Nomor PO', 'No. Invoice', 'Supplier', 'Gramasi PO (gr)', 'Diterima (gr)', 'Gold in Transit (gr)', '% Pemenuhan', 'Terima Terakhir', 'Aging (hari)', 'Status'];
    const data = gitDetailFiltered.map(function (r, idx) {
      return [idx + 1, r.tanggalPO, r.nomorPO, r.nomorInvoice || '-', r.supplier, r.qtyPO, r.diterima, r.goldInTransit, +r.persenPemenuhan.toFixed(1), r.tanggalTerakhirTerima || '-', r.aging, r.status];
    });
    const ws = XLSX.utils.aoa_to_sheet([header].concat(data));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Detail Outstanding PO');
    XLSX.writeFile(wb, 'Detail Outstanding PO - posisi ' + gitData.posisi + '.xlsx');

  function gitDownloadPdf() {
    if (!gitDetailFiltered.length) { showToast('Tidak ada data untuk diexport', 'warning'); return; }
    const capture = document.getElementById('git-print-capture-area');
    const rowsHtml = gitDetailFiltered.map(function (r, idx) {
      return '<tr>' +
        '<td style="padding:4px 8px; border:1px solid #ddd;">' + (idx + 1) + '</td>' +
        '<td style="padding:4px 8px; border:1px solid #ddd;">' + (r.tanggalPO ? r.tanggalPO.split('-').reverse().join('/') : '-') + '</td>' +
        '<td style="padding:4px 8px; border:1px solid #ddd;">' + escapeHtmlAttr(r.nomorPO) + '</td>' +
        '<td style="padding:4px 8px; border:1px solid #ddd;">' + escapeHtmlAttr(r.supplier) + '</td>' +
        '<td style="padding:4px 8px; border:1px solid #ddd; text-align:right;">' + formatGram(r.qtyPO) + '</td>' +
        '<td style="padding:4px 8px; border:1px solid #ddd; text-align:right;">' + formatGram(r.diterima) + '</td>' +

        '</tr>';
    }).join('');
    capture.innerHTML = '<div style="font-family:Arial,sans-serif; padding:16px; background:#fff;">' +
      '<div style="font-size:16px; font-weight:800; margin-bottom:4px;">Detail Outstanding PO — Gold in Transit</div>' +
      '<div style="font-size:12px; color:#555; margin-bottom:12px;">Posisi per ' + gitPosisiLabel_(gitData.posisi) + '</div>' +
      '<table style="border-collapse:collapse; width:100%; font-size:11px;">' +
      '<thead><tr style="background:#046A38; color:#fff;">' +
      '<th style="padding:5px 8px; border:1px solid #ddd;">No</th><th style="padding:5px 8px; border:1px solid #ddd;">Tanggal PO</th><th style="padding:5px 8px; border:1px solid #ddd;">Nomor PO</th><th style="padding:5px 8px; border:1px solid #ddd;">Supplier</th><th style="padding:5px 8px; border:1px solid #ddd;">Gramasi PO</th><th style="padding:5px 8px; border:1px solid #ddd;">Diterima</th><th style="padding:5px 8px; border:1px solid #ddd;">Gold in Transit</th><th style="padding:5px 8px; border:1px solid #ddd;">Aging</th><th style="padding:5px 8px; border:1px solid #ddd;">Status</th>' +
      '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';

    if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { showToast('Modul export PDF tidak tersedia', 'error'); return; }

    html2canvas(capture, { scale: 2, backgroundColor: '#ffffff', useCORS: true, windowWidth: capture.scrollWidth, windowHeight: capture.scrollHeight })
      .then(function (canvas) {
        const imgData = canvas.toDataURL('image/png', 1.0);
        const { jsPDF } = window.jspdf;
        const pdfWidth = 841.89; // A4 landscape pt
        const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
        const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [pdfWidth, pdfHeight], compress: false });
        pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');
        pdf.save('Detail Outstanding PO - posisi ' + gitData.posisi + '.pdf');
        showToast('PDF berhasil diunduh', 'success');
      }).catch(function () { showToast('Gagal membuat PDF', 'error'); });
