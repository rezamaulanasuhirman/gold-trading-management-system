  // ============================================================
  const SPT_SUPPLIER_LIST = ['HRTA', 'IGS', 'SJL', 'IDN', 'MKB/STRGLD', 'LOTUS', 'APEPI', 'Penetapan Harga'];
  const SPT_SUPPLIER_COLORS = { 'HRTA': '#046A38', 'IGS': '#C9A227', 'SJL': '#2563EB', 'IDN': '#DC2626', 'MKB/STRGLD': '#7C3AED', 'LOTUS': '#0D9488', 'APEPI': '#EA580C', 'Penetapan Harga': '#DB2777' };
  // Sentra Buyback — benchmark pasar (BUKAN supplier), sengaja dipisah
  // dari SPT_SUPPLIER_LIST/SPT_SUPPLIER_COLORS supaya tidak pernah ikut
  // dihitung sebagai supplier di mana pun (backend juga sudah memisahkan
  // supplierList vs benchmarkList). Warna ungu #9333EA dipakai karena
  // #7C3AED (usulan awal) sudah dipakai MKB/STRGLD — supaya tetap
  // berbeda dari semua warna supplier & Penetapan Harga yang ada.
  const SPT_BENCHMARK_LIST = ['Sentra Buyback'];
  const SPT_BENCHMARK_COLORS = { 'Sentra Buyback': '#9333EA' };
  let sptSelectedSuppliers = new Set(SPT_SUPPLIER_LIST.concat(SPT_BENCHMARK_LIST));
  let sptLastData = null;
  let sptLegendClickTimer = null;

  function initSupplierPriceChips() {
    const box = document.getElementById('spt-supplier-checks');
    if (!box || box.dataset.initialized) return;
    box.dataset.initialized = '1';
    box.innerHTML = SPT_SUPPLIER_LIST.concat(SPT_BENCHMARK_LIST).map(function (s) {
      const color = SPT_SUPPLIER_COLORS[s] || SPT_BENCHMARK_COLORS[s] || '#888';
      return '<div class="spt-supplier-chip active" data-supplier="' + s + '" onclick="toggleSptSupplier(this, \'' + s + '\')">' +
        '<span class="dot" style="background:' + color + '"></span>' + s + '</div>';
    }).join('');
  }

  function toggleSptSupplier(el, supplier) {
    if (sptSelectedSuppliers.has(supplier)) {
      sptSelectedSuppliers.delete(supplier);
      el.classList.remove('active');
    } else {
      sptSelectedSuppliers.add(supplier);
      el.classList.add('active');
    }
    if (sptLastData) renderSupplierPriceChart(sptLastData);
  }

  function loadSupplierPriceTrend() {
    initSupplierPriceChips();
    const startEl = document.getElementById('spt-start-date');
    const endEl = document.getElementById('spt-end-date');
    if (endEl && !endEl.value) endEl.value = todayISO();
    if (startEl && !startEl.value) {
      const d = new Date();
      d.setDate(d.getDate() - 30);
      startEl.value = d.toISOString().slice(0, 10);
    }
    const start = startEl.value, end = endEl.value;
    const freq = document.getElementById('spt-frequency').value;

    google.script.run.withSuccessHandler(function (data) {
      sptLastData = data;
      renderSupplierPriceChart(data);
    }).withFailureHandler(handleLoadError).getSupplierPriceTimeSeries(start, end, freq);

    google.script.run.withSuccessHandler(renderSupplierPriceKpiInsight).withFailureHandler(handleLoadError).getSupplierPriceKpiAndInsights(start, end);

    loadBenchmarkPage();
  }

  function renderSupplierPriceChart(data) {
    if (!data || !data.dates || !data.dates.length) return;
    destroyChart('supplierPriceTrend');
    const ctx = document.getElementById('chart-supplier-price-page');
    if (!ctx) return;

    const datasets = data.supplierList
      .filter(function (s) { return sptSelectedSuppliers.has(s); })
      .map(function (s) {
        const color = SPT_SUPPLIER_COLORS[s] || '#888';
        return {
          label: s, data: data.series[s], borderColor: color, backgroundColor: color + '22',
          borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, tension: 0.25, spanGaps: true
        };
      })
      // Sentra Buyback — benchmark pasar (bukan supplier), tetap masuk
      // chart/legend/tooltip/zoom/export yang sama, dibedakan garis
      // putus-putus + warna ungu supaya jelas ini pembanding, bukan
      // supplier. spanGaps:false supaya tanggal tanpa data tetap
      // kosong/terputus (bukan diinterpolasi/dianggap 0).
      .concat((data.benchmarkList || [])
        .filter(function (s) { return sptSelectedSuppliers.has(s); })
        .map(function (s) {
          const color = SPT_BENCHMARK_COLORS[s] || '#9333EA';
          return {
            label: s, data: data.benchmarkSeries[s], borderColor: color, backgroundColor: color + '22',
            borderWidth: 2, borderDash: [6, 4], pointRadius: 2, pointHoverRadius: 5, tension: 0.25, spanGaps: false
          };
        }));

    charts.supplierPriceTrend = new Chart(ctx, {
      type: 'line',
      data: { labels: data.dates, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        onHover: function (evt, elements, chart) {
          chart.data.datasets.forEach(function (ds, i) {
            ds.borderWidth = elements.length && elements[0].datasetIndex === i ? 3.5 : 2;
          });
        },
        plugins: {
          legend: {
            position: 'top', labels: { boxWidth: 10, font: { size: 11 } },
            onClick: function (e, legendItem, legend) {
              const chart = legend.chart;
              const idx = legendItem.datasetIndex;
              if (sptLegendClickTimer) {
                clearTimeout(sptLegendClickTimer);
                sptLegendClickTimer = null;
                // Double click -> isolasi hanya dataset ini.
                chart.data.datasets.forEach(function (ds, i) { chart.setDatasetVisibility(i, i === idx); });
                chart.update();
              } else {
                sptLegendClickTimer = setTimeout(function () {
                  const meta = chart.getDatasetMeta(idx);
                  chart.setDatasetVisibility(idx, !chart.isDatasetVisible(idx));
                  chart.update();
                  sptLegendClickTimer = null;
                }, 250);
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                const supplier = ctx.dataset.label;
                const val = ctx.parsed.y;
                if (val == null) return supplier + ': -';
                const dsIndex = ctx.datasetIndex;
                const i = ctx.dataIndex;
                const arr = ctx.chart.data.datasets[dsIndex].data;
                let changeStr = '';
                if (i > 0 && arr[i - 1] != null) {
                  const diff = val - arr[i - 1];
                  const pct = arr[i - 1] ? (diff / arr[i - 1]) * 100 : 0;
                  changeStr = ' (' + (diff >= 0 ? '+' : '') + formatRupiah(diff) + ', ' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%)';
                }
                return supplier + ': ' + formatRupiah(val) + changeStr;
              }
            }
          },
          zoom: {
            pan: { enabled: true, mode: 'x' },
            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
          }
        },
        scales: {
          y: { ticks: { callback: v => formatRupiahShort(v) }, grid: { color: themeVar_('--color-border', '#f0f0f0') } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  function resetSupplierPriceZoom() {
    if (charts.supplierPriceTrend) charts.supplierPriceTrend.resetZoom();
  }

  /**
   * Format selisih rata-rata supplier vs rata-rata Sentra Buyback.
   * Hijau = supplier lebih rendah (di bawah), Merah = lebih tinggi
   * (di atas), Abu-abu = sama persis. null (data tidak cukup) -> ''.
   */
  function sptFormatDelta_(selisih) {
    if (selisih == null) return '';
    const rounded = Math.round(selisih);
    if (rounded === 0) return '<div class="spt-avg-item-delta equal">Sama dengan Sentra Buyback</div>';
    const cls = rounded < 0 ? 'below' : 'above';
    const kata = rounded < 0 ? 'di bawah' : 'di atas';
    return '<div class="spt-avg-item-delta ' + cls + '">' + formatRupiah(Math.abs(rounded)) + ' ' + kata + ' Sentra Buyback</div>';
  }

  /**
   * "Harga Rata-Rata per Supplier" — card per supplier (bukan
   * Sentra Buyback/Penetapan Harga, sudah difilter di backend),
   * diurutkan termurah->tertinggi, plus KPI kecil "Rata-Rata Sentra
   * Buyback" di header section yang sama.
   */
  function renderSptSupplierAverages_(res) {
    const wrap = document.getElementById('spt-supplier-avg-list');
    const sbEl = document.getElementById('spt-kpi-sentra-buyback');
    const list = (res && res.supplierAverages) || [];

    if (sbEl) {
      const sb = res && res.benchmarkAverages ? res.benchmarkAverages['Sentra Buyback'] : null;
      sbEl.textContent = sb ? (formatRupiah(sb.avg) + '/gr') : 'Tidak ada data';
    }

    if (!wrap) return;
    if (!list.length) { wrap.innerHTML = '<div class="recent-empty">Belum ada data pada periode ini</div>'; return; }

    wrap.innerHTML = list.map(function (r) {
      const color = SPT_SUPPLIER_COLORS[r.key] || '#888';
      const badge = r.isTermurah ? '<span class="spt-avg-item-badge termurah">Termurah</span>'
        : (r.isTertinggi ? '<span class="spt-avg-item-badge tertinggi">Tertinggi</span>' : '');
      const valueHtml = (r.avg != null)
        ? '<div class="spt-avg-item-value">' + formatRupiah(r.avg) + '/gr</div>'
        : '<div class="spt-avg-item-value muted">Tidak ada data</div>';
      return '<div class="spt-avg-item" style="border-left-color:' + color + ';">' +
        '<div class="spt-avg-item-head"><span class="dot" style="background:' + color + ';"></span>' +
        '<span class="spt-avg-item-name">' + r.key + '</span>' + badge + '</div>' +
        valueHtml + sptFormatDelta_(r.selisihVsSentraBuyback) +
        '</div>';
    }).join('');
  }

  function renderSupplierPriceKpiInsight(res) {
    if (!res) {
      document.getElementById('spt-insight-body').innerHTML = '<div class="recent-empty">Belum ada data pada periode ini</div>';
      renderSptSupplierAverages_(null);
      return;
    }
    document.getElementById('spt-kpi-jumlah').textContent = res.jumlahSupplier;
    document.getElementById('spt-kpi-terendah').textContent = res.cheapestToday ? res.cheapestToday + ' — ' + formatRupiah(res.cheapestTodayPrice) : '-';
    document.getElementById('spt-kpi-tertinggi').textContent = res.mostExpensiveToday ? res.mostExpensiveToday + ' — ' + formatRupiah(res.mostExpensiveTodayPrice) : '-';
    document.getElementById('spt-kpi-selisih').textContent = formatRupiah(res.selisihTerbesar);
    document.getElementById('spt-kpi-rata').textContent = formatRupiah(res.avgAll);
    document.getElementById('spt-kpi-spread').textContent = formatRupiah(res.avgSpread);

    const items = [];
    if (res.termurahPeriode) items.push({ icon: 'savings', title: 'Supplier Termurah Selama Periode', text: res.termurahPeriode.key + ' dengan rata-rata ' + formatRupiah(res.termurahPeriode.avg) + '/gr.' });
    if (res.palingStabil) items.push({ icon: 'balance', title: 'Supplier Paling Stabil', text: res.palingStabil.key + ' — deviasi harga terkecil (std dev ' + formatRupiah(res.palingStabil.stddev) + ').' });
    if (res.palingFluktuatif) items.push({ icon: 'trending_up', title: 'Supplier Paling Fluktuatif', text: res.palingFluktuatif.key + ' — deviasi harga terbesar (std dev ' + formatRupiah(res.palingFluktuatif.stddev) + ').' });
    if (res.palingSeringTermurah) items.push({ icon: 'military_tech', title: 'Paling Sering Jadi Harga Terbaik', text: res.palingSeringTermurah.key + ' — termurah pada ' + res.palingSeringTermurah.cheapestDays + ' hari dalam periode ini.' });
    if (res.trenNaik && res.trenNaik.length) items.push({ icon: 'arrow_upward', title: 'Supplier dengan Tren Naik', text: res.trenNaik.map(t => t.key + ' (+' + t.trendPct.toFixed(1) + '%)').join(', ') });
    if (res.trenTurun && res.trenTurun.length) items.push({ icon: 'arrow_downward', title: 'Supplier dengan Tren Turun', text: res.trenTurun.map(t => t.key + ' (' + t.trendPct.toFixed(1) + '%)').join(', ') });
    items.push({ icon: 'swap_horiz', title: 'Rata-rata Spread Antar Supplier', text: formatRupiah(res.avgSpread) + ' per hari (selisih harga tertinggi-terendah).' });

    document.getElementById('spt-insight-body').innerHTML = items.map(function (it) {
      return '<div class="spt-insight-item"><span class="material-symbols-rounded">' + it.icon + '</span>' +
        '<div><div class="spt-insight-title">' + it.title + '</div><div class="spt-insight-text">' + it.text + '</div></div></div>';
    }).join('');

    renderSptSupplierAverages_(res);
  }

  function exportSupplierPricePng() {
    if (!charts.supplierPriceTrend) { showToast('Belum ada chart untuk diexport', 'error'); return; }
    const link = document.createElement('a');
    link.href = charts.supplierPriceTrend.toBase64Image();
    link.download = 'Supplier Price Trend - ' + todayISO() + '.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function exportSupplierPricePdf() {
    const el = document.getElementById('spt-chart-card');
    if (!el || typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { showToast('Gagal memuat modul export PDF', 'error'); return; }
    showToast('Menyiapkan PDF...', 'success');
    html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true }).then(function (canvas) {
      const imgData = canvas.toDataURL('image/png', 1.0);
      const { jsPDF } = window.jspdf;
      const pdfWidth = 841.89, pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      const pdf = new jsPDF({ orientation: 'landscape', unit: 'pt', format: [pdfWidth, pdfHeight] });
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
      pdf.save('Supplier Price Trend - ' + todayISO() + '.pdf');
      showToast('PDF berhasil diunduh', 'success');
    }).catch(function () { showToast('Gagal membuat PDF', 'error'); });
  }

  function exportSupplierPriceExcel() {
    if (!sptLastData || typeof XLSX === 'undefined') { showToast('Belum ada data untuk diexport', 'error'); return; }
    const benchmarkList = sptLastData.benchmarkList || [];
    const header = ['Tanggal'].concat(sptLastData.supplierList).concat(benchmarkList.map(function (s) { return s + ' (Benchmark)'; }));
    const rows = sptLastData.dates.map(function (d, i) {
      return [d]
        .concat(sptLastData.supplierList.map(function (s) { return sptLastData.series[s][i]; }))
        .concat(benchmarkList.map(function (s) { return sptLastData.benchmarkSeries[s][i]; }));
    });
    const ws = XLSX.utils.aoa_to_sheet([header].concat(rows));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Supplier Price Trend');
    XLSX.writeFile(wb, 'Supplier Price Trend - ' + todayISO() + '.xlsx');
  }


  // ============================================================
  // PROFILE MITRA
  // ============================================================
  let mitraListData = [];
  let mitraSortField = null;
  let mitraSortDir = 1;
  let mitraCurrentPage = 1;
  const MITRA_PAGE_SIZE = 15;
  let mitraCurrentNama = null;

  function loadMitraList() {
    document.getElementById('mitra-table-body').innerHTML = '<tr><td colspan="12" class="recent-empty">Memuat...</td></tr>';
    google.script.run.withSuccessHandler(function (res) {
      mitraListData = res || [];
      mitraCurrentPage = 1;
      populateMitraSearchDropdown();
      renderMitraTable();
      if (mitraListData.length) openMitraDetail(mitraListData[0].namaPerusahaan, false);
    }).withFailureHandler(handleLoadError).getMitraList();
  }

  function populateMitraSearchDropdown() {
    const sel = document.getElementById('mitra-search');
    const currentVal = sel.value;
    const names = mitraListData.map(m => m.namaPerusahaan).sort((a, b) => a.localeCompare(b));
    sel.innerHTML = '<option value="">Semua Perusahaan</option>' +
      names.map(n => '<option value="' + n.replace(/"/g, '&quot;') + '">' + n + '</option>').join('');
    sel.value = currentVal;
  }

  function sortMitraTable(field) {
    if (mitraSortField === field) { mitraSortDir = -mitraSortDir; } else { mitraSortField = field; mitraSortDir = 1; }
    renderMitraTable();
  }

  function renderMitraTable() {
    const search = document.getElementById('mitra-search').value;
    const jenisFilter = document.getElementById('mitra-filter-jenis').value;
    const statusFilter = document.getElementById('mitra-filter-status').value;

    let filtered = mitraListData.filter(function (m) {
      if (search && m.namaPerusahaan !== search) return false;
      if (jenisFilter && m.jenisMitra !== jenisFilter) return false;
      if (statusFilter && m.statusAktif !== statusFilter) return false;
      return true;
    });

    if (mitraSortField) {
      filtered.sort(function (a, b) {
        let va = a[mitraSortField], vb = b[mitraSortField];
        if (va == null) va = -Infinity; if (vb == null) vb = -Infinity;
        if (typeof va === 'string') return va.localeCompare(vb) * mitraSortDir;
        return (va - vb) * mitraSortDir;
      });
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / MITRA_PAGE_SIZE));
    if (mitraCurrentPage > totalPages) mitraCurrentPage = totalPages;
    const start = (mitraCurrentPage - 1) * MITRA_PAGE_SIZE;
    const pageRows = filtered.slice(start, start + MITRA_PAGE_SIZE);

    const body = document.getElementById('mitra-table-body');
    if (!pageRows.length) {
      body.innerHTML = '<tr><td colspan="12" class="recent-empty">Tidak ada mitra yang cocok dengan filter ini</td></tr>';
    } else {
      body.innerHTML = pageRows.map(function (m) {
        const badgeClass = m.jenisMitra === 'Supplier' ? 'supplier' : m.jenisMitra === 'Buyer' ? 'buyer' : m.jenisMitra === 'Supplier & Buyer' ? 'both' : 'none';
        const statusClass = m.statusAktif === 'Nonaktif' ? 'nonaktif' : 'aktif';
        return '<tr>' +
          '<td><b>' + m.namaPerusahaan + '</b></td>' +
          '<td><span class="mitra-badge ' + badgeClass + '">' + m.jenisMitra + '</span></td>' +
          '<td>' + m.kategori + '</td>' +
          '<td><span class="mitra-badge ' + statusClass + '">' + m.statusAktif + '</span></td>' +
          '<td>' + m.kota + '</td>' +
          '<td>' + m.picUtama + '</td>' +
          '<td>' + (m.totalPembelian == null ? '-' : formatRupiah(m.totalPembelian)) + '</td>' +
          '<td>' + (m.totalPenjualan == null ? '-' : formatRupiah(m.totalPenjualan)) + '</td>' +
          '<td>' + m.statusPKS + '</td>' +
          '<td>' + m.sisaMasaPKS + '</td>' +
          '<td>' + m.companyVisitTerakhir + '</td>' +
          '<td><button class="btn btn-secondary" style="padding:5px 10px; font-size:11px;" onclick="openMitraDetail(\'' + m.namaPerusahaan.replace(/'/g, "\\'") + '\')">Lihat Detail</button></td>' +
          '</tr>';
      }).join('');
    }

    const pag = document.getElementById('mitra-pagination');
    if (!filtered.length) { pag.innerHTML = ''; return; }
    const showStart = start + 1;
    const showEnd = Math.min(start + MITRA_PAGE_SIZE, filtered.length);
    let pagHtml = '<div class="mitra-pagination-info">' + showStart + '-' + showEnd + ' dari ' + filtered.length + ' data</div><div class="mitra-pagination-pages">';
    pagHtml += '<div class="mitra-page-btn nav' + (mitraCurrentPage === 1 ? ' disabled' : '') + '" onclick="goToMitraPage(' + (mitraCurrentPage - 1) + ')">&laquo;</div>';
    const maxBtns = 5;
    let pStart = Math.max(1, mitraCurrentPage - 2), pEnd = Math.min(totalPages, pStart + maxBtns - 1);
    pStart = Math.max(1, pEnd - maxBtns + 1);
    if (pStart > 1) pagHtml += '<div class="mitra-page-btn" onclick="goToMitraPage(1)">1</div><span>...</span>';
    for (let i = pStart; i <= pEnd; i++) {
      pagHtml += '<div class="mitra-page-btn' + (i === mitraCurrentPage ? ' active' : '') + '" onclick="goToMitraPage(' + i + ')">' + i + '</div>';
    }
    if (pEnd < totalPages) pagHtml += '<span>...</span><div class="mitra-page-btn" onclick="goToMitraPage(' + totalPages + ')">' + totalPages + '</div>';
    pagHtml += '<div class="mitra-page-btn nav' + (mitraCurrentPage === totalPages ? ' disabled' : '') + '" onclick="goToMitraPage(' + (mitraCurrentPage + 1) + ')">&raquo;</div>';
    pagHtml += '</div>';
    pag.innerHTML = pagHtml;
  }

  function goToMitraPage(page) { mitraCurrentPage = page; renderMitraTable(); }

  function openMitraDetail(nama, scroll) {
    mitraCurrentNama = nama;
    document.getElementById('mitra-detail-nama').textContent = nama;
    document.getElementById('mitra-sidebar-logo').textContent = nama.replace(/^(PT|CV|UD)\.?\s+/i, '').slice(0, 2).toUpperCase();
    document.getElementById('mitra-detail-subtitle').innerHTML = '';
    google.script.run.withSuccessHandler(renderMitraDetail).withFailureHandler(handleLoadError).getMitraDetail(nama);
    showMitraTab('overview', document.querySelector('.mitra-tab'));
    if (scroll !== false) {
      document.getElementById('mitra-detail-view').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
  }

  function showMitraTab(tabId, el) {
    document.querySelectorAll('.mitra-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.mitra-tab-content').forEach(c => c.classList.remove('active'));
    if (el) el.classList.add('active');
    document.getElementById('mitra-tab-' + tabId).classList.add('active');
    if (tabId === 'pks' && mitraCurrentNama) loadMitraPKS();
    if (tabId === 'dokumen' && mitraCurrentNama) loadMitraDocuments();
  }

  function loadMitraPKS() {
    resetMitraPKSForm();
    document.getElementById('mitra-pks-list').innerHTML = '<div class="recent-empty">Memuat...</div>';
    google.script.run.withSuccessHandler(renderMitraPKS).withFailureHandler(handleLoadError).getMitraPKSList(mitraCurrentNama);
  }

  function renderMitraPKS(list) {
    list = list || [];
    const REMINDER_DAYS = [90, 60, 30, 14, 7];

    if (!list.length) {
      document.getElementById('mitra-pks-info').innerHTML = '<div class="recent-empty">Belum ada data PKS</div>';
      document.getElementById('mitra-pks-countdown-box').innerHTML = '';
      document.getElementById('mitra-pks-reminder').innerHTML = REMINDER_DAYS.map(d => '<span class="mitra-reminder-chip">H-' + d + '</span>').join('');
      document.getElementById('mitra-pks-list').innerHTML = '<div class="recent-empty">Belum ada riwayat PKS untuk mitra ini</div>';
      return;
    }

    const aktif = list[0]; // sudah terurut, PKS paling relevan di posisi pertama
    document.getElementById('mitra-pks-info').innerHTML =
      mitraInfoRow('Nomor PKS', aktif.nomorPKS) +
      mitraInfoRow('Nama PKS', aktif.namaPKS) +
      mitraInfoRow('Mulai', aktif.tanggalMulai) +
      mitraInfoRow('Berakhir', aktif.tanggalBerakhir) +
      mitraInfoRow('Jangka Waktu', aktif.jangkaWaktuHari != null ? aktif.jangkaWaktuHari + ' hari' : '-') +
      mitraInfoRow('Status', '<span class="mitra-badge ' + aktif.colorClass + '">' + aktif.status + '</span>');

    document.getElementById('mitra-pks-countdown-box').innerHTML =
      '<div class="mitra-pks-countdown"><div class="lbl">Sisa Masa PKS</div><div class="val">' +
      (aktif.sisaHari != null ? aktif.sisaHari + ' hari' : '-') + '</div>' +
      '<div class="sub">Berakhir pada ' + aktif.tanggalBerakhir + '</div></div>';

    document.getElementById('mitra-pks-reminder').innerHTML = REMINDER_DAYS.map(function (d) {
      const hit = aktif.reminderKena && aktif.reminderKena.indexOf(d) > -1;
      return '<span class="mitra-reminder-chip' + (hit ? ' hit' : '') + '">H-' + d + '</span>';
    }).join('');

    document.getElementById('mitra-pks-list').innerHTML = list.map(function (p) {
      return '<div class="mitra-pks-list-item">' +
        '<div class="row"><b>' + p.namaPKS + ' (' + p.nomorPKS + ')</b><span class="mitra-badge ' + p.colorClass + '">' + p.status + '</span></div>' +
        '<div style="font-size:12px; color:var(--color-text-muted);">' + p.tanggalMulai + ' s/d ' + p.tanggalBerakhir + ' &middot; Catatan: ' + p.catatanLegal + '</div>' +
        '<button class="btn btn-secondary" style="margin-top:8px; padding:5px 10px; font-size:11px;" onclick=\'editMitraPKS(' + JSON.stringify(p) + ')\'>Edit</button>' +
        '</div>';
    }).join('');
  }

  function resetMitraPKSForm() {
    document.getElementById('mitra-pks-form').innerHTML =
      '<input type="hidden" id="mpks-id" value="">' +
      '<div class="form-group"><label>Nomor PKS</label><input type="text" id="mpks-nomor"></div>' +
      '<div class="form-group"><label>Nama PKS</label><input type="text" id="mpks-nama"></div>' +
      '<div class="form-group"><label>Tanggal Mulai</label><input type="date" id="mpks-mulai"></div>' +
      '<div class="form-group"><label>Tanggal Berakhir</label><input type="date" id="mpks-akhir"></div>' +
      '<div class="form-group" style="grid-column:1/-1;"><label>Catatan Legal</label><textarea id="mpks-catatan" rows="2"></textarea></div>';

  function editMitraPKS(p) {
    resetMitraPKSForm();
    document.getElementById('mpks-id').value = p.pksId;
    document.getElementById('mpks-nomor').value = p.nomorPKS === '-' ? '' : p.nomorPKS;
    document.getElementById('mpks-nama').value = p.namaPKS === '-' ? '' : p.namaPKS;
    document.getElementById('mpks-mulai').value = p.tanggalMulai || '';
    document.getElementById('mpks-akhir').value = p.tanggalBerakhir || '';
    document.getElementById('mpks-catatan').value = p.catatanLegal === '-' ? '' : p.catatanLegal;

  function submitMitraPKS() {
    if (!mitraCurrentNama) return;
    const data = {
      pksId: document.getElementById('mpks-id').value || null,
      namaPerusahaan: mitraCurrentNama,
      nomorPKS: document.getElementById('mpks-nomor').value,
      namaPKS: document.getElementById('mpks-nama').value,
      tanggalMulai: document.getElementById('mpks-mulai').value,
      tanggalBerakhir: document.getElementById('mpks-akhir').value,
      catatanLegal: document.getElementById('mpks-catatan').value
    };

      showToast('PKS berhasil disimpan', 'success');
      loadMitraPKS();
      loadMitraList();
    }).withFailureHandler(handleLoadError).saveMitraPKS(data);

  // ---------------- Dokumen PKS ----------------
  let mitraDocEditingId = null;

  function loadMitraDocuments() {
    document.getElementById('mitra-doc-list').innerHTML = '<div class="recent-empty">Memuat...</div>';
    google.script.run.withSuccessHandler(renderMitraDocuments).withFailureHandler(handleLoadError).getMitraDocuments(mitraCurrentNama);
    google.script.run.withSuccessHandler(function (pksList) {
      const sel = document.getElementById('mdoc-pks');
      sel.innerHTML = '<option value="">- Tidak terkait PKS tertentu -</option>' +
        (pksList || []).map(p => '<option value="' + p.pksId + '">' + p.namaPKS + ' (' + p.nomorPKS + ')</option>').join('');
    }).withFailureHandler(handleLoadError).getMitraPKSList(mitraCurrentNama);
  }

  function docIconClass(namaDokumen) {
    const ext = (namaDokumen || '').split('.').pop().toLowerCase();
    if (ext === 'pdf') return { cls: 'pdf', icon: 'picture_as_pdf' };
    if (['jpg', 'jpeg', 'png', 'gif'].indexOf(ext) > -1) return { cls: 'image', icon: 'image' };
    if (['doc', 'docx'].indexOf(ext) > -1) return { cls: 'doc', icon: 'description' };
    return { cls: 'other', icon: 'insert_drive_file' };
  }

  function renderMitraDocuments(list) {
    list = list || [];
    const box = document.getElementById('mitra-doc-list');
    if (!list.length) { box.innerHTML = '<div class="recent-empty">Belum ada dokumen untuk mitra ini</div>'; return; }

    box.innerHTML = list.map(function (d) {
      const iconInfo = docIconClass(d.namaDokumen);
      const statusBadge = d.statusDokumen === 'Diarsipkan' ? 'arsip' : 'aktif';
      let actions = '';
      if (d.fileExists) {
        actions += '<a class="btn btn-secondary" href="' + d.viewUrl + '" target="_blank">Preview</a>';
        actions += '<a class="btn btn-secondary" href="' + d.viewUrl + '" target="_blank">Buka di Drive</a>';
        actions += '<a class="btn btn-secondary" href="' + d.downloadUrl + '" target="_blank">Download</a>';
      } else {
        actions += '<span style="font-size:11px; color:var(--color-danger);">File tidak ditemukan di Drive</span>';
      }
      actions += '<button class="btn btn-secondary" onclick=\'openEditMitraDocument(' + JSON.stringify(d) + ')\'>Edit Info</button>';
      if (d.statusDokumen !== 'Diarsipkan') {
        actions += '<button class="btn btn-secondary" onclick="confirmArchiveDocument(\'' + d.docId + '\')">Arsipkan</button>';
      }

      return '<div class="mitra-doc-item">' +
        '<div class="mitra-doc-icon ' + iconInfo.cls + '"><span class="material-symbols-rounded">' + iconInfo.icon + '</span></div>' +
        '<div class="mitra-doc-info">' +
        '<div class="mitra-doc-name">' + d.namaDokumen + ' <span class="mitra-badge ' + statusBadge + '">' + d.statusDokumen + '</span></div>' +
        '<div class="mitra-doc-meta">' + d.jenisDokumen + ' &middot; v' + d.versi + ' &middot; Tgl Dokumen: ' + d.tanggalDokumen + ' &middot; Upload: ' + d.tanggalUpload + ' oleh ' + d.pengunggah + '</div>' +
        (d.catatan !== '-' ? '<div class="mitra-doc-meta">Catatan: ' + d.catatan + '</div>' : '') +
        '<div class="mitra-doc-actions">' + actions + '</div>' +
        '</div></div>';
    }).join('');
  }

  function resetMitraDocForm() {
    mitraDocEditingId = null;
    document.getElementById('mdoc-file').value = '';
    document.getElementById('mdoc-nama').value = '';
    document.getElementById('mdoc-jenis').value = 'PKS Utama';
    document.getElementById('mdoc-versi').value = '1.0';
    document.getElementById('mdoc-tanggal').value = '';
    document.getElementById('mdoc-catatan').value = '';
  }

  function openEditMitraDocument(d) {
    mitraDocEditingId = d.docId;
    document.getElementById('mdoc-nama').value = d.namaDokumen === '-' ? '' : d.namaDokumen;
    document.getElementById('mdoc-jenis').value = d.jenisDokumen;
    document.getElementById('mdoc-versi').value = d.versi === '-' ? '' : d.versi;
    document.getElementById('mdoc-tanggal').value = d.tanggalDokumen === '-' ? '' : d.tanggalDokumen;
    document.getElementById('mdoc-catatan').value = d.catatan === '-' ? '' : d.catatan;
    showToast('Mode edit info dokumen "' + d.namaDokumen + '" — ubah field lalu klik Upload/Simpan (file tidak perlu dipilih ulang)', 'success');
    document.getElementById('mdoc-file').closest('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function submitMitraDocument() {
    if (!mitraCurrentNama) return;
    const fileInput = document.getElementById('mdoc-file');

    if (mitraDocEditingId) {
      google.script.run.withSuccessHandler(function () {
        showToast('Info dokumen berhasil diperbarui', 'success');
        resetMitraDocForm();
        loadMitraDocuments();
      }).withFailureHandler(handleLoadError).updateMitraDocumentInfo({
        docId: mitraDocEditingId,
        namaDokumen: document.getElementById('mdoc-nama').value,
        jenisDokumen: document.getElementById('mdoc-jenis').value,
        versi: document.getElementById('mdoc-versi').value,
        tanggalDokumen: document.getElementById('mdoc-tanggal').value,
        catatan: document.getElementById('mdoc-catatan').value
      });
      return;
    }

    if (!fileInput.files || !fileInput.files.length) { showToast('Pilih file terlebih dahulu', 'error'); return; }
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = function (e) {
      const base64 = e.target.result.split(',')[1];
      showToast('Mengupload dokumen...', 'success');
      google.script.run.withSuccessHandler(function () {
        showToast('Dokumen berhasil diupload', 'success');
        resetMitraDocForm();
        loadMitraDocuments();
      }).withFailureHandler(handleLoadError).uploadMitraDocument({
        namaPerusahaan: mitraCurrentNama,
        pksId: document.getElementById('mdoc-pks').value,
        namaDokumen: document.getElementById('mdoc-nama').value || file.name,
        jenisDokumen: document.getElementById('mdoc-jenis').value,
        versi: document.getElementById('mdoc-versi').value,
        tanggalDokumen: document.getElementById('mdoc-tanggal').value,
        catatan: document.getElementById('mdoc-catatan').value,
        fileName: file.name,
        mimeType: file.type,
        base64Data: base64
      });
    };
    reader.readAsDataURL(file);
  }

  function confirmArchiveDocument(docId) {
    if (!confirm('Arsipkan dokumen ini? File tidak akan dihapus dari Drive, hanya statusnya berubah menjadi Diarsipkan.')) return;
    google.script.run.withSuccessHandler(function () {
      showToast('Dokumen diarsipkan', 'success');
      loadMitraDocuments();
    }).withFailureHandler(handleLoadError).archiveMitraDocument(docId);
  }

  function mitraInfoRow(label, value) {
    return '<div class="mitra-info-row"><span class="label">' + label + '</span><span class="value">' + (value || '-') + '</span></div>';
  }

  function renderMitraDetail(data) {
    if (!data) { showToast('Data mitra tidak ditemukan', 'error'); closeMitraDetail(); return; }

    const badgeClass = data.jenisMitra === 'Supplier' ? 'supplier' : data.jenisMitra === 'Buyer' ? 'buyer' : data.jenisMitra === 'Supplier & Buyer' ? 'both' : 'none';
    document.getElementById('mitra-detail-subtitle').innerHTML =
      '<span class="mitra-badge ' + badgeClass + '">' + data.jenisMitra + '</span>' +
      '<span class="mitra-badge ' + (data.statusAktif === 'Nonaktif' ? 'nonaktif' : 'aktif') + '">' + data.statusAktif + '</span>' +
      (data.mitraId ? '<span style="color:var(--color-text-muted); font-size:11px;">ID: ' + data.mitraId + '</span>' : '');

    document.getElementById('mitra-info-umum').innerHTML =
      mitraInfoRow('Nama Perusahaan', data.namaPerusahaan) +
      mitraInfoRow('Jenis Mitra', data.jenisMitra) +
      mitraInfoRow('Kategori', data.kategori) +
      mitraInfoRow('Status', data.statusAktif) +
      mitraInfoRow('NPWP', data.npwp) +
      mitraInfoRow('Kota', data.kota) +
      mitraInfoRow('Alamat', data.alamat);

    document.getElementById('mitra-info-kontak').innerHTML =
      mitraInfoRow('PIC Utama', data.picUtama) +
      mitraInfoRow('HP PIC', data.hpPIC) +
      mitraInfoRow('Email PIC', data.emailPIC) +
      mitraInfoRow('Telepon', data.phone) +
      mitraInfoRow('Nama Bank', data.namaBank) +
      mitraInfoRow('No Rekening', data.noRekening) +
      mitraInfoRow('Website', data.website);

    document.getElementById('mitra-info-produk').innerHTML =
      mitraInfoRow('Jenis Produk', data.jenisProduk) +
      mitraInfoRow('Merek Emas', data.merekEmas) +
      mitraInfoRow('Lokasi Pabrik', data.lokasiPabrik) +
      mitraInfoRow('Lokasi Gudang', data.lokasiGudang) +
      mitraInfoRow('Catatan', data.catatan);

    document.getElementById('mitra-edit-form').innerHTML =
      '<div class="form-group"><label>Jenis Mitra (Override)</label><select id="mf-jenis"><option value="">Otomatis dari transaksi</option><option value="Supplier">Supplier</option><option value="Buyer">Buyer</option><option value="Supplier & Buyer">Supplier & Buyer</option></select></div>' +
      '<div class="form-group"><label>Kategori</label><input type="text" id="mf-kategori" value="' + (data.kategori === '-' ? '' : data.kategori) + '"></div>' +
      '<div class="form-group"><label>Status Aktif</label><select id="mf-status"><option value="Aktif">Aktif</option><option value="Nonaktif">Nonaktif</option></select></div>' +
      '<div class="form-group"><label>Website</label><input type="text" id="mf-website" value="' + (data.website === '-' ? '' : data.website) + '"></div>' +
      '<div class="form-group"><label>Jenis Produk</label><input type="text" id="mf-jenisproduk" value="' + (data.jenisProduk === '-' ? '' : data.jenisProduk) + '"></div>' +
      '<div class="form-group"><label>Merek Emas</label><input type="text" id="mf-merek" value="' + (data.merekEmas === '-' ? '' : data.merekEmas) + '"></div>' +
      '<div class="form-group"><label>Lokasi Pabrik</label><input type="text" id="mf-pabrik" value="' + (data.lokasiPabrik === '-' ? '' : data.lokasiPabrik) + '"></div>' +
      '<div class="form-group"><label>Lokasi Gudang</label><input type="text" id="mf-gudang" value="' + (data.lokasiGudang === '-' ? '' : data.lokasiGudang) + '"></div>' +
      '<div class="form-group" style="grid-column:1/-1;"><label>Catatan</label><textarea id="mf-catatan" rows="2">' + (data.catatan === '-' ? '' : data.catatan) + '</textarea></div>';
    document.getElementById('mf-jenis').value = data.jenisMitra === 'Belum ada transaksi' ? '' : (['Supplier', 'Buyer', 'Supplier & Buyer'].indexOf(data.jenisMitra) > -1 ? '' : data.jenisMitra);
    document.getElementById('mf-status').value = data.statusAktif === 'Nonaktif' ? 'Nonaktif' : 'Aktif';

    // Tab Transaksi
    const s = data.summary || {};
    const showPembelian = data.jenisMitra === 'Supplier' || data.jenisMitra === 'Supplier & Buyer';
    const showPenjualan = data.jenisMitra === 'Buyer' || data.jenisMitra === 'Supplier & Buyer';
    let kpiHtml = '';
    function kpiCard(icon, iconClass, label, val, sub) {
      return '<div class="card mitra-kpi-icon-card">' +
        '<div class="mitra-kpi-top"><div><div class="mini-kpi-label">' + label + '</div><div class="mitra-kpi-val">' + val + '</div></div>' +
        '<div class="mitra-kpi-icon ' + iconClass + '"><span class="material-symbols-rounded">' + icon + '</span></div></div>' +
        '<div class="mitra-kpi-sub">' + sub + '</div></div>';
    }
    if (showPembelian) {
      kpiHtml += kpiCard('shopping_cart', 'gold', 'Total Pembelian', formatRupiah(s.pembelian.totalNominal), 'Volume ' + formatGram(s.pembelian.totalGram) + ' &middot; ' + s.pembelian.jumlahTransaksi + ' transaksi');
    }
    if (showPenjualan) {
      kpiHtml += kpiCard('sell', 'purple', 'Total Penjualan', formatRupiah(s.penjualan.totalNominal), 'Volume ' + formatGram(s.penjualan.totalGram) + ' &middot; ' + s.penjualan.jumlahTransaksi + ' transaksi');
    }
    if (s.piutang && s.piutang.totalGramasi) {
      kpiHtml += kpiCard('account_balance_wallet', '', 'Piutang', formatRupiah(s.piutang.totalValuasi), formatGram(s.piutang.totalGramasi) + ' outstanding');
    }
    document.getElementById('mitra-transaksi-kpi').innerHTML = kpiHtml || '<div class="recent-empty">Belum ada transaksi tercatat</div>';

    const pjBody = document.getElementById('mitra-pembelian-body');
    if (showPembelian && s.pembelian.rows.length) {
      pjBody.innerHTML = s.pembelian.rows.map(r => '<tr><td>' + extractDateShort(r.Tanggal) + '</td><td>' + (r.NomorPO || '-') + '</td><td>' + formatGram(r.Qty) + '</td><td>' + formatRupiah(r.TotalHarga) + '</td></tr>').join('');
    } else {
      pjBody.innerHTML = '<tr><td colspan="4" class="recent-empty">-</td></tr>';
    }

    const pnBody = document.getElementById('mitra-penjualan-body');
    if (showPenjualan && s.penjualan.rows.length) {
      pnBody.innerHTML = s.penjualan.rows.map(r => '<tr><td>' + extractDateShort(r.Tanggal) + '</td><td>' + (r.NomorInvoice || '-') + '</td><td>' + formatGram(r.Qty) + '</td><td>' + formatRupiah(r.TotalHarga) + '</td></tr>').join('');
    } else {
      pnBody.innerHTML = '<tr><td colspan="4" class="recent-empty">-</td></tr>';
    }
  }

  function extractDateShort(val) {
    if (!val) return '-';
    const s = String(val);
    return s.length >= 10 ? s.slice(0, 10) : s;
  }

<script>
  // ============================================================
  // PENETAPAN HARGA (BOBOT SUPPLIER) — prinsip sama dengan Gold
  // Studio: bobot per supplier (total 100%) -> System Reference
  // Price (rata-rata tertimbang) -> Harga Jual = Ref x (1+Margin%).
  // TANPA approval — submit langsung tersimpan.
  // ============================================================
  var phBobotList = [];

  // ============================================================
  // PRINT PENETAPAN HARGA — read-only, dibaca langsung dari sheet
  // Print_ V3 & sumbernya (lihat komentar audit lengkap di
  // Code.js: getPenetapanHargaTradingReguler/getPenetapanHargaAntam).
  // Tab Trading Reguler (Tanggal + Tahap Penetapan) dan ANTAM
  // (Tanggal + 11 denominasi, tanpa dimensi Tahap).
  // ============================================================
  var pphTab = 'trading';
  var pphLoadToken = 0;

  function setPphTab(tab) {
    pphTab = tab;
    document.getElementById('pph-tab-trading').classList.toggle('active', tab === 'trading');
    document.getElementById('pph-tab-antam').classList.toggle('active', tab === 'antam');
    document.getElementById('pph-tahap-controls').style.display = tab === 'trading' ? 'flex' : 'none';
    document.getElementById('pph-hargajual-trading').style.display = tab === 'trading' ? 'block' : 'none';
    document.getElementById('pph-hargajual-antam').style.display = tab === 'antam' ? 'block' : 'none';
    if (tab === 'trading') {
      refreshPphTahapOptions();
    } else {
      loadPrintPenetapanHarga();
    }
  }

  function onPphFilterChange() {
    if (pphTab === 'trading') {
      refreshPphTahapOptions();
    } else {
      loadPrintPenetapanHarga();
    }
  }

  function refreshPphTahapOptions() {
    const tanggalEl = document.getElementById('pph-tanggal');
    if (!tanggalEl.value) tanggalEl.value = todayISO();
    google.script.run
      .withSuccessHandler(function (options) {
        const sel = document.getElementById('pph-tahap-select');
        options = options || [];
        sel.innerHTML = options.length
          ? options.map(function (o) { return '<option value="' + o.tahap + '">' + o.label + '</option>'; }).join('')
          : '<option value="1">Penetapan Harga</option>';
        loadPrintPenetapanHarga();
      })
      .withFailureHandler(handleLoadError)
      .getPenetapanHargaTahapOptions(tanggalEl.value);
  }

  function loadPrintPenetapanHarga() {
    const tanggalEl = document.getElementById('pph-tanggal');
    if (!tanggalEl.value) tanggalEl.value = todayISO();
    const tanggal = tanggalEl.value;

    const reqToken = ++pphLoadToken;
    document.getElementById('pph-referensi-body').innerHTML = '<tr><td colspan="4" class="recent-empty">Memuat...</td></tr>';
    document.getElementById('pph-status-label-text').textContent = 'Memuat...';

    if (pphTab === 'trading') {
      const tahapSel = document.getElementById('pph-tahap-select');
      if (!tahapSel.options.length) { refreshPphTahapOptions(); return; }
      const tahap = Number(tahapSel.value) || 1;
      google.script.run
        .withSuccessHandler(function (data) { if (reqToken === pphLoadToken) renderPphTrading(data); })
        .withFailureHandler(handleLoadError)
        .getPenetapanHargaTradingReguler(tanggal, tahap);
    } else {
      google.script.run
        .withSuccessHandler(function (data) { if (reqToken === pphLoadToken) renderPphAntam(data); })
        .withFailureHandler(handleLoadError)
        .getPenetapanHargaAntam(tanggal);
    }
  }

  function pphReferensiRows_(referensi) {
    referensi = referensi || [];
    if (!referensi.length) return '<tr><td colspan="4" class="recent-empty">Belum ada data pada periode ini.</td></tr>';
    return referensi.map(function (r) {
      return '<tr><td>' + r.sumber + '</td><td>' + r.jenis + '</td><td>' + formatRupiah(r.harga) + '</td><td>' + r.satuan + '</td></tr>';
    }).join('');
  }

  function renderPphTrading(data) {
    pphLastData = data;
    pphLastMode = 'trading';
    document.getElementById('pph-referensi-subtitle').textContent = '9 sumber data — ' + data.tahapLabel;
    document.getElementById('pph-referensi-body').innerHTML = pphReferensiRows_(data.referensi);

    document.getElementById('pph-harga-penetapan').textContent = formatRupiah(data.hargaJual.hargaPenetapan);
    document.getElementById('pph-disc-manop').textContent = formatRupiah(data.hargaJual.maksDiscManop);
    document.getElementById('pph-disc-kadep').textContent = formatRupiah(data.hargaJual.maksDiscKadep);
    document.getElementById('pph-disc-kadiv').textContent = formatRupiah(data.hargaJual.maksDiscKadiv);

    renderPphDeposito(data.deposito);
    renderPphPiutang(data.piutang);

    document.getElementById('pph-status-label-text').textContent =
      'Trading Reguler — ' + formatDateIndo(data.tanggal) + ', ' + data.tahapLabel +
      (data.pukul ? ' · Pukul ' + data.pukul : '') +
      (data.hasData ? '' : ' (belum ada data untuk tanggal/tahap ini)');
  }

  function renderPphAntam(data) {
    pphLastData = data;
    pphLastMode = 'antam';
    document.getElementById('pph-referensi-subtitle').textContent = 'Harga acuan ANTAM per denominasi';
    const denominasi = data.denominasi || [];
    document.getElementById('pph-referensi-body').innerHTML = denominasi.length
      ? denominasi.map(function (d) { return '<tr><td>' + d.gramasi + ' gr</td><td>Fisik</td><td>' + formatRupiah(d.acuan) + '</td><td>Rupiah</td></tr>'; }).join('')
      : '<tr><td colspan="4" class="recent-empty">Belum ada data pada periode ini.</td></tr>';

  function pdfphFileName_(mode, data) {
    const parts = data.tanggal.split('-'); // yyyy-mm-dd

    const suffix = mode === 'trading' ? ('Tahap-' + data.tahap) : 'ANTAM';

  function downloadPenetapanHargaLaporan() {
    if (!pphLastData) { showToast('Data belum selesai dimuat, coba lagi sebentar', 'warning'); return; }
    if (typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { showToast('Modul export PDF tidak tersedia', 'error'); return; }

    showToast('Menyiapkan PDF...', 'success');

    pdfphEnsureAsset_(function (assets) {
      const capture = document.getElementById('pph-pdf-capture');
      capture.className = 'pdfph-page';
      capture.innerHTML = buildPenetapanHargaPdfHtml_(pphLastMode, pphLastData, assets);
      pdfphCaptureAndSave_(capture);
    });
  }

  function pdfphCaptureAndSave_(capture) {
    // Beri jeda 1 frame supaya layout, gambar, & font Material Symbols
    // selesai sebelum di-capture (sama seperti pola downloadLaporanPdf()).
    setTimeout(function () {
      html2canvas(capture, {
        scale: 3, backgroundColor: '#ffffff', useCORS: true,
        windowWidth: capture.scrollWidth, windowHeight: capture.scrollHeight
      }).then(function (canvas) {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });
        const pageWidth = pdf.internal.pageSize.getWidth();
        // SELALU pakai lebar penuh halaman A4 (tanpa letterbox kiri-kanan) --
        // margin kiri/kanan yang terlihat di PDF murni dari padding
        // .pdfph-page (~10mm), BUKAN dari sisa ruang hasil "fit ke tinggi
        // halaman" di sini. Kalau kontennya sedikit lebih tinggi dari 1
        // halaman A4, biar jsPDF yang memotong di batas halaman (bukan
        // di-shrink, supaya lebar tidak pernah menyusut/nge-letterbox).
        const ratio = canvas.height / canvas.width;
        const w = pageWidth;
        const h = w * ratio;
        const imgData = canvas.toDataURL('image/png', 1.0);
        pdf.addImage(imgData, 'PNG', 0, 0, w, h, undefined, 'FAST');
        pdf.save(pdfphFileName_(pphLastMode, pphLastData));
        showToast('PDF berhasil diunduh', 'success');
      }).catch(function (err) {
        console.error(err);
        showToast('Gagal membuat PDF laporan', 'error');
      });
    }, 60);
  }

  /**
   * Isi otomatis field Harga untuk baris indikator market (isMarket)
   * di tabel "Input Harga & Penetapan Hari Ini", memakai nilai live
   * yang sudah diambil loadMarketBenchmarkRef(). Aman dipanggil
   * kapan saja — field yang belum ada di DOM otomatis dilewati.
   */
  function applyMarketRefToInputTable() {
    if (!phMarketRef) return;
    phBobotList.forEach(function (b) {
      if (!b.isMarket || !b.marketKey) return;
      const val = phMarketRef[b.marketKey];
      const el = document.getElementById('ph-harga-' + b.supplierId);
      if (el && val != null) {
        el.value = Math.round(Number(val)).toLocaleString('id-ID');
        calcPenetapanHarga();
      }
    });
  }

  function calcTotalBobot() {
    let total = 0;
    phBobotList.forEach(function (b, i) {
      const aktifEl = document.getElementById('bobot-aktif-' + i);
      const valEl = document.getElementById('bobot-val-' + i);
      if (aktifEl && aktifEl.checked && valEl) total += Number(valEl.value) || 0;
    });
    total = Math.round(total * 100) / 100;
    const el = document.getElementById('ph-total-bobot');
    if (el) {
      el.textContent = total + '%';
      el.style.color = Math.abs(total - 100) < 0.01 ? 'var(--color-success)' : (total > 100 ? 'var(--color-danger)' : 'var(--color-warning)');
    }
    return total;
  }

  function autoDistribusiBobot() {
    const aktifIdx = [];
    phBobotList.forEach(function (b, i) {
      const aktifEl = document.getElementById('bobot-aktif-' + i);
      if (aktifEl && aktifEl.checked) aktifIdx.push(i);
    });
    if (!aktifIdx.length) { showToast('Aktifkan minimal satu supplier dulu', 'warning'); return; }
    const each = Math.floor((100 / aktifIdx.length) * 100) / 100;
    const last = Math.round((100 - each * (aktifIdx.length - 1)) * 100) / 100;
    aktifIdx.forEach(function (idx, pos) {
      const valEl = document.getElementById('bobot-val-' + idx);
      if (valEl) valEl.value = pos === aktifIdx.length - 1 ? last : each;
    });
    calcTotalBobot();
    calcPenetapanHarga();
  }

      const diskonAttrs = b.isMarket ? ' readonly value="0" title="Diskon tidak berlaku untuk indikator market"' : '';
      return '<tr><td><b>' + b.nama + '</b>' + badge + '</td>' +
        '<td><input type="number" class="date-picker-input" style="width:90px;" id="bobot-val-' + i + '" value="' + b.bobot + '" min="0" max="100" step="0.01" oninput="calcTotalBobot(); calcPenetapanHarga();"></td>' +
        '<td><input type="checkbox" id="bobot-aktif-' + i + '" ' + (b.aktif ? 'checked' : '') + ' onchange="calcTotalBobot(); calcPenetapanHarga();"></td>' +
        '<td><input type="text" inputmode="numeric" class="date-picker-input" style="width:130px;"' + hargaAttrs + ' id="ph-harga-' + b.supplierId + '" oninput="formatCurrencyInput(this); calcPenetapanHarga();" placeholder="0"></td>' +
        '<td><input type="text" inputmode="numeric" class="date-picker-input" style="width:110px;"' + diskonAttrs + ' id="ph-diskon-' + b.supplierId + '" oninput="formatCurrencyInput(this); calcPenetapanHarga();" placeholder="0"></td></tr>';
    }).join('');
    calcTotalBobot();
    calcPenetapanHarga();
    applyMarketRefToInputTable();
  }

  function collectPenetapanHargaItems() {
    return phBobotList.map(function (b, i) {
      const bobotEl = document.getElementById('bobot-val-' + i);
      const bobot = bobotEl ? (Number(bobotEl.value) || 0) : b.bobot;
      const hargaEl = document.getElementById('ph-harga-' + b.supplierId);
      const diskonEl = document.getElementById('ph-diskon-' + b.supplierId);
      const harga = hargaEl ? getCurrencyValue(hargaEl) : 0;
      const diskon = diskonEl ? getCurrencyValue(diskonEl) : 0;
      const hargaBase = harga - diskon;
      return { supplierId: b.supplierId, nama: b.nama, harga: harga, diskon: diskon, hargaBase: hargaBase, bobot: bobot, aktif: hargaBase > 0 };
    });
  }

  function calcPenetapanHarga() {
    const items = collectPenetapanHargaItems();
    const margin = Number((document.getElementById('ph-margin') || { value: 0 }).value) || 0;

    const rowsBox = document.getElementById('ph-preview-rows');
    if (rowsBox) {
      rowsBox.innerHTML = items.filter(function (i) { return i.harga > 0; }).map(function (i) {
        return '<div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--color-text-muted);"><span>' + i.nama + ' (' + i.bobot + '%)</span><span>' + formatRupiah(i.hargaBase) + '</span></div>';
      }).join('') || '<div class="recent-empty">Isi harga supplier untuk melihat kalkulasi</div>';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        document.getElementById('ph-sys-ref').textContent = formatRupiah(res.sysRefPrice);
        document.getElementById('ph-harga-jual').textContent = formatRupiah(res.hargaJual);
        renderBreakdownMargin(items, res.hargaJual);
      })
      .withFailureHandler(handleLoadError)
      .previewPenetapanHargaBobot(items, margin);
  }

  function renderBreakdownMargin(items, hargaJual) {
    const body = document.getElementById('ph-breakdown-body');
    if (!body) return;
    const isiItems = items.filter(function (i) { return i.harga > 0; });
    if (!isiItems.length || !hargaJual) {
      body.innerHTML = '<tr><td colspan="7" class="recent-empty">Isi harga supplier untuk melihat breakdown</td></tr>';
      return;
    }
    body.innerHTML = isiItems.map(function (i) {
      const marginRp = hargaJual - i.hargaBase;
      const marginPct = i.hargaBase ? (marginRp / i.hargaBase) * 100 : 0;
      const marginColor = marginRp >= 0 ? 'var(--color-success)' : 'var(--color-danger)';
      return '<tr><td><b>' + i.nama + '</b></td><td>' + i.bobot + '%</td>' +
        '<td>' + formatRupiah(i.harga) + '</td><td>' + formatRupiah(i.diskon) + '</td>' +
        '<td>' + formatRupiah(i.hargaBase) + '</td>' +
        '<td style="color:' + marginColor + '; font-weight:700;">' + formatRupiah(marginRp) + '</td>' +
        '<td style="color:' + marginColor + '; font-weight:700;">' + marginPct.toFixed(2) + '%</td></tr>';
    }).join('');
  }

  function submitPenetapanHarga() {
    const items = collectPenetapanHargaItems();
    const margin = Number((document.getElementById('ph-margin') || { value: 0 }).value) || 0;
    const isiCount = items.filter(function (i) { return i.aktif; }).length;
    if (!isiCount) { showToast('Isi minimal satu harga supplier', 'warning'); return; }

    google.script.run
      .withSuccessHandler(function (res) {
        showToast('Penetapan harga tersimpan — Harga Jual ' + formatRupiah(res.hargaJual), 'success');
        loadPenetapanHargaHistory();
      })
      .withFailureHandler(function (err) { showToast('Gagal menyimpan: ' + (err.message || err), 'error'); })
      .submitPenetapanHargaBobot({ hargaSupplier: items, margin: margin });
  }

  function renderHutTimeline(byMonth) {
    const box = document.getElementById('hut-timeline');

        '<div class="hut-timeline-month-label">' + m.label + '</div>' +

  function submitHutFormModal() {
    const id = document.getElementById('hut-form-id').value;
    const isEdit = !!id;
    const nama = document.getElementById('hut-form-nama').value.trim();
    const kategori = document.getElementById('hut-form-kategori').value;
    const jenisPerusahaan = document.getElementById('hut-form-jenis').value;
    const tanggalBerdiri = document.getElementById('hut-form-tanggal').value;
    const emailPic = document.getElementById('hut-form-email').value.trim();
    const statusAktif = document.getElementById('hut-form-status').value;
    const keterangan = document.getElementById('hut-form-keterangan').value.trim();

    if (!nama) { showToast('Nama perusahaan wajib diisi', 'warning'); return; }
    if (!tanggalBerdiri) { showToast('Tanggal berdiri wajib diisi', 'warning'); return; }
    if (tanggalBerdiri > todayISO()) { showToast('Tanggal berdiri tidak boleh melebihi tanggal hari ini', 'warning'); return; }
    if (!jenisPerusahaan) { showToast('Jenis Perusahaan wajib dipilih', 'warning'); return; }

    if (!confirm(isEdit ? 'Simpan perubahan data perusahaan ini?' : 'Tambahkan perusahaan ini?')) return;

    const data = {
      nama: nama, kategori: kategori, jenisPerusahaan: jenisPerusahaan,
      tanggalBerdiri: tanggalBerdiri, emailPic: emailPic, statusAktif: statusAktif, keterangan: keterangan
    };
    const btn = document.getElementById('hut-form-save-btn');
    setButtonLoading(btn, true);

    const onSuccess = function () {
      setButtonLoading(btn, false);
      closeHutFormModal();
      showToast(isEdit ? 'Data perusahaan berhasil diperbarui.' : 'Perusahaan berhasil ditambahkan.', 'success');
      loadRundownHutPage();
    };
    const onFailure = function (err) {
      setButtonLoading(btn, false);
      showToast('Gagal menyimpan: ' + (err.message || err), 'error');
    };

    if (isEdit) {
      google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).updateMasterHut(id, data);
    } else {
      google.script.run.withSuccessHandler(onSuccess).withFailureHandler(onFailure).addMasterHut(data);
    }
  }

  function deleteHutEntry(id, nama) {
    if (!confirm('Hapus data perusahaan "' + nama + '" dari Rundown HUT? Tindakan ini tidak bisa dibatalkan.')) return;
    google.script.run
      .withSuccessHandler(function () {

      .withFailureHandler(function (err) { showToast('Gagal menghapus: ' + (err.message || err), 'error'); })
      .deleteMasterHut(id);
