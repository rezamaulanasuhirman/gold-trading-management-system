</script>

<script>
  // ============================================================
  // PENETAPAN HARGA (BOBOT SUPPLIER) — prinsip sama dengan Gold
  // Studio: bobot per supplier (total 100%) -> System Reference
  // Price (rata-rata tertimbang) -> Harga Jual = Ref x (1+Margin%).
  // TANPA approval — submit langsung tersimpan.
  // ============================================================
  var phBobotList = [];

  function loadPenetapanHargaPage() {
    document.getElementById('ph-harga-table-body').innerHTML = '<tr><td colspan="5" class="recent-empty">Memuat...</td></tr>';
    google.script.run
      .withSuccessHandler(function (list) {
        phBobotList = list || [];
        renderPenetapanHargaInputTable(phBobotList);
      })
      .withFailureHandler(handleLoadError)
      .getBobotSupplierList();

    loadPenetapanHargaHistory();
    loadMarketBenchmarkRef();
  }

  var phMarketRef = null;

  function loadMarketBenchmarkRef() {
    ['ref-spotgold', 'ref-xauidrk', 'ref-lbma', 'ref-kitco', 'ref-kursjual', 'ref-kursbeli', 'ref-rplbma', 'ref-rpkitco'].forEach(function (id) {
      const el = document.getElementById(id);
      if (el) el.textContent = '...';
    });
    google.script.run
      .withSuccessHandler(function (ref) {
        phMarketRef = ref;
        document.getElementById('ref-spotgold').textContent = ref && ref.spotGold != null ? formatRupiah(ref.spotGold) : '-';
        document.getElementById('ref-xauidrk').textContent = ref && ref.xauIdr != null ? formatRupiah(ref.xauIdr) : '-';
        document.getElementById('ref-lbma').textContent = ref && ref.lbma != null ? formatUsd(ref.lbma) : '-';
        document.getElementById('ref-kitco').textContent = ref && ref.kitco != null ? formatUsd(ref.kitco) : '-';
        document.getElementById('ref-kursjual').textContent = ref && ref.kursJual != null ? formatRupiah(ref.kursJual) : '-';
        document.getElementById('ref-kursbeli').textContent = ref && ref.kursBeli != null ? formatRupiah(ref.kursBeli) : '-';
        document.getElementById('ref-rplbma').textContent = ref && ref.rpLbma != null ? formatRupiah(ref.rpLbma) : '-';
        document.getElementById('ref-rpkitco').textContent = ref && ref.rpKitco != null ? formatRupiah(ref.rpKitco) : '-';
        applyMarketRefToInputTable();
      })
      .withFailureHandler(handleLoadError)
      .getMarketBenchmarkLive(null);
  }

  /**
   * Isi otomatis field Harga untuk baris indikator market (isMarket)
   * di tabel "Input Harga & Penetapan Hari Ini", memakai nilai live
   * yang sudah diambil loadMarketBenchmarkRef(). Aman dipanggil
   * kapan saja — field yang belum ada di DOM otomatis dilewati.
   */
  function applyMarketRefToInputTable() {
    if (!phMarketRef) return;
    phBobotList.forEach(function (b) {
      if (!b.isMarket || !b.marketKey) return;
      const val = phMarketRef[b.marketKey];
      const el = document.getElementById('ph-harga-' + b.supplierId);
      if (el && val != null) {
        el.value = Math.round(Number(val)).toLocaleString('id-ID');
        calcPenetapanHarga();
      }
    });
  }

  function calcTotalBobot() {
    let total = 0;
    phBobotList.forEach(function (b, i) {
      const aktifEl = document.getElementById('bobot-aktif-' + i);
      const valEl = document.getElementById('bobot-val-' + i);
      if (aktifEl && aktifEl.checked && valEl) total += Number(valEl.value) || 0;
    });
    total = Math.round(total * 100) / 100;
    const el = document.getElementById('ph-total-bobot');
    if (el) {
      el.textContent = total + '%';
      el.style.color = Math.abs(total - 100) < 0.01 ? 'var(--color-success)' : (total > 100 ? 'var(--color-danger)' : 'var(--color-warning)');
    }
    return total;
  }

  function autoDistribusiBobot() {
    const aktifIdx = [];
    phBobotList.forEach(function (b, i) {
      const aktifEl = document.getElementById('bobot-aktif-' + i);
      if (aktifEl && aktifEl.checked) aktifIdx.push(i);
    });
    if (!aktifIdx.length) { showToast('Aktifkan minimal satu supplier dulu', 'warning'); return; }
    const each = Math.floor((100 / aktifIdx.length) * 100) / 100;
    const last = Math.round((100 - each * (aktifIdx.length - 1)) * 100) / 100;
    aktifIdx.forEach(function (idx, pos) {
      const valEl = document.getElementById('bobot-val-' + idx);
      if (valEl) valEl.value = pos === aktifIdx.length - 1 ? last : each;
    });
    calcTotalBobot();
    calcPenetapanHarga();
  }

  function renderPenetapanHargaInputTable(list) {
    const body = document.getElementById('ph-harga-table-body');
    if (!list.length) { body.innerHTML = '<tr><td colspan="5" class="recent-empty">Belum ada supplier</td></tr>'; return; }
    body.innerHTML = list.map(function (b, i) {
      const badge = b.isMarket ? ' <span class="badge gold" style="margin-left:6px; font-size:9px;">Live</span>' : '';
      const hargaAttrs = b.isMarket ? ' readonly title="Terisi otomatis dari harga market live"' : '';
      const diskonAttrs = b.isMarket ? ' readonly value="0" title="Diskon tidak berlaku untuk indikator market"' : '';
      return '<tr><td><b>' + b.nama + '</b>' + badge + '</td>' +
        '<td><input type="number" class="date-picker-input" style="width:90px;" id="bobot-val-' + i + '" value="' + b.bobot + '" min="0" max="100" step="0.01" oninput="calcTotalBobot(); calcPenetapanHarga();"></td>' +
        '<td><input type="checkbox" id="bobot-aktif-' + i + '" ' + (b.aktif ? 'checked' : '') + ' onchange="calcTotalBobot(); calcPenetapanHarga();"></td>' +
        '<td><input type="text" inputmode="numeric" class="date-picker-input" style="width:130px;"' + hargaAttrs + ' id="ph-harga-' + b.supplierId + '" oninput="formatCurrencyInput(this); calcPenetapanHarga();" placeholder="0"></td>' +
        '<td><input type="text" inputmode="numeric" class="date-picker-input" style="width:110px;"' + diskonAttrs + ' id="ph-diskon-' + b.supplierId + '" oninput="formatCurrencyInput(this); calcPenetapanHarga();" placeholder="0"></td></tr>';
    }).join('');
    calcTotalBobot();
    calcPenetapanHarga();
    applyMarketRefToInputTable();
  }

  function collectPenetapanHargaItems() {
    return phBobotList.map(function (b, i) {
      const bobotEl = document.getElementById('bobot-val-' + i);
      const bobot = bobotEl ? (Number(bobotEl.value) || 0) : b.bobot;
      const hargaEl = document.getElementById('ph-harga-' + b.supplierId);
      const diskonEl = document.getElementById('ph-diskon-' + b.supplierId);
      const harga = hargaEl ? getCurrencyValue(hargaEl) : 0;
      const diskon = diskonEl ? getCurrencyValue(diskonEl) : 0;
      const hargaBase = harga - diskon;
      return { supplierId: b.supplierId, nama: b.nama, harga: harga, diskon: diskon, hargaBase: hargaBase, bobot: bobot, aktif: hargaBase > 0 };
    });
  }

  function calcPenetapanHarga() {
    const items = collectPenetapanHargaItems();
    const margin = Number((document.getElementById('ph-margin') || { value: 0 }).value) || 0;

    const rowsBox = document.getElementById('ph-preview-rows');
    if (rowsBox) {
      rowsBox.innerHTML = items.filter(function (i) { return i.harga > 0; }).map(function (i) {
        return '<div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--color-text-muted);"><span>' + i.nama + ' (' + i.bobot + '%)</span><span>' + formatRupiah(i.hargaBase) + '</span></div>';
      }).join('') || '<div class="recent-empty">Isi harga supplier untuk melihat kalkulasi</div>';
    }

    google.script.run
      .withSuccessHandler(function (res) {
        document.getElementById('ph-sys-ref').textContent = formatRupiah(res.sysRefPrice);
        document.getElementById('ph-harga-jual').textContent = formatRupiah(res.hargaJual);
        renderBreakdownMargin(items, res.hargaJual);
      })
      .withFailureHandler(handleLoadError)
      .previewPenetapanHargaBobot(items, margin);
  }

  function renderBreakdownMargin(items, hargaJual) {
    const body = document.getElementById('ph-breakdown-body');
    if (!body) return;
    const isiItems = items.filter(function (i) { return i.harga > 0; });
    if (!isiItems.length || !hargaJual) {
      body.innerHTML = '<tr><td colspan="7" class="recent-empty">Isi harga supplier untuk melihat breakdown</td></tr>';
      return;
    }
    body.innerHTML = isiItems.map(function (i) {
      const marginRp = hargaJual - i.hargaBase;
      const marginPct = i.hargaBase ? (marginRp / i.hargaBase) * 100 : 0;
      const marginColor = marginRp >= 0 ? 'var(--color-success)' : 'var(--color-danger)';
      return '<tr><td><b>' + i.nama + '</b></td><td>' + i.bobot + '%</td>' +
        '<td>' + formatRupiah(i.harga) + '</td><td>' + formatRupiah(i.diskon) + '</td>' +
        '<td>' + formatRupiah(i.hargaBase) + '</td>' +
        '<td style="color:' + marginColor + '; font-weight:700;">' + formatRupiah(marginRp) + '</td>' +
        '<td style="color:' + marginColor + '; font-weight:700;">' + marginPct.toFixed(2) + '%</td></tr>';
    }).join('');
  }

  function submitPenetapanHarga() {
    const items = collectPenetapanHargaItems();
    const margin = Number((document.getElementById('ph-margin') || { value: 0 }).value) || 0;
    const isiCount = items.filter(function (i) { return i.aktif; }).length;
    if (!isiCount) { showToast('Isi minimal satu harga supplier', 'warning'); return; }

    google.script.run
      .withSuccessHandler(function (res) {
        showToast('Penetapan harga tersimpan — Harga Jual ' + formatRupiah(res.hargaJual), 'success');
        loadPenetapanHargaHistory();
      })
      .withFailureHandler(function (err) { showToast('Gagal menyimpan: ' + (err.message || err), 'error'); })
      .submitPenetapanHargaBobot({ hargaSupplier: items, margin: margin });
  }

  function loadPenetapanHargaHistory() {
    const body = document.getElementById('ph-history-body');
    if (!body) return;
    body.innerHTML = '<tr><td colspan="6" class="recent-empty">Memuat...</td></tr>';
    google.script.run
      .withSuccessHandler(function (list) {
        list = list || [];
        if (!list.length) { body.innerHTML = '<tr><td colspan="6" class="recent-empty">Belum ada riwayat</td></tr>'; return; }
        body.innerHTML = list.map(function (r) {
          return '<tr><td>' + String(r.tanggal).split('T')[0] + '</td><td>' + (r.waktu ? new Date(r.waktu).toLocaleTimeString('id-ID') : '-') + '</td>' +
            '<td>' + r.inputBy + '</td><td>' + formatRupiah(r.sysRefPrice) + '</td><td>' + r.margin.toFixed(2) + '%</td>' +
            '<td><b>' + formatRupiah(r.hargaJual) + '</b></td></tr>';
        }).join('');
      })
      .withFailureHandler(handleLoadError)
      .getPenetapanHargaBobotRecent(30);
  }
</script>
