<script>
  // ============================================================
  // SPA NAVIGATION
  // ============================================================
  function showPage(pageId, navEl) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + pageId).classList.add('active');

    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    if (navEl) navEl.classList.add('active');

    document.querySelector('.sidebar').classList.remove('open');

    if (pageId === 'dashboard') loadDashboard();
    if (pageId === 'laporan-harian') loadLaporanHarian();
    if (pageId === 'laporan-bulanan') loadLaporanBulanan();
    if (pageId === 'daily-trading') loadDailyTradingPage();
    if (pageId === 'piutang') loadPiutangPage();
    if (pageId === 'penetapan-harga') loadPenetapanHargaPage();
    if (pageId === 'pembelian') loadPembelianPage();
    if (pageId === 'invoice') loadInvoicePage();
    if (pageId === 'history') loadAuditTrail();
    if (pageId === 'settings') loadSettingsPage();
    if (pageId === 'supplier-price') loadSupplierPriceTrend();
    if (pageId === 'profile-mitra') loadMitraList();
    if (pageId === 'penjualan') loadPenjualanPage();
    if (pageId === 'analytics') loadAnalyticsPage();
  }

  function toggleSidebar() {
    document.querySelector('.sidebar').classList.toggle('open');
  }

  // ============================================================
  // DARK MODE
  // ============================================================
  function toggleTheme() {
    const root = document.documentElement;
    const isDark = root.getAttribute('data-theme') === 'dark';
    root.setAttribute('data-theme', isDark ? 'light' : 'dark');
    const icon = document.getElementById('theme-icon');
    icon.textContent = isDark ? 'dark_mode' : 'light_mode';
  }

  // ============================================================
  // TOAST NOTIFICATION
  // ============================================================
  function showToast(message, type) {
    type = type || 'success';
    const container = document.getElementById('toast-container');
    const icons = { success: 'check_circle', error: 'error', warning: 'warning' };
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.innerHTML =
      '<span class="material-symbols-rounded" style="font-size:18px;">' + (icons[type] || 'info') + '</span>' +
      '<span>' + message + '</span>';
    container.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }

  // ============================================================
  // FORMATTER
  // ============================================================
  function formatRupiah(num) {
    num = Number(num) || 0;
    return 'Rp' + num.toLocaleString('id-ID', { maximumFractionDigits: 0 });
  }
  function formatRupiahShort(num) {
    num = Number(num) || 0;
    const abs = Math.abs(num);
    if (abs >= 1e9) return 'Rp' + (num / 1e9).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' M';
    if (abs >= 1e6) return 'Rp' + (num / 1e6).toLocaleString('id-ID', { maximumFractionDigits: 1 }) + ' jt';
    return formatRupiah(num);
  }
  function formatGram(num) {
    num = Number(num) || 0;
    return num.toLocaleString('id-ID', { maximumFractionDigits: 2 }) + ' gr';
  }
  function formatUsd(num) {
    num = Number(num) || 0;
    return '$' + Math.round(num).toLocaleString('en-US', { maximumFractionDigits: 0 });
  }

  /**
   * Dipasang di oninput field harga (currency formatter).
   * Membersihkan non-digit lalu format dengan pemisah ribuan ID.
   */
  function formatCurrencyInput(el) {
    const raw = el.value.replace(/\D/g, '');
    el.value = raw ? Number(raw).toLocaleString('id-ID') : '';
  }
  function getCurrencyValue(el) {
    if (!el || !el.value) return 0;
    return Number(el.value.replace(/\D/g, '')) || 0;
  }

  function todayISO() {
    const d = new Date();
    const off = d.getTimezoneOffset();
    return new Date(d.getTime() - off * 60000).toISOString().split('T')[0];
  }

  function cssColor(varName) {
    return getComputedStyle(document.documentElement).getPropertyValue(varName).trim();
  }

  function setDefaultDates() {
    ['sp-tanggal', 'bm-tanggal', 'ps-tanggal', 'ps-berlaku', 'ot-tanggal', 'inv-tanggal', 'pmb-tanggal', 'pjl-tanggal'].forEach(id => {
      const el = document.getElementById(id);
      if (el && !el.value) el.value = todayISO();
    });
  }

  function resetForm(formId) {
    document.getElementById(formId).reset();
    setDefaultDates();
    updateMarginPreview();
    updateValuasiPreview();
    updateNominalPreview();
    if (document.getElementById('pmb-total-preview')) updatePembelianPreview();

    if (formId === 'form-supplier-price') {
      document.getElementById('sp-edit-id').value = '';
      const btn = document.getElementById('sp-submit-btn');
      btn.innerHTML = '<span class="material-symbols-rounded">save</span> Simpan';
      btn.dataset.origLabel = btn.innerHTML;
      document.getElementById('sp-cancel-edit-btn').style.display = 'none';
    }
    if (formId === 'form-pembelian') {
      document.getElementById('pmb-edit-id').value = '';
      const btn = document.getElementById('pmb-submit-btn');
      btn.innerHTML = '<span class="material-symbols-rounded">save</span> Simpan';
      btn.dataset.origLabel = btn.innerHTML;
      document.getElementById('pmb-cancel-edit-btn').style.display = 'none';
    }
    if (formId === 'form-penjualan') {
      document.getElementById('pjl-edit-id').value = '';
      const btn = document.getElementById('pjl-submit-btn');
      btn.innerHTML = '<span class="material-symbols-rounded">save</span> Simpan';
      btn.dataset.origLabel = btn.innerHTML;
      document.getElementById('pjl-cancel-edit-btn').style.display = 'none';
      updatePenjualanPreview();
    }
  }

  function setButtonLoading(btn, isLoading, label) {
    if (!btn) return;
    btn.disabled = isLoading;
    btn.dataset.origLabel = btn.dataset.origLabel || btn.innerHTML;
    btn.innerHTML = isLoading
      ? '<span class="material-symbols-rounded">progress_activity</span> Menyimpan...'
      : btn.dataset.origLabel;
  }

  // ============================================================
  // TANGGAL HARI INI DI HEADER
  // ============================================================
  function renderTodayDate() {
    const el = document.getElementById('topbar-date');
    const now = new Date();
    const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    el.textContent = now.toLocaleDateString('id-ID', opts);
  }

  // ============================================================
  // LOAD USER (email + role) DI HEADER
  // ============================================================
  function loadCurrentUser() {
    google.script.run
      .withSuccessHandler(function (user) {
        document.getElementById('u-name').textContent = user.Nama || user.Email;
        document.getElementById('u-role').textContent = user.Role;
        document.getElementById('u-avatar').textContent = (user.Nama || user.Email || '?').charAt(0).toUpperCase();
      })
      .withFailureHandler(function (err) {
        console.error(err);
        document.getElementById('u-name').textContent = 'Guest';
        document.getElementById('u-role').textContent = '-';
      })
      .getCurrentUser();
  }

  // ============================================================
  // GLOBAL PERIOD FILTER (Dashboard) — single source of truth.
  // Semua komponen Dashboard membaca periode dari state ini saja;
  // tidak ada filter terpisah per card.
  // ============================================================
  var dashboardPeriod = { mode: 'month', startDate: null, endDate: null };
  var dashboardPeriodInitialized = false;
  var dashboardPeriodLoadToken = 0;
  var dashboardPeriodLastKey = null;

  var MONTH_NAMES_ID = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

  function pad2(n) { return String(n).padStart(2, '0'); }
  function monthKeyOf(date) { return date.getFullYear() + '-' + pad2(date.getMonth() + 1); }

  /**
   * Rentang tanggal (ISO 'yyyy-MM-dd') awal & akhir bulan dari key 'YYYY-MM'.
   */
  function getMonthRange(monthKey) {
    const parts = monthKey.split('-');
    const year = Number(parts[0]), month = Number(parts[1]); // month: 1-12
    const start = year + '-' + pad2(month) + '-01';
    const lastDay = new Date(year, month, 0).getDate();
    const end = year + '-' + pad2(month) + '-' + pad2(lastDay);
    return { start: start, end: end };
  }

  function formatDateIndo(iso) {
    if (!iso) return '-';
    const parts = iso.split('-');
    return Number(parts[2]) + ' ' + MONTH_NAMES_ID[Number(parts[1]) - 1] + ' ' + parts[0];
  }

  /**
   * Isi dropdown Bulan dengan 24 bulan terakhir (termasuk bulan berjalan),
   * terbaru di atas.
   */
  function populatePeriodMonthSelect() {
    const sel = document.getElementById('period-month-select');
    if (!sel) return;
    const now = new Date();
    const options = [];
    for (let i = 0; i < 24; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const key = monthKeyOf(d);
      options.push('<option value="' + key + '">' + MONTH_NAMES_ID[d.getMonth()] + ' ' + d.getFullYear() + '</option>');
    }
    sel.innerHTML = options.join('');
    sel.value = monthKeyOf(now);
  }

  function initDashboardPeriodFilter() {
    populatePeriodMonthSelect();
    setPeriodMode('month');
  }

  function setPeriodMode(mode) {
    dashboardPeriod.mode = mode;
    const monthTab = document.getElementById('period-mode-month');
    const rangeTab = document.getElementById('period-mode-range');
    const monthCtl = document.getElementById('period-controls-month');
    const rangeCtl = document.getElementById('period-controls-range');
    if (monthTab) monthTab.classList.toggle('active', mode === 'month');
    if (rangeTab) rangeTab.classList.toggle('active', mode === 'range');
    if (monthCtl) monthCtl.style.display = mode === 'month' ? 'flex' : 'none';
    if (rangeCtl) rangeCtl.style.display = mode === 'range' ? 'flex' : 'none';

    if (mode === 'month') {
      onPeriodMonthChange();
    } else {
      const startEl = document.getElementById('period-start-date');
      const endEl = document.getElementById('period-end-date');
      if (startEl && !startEl.value && dashboardPeriod.startDate) startEl.value = dashboardPeriod.startDate;
      if (endEl && !endEl.value && dashboardPeriod.endDate) endEl.value = dashboardPeriod.endDate;
      if (startEl && endEl && startEl.value && endEl.value) onPeriodRangeChange();
    }
  }

  function onPeriodMonthChange() {
    const sel = document.getElementById('period-month-select');
    if (!sel || !sel.value) return;
    const range = getMonthRange(sel.value);
    dashboardPeriod.mode = 'month';
    dashboardPeriod.startDate = range.start;
    dashboardPeriod.endDate = range.end;
    document.getElementById('period-active-label-text').textContent =
      'Periode Aktif: ' + MONTH_NAMES_ID[Number(sel.value.split('-')[1]) - 1] + ' ' + sel.value.split('-')[0];
    loadDashboardData();
  }

  function onPeriodRangeChange() {
    const startEl = document.getElementById('period-start-date');
    const endEl = document.getElementById('period-end-date');
    let start = startEl.value, end = endEl.value;
    if (!start || !end) return;
    if (start > end) {
      showToast('Tanggal Mulai tidak boleh lebih besar dari Tanggal Akhir', 'warning');
      endEl.value = start;
      end = start;
    }
    dashboardPeriod.mode = 'range';
    dashboardPeriod.startDate = start;
    dashboardPeriod.endDate = end;
    document.getElementById('period-active-label-text').textContent =
      'Periode Aktif: ' + formatDateIndo(start) + ' – ' + formatDateIndo(end);
    loadDashboardData();
  }

  function resetPeriodFilter() {
    const startEl = document.getElementById('period-start-date');
    const endEl = document.getElementById('period-end-date');
    if (startEl) startEl.value = '';
    if (endEl) endEl.value = '';
    populatePeriodMonthSelect();
    setPeriodMode('month');
  }

  // ============================================================
  // LOAD DASHBOARD KPI (data real dari backend)
  // ============================================================
  function loadDashboard() {
    if (!dashboardPeriodInitialized) {
      dashboardPeriodInitialized = true;
      initDashboardPeriodFilter(); // akan memicu loadDashboardData()
    } else {
      loadDashboardData(true); // refresh data untuk periode yang sedang aktif
    }
  }

  /**
   * Memuat SELURUH data Dashboard berdasarkan dashboardPeriod
   * (Global Period Filter) — single source of truth. Semua card
   * mengirim startDate/endDate yang SAMA ke backend, jadi tidak
   * ada card yang "ketinggalan" periode filter.
   */
  function loadDashboardData(force) {
    const start = dashboardPeriod.startDate;
    const end = dashboardPeriod.endDate;
    const key = dashboardPeriod.mode + '|' + start + '|' + end;
    if (!force && key === dashboardPeriodLastKey) return; // hindari request berulang untuk periode yang sama
    dashboardPeriodLastKey = key;

    const reqToken = ++dashboardPeriodLoadToken;
    function guard(handler) {
      return function (res) {
        if (reqToken !== dashboardPeriodLoadToken) return; // respons basi (periode sudah berganti), abaikan
        handler(res);
      };
    }

    setKpiLoading(true);
    loadDashboardMarketStrip(); // live/realtime — tidak terikat periode filter

    google.script.run.withSuccessHandler(guard(renderSalesKpi)).withFailureHandler(handleLoadError).getSalesSummaryAll(start, end);
    google.script.run.withSuccessHandler(guard(renderPembelianKpi)).withFailureHandler(handleLoadError).getPembelianSummaryAll(start, end);
    google.script.run.withSuccessHandler(guard(renderMarginKpi)).withFailureHandler(handleLoadError).calculateProfitMarginOverall(start, end);
    google.script.run.withSuccessHandler(guard(renderTransaksiKpi)).withFailureHandler(handleLoadError).getTransactionSummary(start, end);

    google.script.run.withSuccessHandler(guard(function (v) { renderSparkline('spark-penjualan', 'sparkPenjualan', v, cssColor('--color-primary')); })).withFailureHandler(handleLoadError).getPenjualanSparklineValues(start, end);
    google.script.run.withSuccessHandler(guard(function (v) { renderSparkline('spark-pembelian', 'sparkPembelian', v, cssColor('--color-gold')); })).withFailureHandler(handleLoadError).getPembelianSparklineValues(start, end);
    google.script.run.withSuccessHandler(guard(function (v) { renderSparkline('spark-margin', 'sparkMargin', v, '#8B5CF6'); })).withFailureHandler(handleLoadError).getMarginSparklineValues(start, end);

    google.script.run.withSuccessHandler(guard(renderAiSummary)).withFailureHandler(handleLoadError).generateOverallSummary(start, end);
    google.script.run.withSuccessHandler(guard(renderAlerts)).withFailureHandler(handleLoadError).getAlertsOverall(start, end);
    // Piutang per Supplier = posisi/saldo outstanding TERKINI (live snapshot
    // dari sheet Rekap, bukan riwayat per tanggal) — tidak dipaksakan ikut
    // filter periode, sesuai sifat datanya (posisi, bukan transaksi).
    google.script.run.withSuccessHandler(guard(renderPiutangSupplierChart)).withFailureHandler(handleLoadError).getPiutangLive(null);
    google.script.run.withSuccessHandler(guard(renderTopMerkChart)).withFailureHandler(handleLoadError).getTopMerkPenjualan(5, start, end);
    google.script.run.withSuccessHandler(guard(renderSalesBuyerChart)).withFailureHandler(handleLoadError).getSalesByBuyerAll(start, end);
    google.script.run.withSuccessHandler(guard(renderTopBuyerRank)).withFailureHandler(handleLoadError).getTopBuyers(5, start, end);
    google.script.run.withSuccessHandler(guard(renderTopSupplierRank)).withFailureHandler(handleLoadError).getTopSuppliers(5, start, end);
    // Trend 30-hari terakhir — chart historis tetap (bukan bagian dari
    // Global Period Filter), agar pola margin/barang tiba tetap terbaca.
    google.script.run.withSuccessHandler(renderMarginTrendChart).withFailureHandler(handleLoadError).getMarginTrendHarian(30);
    google.script.run.withSuccessHandler(renderBarangTibaChart).withFailureHandler(handleLoadError).getBarangTibaTrend(30);
  }

  function handleLoadError(err) {
    console.error(err);
    showToast('Gagal memuat data: ' + (err.message || err), 'error');
  }

  function loadDashboardMarketStrip() {
    const box = document.getElementById('dashboard-market-strip');
    if (box) box.textContent = 'Memuat...';
    google.script.run
      .withSuccessHandler(function (ref) {
        if (!box) return;
        if (!ref) { box.textContent = 'Belum ada data market untuk hari ini.'; return; }
        const items = [
          ['Spot Gold', ref.spotGold, 'rp'],
          ['XAUIDRK', ref.xauIdr, 'rp'],
          ['LBMA', ref.lbma, 'usd'],
          ['Kitco', ref.kitco, 'usd'],
          ['Kurs Jual', ref.kursJual, 'rp'],
          ['Kurs Beli', ref.kursBeli, 'rp'],
          ['Rp LBMA', ref.rpLbma, 'rp'],
          ['Rp Kitco', ref.rpKitco, 'rp']
        ];
        box.innerHTML = items.map(function (it) {
          const val = it[1] == null ? '-' : (it[2] === 'usd' ? formatUsd(it[1]) : formatRupiah(it[1]));
          return '<span style="white-space:nowrap;"><span style="color:var(--color-text-muted); font-weight:600;">' + it[0] + ':</span> <b>' + val + '</b></span>';
        }).join('<span style="color:var(--color-border);">|</span>');
      })
      .withFailureHandler(function (err) {
        console.error(err);
        if (box) box.textContent = 'Gagal memuat data market.';
      })
      .getMarketBenchmarkLive(null);
  }

  function setKpiLoading(isLoading) {
    document.querySelectorAll('.kpi-value, .kpi-sub').forEach(el => {
      if (isLoading) { el.classList.add('skeleton'); el.innerHTML = '&nbsp;'; }
    });
  }
  function clearKpiLoading(cardId) {
    const card = document.getElementById(cardId);
    if (!card) return;
    card.querySelectorAll('.skeleton').forEach(el => el.classList.remove('skeleton'));
  }

  function renderSalesKpi(res) {
    document.getElementById('kpi-sales-nominal').textContent = formatRupiah(res.totalNominal);
    document.getElementById('kpi-sales-sub').innerHTML =
      '<span><b>' + formatGram(res.totalGram) + '</b> gramasi</span><span><b>' + res.jumlahInvoice + '</b> invoice</span>';
    clearKpiLoading('kpi-card-sales');
  }
  function renderPembelianKpi(res) {
    document.getElementById('kpi-pembelian-nominal').textContent = formatRupiah(res.totalNominal);
    document.getElementById('kpi-pembelian-sub').innerHTML =
      '<span><b>' + formatGram(res.totalGram) + '</b> gramasi</span><span><b>' + res.jumlahTransaksi + '</b> transaksi</span>';
    clearKpiLoading('kpi-card-pembelian');
  }
  function renderCheapestSupplierKpi(res) {
    const val = document.getElementById('kpi-cheapest-value');
    const sub = document.getElementById('kpi-cheapest-sub');
    if (!res) {
      val.textContent = '-';
      sub.innerHTML = '<span>Belum ada data harga hari ini</span>';
    } else {
      val.textContent = res.supplierNama;
      const selisihText = res.selisihDariBenchmark == null ? ''
        : '<span>Selisih: <b>' + formatRupiah(res.selisihDariBenchmark) + '</b> vs Spot Gold</span>';
      sub.innerHTML = '<span><b>' + formatRupiah(res.harga) + '</b>/gr</span>' + selisihText;
    }
    clearKpiLoading('kpi-card-cheapest');
  }
  function renderMarginKpi(res) {
    document.getElementById('kpi-margin-avg').textContent = formatRupiah(res.profitMargin);
    document.getElementById('kpi-margin-sub').innerHTML =
      '<span>Penjualan: <b>' + formatRupiah(res.totalPenjualan) + '</b></span><span>Pembelian: <b>' + formatRupiah(res.totalPembelian) + '</b></span>';
    clearKpiLoading('kpi-card-margin');
  }
  function renderTransaksiKpi(res) {
    document.getElementById('kpi-transaksi-nominal').textContent = formatRupiah(res.totalNominal);
    document.getElementById('kpi-transaksi-sub').innerHTML =
      '<span><b>' + res.jumlahPembelian + '</b> pembelian</span><span><b>' + res.jumlahPenjualan + '</b> penjualan</span>';
    clearKpiLoading('kpi-card-transaksi');
  }
  function renderBenchmarkKpi(res) {
    const val = document.getElementById('kpi-benchmark-value');
    const sub = document.getElementById('kpi-benchmark-sub');
    if (!res) {
      val.textContent = '-';
      sub.innerHTML = '<span>Belum ada data benchmark hari ini</span>';
    } else {
      val.textContent = formatRupiah(res.SpotGold);
      sub.innerHTML = '<span>LBMA: <b>' + formatRupiah(res.LBMA) + '</b></span><span>XAUIDRK: <b>' + formatRupiah(res.XAUIDRK) + '</b></span>';
    }
    clearKpiLoading('kpi-card-benchmark');
  }

  function refreshCurrentPage() {
    showToast('Memuat ulang data...', 'success');
    loadDashboard();
  }

  // ============================================================
  // FASE 5 — AI SUMMARY & ALERT
  // ============================================================
  function renderAiSummary(text) {
    document.getElementById('ai-summary-text').textContent = text || '-';
  }

  function renderAlerts(list) {
    list = list || [];
    const el = document.getElementById('ai-insight-text');
    if (!el) return;
    el.textContent = list.length ? list[0].message : 'Tidak ada insight khusus saat ini.';
  }

  /**
   * Sparkline mini-chart tanpa sumbu/legend — dipakai di kartu KPI Dashboard.
   */
  function renderSparkline(canvasId, chartKey, values, color) {
    values = values || [];
    destroyChart(chartKey);
    const ctx = document.getElementById(canvasId);
    if (!ctx) return;
    charts[chartKey] = new Chart(ctx, {
      type: 'line',
      data: {
        labels: values.map((_, i) => i),
        datasets: [{
          data: values, borderColor: color, backgroundColor: color + '33',
          fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        scales: { x: { display: false }, y: { display: false } },
        elements: { line: { borderJoinStyle: 'round' } }
      }
    });
  }

  // ============================================================
  // FASE 5 — CHART.JS INSTANCES
  // ============================================================
  var charts = {};

  function destroyChart(key) {
    if (charts[key]) { charts[key].destroy(); charts[key] = null; }
  }

  function renderSupplierComparisonChart(list) {
    list = list || [];
    destroyChart('supplierComparison');
    const ctx = document.getElementById('chart-supplier-comparison');
    if (!ctx) return;
    if (!list.length) { return; }

    const colors = list.map(s => s.isCheapest ? cssColor('--color-success') : (s.isMostExpensive ? cssColor('--color-danger') : cssColor('--color-primary-light')));
    charts.supplierComparison = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: list.map(s => s.supplierNama),
        datasets: [{ label: 'Harga (Rp/gr)', data: list.map(s => s.harga), backgroundColor: colors, borderRadius: 6 }]
      },
      options: {
        indexAxis: 'y',
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { x: { ticks: { callback: v => formatRupiah(v) } } }
      }
    });
  }

  function renderBenchmarkComparisonChart(res) {
    destroyChart('benchmarkComparison');
    const ctx = document.getElementById('chart-benchmark-comparison');
    if (!ctx || !res || !res.labels.length) return;

    charts.benchmarkComparison = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: res.labels,
        datasets: [{ label: 'Harga (Rp/gr)', data: res.values, backgroundColor: cssColor('--color-gold'), borderRadius: 6 }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { ticks: { callback: v => formatRupiah(v) } } }
      }
    });
  }

  // ============================================================
  // WIDGET DASHBOARD BARU — bar-list (menggantikan donut/bar chart
  // untuk Piutang per Supplier, Penjualan per Buyer, Top 5 Merk)
  // ============================================================
  const BAR_LIST_PALETTE = ['#046A38', '#1E9E5A', '#6FCB9F', '#C9A227', '#D6483A', '#8B5CF6'];

  function buildBarListRow(rank, name, colorHex, barPct, valueText, pctText) {
    return '<div class="bar-list-row">' +
      (rank != null ? '<div class="bar-list-rank">' + rank + '</div>' : '') +
      '<div class="bar-list-main">' +

  function renderPiutangSupplierChart(data) {
    const rows = (data && data.rows) || [];
    const totalValuasi = (data && data.totalValuasi) || 0;
    const totalEl = document.getElementById('piutang-total-value');
    if (totalEl) totalEl.textContent = formatRupiahShort(totalValuasi);

    const listBox = document.getElementById('piutang-bar-list');
    const insightBox = document.getElementById('piutang-insight-box');
    if (!listBox) return;
    if (!rows.length) {
      listBox.innerHTML = '<div class="recent-empty">Belum ada piutang</div>';
      if (insightBox) insightBox.style.display = 'none';
      return;
    }
    if (insightBox) insightBox.style.display = 'flex';

    const max = rows[0].valuasi || 1;
    listBox.innerHTML = rows.map(function (r, i) {
      const barPct = max ? (r.valuasi / max) * 100 : 0;
      const color = BAR_LIST_PALETTE[i % BAR_LIST_PALETTE.length];
      return buildBarListRow(null, r.supplierNama, color, barPct, formatRupiahShort(r.valuasi), r.valuasiPercent.toFixed(0) + '%');
    }).join('');

    const top = rows[0];
    const topNameEl = document.getElementById('piutang-top-name');
    const topPctEl = document.getElementById('piutang-top-pct');
    if (topNameEl) topNameEl.textContent = top.supplierNama;
    if (topPctEl) topPctEl.textContent = top.valuasiPercent.toFixed(0) + '% dari total piutang';
  }

  /**
   * Mengisi form Supplier Price dengan data entri yang dipilih untuk
   * diedit, lalu form berubah ke mode "Update" (bukan tambah baru).
   */
  function editSupplierPrice(id) {
    const entry = spRecentCache.find(r => r.ID === id);
    if (!entry) { showToast('Data tidak ditemukan, coba refresh', 'error'); return; }

    document.getElementById('sp-edit-id').value = entry.ID;
    document.getElementById('sp-tanggal').value = String(entry.Tanggal).split('T')[0];
    document.getElementById('sp-supplier').value = entry.SupplierID;
    document.getElementById('sp-harga1').value = entry.Harga1 ? Number(entry.Harga1).toLocaleString('id-ID') : '';
    document.getElementById('sp-harga2').value = entry.Harga2 ? Number(entry.Harga2).toLocaleString('id-ID') : '';
    document.getElementById('sp-harga3').value = entry.Harga3 ? Number(entry.Harga3).toLocaleString('id-ID') : '';
    document.getElementById('sp-harga4').value = entry.Harga4 ? Number(entry.Harga4).toLocaleString('id-ID') : '';
    document.getElementById('sp-catatan').value = entry.Catatan || '';

    const btn = document.getElementById('sp-submit-btn');
    btn.innerHTML = '<span class="material-symbols-rounded">save</span> Update';
    btn.dataset.origLabel = btn.innerHTML;
    document.getElementById('sp-cancel-edit-btn').style.display = 'inline-flex';

    document.getElementById('form-supplier-price').scrollIntoView({ behavior: 'smooth', block: 'center' });
    showToast('Mode edit — ubah harga lalu klik Update', 'warning');
  }

  function cancelEditSupplierPrice() {
    document.getElementById('sp-edit-id').value = '';
    const btn = document.getElementById('sp-submit-btn');

  // ============================================================
  // FORM SUBMIT — SUPPLIER PRICE
  // ============================================================
  function submitSupplierPrice(evt) {
    evt.preventDefault();
    const supplierSel = document.getElementById('sp-supplier');
    if (!supplierSel.value) { showToast('Pilih supplier terlebih dahulu', 'warning'); return false; }

    const editId = document.getElementById('sp-edit-id').value;
    const data = {
      Tanggal: document.getElementById('sp-tanggal').value,
      SupplierID: supplierSel.value,
      SupplierNama: supplierSel.options[supplierSel.selectedIndex].text,
      Harga1: getCurrencyValue(document.getElementById('sp-harga1')),
      Harga2: getCurrencyValue(document.getElementById('sp-harga2')),
      Harga3: getCurrencyValue(document.getElementById('sp-harga3')),
      Harga4: getCurrencyValue(document.getElementById('sp-harga4')),
      Catatan: document.getElementById('sp-catatan').value
    };
    if (!data.Harga1 && !data.Harga2 && !data.Harga3 && !data.Harga4) {
      showToast('Isi minimal satu harga', 'warning'); return false;
    }

    const btn = document.getElementById('sp-submit-btn');
    setButtonLoading(btn, true);

    if (editId) {
      google.script.run
        .withSuccessHandler(function () {
          setButtonLoading(btn, false);
          showToast('Harga supplier berhasil diperbarui', 'success');
          cancelEditSupplierPrice();
          loadSupplierPriceRecent();
          loadDashboard();
        })
        .withFailureHandler(function (err) {
          setButtonLoading(btn, false);
          showToast('Gagal memperbarui: ' + (err.message || err), 'error');
        })
        .updateSupplierPrice(editId, data);
    } else {
      google.script.run
        .withSuccessHandler(function () {
          setButtonLoading(btn, false);
          showToast('Harga supplier berhasil disimpan', 'success');
          resetForm('form-supplier-price');
          loadSupplierPriceRecent();
        })
        .withFailureHandler(function (err) {
          setButtonLoading(btn, false);
          showToast('Gagal menyimpan: ' + (err.message || err), 'error');
        })
        .addSupplierPrice(data);
    }
    return false;
  }

    evt.preventDefault();
    const buyerName = document.getElementById('inv-buyer').value.trim();
    if (!buyerName) { showToast('Isi nama buyer', 'warning'); return false; }

    const baseData = {
      NomorInvoice: document.getElementById('inv-nomor').value,
      Tanggal: document.getElementById('inv-tanggal').value,
      Harga: getCurrencyValue(document.getElementById('inv-harga')),
      Gram: Number(document.getElementById('inv-gram').value) || 0,
      Status: document.getElementById('inv-status').value,
      Catatan: document.getElementById('inv-catatan').value
    };
    if (!baseData.NomorInvoice || !baseData.Harga || !baseData.Gram) {
      showToast('Lengkapi nomor invoice, harga, dan gram', 'warning'); return false;
    }

    google.script.run
      .withSuccessHandler(function (buyerId) {
        const data = Object.assign({}, baseData, { BuyerID: buyerId, BuyerNama: buyerName });
        google.script.run
          .withSuccessHandler(function () {
            showToast('Invoice berhasil disimpan', 'success');
            resetForm('form-invoice');
            loadInvoiceRecent();
            loadDashboard();
          })
          .withFailureHandler(function (err) { showToast('Gagal menyimpan invoice: ' + (err.message || err), 'error'); })
          .addInvoice(data);
      })
      .withFailureHandler(function (err) { showToast('Gagal memproses buyer: ' + (err.message || err), 'error'); })
      .findOrCreateBuyer(buyerName);
    return false;
  }

  function submitPembelian(evt) {
    evt.preventDefault();
    const seller = document.getElementById('pmb-seller').value.trim();
    if (!seller) { showToast('Isi nama seller/supplier', 'warning'); return false; }

    const editId = document.getElementById('pmb-edit-id').value;
    const harga = getCurrencyValue(document.getElementById('pmb-harga'));
    const afterDiskonRaw = document.getElementById('pmb-after-diskon').value;
    const data = {
      Tanggal: document.getElementById('pmb-tanggal').value,
      NomorPO: document.getElementById('pmb-nomor-po').value,
      Seller: seller,
      Qty: Number(document.getElementById('pmb-qty').value) || 0,
      Harga: harga,
      AfterDiskon: afterDiskonRaw ? getCurrencyValue(document.getElementById('pmb-after-diskon')) : harga,
      InvoiceRef: document.getElementById('pmb-invoice-ref').value,
      Catatan: document.getElementById('pmb-catatan').value
    };
    if (!data.NomorPO || !data.Qty || !data.Harga) { showToast('Lengkapi Nomor PO, Qty, dan Harga', 'warning'); return false; }

    const btn = document.getElementById('pmb-submit-btn');
    setButtonLoading(btn, true);

    if (editId) {
      google.script.run
        .withSuccessHandler(function () {
          setButtonLoading(btn, false);
          showToast('Pembelian berhasil diperbarui', 'success');
          cancelEditPembelian();
          loadPembelianRecent();
          loadPembelianHistoryTable();
        })
        .withFailureHandler(function (err) { setButtonLoading(btn, false); showToast('Gagal memperbarui: ' + (err.message || err), 'error'); })
        .updatePembelianTransaksi(editId, data);
    } else {
      google.script.run
        .withSuccessHandler(function () {
          setButtonLoading(btn, false);
          showToast('Pembelian berhasil disimpan', 'success');
          resetForm('form-pembelian');
          loadPembelianRecent();
          loadPembelianHistoryTable();
        })
        .withFailureHandler(function (err) { setButtonLoading(btn, false); showToast('Gagal menyimpan: ' + (err.message || err), 'error'); })
        .addPembelianTransaksi(data);
    }
    return false;
  }

    document.getElementById('pjl-edit-id').value = entry.ID;
    document.getElementById('pjl-tanggal').value = String(entry.Tanggal).split('T')[0];
    document.getElementById('pjl-nomor-invoice').value = entry.NomorInvoice;
    document.getElementById('pjl-harga').value = entry.HargaPerGram ? Number(entry.HargaPerGram).toLocaleString('id-ID') : '';

    document.getElementById('pjl-denominasi').value = entry.Denominasi || '1.000';

  function submitPenjualan(evt) {
    evt.preventDefault();
    const editId = document.getElementById('pjl-edit-id').value;
    const data = {
      Tanggal: document.getElementById('pjl-tanggal').value,
      NomorInvoice: document.getElementById('pjl-nomor-invoice').value,
      HargaPerGram: getCurrencyValue(document.getElementById('pjl-harga')),
      Qty: Number(document.getElementById('pjl-qty').value) || 0,
      Pembeli: document.getElementById('pjl-pembeli').value.trim(),
      Denominasi: document.getElementById('pjl-denominasi').value,
      Merk: document.getElementById('pjl-merk').value,
      Status: document.getElementById('pjl-status').value,
      Bank: document.getElementById('pjl-bank').value,
      TanggalPengambilan: document.getElementById('pjl-tgl-ambil').value,
      EstimasiPenjemputan: document.getElementById('pjl-estimasi').value,
      Catatan: document.getElementById('pjl-catatan').value
    };
    if (!data.NomorInvoice || !data.HargaPerGram || !data.Qty || !data.Pembeli) {
      showToast('Lengkapi Nomor Invoice, Harga, Qty, dan Pembeli', 'warning'); return false;
    }

    const btn = document.getElementById('pjl-submit-btn');
    setButtonLoading(btn, true);

    if (editId) {
      google.script.run
        .withSuccessHandler(function () {
          setButtonLoading(btn, false);
          showToast('Penjualan berhasil diperbarui', 'success');
          cancelEditPenjualan();
          loadPenjualanRecent();
          loadPenjualanHistoryTable();
          loadDashboard();
        })
        .withFailureHandler(function (err) { setButtonLoading(btn, false); showToast('Gagal memperbarui: ' + (err.message || err), 'error'); })
        .updatePenjualanTransaksi(editId, data);
    } else {
      google.script.run
        .withSuccessHandler(function () {
          setButtonLoading(btn, false);
          showToast('Penjualan berhasil disimpan', 'success');
          resetForm('form-penjualan');
          loadPenjualanRecent();
          loadPenjualanHistoryTable();
          loadDashboard();
        })
        .withFailureHandler(function (err) { setButtonLoading(btn, false); showToast('Gagal menyimpan: ' + (err.message || err), 'error'); })
        .addPenjualanTransaksi(data);
    }
    return false;
  }

  var lapTanggalLabel = '';
  function renderLaporanHarian(data) {
    if (!data) return;
    lapTanggalLabel = data.tanggalLabel;
    const printDateEl = document.getElementById('lap-print-date');
    if (printDateEl) printDateEl.textContent = data.tanggalLabel;

    document.getElementById('lap-kpi-pembelian').textContent = formatRupiah(data.pembelian.summary.totalNominal);

      ? data.cheapestSupplier.nama + ' (' + formatRupiah(data.cheapestSupplier.harga) + ')'
      : '-';
    document.getElementById('lap-kpi-margin').textContent = data.penetapanHarga.marginPercent.toFixed(2) + '%';

    // --- Sumber Data ---
    const sdBody = document.getElementById('lap-sumberdata-body');
    if (!data.sumberData.length) {
      sdBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Belum ada input harga hari ini</td></tr>';
    } else {
      sdBody.innerHTML = data.sumberData.map(function (r) {
        const isUsd = r.nama === 'LBMA H-1' || r.nama === 'Kitco H-1';
        const fmt = isUsd ? formatUsd : formatRupiah;
        return '<tr><td><b>' + r.nama + '</b></td><td>' + fmt(r.harga1) + '</td><td>' + fmt(r.harga2) +
          '</td><td>' + fmt(r.harga3) + '</td><td>' + fmt(r.harga4) + '</td></tr>';
      }).join('');
    }

    // --- Piutang ---
    const ptBody = document.getElementById('lap-piutang-body');
    if (!data.piutang.rows.length) {
      ptBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Tidak ada piutang aktif</td></tr>';
    } else {
      let html = data.piutang.rows.map(function (r) {
        return '<tr><td><b>' + r.supplierNama + '</b></td><td>' + formatGram(r.gramasi) + '</td><td>' + r.gramasiPercent.toFixed(2) + '%</td>' +
          '<td>' + formatRupiah(r.valuasi) + '</td><td>' + r.valuasiPercent.toFixed(2) + '%</td></tr>';
      }).join('');

        '</td><td>100%</td><td>' + formatRupiah(data.piutang.totalValuasi) + '</td><td>100%</td></tr>';
      ptBody.innerHTML = html;
    }

    // --- Penetapan Harga ---
    const psBody = document.getElementById('lap-penetapan-body');
    function fourCols(vals) {
      const arr = [0, 1, 2, 3].map(i => vals[i] || 0);
      return arr.map(v => '<td>' + (v ? formatRupiah(v) : '-') + '</td>').join('');
    }
    if (!data.penetapanHarga.saleVals.length && !data.penetapanHarga.buybackVals.length) {
      psBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Belum ada penetapan harga hari ini</td></tr>';
    } else {
      psBody.innerHTML =
        '<tr><td><b>Sale</b></td>' + fourCols(data.penetapanHarga.saleVals) + '</tr>' +
        '<tr><td><b>Buyback</b></td>' + fourCols(data.penetapanHarga.buybackVals) + '</tr>';
    }
    document.getElementById('lap-margin-percent').textContent = data.penetapanHarga.marginPercent.toFixed(2) + '%';
    document.getElementById('lap-profit-margin').textContent = formatRupiah(data.penetapanHarga.profitMargin);

    // --- Penjualan ---
    const pjBody = document.getElementById('lap-penjualan-body');
    if (!data.penjualan.rows.length) {
      pjBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Belum ada penjualan hari ini</td></tr>';
    } else {
      let html = data.penjualan.rows.map(function (r) {
        return '<tr><td>' + r.NomorInvoice + '</td><td>' + formatRupiah(r.HargaPerGram) + '</td><td>' + formatGram(r.Qty) +
          '</td><td>' + formatRupiah(r.TotalHarga) + '</td><td>' + r.Pembeli + '</td></tr>';
      }).join('');
      html += '<tr style="background:var(--color-gold-soft); font-weight:700;"><td>Total</td><td>-</td><td>' + formatGram(data.penjualan.summary.totalGram) +
        '</td><td>' + formatRupiah(data.penjualan.summary.totalNominal) + '</td><td></td></tr>';
      pjBody.innerHTML = html;
    }

    // --- Pembelian ---
    const pbBody = document.getElementById('lap-pembelian-body');
    if (!data.pembelian.rows.length) {
      pbBody.innerHTML = '<tr><td colspan="5" class="recent-empty">Belum ada pembelian hari ini</td></tr>';
    } else {
      let html = data.pembelian.rows.map(function (r) {
        return '<tr><td>' + r.NomorPO + '</td><td>' + formatRupiah(r.AfterDiskon) + '</td><td>' + formatGram(r.Qty) +
          '</td><td>' + formatRupiah(r.TotalHarga) + '</td><td>' + r.Seller + '</td></tr>';
      }).join('');
      html += '<tr style="background:var(--color-gold-soft); font-weight:700;"><td>Total</td><td>-</td><td>' + formatGram(data.pembelian.summary.totalGram) +
        '</td><td>' + formatRupiah(data.pembelian.summary.totalNominal) + '</td><td></td></tr>';
      pbBody.innerHTML = html;
    }

    // --- Isi juga versi Summary (tersembunyi, dipakai tombol Download Summary) ---
    renderLaporanSummary(data);

  function downloadLaporanImage() {

    if (!el || typeof html2canvas === 'undefined') { showToast('Gagal memuat modul export gambar', 'error'); return; }
    showToast('Menyiapkan gambar HD...', 'success');
    html2canvas(el, {
      scale: 3, backgroundColor: '#ffffff', useCORS: true,
      windowWidth: el.scrollWidth, windowHeight: el.scrollHeight
    }).then(function (canvas) {
      canvas.toBlob(function (blob) {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = getLaporanFileName() + '.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Gambar HD berhasil diunduh', 'success');
      }, 'image/png', 1.0);

      showToast('Gagal membuat gambar laporan', 'error');

  function downloadLaporanPdf() {
    const el = document.getElementById('lap-capture-area');
    if (!el || typeof html2canvas === 'undefined' || typeof window.jspdf === 'undefined') { showToast('Gagal memuat modul export PDF', 'error'); return; }
    showToast('Menyiapkan PDF HD...', 'success');
    html2canvas(el, {
      scale: 3, backgroundColor: '#ffffff', useCORS: true,
      windowWidth: el.scrollWidth, windowHeight: el.scrollHeight
    }).then(function (canvas) {
      const imgData = canvas.toDataURL('image/png', 1.0);
      const { jsPDF } = window.jspdf;
      const pdfWidth = 595.28; // A4 pt, portrait
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      const pdf = new jsPDF({ orientation: pdfHeight > pdfWidth ? 'portrait' : 'landscape', unit: 'pt', format: [pdfWidth, pdfHeight], compress: false });
      pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight, undefined, 'FAST');
      pdf.save(getLaporanFileName() + '.pdf');
      showToast('PDF HD berhasil diunduh', 'success');
    }).catch(function () {
      showToast('Gagal membuat PDF laporan', 'error');
    });
  }

  function findSumberDataHarga(sumberData, nama) {
    const row = (sumberData || []).find(function (r) { return r.nama === nama; });
    if (!row) return null;
    const vals = [row.harga1, row.harga2, row.harga3, row.harga4].filter(function (v) { return v; });
    return vals.length ? vals[vals.length - 1] : null;
  }

    google.script.run.withSuccessHandler(renderSupplierBreakdownChart).withFailureHandler(handleLoadError).getSupplierBreakdownMonth(month);

  function formatNarrativeHtml(text) {
    text = text || '';
    let html = '';
    text.split('\n').forEach(function (line) {
      if (!line.trim()) return;
      if (line === 'Insight' || line === 'Momentum Ke Depan') {
        html += '<div class="mo-insight-title">' + line + '</div>';
      } else {
        html += '<p>' + line + '</p>';
      }
    });

  function downloadLaporanBulananPdf() {
    const month = getMonthPickerValue();
    showToast('Menyiapkan Laporan Bulanan (proses di server, mohon tunggu)...', 'success');

    google.script.run
      .withSuccessHandler(function (result) {
        if (!result || !result.base64) { showToast('Gagal membuat Laporan Bulanan', 'error'); return; }
        const byteChars = atob(result.base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
        const byteArray = new Uint8Array(byteNumbers);
        const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = result.fileName || ('Laporan Bulanan Perdagangan Emas – ' + month + '.pptx');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('Laporan Bulanan (PPTX) berhasil diunduh', 'success');

        if (result.slidesUrl) {
          const box = document.getElementById('mo-slides-link-box');
          const a = document.getElementById('mo-slides-link');
          if (box && a) {
            a.href = result.slidesUrl;
            box.style.display = 'flex';
          }
        }
      })
      .withFailureHandler(function (err) {
        console.error(err);
        showToast('Gagal membuat Laporan Bulanan: ' + (err.message || err), 'error');
      })
      .generateMonthlyReportSlides(month);
  }

  function renderSupplierPriceChart(data) {
    if (!data || !data.dates || !data.dates.length) return;
    destroyChart('supplierPriceTrend');
    const ctx = document.getElementById('chart-supplier-price-page');
    if (!ctx) return;

    const datasets = data.supplierList
      .filter(function (s) { return sptSelectedSuppliers.has(s); })
      .map(function (s) {
        const color = SPT_SUPPLIER_COLORS[s] || '#888';
        return {
          label: s, data: data.series[s], borderColor: color, backgroundColor: color + '22',
          borderWidth: 2, pointRadius: 2, pointHoverRadius: 5, tension: 0.25, spanGaps: true
        };
      });

    charts.supplierPriceTrend = new Chart(ctx, {
      type: 'line',
      data: { labels: data.dates, datasets: datasets },
      options: {
        responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
        onHover: function (evt, elements, chart) {
          chart.data.datasets.forEach(function (ds, i) {
            ds.borderWidth = elements.length && elements[0].datasetIndex === i ? 3.5 : 2;
          });
        },
        plugins: {
          legend: {
            position: 'top', labels: { boxWidth: 10, font: { size: 11 } },
            onClick: function (e, legendItem, legend) {
              const chart = legend.chart;
              const idx = legendItem.datasetIndex;
              if (sptLegendClickTimer) {
                clearTimeout(sptLegendClickTimer);
                sptLegendClickTimer = null;
                // Double click -> isolasi hanya dataset ini.
                chart.data.datasets.forEach(function (ds, i) { chart.setDatasetVisibility(i, i === idx); });
                chart.update();
              } else {
                sptLegendClickTimer = setTimeout(function () {
                  const meta = chart.getDatasetMeta(idx);
                  chart.setDatasetVisibility(idx, !chart.isDatasetVisible(idx));
                  chart.update();
                  sptLegendClickTimer = null;
                }, 250);
              }
            }
          },
          tooltip: {
            callbacks: {
              label: function (ctx) {
                const supplier = ctx.dataset.label;
                const val = ctx.parsed.y;
                if (val == null) return supplier + ': -';
                const dsIndex = ctx.datasetIndex;
                const i = ctx.dataIndex;
                const arr = ctx.chart.data.datasets[dsIndex].data;
                let changeStr = '';
                if (i > 0 && arr[i - 1] != null) {
                  const diff = val - arr[i - 1];
                  const pct = arr[i - 1] ? (diff / arr[i - 1]) * 100 : 0;
                  changeStr = ' (' + (diff >= 0 ? '+' : '') + formatRupiah(diff) + ', ' + (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%)';
                }
                return supplier + ': ' + formatRupiah(val) + changeStr;
              }
            }
          },
          zoom: {
            pan: { enabled: true, mode: 'x' },
            zoom: { wheel: { enabled: true }, pinch: { enabled: true }, mode: 'x' }
          }
        },
        scales: {
          y: { ticks: { callback: v => formatRupiahShort(v) }, grid: { color: '#f0f0f0' } },
          x: { grid: { display: false } }
        }
      }
    });
  }

  let mitraListData = [];

  const MITRA_PAGE_SIZE = 15;
  let mitraCurrentNama = null;

  function loadMitraList() {

  function populateMitraSearchDropdown() {
    const sel = document.getElementById('mitra-search');
    const currentVal = sel.value;
    const names = mitraListData.map(m => m.namaPerusahaan).sort((a, b) => a.localeCompare(b));

  function sortMitraTable(field) {
    if (mitraSortField === field) { mitraSortDir = -mitraSortDir; } else { mitraSortField = field; mitraSortDir = 1; }
    renderMitraTable();
  }

  function renderMitraTable() {
    const search = document.getElementById('mitra-search').value;
    const jenisFilter = document.getElementById('mitra-filter-jenis').value;
    const statusFilter = document.getElementById('mitra-filter-status').value;

    let filtered = mitraListData.filter(function (m) {
      if (search && m.namaPerusahaan !== search) return false;
      if (jenisFilter && m.jenisMitra !== jenisFilter) return false;
      if (statusFilter && m.statusAktif !== statusFilter) return false;
      return true;
    });

    if (mitraSortField) {
      filtered.sort(function (a, b) {
        let va = a[mitraSortField], vb = b[mitraSortField];
        if (va == null) va = -Infinity; if (vb == null) vb = -Infinity;
        if (typeof va === 'string') return va.localeCompare(vb) * mitraSortDir;
        return (va - vb) * mitraSortDir;
      });
    }

    const totalPages = Math.max(1, Math.ceil(filtered.length / MITRA_PAGE_SIZE));
    if (mitraCurrentPage > totalPages) mitraCurrentPage = totalPages;
    const start = (mitraCurrentPage - 1) * MITRA_PAGE_SIZE;
    const pageRows = filtered.slice(start, start + MITRA_PAGE_SIZE);

    const body = document.getElementById('mitra-table-body');
    if (!pageRows.length) {
      body.innerHTML = '<tr><td colspan="12" class="recent-empty">Tidak ada mitra yang cocok dengan filter ini</td></tr>';
    } else {
      body.innerHTML = pageRows.map(function (m) {
        const badgeClass = m.jenisMitra === 'Supplier' ? 'supplier' : m.jenisMitra === 'Buyer' ? 'buyer' : m.jenisMitra === 'Supplier & Buyer' ? 'both' : 'none';
        const statusClass = m.statusAktif === 'Nonaktif' ? 'nonaktif' : 'aktif';
        return '<tr>' +
          '<td><b>' + m.namaPerusahaan + '</b></td>' +
          '<td><span class="mitra-badge ' + badgeClass + '">' + m.jenisMitra + '</span></td>' +
          '<td>' + m.kategori + '</td>' +
          '<td><span class="mitra-badge ' + statusClass + '">' + m.statusAktif + '</span></td>' +
          '<td>' + m.kota + '</td>' +
          '<td>' + m.picUtama + '</td>' +
          '<td>' + (m.totalPembelian == null ? '-' : formatRupiah(m.totalPembelian)) + '</td>' +
          '<td>' + (m.totalPenjualan == null ? '-' : formatRupiah(m.totalPenjualan)) + '</td>' +
          '<td>' + m.statusPKS + '</td>' +
          '<td>' + m.sisaMasaPKS + '</td>' +
          '<td>' + m.companyVisitTerakhir + '</td>' +
          '<td><button class="btn btn-secondary" style="padding:5px 10px; font-size:11px;" onclick="openMitraDetail(\'' + m.namaPerusahaan.replace(/'/g, "\\'") + '\')">Lihat Detail</button></td>' +
          '</tr>';
      }).join('');
    }

    const pag = document.getElementById('mitra-pagination');
    if (!filtered.length) { pag.innerHTML = ''; return; }
    const showStart = start + 1;
    const showEnd = Math.min(start + MITRA_PAGE_SIZE, filtered.length);
    let pagHtml = '<div class="mitra-pagination-info">' + showStart + '-' + showEnd + ' dari ' + filtered.length + ' data</div><div class="mitra-pagination-pages">';
    pagHtml += '<div class="mitra-page-btn nav' + (mitraCurrentPage === 1 ? ' disabled' : '') + '" onclick="goToMitraPage(' + (mitraCurrentPage - 1) + ')">&laquo;</div>';
    const maxBtns = 5;
    let pStart = Math.max(1, mitraCurrentPage - 2), pEnd = Math.min(totalPages, pStart + maxBtns - 1);
    pStart = Math.max(1, pEnd - maxBtns + 1);
    if (pStart > 1) pagHtml += '<div class="mitra-page-btn" onclick="goToMitraPage(1)">1</div><span>...</span>';
    for (let i = pStart; i <= pEnd; i++) {
      pagHtml += '<div class="mitra-page-btn' + (i === mitraCurrentPage ? ' active' : '') + '" onclick="goToMitraPage(' + i + ')">' + i + '</div>';
    }
    if (pEnd < totalPages) pagHtml += '<span>...</span><div class="mitra-page-btn" onclick="goToMitraPage(' + totalPages + ')">' + totalPages + '</div>';
    pagHtml += '<div class="mitra-page-btn nav' + (mitraCurrentPage === totalPages ? ' disabled' : '') + '" onclick="goToMitraPage(' + (mitraCurrentPage + 1) + ')">&raquo;</div>';
    pagHtml += '</div>';
    pag.innerHTML = pagHtml;
  }

  function renderMitraPKS(list) {
    list = list || [];
    const REMINDER_DAYS = [90, 60, 30, 14, 7];

    if (!list.length) {
      document.getElementById('mitra-pks-info').innerHTML = '<div class="recent-empty">Belum ada data PKS</div>';
      document.getElementById('mitra-pks-countdown-box').innerHTML = '';
      document.getElementById('mitra-pks-reminder').innerHTML = REMINDER_DAYS.map(d => '<span class="mitra-reminder-chip">H-' + d + '</span>').join('');
      document.getElementById('mitra-pks-list').innerHTML = '<div class="recent-empty">Belum ada riwayat PKS untuk mitra ini</div>';
      return;
    }

    const aktif = list[0]; // sudah terurut, PKS paling relevan di posisi pertama
    document.getElementById('mitra-pks-info').innerHTML =
      mitraInfoRow('Nomor PKS', aktif.nomorPKS) +
      mitraInfoRow('Nama PKS', aktif.namaPKS) +
      mitraInfoRow('Mulai', aktif.tanggalMulai) +
      mitraInfoRow('Berakhir', aktif.tanggalBerakhir) +
      mitraInfoRow('Jangka Waktu', aktif.jangkaWaktuHari != null ? aktif.jangkaWaktuHari + ' hari' : '-') +
      mitraInfoRow('Status', '<span class="mitra-badge ' + aktif.colorClass + '">' + aktif.status + '</span>');

    document.getElementById('mitra-pks-countdown-box').innerHTML =
      '<div class="mitra-pks-countdown"><div class="lbl">Sisa Masa PKS</div><div class="val">' +
      (aktif.sisaHari != null ? aktif.sisaHari + ' hari' : '-') + '</div>' +
      '<div class="sub">Berakhir pada ' + aktif.tanggalBerakhir + '</div></div>';

    document.getElementById('mitra-pks-reminder').innerHTML = REMINDER_DAYS.map(function (d) {
      const hit = aktif.reminderKena && aktif.reminderKena.indexOf(d) > -1;
      return '<span class="mitra-reminder-chip' + (hit ? ' hit' : '') + '">H-' + d + '</span>';
    }).join('');

    document.getElementById('mitra-pks-list').innerHTML = list.map(function (p) {
      return '<div class="mitra-pks-list-item">' +
        '<div class="row"><b>' + p.namaPKS + ' (' + p.nomorPKS + ')</b><span class="mitra-badge ' + p.colorClass + '">' + p.status + '</span></div>' +
        '<div style="font-size:12px; color:var(--color-text-muted);">' + p.tanggalMulai + ' s/d ' + p.tanggalBerakhir + ' &middot; Catatan: ' + p.catatanLegal + '</div>' +
        '<button class="btn btn-secondary" style="margin-top:8px; padding:5px 10px; font-size:11px;" onclick=\'editMitraPKS(' + JSON.stringify(p) + ')\'>Edit</button>' +
        '</div>';
    }).join('');
  }

  function resetMitraPKSForm() {
    document.getElementById('mitra-pks-form').innerHTML =
      '<input type="hidden" id="mpks-id" value="">' +
      '<div class="form-group"><label>Nomor PKS</label><input type="text" id="mpks-nomor"></div>' +
      '<div class="form-group"><label>Nama PKS</label><input type="text" id="mpks-nama"></div>' +
      '<div class="form-group"><label>Tanggal Mulai</label><input type="date" id="mpks-mulai"></div>' +
      '<div class="form-group"><label>Tanggal Berakhir</label><input type="date" id="mpks-akhir"></div>' +
      '<div class="form-group" style="grid-column:1/-1;"><label>Catatan Legal</label><textarea id="mpks-catatan" rows="2"></textarea></div>';
  }

  function editMitraPKS(p) {
    resetMitraPKSForm();
    document.getElementById('mpks-id').value = p.pksId;
    document.getElementById('mpks-nomor').value = p.nomorPKS === '-' ? '' : p.nomorPKS;
    document.getElementById('mpks-nama').value = p.namaPKS === '-' ? '' : p.namaPKS;
    document.getElementById('mpks-mulai').value = p.tanggalMulai || '';
    document.getElementById('mpks-akhir').value = p.tanggalBerakhir || '';
    document.getElementById('mpks-catatan').value = p.catatanLegal === '-' ? '' : p.catatanLegal;
  }

  function submitMitraPKS() {
    if (!mitraCurrentNama) return;
    const data = {
      pksId: document.getElementById('mpks-id').value || null,
      namaPerusahaan: mitraCurrentNama,
      nomorPKS: document.getElementById('mpks-nomor').value,
      namaPKS: document.getElementById('mpks-nama').value,
      tanggalMulai: document.getElementById('mpks-mulai').value,
      tanggalBerakhir: document.getElementById('mpks-akhir').value,
      catatanLegal: document.getElementById('mpks-catatan').value
    };
    google.script.run.withSuccessHandler(function () {
      showToast('PKS berhasil disimpan', 'success');
      loadMitraPKS();
      loadMitraList();
    }).withFailureHandler(handleLoadError).saveMitraPKS(data);
  }

  // ---------------- Dokumen PKS ----------------
  let mitraDocEditingId = null;

  function loadMitraDocuments() {
    document.getElementById('mitra-doc-list').innerHTML = '<div class="recent-empty">Memuat...</div>';
    google.script.run.withSuccessHandler(renderMitraDocuments).withFailureHandler(handleLoadError).getMitraDocuments(mitraCurrentNama);
    google.script.run.withSuccessHandler(function (pksList) {
      const sel = document.getElementById('mdoc-pks');
      sel.innerHTML = '<option value="">- Tidak terkait PKS tertentu -</option>' +
        (pksList || []).map(p => '<option value="' + p.pksId + '">' + p.namaPKS + ' (' + p.nomorPKS + ')</option>').join('');
    }).withFailureHandler(handleLoadError).getMitraPKSList(mitraCurrentNama);
  }

  function docIconClass(namaDokumen) {
    const ext = (namaDokumen || '').split('.').pop().toLowerCase();
    if (ext === 'pdf') return { cls: 'pdf', icon: 'picture_as_pdf' };
    if (['jpg', 'jpeg', 'png', 'gif'].indexOf(ext) > -1) return { cls: 'image', icon: 'image' };
    if (['doc', 'docx'].indexOf(ext) > -1) return { cls: 'doc', icon: 'description' };
    return { cls: 'other', icon: 'insert_drive_file' };
  }

  function renderMitraDocuments(list) {
    list = list || [];
    const box = document.getElementById('mitra-doc-list');
    if (!list.length) { box.innerHTML = '<div class="recent-empty">Belum ada dokumen untuk mitra ini</div>'; return; }

    box.innerHTML = list.map(function (d) {
      const iconInfo = docIconClass(d.namaDokumen);
      const statusBadge = d.statusDokumen === 'Diarsipkan' ? 'arsip' : 'aktif';
      let actions = '';
      if (d.fileExists) {
        actions += '<a class="btn btn-secondary" href="' + d.viewUrl + '" target="_blank">Preview</a>';
        actions += '<a class="btn btn-secondary" href="' + d.viewUrl + '" target="_blank">Buka di Drive</a>';
        actions += '<a class="btn btn-secondary" href="' + d.downloadUrl + '" target="_blank">Download</a>';
      } else {
        actions += '<span style="font-size:11px; color:var(--color-danger);">File tidak ditemukan di Drive</span>';
      }
      actions += '<button class="btn btn-secondary" onclick=\'openEditMitraDocument(' + JSON.stringify(d) + ')\'>Edit Info</button>';
      if (d.statusDokumen !== 'Diarsipkan') {
        actions += '<button class="btn btn-secondary" onclick="confirmArchiveDocument(\'' + d.docId + '\')">Arsipkan</button>';
      }

      return '<div class="mitra-doc-item">' +
        '<div class="mitra-doc-icon ' + iconInfo.cls + '"><span class="material-symbols-rounded">' + iconInfo.icon + '</span></div>' +
        '<div class="mitra-doc-info">' +
        '<div class="mitra-doc-name">' + d.namaDokumen + ' <span class="mitra-badge ' + statusBadge + '">' + d.statusDokumen + '</span></div>' +
        '<div class="mitra-doc-meta">' + d.jenisDokumen + ' &middot; v' + d.versi + ' &middot; Tgl Dokumen: ' + d.tanggalDokumen + ' &middot; Upload: ' + d.tanggalUpload + ' oleh ' + d.pengunggah + '</div>' +
        (d.catatan !== '-' ? '<div class="mitra-doc-meta">Catatan: ' + d.catatan + '</div>' : '') +
        '<div class="mitra-doc-actions">' + actions + '</div>' +
        '</div></div>';
    }).join('');
  }

  function resetMitraDocForm() {
    mitraDocEditingId = null;
    document.getElementById('mdoc-file').value = '';
    document.getElementById('mdoc-nama').value = '';
    document.getElementById('mdoc-jenis').value = 'PKS Utama';
    document.getElementById('mdoc-versi').value = '1.0';
    document.getElementById('mdoc-tanggal').value = '';
    document.getElementById('mdoc-catatan').value = '';
  }

  function openEditMitraDocument(d) {
    mitraDocEditingId = d.docId;
    document.getElementById('mdoc-nama').value = d.namaDokumen === '-' ? '' : d.namaDokumen;
    document.getElementById('mdoc-jenis').value = d.jenisDokumen;
    document.getElementById('mdoc-versi').value = d.versi === '-' ? '' : d.versi;
    document.getElementById('mdoc-tanggal').value = d.tanggalDokumen === '-' ? '' : d.tanggalDokumen;
    document.getElementById('mdoc-catatan').value = d.catatan === '-' ? '' : d.catatan;
    showToast('Mode edit info dokumen "' + d.namaDokumen + '" — ubah field lalu klik Upload/Simpan (file tidak perlu dipilih ulang)', 'success');
    document.getElementById('mdoc-file').closest('.card').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function submitMitraDocument() {
    if (!mitraCurrentNama) return;
    const fileInput = document.getElementById('mdoc-file');

    if (mitraDocEditingId) {
      google.script.run.withSuccessHandler(function () {
        showToast('Info dokumen berhasil diperbarui', 'success');
        resetMitraDocForm();
        loadMitraDocuments();
      }).withFailureHandler(handleLoadError).updateMitraDocumentInfo({
        docId: mitraDocEditingId,
        namaDokumen: document.getElementById('mdoc-nama').value,
        jenisDokumen: document.getElementById('mdoc-jenis').value,
        versi: document.getElementById('mdoc-versi').value,
        tanggalDokumen: document.getElementById('mdoc-tanggal').value,
        catatan: document.getElementById('mdoc-catatan').value
      });
      return;
    }

    if (!fileInput.files || !fileInput.files.length) { showToast('Pilih file terlebih dahulu', 'error'); return; }
    const file = fileInput.files[0];
    const reader = new FileReader();
    reader.onload = function (e) {
      const base64 = e.target.result.split(',')[1];
      showToast('Mengupload dokumen...', 'success');
      google.script.run.withSuccessHandler(function () {
        showToast('Dokumen berhasil diupload', 'success');
        resetMitraDocForm();
        loadMitraDocuments();
      }).withFailureHandler(handleLoadError).uploadMitraDocument({
        namaPerusahaan: mitraCurrentNama,
        pksId: document.getElementById('mdoc-pks').value,
        namaDokumen: document.getElementById('mdoc-nama').value || file.name,
        jenisDokumen: document.getElementById('mdoc-jenis').value,
        versi: document.getElementById('mdoc-versi').value,
        tanggalDokumen: document.getElementById('mdoc-tanggal').value,
        catatan: document.getElementById('mdoc-catatan').value,
        fileName: file.name,
        mimeType: file.type,
        base64Data: base64
      });
    };
    reader.readAsDataURL(file);
  }

  function confirmArchiveDocument(docId) {
    if (!confirm('Arsipkan dokumen ini? File tidak akan dihapus dari Drive, hanya statusnya berubah menjadi Diarsipkan.')) return;
    google.script.run.withSuccessHandler(function () {
      showToast('Dokumen diarsipkan', 'success');
      loadMitraDocuments();
    }).withFailureHandler(handleLoadError).archiveMitraDocument(docId);
  }

  function mitraInfoRow(label, value) {
    return '<div class="mitra-info-row"><span class="label">' + label + '</span><span class="value">' + (value || '-') + '</span></div>';
  }

  function renderMitraDetail(data) {
    if (!data) { showToast('Data mitra tidak ditemukan', 'error'); closeMitraDetail(); return; }

    const badgeClass = data.jenisMitra === 'Supplier' ? 'supplier' : data.jenisMitra === 'Buyer' ? 'buyer' : data.jenisMitra === 'Supplier & Buyer' ? 'both' : 'none';
    document.getElementById('mitra-detail-subtitle').innerHTML =
      '<span class="mitra-badge ' + badgeClass + '">' + data.jenisMitra + '</span>' +
      '<span class="mitra-badge ' + (data.statusAktif === 'Nonaktif' ? 'nonaktif' : 'aktif') + '">' + data.statusAktif + '</span>' +
      (data.mitraId ? '<span style="color:var(--color-text-muted); font-size:11px;">ID: ' + data.mitraId + '</span>' : '');

    document.getElementById('mitra-info-umum').innerHTML =
      mitraInfoRow('Nama Perusahaan', data.namaPerusahaan) +
      mitraInfoRow('Jenis Mitra', data.jenisMitra) +
      mitraInfoRow('Kategori', data.kategori) +
      mitraInfoRow('Status', data.statusAktif) +
      mitraInfoRow('NPWP', data.npwp) +
      mitraInfoRow('Kota', data.kota) +
      mitraInfoRow('Alamat', data.alamat);

    document.getElementById('mitra-info-kontak').innerHTML =
      mitraInfoRow('PIC Utama', data.picUtama) +
      mitraInfoRow('HP PIC', data.hpPIC) +
      mitraInfoRow('Email PIC', data.emailPIC) +
      mitraInfoRow('Telepon', data.phone) +
      mitraInfoRow('Nama Bank', data.namaBank) +
      mitraInfoRow('No Rekening', data.noRekening) +
      mitraInfoRow('Website', data.website);

    document.getElementById('mitra-info-produk').innerHTML =
      mitraInfoRow('Jenis Produk', data.jenisProduk) +
      mitraInfoRow('Merek Emas', data.merekEmas) +
      mitraInfoRow('Lokasi Pabrik', data.lokasiPabrik) +
      mitraInfoRow('Lokasi Gudang', data.lokasiGudang) +
      mitraInfoRow('Catatan', data.catatan);

    document.getElementById('mitra-edit-form').innerHTML =
      '<div class="form-group"><label>Jenis Mitra (Override)</label><select id="mf-jenis"><option value="">Otomatis dari transaksi</option><option value="Supplier">Supplier</option><option value="Buyer">Buyer</option><option value="Supplier & Buyer">Supplier & Buyer</option></select></div>' +
      '<div class="form-group"><label>Kategori</label><input type="text" id="mf-kategori" value="' + (data.kategori === '-' ? '' : data.kategori) + '"></div>' +
      '<div class="form-group"><label>Status Aktif</label><select id="mf-status"><option value="Aktif">Aktif</option><option value="Nonaktif">Nonaktif</option></select></div>' +
      '<div class="form-group"><label>Website</label><input type="text" id="mf-website" value="' + (data.website === '-' ? '' : data.website) + '"></div>' +
      '<div class="form-group"><label>Jenis Produk</label><input type="text" id="mf-jenisproduk" value="' + (data.jenisProduk === '-' ? '' : data.jenisProduk) + '"></div>' +
      '<div class="form-group"><label>Merek Emas</label><input type="text" id="mf-merek" value="' + (data.merekEmas === '-' ? '' : data.merekEmas) + '"></div>' +
      '<div class="form-group"><label>Lokasi Pabrik</label><input type="text" id="mf-pabrik" value="' + (data.lokasiPabrik === '-' ? '' : data.lokasiPabrik) + '"></div>' +
      '<div class="form-group"><label>Lokasi Gudang</label><input type="text" id="mf-gudang" value="' + (data.lokasiGudang === '-' ? '' : data.lokasiGudang) + '"></div>' +
      '<div class="form-group" style="grid-column:1/-1;"><label>Catatan</label><textarea id="mf-catatan" rows="2">' + (data.catatan === '-' ? '' : data.catatan) + '</textarea></div>';
    document.getElementById('mf-jenis').value = data.jenisMitra === 'Belum ada transaksi' ? '' : (['Supplier', 'Buyer', 'Supplier & Buyer'].indexOf(data.jenisMitra) > -1 ? '' : data.jenisMitra);
    document.getElementById('mf-status').value = data.statusAktif === 'Nonaktif' ? 'Nonaktif' : 'Aktif';

    // Tab Transaksi
    const s = data.summary || {};
    const showPembelian = data.jenisMitra === 'Supplier' || data.jenisMitra === 'Supplier & Buyer';
    const showPenjualan = data.jenisMitra === 'Buyer' || data.jenisMitra === 'Supplier & Buyer';
    let kpiHtml = '';
    function kpiCard(icon, iconClass, label, val, sub) {
      return '<div class="card mitra-kpi-icon-card">' +
        '<div class="mitra-kpi-top"><div><div class="mini-kpi-label">' + label + '</div><div class="mitra-kpi-val">' + val + '</div></div>' +
        '<div class="mitra-kpi-icon ' + iconClass + '"><span class="material-symbols-rounded">' + icon + '</span></div></div>' +
        '<div class="mitra-kpi-sub">' + sub + '</div></div>';
    }
    if (showPembelian) {
      kpiHtml += kpiCard('shopping_cart', 'gold', 'Total Pembelian', formatRupiah(s.pembelian.totalNominal), 'Volume ' + formatGram(s.pembelian.totalGram) + ' &middot; ' + s.pembelian.jumlahTransaksi + ' transaksi');
    }
    if (showPenjualan) {
      kpiHtml += kpiCard('sell', 'purple', 'Total Penjualan', formatRupiah(s.penjualan.totalNominal), 'Volume ' + formatGram(s.penjualan.totalGram) + ' &middot; ' + s.penjualan.jumlahTransaksi + ' transaksi');
    }
    if (s.piutang && s.piutang.totalGramasi) {
      kpiHtml += kpiCard('account_balance_wallet', '', 'Piutang', formatRupiah(s.piutang.totalValuasi), formatGram(s.piutang.totalGramasi) + ' outstanding');
    }
    document.getElementById('mitra-transaksi-kpi').innerHTML = kpiHtml || '<div class="recent-empty">Belum ada transaksi tercatat</div>';

    const pjBody = document.getElementById('mitra-pembelian-body');
    if (showPembelian && s.pembelian.rows.length) {
      pjBody.innerHTML = s.pembelian.rows.map(r => '<tr><td>' + extractDateShort(r.Tanggal) + '</td><td>' + (r.NomorPO || '-') + '</td><td>' + formatGram(r.Qty) + '</td><td>' + formatRupiah(r.TotalHarga) + '</td></tr>').join('');
    } else {
      pjBody.innerHTML = '<tr><td colspan="4" class="recent-empty">-</td></tr>';
    }

    const pnBody = document.getElementById('mitra-penjualan-body');
    if (showPenjualan && s.penjualan.rows.length) {
      pnBody.innerHTML = s.penjualan.rows.map(r => '<tr><td>' + extractDateShort(r.Tanggal) + '</td><td>' + (r.NomorInvoice || '-') + '</td><td>' + formatGram(r.Qty) + '</td><td>' + formatRupiah(r.TotalHarga) + '</td></tr>').join('');
    } else {
      pnBody.innerHTML = '<tr><td colspan="4" class="recent-empty">-</td></tr>';
    }
  }

  function extractDateShort(val) {
    if (!val) return '-';
    const s = String(val);
    return s.length >= 10 ? s.slice(0, 10) : s;
  }
